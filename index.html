<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>純文字 RPG</title>
<link rel="stylesheet" href="style.css?v=20260906-3">
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <h1 id="brandTitle">純文字 RPG</h1>
    <div class="status" id="saveStatus">本機自動存檔</div>
  </div>
  <nav id="topNav"></nav>
</header>
<main id="main"></main>
</div>
<div class="bottom-nav" id="bottomNav"></div>

<div class="modal" id="passwordModal">
  <div class="modal-box">
    <h3>管理功能</h3>
    <div class="muted">請輸入管理密碼。</div>
    <input id="gmPassword" type="password" autocomplete="off">
    <div class="controls"><button class="btn" onclick="closeGMModal()">取消</button><button class="btn primary" onclick="unlockGM()">進入</button></div>
  </div>
</div>

<div class="modal" id="riskModal">
  <div class="modal-box risk-box">
    <h3>⚠ 低血量警告</h3>
    <p id="riskMessage" class="muted">目前 HP 已低於 50%。若戰敗，將損失 EXP，並可能遺失裝備。</p>
    <div class="controls">
      <button id="riskContinueBtn" class="btn primary" onclick="continueRiskBattle()">仍要繼續戰鬥</button>
      <button class="btn ok" onclick="riskRest()">回城休息</button>
    </div>
  </div>
</div>

<div class="modal" id="lostGearModal">
  <div class="modal-box">
    <h3>⚠ 裝備遺失</h3>
    <p>你在戰敗後遺失了以下裝備：</p>
    <div id="lostGearDetail" class="item"></div>
    <p class="muted">此裝備已移至商店的「遺失裝備贖回」，之後可前往商店查看並贖回。</p>
    <div class="controls"><button class="btn primary" onclick="closeLostGearModal()">知道了</button></div>
  </div>
</div>

<script src="data.js?v=20260906-4"></script>
<script src="engine.js?v=20260906-4"></script>
<script src="ui.js?v=20260906-11"></script>
<script>
(()=>{
  const RISK_HP_RATIO=0.5;
  let pendingLostGear=null;

  window.lowHp=function(){
    const s=equippedStats();
    return s.hp>0&&state.hp/s.hp<RISK_HP_RATIO;
  };

  window.adventureStatus=function(){
    const s=equippedStats(),need=state.level<50?expNeed(state.level):0,hpPct=s.hp?state.hp/s.hp*100:0,expPct=state.level<50?Math.min(100,state.exp/need*100):100,low=hpPct<50;
    return `<div class="card" style="margin-bottom:16px">
      <div class="stats"><div class="stat">等級<b>Lv.${state.level}</b></div><div class="stat">金幣<b>${state.gold.toLocaleString()}</b></div></div>
      <div style="margin-top:12px;${low?"color:#ff8585;font-weight:700":""}">HP ${state.hp} / ${s.hp}${low?"　⚠ 戰敗會損失 EXP，並可能遺失裝備":""}<div class="bar"><span class="hp" style="width:${hpPct}%"></span></div></div>
      <div style="margin-top:10px">EXP ${state.level>=50?"MAX":state.exp+" / "+need}<div class="bar"><span class="xp" style="width:${expPct}%"></span></div></div>
    </div>`;
  };

  window.showRiskModal=function(mode,remaining=0){
    riskMode=mode;
    const modal=document.getElementById("riskModal"),msg=document.getElementById("riskMessage"),continueBtn=document.getElementById("riskContinueBtn");
    if(mode==="continuous"){
      if(msg)msg.innerHTML=`目前 HP 已低於 50%。連續戰鬥已暫停，尚有 <b>${remaining}</b> 場。<br>若繼續後戰敗，將損失目前等級升級所需 EXP 的 10%，並有 30% 機率遺失目前裝備中的 1 件。`;
      if(continueBtn)continueBtn.textContent=`繼續剩餘 ${remaining} 場`;
    }else{
      if(msg)msg.innerHTML=`目前 HP 已低於 50%。<br>若戰敗，將損失目前等級升級所需 EXP 的 10%，並有 30% 機率遺失目前裝備中的 1 件。`;
      if(continueBtn)continueBtn.textContent="仍要繼續戰鬥";
    }
    if(modal)modal.classList.add("show");
  };

  window.shopPage=function(){
    ensureShop();
    const cost=shopRefreshCost(),maxed=(state.shop.refreshIndex||0)>=7,lost=state.lostGear||[];
    const rows=state.shop.items.map((it,i)=>{
      const current=state.equipment[it.type];
      const itemScore=equipmentScore(it);
      const currentScore=current?equipmentScore(current):null;
      const diff=current?itemScore-currentScore:itemScore;
      const diffText=current?`${diff>0?"+":""}${diff}`:"目前無裝備";
      const diffColor=!current?"#e5cf9a":diff>0?"#76d587":diff<0?"#e27474":"#ccc";
      const currentHtml=current?`${itemHtml(current,true)}<div class="muted" style="margin-top:4px">分數 ${currentScore}</div>`:`<span class="muted">無</span>`;
      return `<tr>
        <td>${itemHtml(it,true)}</td>
        <td>${statLine(it)}</td>
        <td><div class="muted">目前</div>${currentHtml}<div style="margin-top:6px"><span class="muted">商品分數 ${itemScore}</span>　<b style="color:${diffColor}">${diffText}</b></div></td>
        <td>${it.buy.toLocaleString()}</td>
        <td><button class="btn" onclick="buyItem(${i})">購買</button></td>
      </tr>`;
    }).join("");
    return `<div class="card"><h2>商店</h2>
      <div class="notice">商店商品會保存在存檔中，重新整理頁面不會更換。刷新價格會逐次提高；每購買 1 件裝備，刷新價格下降一階。</div>
      <div class="controls"><button class="btn" onclick="refreshShop()">刷新商店（${cost.toLocaleString()}）</button>
      ${maxed?`<button class="btn blue" onclick="manualResetShopPrice()" ${canResetShopPrice()?"":"disabled"}>重置刷新價格${canResetShopPrice()?"":"（"+shopCooldownText()+"）"}</button>`:""}
      <span class="muted">持有金幣：${state.gold.toLocaleString()}</span></div>
      <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>商品</th><th>能力</th><th>與目前裝備比較</th><th>價格</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      ${lost.length?`<h3 style="margin-top:24px">遺失裝備贖回</h3><div class="notice">死亡時遺失的裝備會暫存在此，可用金幣贖回。</div><div style="overflow:auto"><table><thead><tr><th>裝備</th><th>能力</th><th>贖回價格</th><th></th></tr></thead><tbody>${lost.map((x,i)=>`<tr><td>${itemHtml(x.item,true)}</td><td>${statLine(x.item)}</td><td>${x.cost.toLocaleString()}</td><td><button class="btn" onclick="redeemGear(${i})">贖回</button></td></tr>`).join("")}</tbody></table></div>`:""}
    </div>`;
  };

  const originalFightOnce=window.fightOnce;
  if(typeof originalFightOnce==="function"){
    window.fightOnce=function(...args){
      const result=originalFightOnce(...args);
      if(result?.penalty?.dropped)pendingLostGear=result.penalty.dropped;
      return result;
    };
  }

  window.closeLostGearModal=function(){
    const modal=document.getElementById("lostGearModal");
    if(modal)modal.classList.remove("show");
  };

  function showPendingLostGear(){
    if(!pendingLostGear||battleBusy)return;
    const it=pendingLostGear;
    pendingLostGear=null;
    const typeName=it.type==="weapon"?"武器":it.type==="armor"?"防具":"飾品";
    const detail=document.getElementById("lostGearDetail");
    if(detail)detail.innerHTML=`<div><b>${typeName}</b></div>${itemHtml(it)}<div class="muted" style="margin-top:6px">${statLine(it)}</div>`;
    const modal=document.getElementById("lostGearModal");
    if(modal)modal.classList.add("show");
  }

  function pinBattleLogToBottom(){
    const log=document.getElementById("battleLog");
    if(!log)return;
    const pin=()=>{log.scrollTop=log.scrollHeight;};
    requestAnimationFrame(()=>{
      pin();
      requestAnimationFrame(pin);
    });
    setTimeout(pin,60);
  }
  const main=document.getElementById("main");
  if(main){
    new MutationObserver(()=>{
      pinBattleLogToBottom();
      setTimeout(showPendingLostGear,0);
    }).observe(main,{childList:true,subtree:true,characterData:true});
  }
  window.addEventListener("load",()=>{
    pinBattleLogToBottom();
    showPendingLostGear();
  });
  if(typeof render==="function")render();
})();
</script>
</body>
</html>
