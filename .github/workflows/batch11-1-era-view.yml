name: One-time Batch 11-1 Era View Refactor

on:
  push:
    paths:
      - '.github/workflows/batch11-1-era-view.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply batch 11-1 shared era view refactor
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          # worldmapui.js: promote the W2-only view state into one shared session-only era view owner.
          replace_once('worldmapui.js', '''  // 宇宙紀元冒險 UI：正式世界預設宇宙；銀河回顧只保留本次頁面生命週期，不寫正式 save/localStorage。
  let secondWorldAdventureView="universe";
  let galaxyReviewSelectedMap=0;
  let galaxyReviewSelectedEnemy=4;
  let galaxyReviewBattleActive=false;
  const reviewRegionOpenState=Object.create(null);
  let reviewRegionInitialized=false;

  function adventureEraTabsHtml(){
    return `<div class="era-view-tabs" role="tablist" aria-label="冒險紀元">
      <button class="era-view-tab ${secondWorldAdventureView==="universe"?"active":""}" type="button" role="tab" aria-selected="${secondWorldAdventureView==="universe"?"true":"false"}" onclick="setSecondWorldAdventureView('universe')">宇宙紀元</button>
      <button class="era-view-tab ${secondWorldAdventureView==="galaxy-review"?"active":""}" type="button" role="tab" aria-selected="${secondWorldAdventureView==="galaxy-review"?"true":"false"}" onclick="setSecondWorldAdventureView('galaxy-review')">銀河紀元・回顧</button>
    </div>`;
  }
''', '''  // 共用冒險紀元視圖 owner：只存在本次頁面 session；不寫 save／localStorage。世界正式切換時重設，普通 render 不重設。
  let galaxyReviewSelectedMap=0;
  let galaxyReviewSelectedEnemy=4;
  let galaxyReviewBattleActive=false;
  const reviewRegionOpenState=Object.create(null);
  let reviewRegionInitialized=false;

  function currentAdventureWorldPhase(){
    if(typeof window.currentWorldPhase==="function"){
      const current=Number(window.currentWorldPhase(state));
      if(Number.isInteger(current)&&current>=1&&current<=3)return current;
    }
    return state?.thirdWorld?.entered===true?3:state?.secondWorld?.entered===true?2:1;
  }
  function defaultAdventureEraView(current=currentAdventureWorldPhase()){
    return current===3?"higher-dimensional":current===2?"universe":"galaxy";
  }
  let adventureEraWorldPhase=currentAdventureWorldPhase();
  let adventureEraView=defaultAdventureEraView(adventureEraWorldPhase);
  function adventureEraAllowedViews(current=currentAdventureWorldPhase()){
    if(current===3)return ["higher-dimensional","universe-review","galaxy-review"];
    if(current===2)return ["universe","galaxy-review"];
    return ["galaxy"];
  }
  function syncAdventureEraViewWorldPhase(){
    const current=currentAdventureWorldPhase();
    if(current!==adventureEraWorldPhase){
      adventureEraWorldPhase=current;
      adventureEraView=defaultAdventureEraView(current);
    }
    if(!adventureEraAllowedViews(current).includes(adventureEraView))adventureEraView=defaultAdventureEraView(current);
    return adventureEraView;
  }
  function normalizeAdventureEraView(value,current=currentAdventureWorldPhase()){
    let next=String(value||"");
    if(current===3&&next==="universe")next="universe-review";
    if(current===2&&next==="universe-review")next="universe";
    return adventureEraAllowedViews(current).includes(next)?next:null;
  }
  function adventureEraViewLocked(){
    const thirdRun=typeof window.thirdWorldContinuousRunSnapshot==="function"?window.thirdWorldContinuousRunSnapshot():null;
    const secondRun=window.activeSecondWorldMainlineContext||null;
    const globalBattleBusy=typeof battleBusy!=="undefined"&&battleBusy===true;
    return galaxyReviewBattleActive===true||thirdRun?.active===true||!!secondRun||globalBattleBusy;
  }
  function eraTabButton(view,label){
    const active=adventureEraView===view,locked=adventureEraViewLocked()&&!active;
    return `<button class="era-view-tab ${active?"active":""}" type="button" role="tab" aria-selected="${active?"true":"false"}" ${locked?'aria-disabled="true" disabled':''} onclick="setAdventureEraView('${view}')">${label}</button>`;
  }
  function adventureEraTabsHtml(){
    syncAdventureEraViewWorldPhase();
    const current=currentAdventureWorldPhase();
    if(current===1)return "";
    const tabs=current===3?[["higher-dimensional","高維紀元"],["universe-review","宇宙紀元・回顧"],["galaxy-review","銀河紀元・回顧"]]:[["universe","宇宙紀元"],["galaxy-review","銀河紀元・回顧"]];
    return `<div class="era-view-tabs" role="tablist" aria-label="冒險紀元">${tabs.map(([view,label])=>eraTabButton(view,label)).join("")}</div>`;
  }
''')

          replace_once('worldmapui.js', '''    return `<section class="map-screen universe-adventure-screen galaxy-review-adventure-screen"><div class="page-top"><button class="btn back-btn" onclick="go('home')">← 返回主頁</button><h2 class="page-title">冒險</h2><span></span></div>${adventureEraTabsHtml()}<div class="notice galaxy-review-notice"><b>銀河紀元・回顧</b><div class="muted" style="margin-top:6px">第一紀元已完成的 10 大區、100 張地圖均可回顧。回顧戰為純挑戰，不影響宇宙紀元正式進度。</div></div><div class="world-region-list galaxy-review-region-list">${regions.map(reviewRegionHtml).join("")}</div></section>`;
''', '''    return `<section class="map-screen universe-adventure-screen galaxy-review-adventure-screen"><div class="page-top"><button class="btn back-btn" onclick="go('home')">← 返回主頁</button><h2 class="page-title">冒險</h2><span></span></div>${adventureEraTabsHtml()}<div class="notice galaxy-review-notice"><b>銀河紀元・回顧</b><div class="muted" style="margin-top:6px">第一紀元已完成的 10 大區、100 張地圖均可回顧。回顧戰為純挑戰，不影響目前正式進度。</div></div><div class="world-region-list galaxy-review-region-list">${regions.map(reviewRegionHtml).join("")}</div></section>`;
''')

          replace_once('worldmapui.js', '''  window.setSecondWorldAdventureView=function(value){
    const next=value==="galaxy-review"?"galaxy-review":"universe";
    if(secondWorldAdventureView===next)return;
    if(next!=="universe"&&typeof window.cancelSecondWorldAdventureProgressFocus==="function")window.cancelSecondWorldAdventureProgressFocus();
    secondWorldAdventureView=next;
    render();
  };
  window.toggleGalaxyReviewAdventureRegion=function(id){
    initReviewRegions();
    reviewRegionOpenState[id]=!reviewRegionOpenState[id];
    render();
  };
  window.getSecondWorldAdventureView=function(){return secondWorldAdventureView;};
''', '''  window.setAdventureEraView=function(value){
    const current=currentAdventureWorldPhase();
    syncAdventureEraViewWorldPhase();
    const next=normalizeAdventureEraView(value,current);
    if(!next)return false;
    if(adventureEraView===next)return true;
    if(adventureEraViewLocked())return false;
    if(next!=="universe"&&typeof window.cancelSecondWorldAdventureProgressFocus==="function")window.cancelSecondWorldAdventureProgressFocus();
    adventureEraView=next;
    render();
    return true;
  };
  window.getAdventureEraView=function(){return syncAdventureEraViewWorldPhase();};
  window.adventureEraViewLocked=adventureEraViewLocked;
  window.adventureEraTabsHtml=adventureEraTabsHtml;
  // Legacy W2 API remains as a compatibility delegate; it no longer owns state.
  window.setSecondWorldAdventureView=function(value){return window.setAdventureEraView(value);};
  window.getSecondWorldAdventureView=function(){return window.getAdventureEraView()==="galaxy-review"?"galaxy-review":"universe";};
  window.toggleGalaxyReviewAdventureRegion=function(id){
    initReviewRegions();
    reviewRegionOpenState[id]=!reviewRegionOpenState[id];
    render();
  };
''')

          replace_once('worldmapui.js', '''    if(secondWorldAdventureView==="galaxy-review")return galaxyReviewAdventureHtml();
''', '''    if(window.getAdventureEraView?.()==="galaxy-review")return galaxyReviewAdventureHtml();
''')

          replace_once('worldmapui.js', '''  window.SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=2;
  window.SECOND_WORLD_ADVENTURE_UI_VERSION=4;
  window.SECOND_WORLD_ADVENTURE_REVIEW_VIEW_VERSION=3;
  window.GALAXY_REVIEW_SELECTION_OWNER_VERSION=1;
''', '''  window.SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=2;
  window.SECOND_WORLD_ADVENTURE_UI_VERSION=5;
  window.SECOND_WORLD_ADVENTURE_REVIEW_VIEW_VERSION=4;
  window.GALAXY_REVIEW_SELECTION_OWNER_VERSION=1;
  window.ADVENTURE_ERA_VIEW_OWNER_VERSION=1;
  window.ADVENTURE_ERA_SESSION_POLICY_VERSION=1;
  window.ADVENTURE_ERA_RUNTIME_LOCK_VERSION=1;
''')

          # playersemanticsui.js: route W3 adventure through the shared era view without resetting it on render.
          replace_once('playersemanticsui.js',' const VERSION=9;',' const VERSION=10;')
          replace_once('playersemanticsui.js', ''' function phaseAwareAdventurePage(){
  if(phase()===3){
   if(typeof window.cancelSecondWorldAdventureProgressFocus==="function")window.cancelSecondWorldAdventureProgressFocus();
   return typeof window.thirdWorldAdventurePageHtml==="function"?window.thirdWorldAdventurePageHtml():thirdWorldAdventureFallback();
  }
  return baseAdventurePage?baseAdventurePage():`<section class="map-screen"><div class="notice"><b>冒險介面尚未載入。</b></div></section>`;
 }
''', ''' function phaseAwareAdventurePage(){
  if(phase()===3){
   if(typeof window.cancelSecondWorldAdventureProgressFocus==="function")window.cancelSecondWorldAdventureProgressFocus();
   const era=typeof window.getAdventureEraView==="function"?window.getAdventureEraView():"higher-dimensional";
   if((era==="universe-review"||era==="galaxy-review")&&typeof window.secondWorldAdventurePageHtml==="function")return window.secondWorldAdventurePageHtml();
   return typeof window.thirdWorldAdventurePageHtml==="function"?window.thirdWorldAdventurePageHtml():thirdWorldAdventureFallback();
  }
  return baseAdventurePage?baseAdventurePage():`<section class="map-screen"><div class="notice"><b>冒險介面尚未載入。</b></div></section>`;
 }
''')
          replace_once('playersemanticsui.js', ''' function applyThirdWorldUniverseReviewSemantics(){
  if(typeof document==="undefined"||phase()!==3)return false;
''', ''' function applyThirdWorldUniverseReviewSemantics(){
  if(typeof document==="undefined"||phase()!==3||window.getAdventureEraView?.()!=="universe-review")return false;
''')
          replace_once('playersemanticsui.js', ''' window.PLAYER_SEMANTICS_UI_VERSION=VERSION;
 window.PLAYER_SEMANTICS_WORLD_PHASE_VERSION=3;
 window.PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION=1;
''', ''' window.PLAYER_SEMANTICS_UI_VERSION=VERSION;
 window.PLAYER_SEMANTICS_WORLD_PHASE_VERSION=3;
 window.PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION=2;
 window.PLAYER_ADVENTURE_ERA_VIEW_ROUTING_VERSION=1;
''')

          # thirdworldui.js: high-dimensional page uses the same era tabs owner.
          replace_once('thirdworldui.js',' const VERSION=6;',' const VERSION=7;')
          replace_once('thirdworldui.js', '''  return `<section class="map-screen third-world-adventure-screen">${topBarHtml(true)}${summaryHtml(agg)}${commonAbilitiesHtml()}${combatRuleHtml()}${activeRunHtml()}<div class="map-grid universe-boss-grid third-world-boss-grid">${defs.map((boss,index)=>bossCardHtml(boss,index)).join("")}</div>${corePanelHtml()}</section>`;
''', '''  const eraTabs=typeof window.adventureEraTabsHtml==="function"?window.adventureEraTabsHtml():"";
  return `<section class="map-screen third-world-adventure-screen">${topBarHtml(true)}${eraTabs}${summaryHtml(agg)}${commonAbilitiesHtml()}${combatRuleHtml()}${activeRunHtml()}<div class="map-grid universe-boss-grid third-world-boss-grid">${defs.map((boss,index)=>bossCardHtml(boss,index)).join("")}</div>${corePanelHtml()}</section>`;
''')
          replace_once('thirdworldui.js', ''' window.THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION=COMBAT_PAGE_UI_VERSION;
 window.THIRD_WORLD_PLAYER_UI_INTEGRITY=validate();
''', ''' window.THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION=COMBAT_PAGE_UI_VERSION;
 window.THIRD_WORLD_PLAYER_UI_ERA_TABS_VERSION=1;
 window.THIRD_WORLD_PLAYER_UI_INTEGRITY=validate();
''')

          # Third-world canonical contract adopts the shared era owner and new UI/routing versions.
          replace_once('thirdworldintegritycontract.js',' const VERSION=26;',' const VERSION=27;')
          replace_once('thirdworldintegritycontract.js', '''  THIRD_WORLD_PLAYER_UI_VERSION:6,THIRD_WORLD_PLAYER_UI_BOSS_GRID_VERSION:1,THIRD_WORLD_PLAYER_UI_CORE_VERSION:2,THIRD_WORLD_PLAYER_UI_DERIVED_OWNER_VERSION:2,THIRD_WORLD_PLAYER_UI_CORE_FEEDBACK_LIFECYCLE_VERSION:1,THIRD_WORLD_PLAYER_UI_CORE_CONFIRMATION_VERSION:1,THIRD_WORLD_PLAYER_UI_RUN_ENTRY_VERSION:1,THIRD_WORLD_PLAYER_UI_THREE_COLUMN_HEADER_VERSION:1,THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION:1,
''', '''  THIRD_WORLD_PLAYER_UI_VERSION:7,THIRD_WORLD_PLAYER_UI_BOSS_GRID_VERSION:1,THIRD_WORLD_PLAYER_UI_CORE_VERSION:2,THIRD_WORLD_PLAYER_UI_DERIVED_OWNER_VERSION:2,THIRD_WORLD_PLAYER_UI_CORE_FEEDBACK_LIFECYCLE_VERSION:1,THIRD_WORLD_PLAYER_UI_CORE_CONFIRMATION_VERSION:1,THIRD_WORLD_PLAYER_UI_RUN_ENTRY_VERSION:1,THIRD_WORLD_PLAYER_UI_THREE_COLUMN_HEADER_VERSION:1,THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION:1,THIRD_WORLD_PLAYER_UI_ERA_TABS_VERSION:1,
''')
          replace_once('thirdworldintegritycontract.js', '''  PLAYER_SEMANTICS_UI_VERSION:9,PLAYER_SEMANTICS_WORLD_PHASE_VERSION:3,PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION:1,CHARACTER_WORLD_PHASE_SEMANTICS_VERSION:2,THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION:1,
''', '''  PLAYER_SEMANTICS_UI_VERSION:10,PLAYER_SEMANTICS_WORLD_PHASE_VERSION:3,PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION:2,PLAYER_ADVENTURE_ERA_VIEW_ROUTING_VERSION:1,CHARACTER_WORLD_PHASE_SEMANTICS_VERSION:2,THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION:1,
  ADVENTURE_ERA_VIEW_OWNER_VERSION:1,ADVENTURE_ERA_SESSION_POLICY_VERSION:1,ADVENTURE_ERA_RUNTIME_LOCK_VERSION:1,
''')
          replace_once('thirdworldintegritycontract.js', '''"thirdWorldAdventurePageHtml","thirdWorldCombatPageHtml","validateThirdWorldPlayerUi","openThirdWorldCoreInjectionConfirm"''', '''"getAdventureEraView","setAdventureEraView","adventureEraTabsHtml","adventureEraViewLocked","thirdWorldAdventurePageHtml","thirdWorldCombatPageHtml","validateThirdWorldPlayerUi","openThirdWorldCoreInjectionConfirm"''')

          # Runtime source integrity for the shared owner and cache-busts.
          replace_once('tests/runtime/js-integrity.js', 'assert(/SECOND_WORLD_ADVENTURE_UI_VERSION=4/.test(worldmap),"worldmapui.js 宇宙冒險 UI 應為 V4。");', 'assert(/SECOND_WORLD_ADVENTURE_UI_VERSION=5/.test(worldmap),"worldmapui.js 宇宙冒險 UI 應為 V5。");\nassert(/ADVENTURE_ERA_VIEW_OWNER_VERSION=1/.test(worldmap)&&/ADVENTURE_ERA_SESSION_POLICY_VERSION=1/.test(worldmap)&&/ADVENTURE_ERA_RUNTIME_LOCK_VERSION=1/.test(worldmap),"三紀元冒險切換必須由單一 session-only owner 持有，並具備 runtime lock。\");\nassert(/let adventureEraView=defaultAdventureEraView/.test(worldmap)&&/setAdventureEraView=function/.test(worldmap)&&/getAdventureEraView=function/.test(worldmap)&&!/let secondWorldAdventureView=/.test(worldmap),"冒險紀元選擇不得再由第二紀元專用 state 持有。\");\nassert(/PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION=2/.test(playerSemanticsUi)&&/PLAYER_ADVENTURE_ERA_VIEW_ROUTING_VERSION=1/.test(playerSemanticsUi)&&/getAdventureEraView/.test(playerSemanticsUi)&&/universe-review/.test(playerSemanticsUi),"高維冒險 routing 必須委派共用 era view owner。\");')
          replace_once('tests/runtime/js-integrity.js', '''assert(index.includes('src="calamityrun.js?v=20260927-run-opt-batch2"')&&index.includes('src="backgroundprogress.js?v=20260927-run-opt-batch1"')&&index.includes('src="thirdworldphase.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldcore.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldmigrationregression.js?v=20260928-thirdworld-batch10-opt2"')&&index.includes('src="thirdworldrun.js?v=20260928-thirdworld-batch10-opt1"')&&index.includes('src="continuousrunintegrity.js?v=20260927-run-opt-batch2"')&&index.includes('src="thirdworldsubsystemintegrity.js?v=20260928-thirdworld-batch10-opt1"')&&index.includes('src="thirdworldintegritycontract.js?v=20260928-thirdworld-batch10-opt1"'),"index.html 必須同步載入目前正式連戰與第三紀元 owner cache-bust。");
''', '''assert(index.includes('src="calamityrun.js?v=20260927-run-opt-batch2"')&&index.includes('src="backgroundprogress.js?v=20260927-run-opt-batch1"')&&index.includes('src="thirdworldphase.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldcore.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldmigrationregression.js?v=20260928-thirdworld-batch10-opt2"')&&index.includes('src="thirdworldrun.js?v=20260928-thirdworld-batch10-opt1"')&&index.includes('src="continuousrunintegrity.js?v=20260927-run-opt-batch2"')&&index.includes('src="thirdworldsubsystemintegrity.js?v=20260928-thirdworld-batch10-opt1"')&&index.includes('src="thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-1"'),"index.html 必須同步載入目前正式連戰與第三紀元 owner cache-bust。");
assert(index.includes('src="worldmapui.js?v=20260928-thirdworld-batch11-1"')&&index.includes('src="thirdworldui.js?v=20260928-thirdworld-batch11-1"')&&index.includes('src="playersemanticsui.js?v=20260928-thirdworld-batch11-1"'),"index.html 必須同步載入第 11-1 批三紀元共用冒險視圖 owner cache-bust。");
''')

          # index.html cache-busts for all modified browser owners.
          replace_once('index.html','worldmapui.js?v=20260925-universe-adventure-cleanup1','worldmapui.js?v=20260928-thirdworld-batch11-1')
          replace_once('index.html','thirdworldui.js?v=20260928-thirdworld-batch10-opt3','thirdworldui.js?v=20260928-thirdworld-batch11-1')
          replace_once('index.html','playersemanticsui.js?v=20260927-thirdworld-ui-opt9-1','playersemanticsui.js?v=20260928-thirdworld-batch11-1')
          replace_once('index.html','thirdworldintegritycontract.js?v=20260928-thirdworld-batch10-opt1','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-1')

          # The temporary helper workflow and accidental empty file must not remain in final main.
          Path('__noop__').unlink(missing_ok=True)
          Path('.github/workflows/batch11-1-era-view.yml').unlink(missing_ok=True)
      - name: Syntax and source integrity self-check
        run: |
          node --check worldmapui.js
          node --check playersemanticsui.js
          node --check thirdworldui.js
          node --check thirdworldintegritycontract.js
          node --check tests/runtime/js-integrity.js
          node tests/runtime/js-integrity.js
          git diff --check
      - name: Commit batch 11-1 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement shared three-era adventure view owner"
          git push origin HEAD:main
