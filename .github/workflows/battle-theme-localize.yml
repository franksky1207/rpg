name: Localize three selected battle themes
on:
  push:
    paths: [".github/workflows/battle-theme-localize.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battle-theme-localize
  cancel-in-progress: false
jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Download and validate selected battle music
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,urllib.request,hashlib,json,subprocess,time
          root=pathlib.Path('audio/assets/battle-themes')
          root.mkdir(parents=True,exist_ok=True)
          items=[
           ('normal','JRPG Battle Theme','North Fantasy Music','https://opengameart.org/content/jrpg-battle-theme','battletheme.wav',True),
           ('medium','Boss Battle','tcarisland','https://opengameart.org/content/boss-battle-5','boss_battle_3.mp3',False),
           ('high',"I'm Boss Here!",'Fato Shadow','https://opengameart.org/content/im-boss-here-soundtrack','fato_shadow_-_im_boss_here.ogg',True)]
          def run(*cmd):
           p=subprocess.run(cmd,capture_output=True,text=True,check=True)
           return p.stdout
          manifest={}
          for tier,title,author,page,source_name,claimed_loop in items:
           url='https://opengameart.org/sites/default/files/'+source_name
           extension=pathlib.Path(source_name).suffix
           original=root/(tier+'-original'+extension)
           if not original.exists() or original.stat().st_size<1000:
            err=None
            for attempt in range(3):
             try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://opengameart.org/'})
              with urllib.request.urlopen(req,timeout=100) as response:data=response.read(40*1024*1024+1)
              if not 1000<len(data)<40*1024*1024 or data[:20].lower().startswith(b'<html'):raise ValueError('invalid audio payload')
              original.write_bytes(data);break
             except Exception as e:
              err=e
              if attempt<2:time.sleep(attempt*3+2)
            if not original.exists():raise RuntimeError(str(err))
           source_data=json.loads(run('ffprobe','-v','error','-show_entries','format=duration:stream=codec_name,sample_rate,channels','-of','json',str(original)))
           seconds=float(source_data['format']['duration'])
           if seconds<15:raise RuntimeError('Unexpected music duration '+tier)
           loop=root/(tier+'-battle-loop.ogg')
           if not loop.exists():
            # No forced head-tail mixing: preserve the arrangement while awaiting human seam evaluation.
            run('ffmpeg','-nostdin','-v','error','-y','-i',str(original),'-map','0:a:0','-ar','48000','-ac','2','-c:a','libvorbis','-q:a','5',str(loop))
           test=json.loads(run('ffprobe','-v','error','-show_entries','format=duration','-of','json',str(loop)))
           loop_seconds=float(test['format']['duration'])
           if abs(loop_seconds-seconds)>1.2:raise RuntimeError('Duration mismatch '+tier)
           run('ffmpeg','-nostdin','-v','error','-i',str(loop),'-f','null','-')
           def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
           manifest[tier]={'title':title,'author':author,'license':'CC BY 4.0','source_page':page,'source_url':url,'original_file':original.name,'original_bytes':original.stat().st_size,'original_sha256':sha(original),'original_duration_seconds':round(seconds,3),'loop_file':loop.name,'loop_bytes':loop.stat().st_size,'loop_sha256':sha(loop),'loop_duration_seconds':round(loop_seconds,3),'loop_strategy':'Source arrangement kept intact; seek/seam test required before claiming seamless looping','source_marked_loop':claimed_loop,'human_loop_auditioned':False,'usage':'GM audition only; not assigned to real battles'}
          (root/'manifest.json').write_text(json.dumps({'version':1,'status':'technical-validation-only','themes':manifest},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({tier:{'seconds':v['loop_duration_seconds'],'bytes':v['loop_bytes']} for tier,v in manifest.items()},indent=2))
          PY
      - name: Commit sources, converted OGG and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/battle-themes/
          if ! git diff --cached --quiet; then
            git commit -m "audio: localize three selected battle themes for GM audition"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
