name: Apply void integrity batch 2

on:
  push:
    paths:
      - '.github/workflows/apply-void-integrity-batch2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index and handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          anchor='<script src="mainminimalmodeintegrity.js?v=20260917-void-minimal-integrity3"></script>'
          addition=anchor+'<script src="dungeonvoidintegrity.js?v=20260917-void-integrity1"></script>'
          if anchor not in text:
              raise SystemExit('index integrity anchor not found')
          text=text.replace(anchor,addition,1)
          p.write_text(text,encoding='utf-8')

          p=Path('PROJECT_HANDOFF.md')
          text=p.read_text(encoding='utf-8')
          anchor='- `VOID_MIRAGE_AUTO_OWNER_VERSION = 1`；`VOID_MIRAGE_UI_AUTO_ADAPTER_VERSION = 1`。\n'
          addition=anchor+'- 虛空專屬 runtime integrity：`dungeonvoidintegrity.js`，`VOID_MIRAGE_INTEGRITY_VERSION = 1`；檢查解鎖 Lv.25、前 100 層起點、每 10 層 Boss、普通／Boss 特性數、勝利後紀錄與樓層前進順序、戰後滿血、退出旗標、唯一 auto-run owner/callback contract、必要 snapshot/API。\n'
          if anchor not in text:
              raise SystemExit('handoff owner anchor not found')
          text=text.replace(anchor,addition,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit batch 2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html PROJECT_HANDOFF.md
          git commit -m 'test: wire void mirage integrity checks'
          git push
