name: Patch W1 Target Context Index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-w1-target-context-index.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert target-context owner and cache bust
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text()
          old='<script src="worldmapui.js?v=20260928-thirdworld-batch11-o2"></script>\n<script src="reincarnationrerunworld1.js?v=20261004-reincarnation-batch5-2-fix1&v2=20261004-rerun-target-identity-fix1&v3=20261004-rerun-speed-badge-reuse1&v4=20261004-rerun-target-context-opt1&v5=20261004-rerun-ui-renderer-opt3"></script>'
          new='<script src="worldmapui.js?v=20260928-thirdworld-batch11-o2"></script>\n<script src="firstworldtargetcontext.js?v=20261005-w1-target-context-batch1"></script>\n<script src="reincarnationrerunworld1.js?v=20261004-reincarnation-batch5-2-fix1&v2=20261004-rerun-target-identity-fix1&v3=20261004-rerun-speed-badge-reuse1&v4=20261004-rerun-target-context-opt1&v5=20261004-rerun-ui-renderer-opt3&v6=20261005-w1-target-context-batch1"></script>'
          if new in text:
              raise SystemExit(0)
          if old not in text:
              raise SystemExit('expected index script block not found')
          path.write_text(text.replace(old,new,1))
          PY
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Load canonical W1 target context owner"
          git push
