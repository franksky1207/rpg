name: W3 VIP20 Death Protection
on:
  push:
    paths:
      - '.github/workflows/w3-vip20-death-protection.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        shell: bash
        run: |
          python3 batch_w3_vip20_death_protection.py
          python3 batch_w3_vip20_fix_integrity.py
      - name: Syntax and diff
        shell: bash
        run: |
          set -euo pipefail
          node --check engine.js
          node --check thirdworldrun.js
          node --check thirdworldplayerflow.js
          node --check vipui.js
          node --check gameguide.js
          node --check tests/runtime/js-integrity.js
          node --check tests/runtime/vip-unbounded-integrity.js
          git diff --check
      - name: Runtime integrity
        shell: bash
        run: |
          set -euo pipefail
          node tests/runtime/js-integrity.js
          node tests/runtime/vip-unbounded-integrity.js
      - name: Story integrity
        shell: bash
        run: |
          set -euo pipefail
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
      - name: Semantic checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DEATH_EQUIPMENT_LOSS_CHANCE=.30' engine.js
          grep -q 'resolveDeathEquipmentPenalty' thirdworldrun.js
          grep -q 'forceProtected:true' thirdworldrun.js
          grep -q 'VIP20｜裝備保護' thirdworldplayerflow.js
          grep -q '第三紀元死亡仍會進行原本的 30% 裝備遺失判定' vipui.js
          grep -q '第三紀元仍保留這個原判定' gameguide.js
          grep -q 'engine.js?v=20260928-thirdworld-vip20-death-protection1' index.html
          grep -q 'thirdworldrun.js?v=20260928-thirdworld-vip20-death-protection1' index.html
          grep -q 'thirdworldplayerflow.js?v=20260928-thirdworld-vip20-death-protection1' index.html
          grep -q 'vipui.js?v=20260928-thirdworld-vip20-death-protection1' index.html
          grep -q 'gameguide.js?v=20260928-thirdworld-vip20-death-protection1' index.html
      - name: Commit formal changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine.js thirdworldrun.js thirdworldplayerflow.js vipui.js gameguide.js tests/runtime/js-integrity.js tests/runtime/vip-unbounded-integrity.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make W3 death protection visibly reward VIP20'
          git push origin HEAD:main
