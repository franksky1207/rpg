name: Batch 12-O2 Story Completion
on:
  push:
    paths:
      - '.github/workflows/batch12-o2-story-completion.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply batch 12-O2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1 anchor, got {c}')
              return s.replace(old,new,1)

          storyui = r'''(function(){
           const MODAL_ID="civilizationStoryModal";
           const VERSION=10;
           const LIFECYCLE_WAIT_VERSION=2;
           const INSTANCE_IDENTITY_VERSION=1;
           let activeStory=null;
           let activePage=0;
           let activeOptions=null;
           let activeToken=0;
           let nextToken=1;
           let storyCloseWaiters=[];

           function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
           function playerName(){
            let name="";
            if(typeof currentPlayerName==="function")name=String(currentPlayerName()||"").trim();
            if(!name&&typeof state?.playerName==="string")name=state.playerName.trim();
            return !name||name==="玩家"?"作戰員":name;
           }
           function interpolate(v){return String(v??"").replaceAll("{角色名稱}",playerName());}
           function regionFinaleLabel(story){
            if(!story?.id)return "";
            const registries=[window.CIVILIZATION_STORY_REGIONS,window.CIVILIZATION_UNIVERSE_STORY_REGIONS];
            for(const regions of registries){
             if(!Array.isArray(regions))continue;
             for(const region of regions){
              const rows=Array.isArray(region?.stories)?region.stories:[];
              if(!rows.length||rows[rows.length-1]?.id!==story.id)continue;
              const chapter=String(story.chapter||"").replace(/^宇宙紀元・/,"").trim();
              return chapter?`${chapter}　完`:"";
             }
            }
            return "";
           }
           function activeStoryLifecycleSnapshot(){return activeStory?Object.freeze({token:activeToken,storyId:String(activeStory.id||""),page:activePage,pageCount:Array.isArray(activeStory.pages)?activeStory.pages.length:0}):null;}
           function resolveStoryClosed(token,storyId,completed){
            const remaining=[];
            storyCloseWaiters.forEach(waiter=>{
             if(waiter.token===token){try{waiter.resolve(Object.freeze({closed:true,matched:true,token,storyId,completed:completed===true}));}catch(_){}}
             else remaining.push(waiter);
            });
            storyCloseWaiters=remaining;
           }
           function waitForStoryClosed(expected=null){
            const current=activeStoryLifecycleSnapshot();
            if(!current)return Promise.resolve(Object.freeze({closed:true,matched:false,reason:"no-active-story",token:0,storyId:null,completed:false}));
            const expectedToken=typeof expected==="number"?expected:Number(expected?.token)||0;
            const expectedStoryId=typeof expected==="string"?expected:String(expected?.storyId||"");
            if(expectedToken&&expectedToken!==current.token)return Promise.resolve(Object.freeze({closed:false,matched:false,reason:"token-mismatch",token:current.token,storyId:current.storyId,completed:false}));
            if(expectedStoryId&&expectedStoryId!==current.storyId)return Promise.resolve(Object.freeze({closed:false,matched:false,reason:"story-mismatch",token:current.token,storyId:current.storyId,completed:false}));
            return new Promise(resolve=>storyCloseWaiters.push({token:current.token,storyId:current.storyId,resolve}));
           }
           function ensureModal(){
            let modal=document.getElementById(MODAL_ID);
            if(modal)return modal;
            modal=document.createElement("div");
            modal.id=MODAL_ID;
            modal.className="story-overlay";
            modal.setAttribute("role","dialog");
            modal.setAttribute("aria-modal","true");
            modal.innerHTML=`<div class="story-card"><div class="story-head"><div id="storyChapter" class="story-chapter"></div><div id="storyLocation" class="story-location"></div><div id="storyTitle" class="story-title"></div></div><div id="storyBody" class="story-body"></div><div id="storyActions" class="story-actions"></div></div>`;
            document.body.appendChild(modal);
            return modal;
           }
           function renderPage(){
            const modal=ensureModal();
            if(!activeStory||!Array.isArray(activeStory.pages)||!activeStory.pages.length)return;
            activePage=Math.max(0,Math.min(activeStory.pages.length-1,activePage));
            document.getElementById("storyChapter").textContent=interpolate(activeStory.chapter||"");
            document.getElementById("storyLocation").textContent=interpolate(activeStory.location||"");
            document.getElementById("storyTitle").textContent=interpolate(activeStory.title||"");
            const page=activeStory.pages[activePage]||[];
            const first=activePage===0,last=activePage===activeStory.pages.length-1;
            const finaleLabel=last?regionFinaleLabel(activeStory):"";
            const normalizedFinale=finaleLabel.trim();
            const hasFinaleLabel=!!finaleLabel&&page.some(block=>{
             if(block&&typeof block==="object"&&typeof block.em==="string")return String(block.em).trim()===normalizedFinale;
             return typeof block==="string"&&String(block).trim()===normalizedFinale;
            });
            let bodyHtml=page.map(block=>{
             if(block&&typeof block==="object"&&Object.prototype.hasOwnProperty.call(block,"em"))return `<p class="story-em">${esc(interpolate(block.em))}</p>`;
             if(finaleLabel&&typeof block==="string"&&String(block).trim()===normalizedFinale)return `<p class="story-em">${esc(interpolate(block))}</p>`;
             return `<p>${esc(interpolate(block))}</p>`;
            }).join("");
            if(finaleLabel&&!hasFinaleLabel)bodyHtml+=`<p class="story-em">${esc(interpolate(finaleLabel))}</p>`;
            document.getElementById("storyBody").innerHTML=bodyHtml;
            const pageLabel=`${activePage+1} / ${activeStory.pages.length}`;
            document.getElementById("storyActions").innerHTML=`${first?'<span class="story-spacer"></span>':'<button class="btn" onclick="storyPreviousPage()">上一頁</button>'}<div class="story-page-number" aria-label="劇情頁數">${pageLabel}</div><button class="btn primary" onclick="${last?'closeStory()':'storyNextPage()'}">${last?'結束':'下一頁'}</button>`;
            modal.classList.add("open");
           }
           window.openStory=function(storyId,options=null){
            const story=window.CIVILIZATION_STORIES?.[storyId];
            if(!story||!Array.isArray(story.pages)||!story.pages.length)return false;
            if(activeStory)return String(activeStory.id||"")===String(storyId||"");
            activeStory=story;activePage=0;activeOptions=options&&typeof options==="object"?options:null;activeToken=nextToken++;renderPage();return true;
           };
           window.storyPreviousPage=function(){if(!activeStory||activePage<=0)return;activePage--;renderPage();};
           window.storyNextPage=function(){if(!activeStory||activePage>=activeStory.pages.length-1)return;activePage++;renderPage();};
           window.closeStory=function(){
            const modal=document.getElementById(MODAL_ID);
            const story=activeStory,options=activeOptions,token=activeToken,storyId=String(story?.id||"");
            const completed=!!story&&Array.isArray(story.pages)&&story.pages.length>0&&activePage===story.pages.length-1;
            if(modal)modal.classList.remove("open");
            activeStory=null;activePage=0;activeOptions=null;activeToken=0;
            if(completed&&typeof options?.onComplete==="function"){
             try{options.onComplete(story.id,story);}catch(error){console.error("Story completion callback failed",error);}
            }
            resolveStoryClosed(token,storyId,completed);
           };
           window.isStoryOpen=function(storyId=null){return !!activeStory&&(storyId==null||String(activeStory.id||"")===String(storyId));};
           window.activeStoryLifecycleSnapshot=activeStoryLifecycleSnapshot;
           window.waitForStoryClosed=waitForStoryClosed;
           window.STORY_UI_VERSION=VERSION;
           window.STORY_UI_LIFECYCLE_WAIT_VERSION=LIFECYCLE_WAIT_VERSION;
           window.STORY_UI_INSTANCE_IDENTITY_VERSION=INSTANCE_IDENTITY_VERSION;
          })();'''
          write('storyui.js',storyui)

          p=read('storyprogress.js')
          p=once(p,'const VERSION=15;','const VERSION=16;','storyprogress version')
          p=once(p,'const THIRD_WORLD_POST_FLOW_DRAIN_VERSION=1;','const THIRD_WORLD_POST_FLOW_DRAIN_VERSION=1;\n const THIRD_WORLD_STORY_COMPLETION_OWNER_VERSION=1;','completion owner constant')
          old='function normalizeProgress(target,options={}){const migration=window.civilizationStoryMigration;if(!migration?.migrate){console.error("Story migration module is unavailable");return target;}migration.migrate(target,migrationOptions(options));return target;}'
          new='function normalizeProgress(target,options={}){const migration=window.civilizationStoryMigration;if(!migration?.migrate){console.error("Story migration module is unavailable");return target;}migration.migrate(target,migrationOptions(options));reconcileThirdWorldStoryCompletionState(target);return target;}'
          p=once(p,old,new,'normalize progress')
          old='function setPending(id){const p=ensureProgress();if(!p)return false;p.pendingStory=id||null;persist();return true;}function completeStory(id){const p=ensureProgress();if(!p)return false;const first=!p.completedStories.includes(id);if(first)p.completedStories.push(id);if(p.pendingStory===id)p.pendingStory=null;if(id===INTRO_STORY_ID){p.introCompleted=true;state.introSeen=true;}persist();if(first&&typeof window.showCivilizationCalamityUnlockNoticeForStory==="function")queueMicrotask(()=>window.showCivilizationCalamityUnlockNoticeForStory(id));if(first&&typeof window.handleSecondWorldStoryCompletion==="function")window.handleSecondWorldStoryCompletion(id);return true;}'
          new='function setPending(id){const p=ensureProgress();if(!p)return false;p.pendingStory=id||null;persist();return true;}function completeStory(id){const p=ensureProgress();if(!p)return false;const thirdGate=thirdWorldStoryCompletionGate(id,state);if(thirdGate.handled&&thirdGate.allowed!==true)return false;const first=!p.completedStories.includes(id);if(first)p.completedStories.push(id);if(p.pendingStory===id)p.pendingStory=null;if(id===INTRO_STORY_ID){p.introCompleted=true;state.introSeen=true;}if(thirdGate.handled)applyThirdWorldStoryCompletion(id,state,thirdGate);persist();if(first&&typeof window.showCivilizationCalamityUnlockNoticeForStory==="function")queueMicrotask(()=>window.showCivilizationCalamityUnlockNoticeForStory(id));if(first&&typeof window.handleSecondWorldStoryCompletion==="function")window.handleSecondWorldStoryCompletion(id);return true;}'
          p=once(p,old,new,'completeStory')
          anchor='function thirdWorldBossesDefeated(target){if(typeof window.thirdWorldBossesAllDefeated==="function")return window.thirdWorldBossesAllDefeated(target)===true;const rows=target?.thirdWorld?.bosses;return Array.isArray(rows)&&rows.length===10&&rows.every(row=>Number(row?.currentHp)===0);}'
          insert=anchor+r'''\n function thirdWorldDescriptorForStory(id){const key=String(id||"");return thirdWorldDescriptors().find(row=>String(row?.storyId||row?.id||"")===key)||null;}
 function thirdWorldStoryCompletionGate(id,target=state){
  const descriptor=thirdWorldDescriptorForStory(id);if(!descriptor)return Object.freeze({handled:false,allowed:true,reason:"not-third-world-story",storyId:String(id||"")});
  const third=target?.thirdWorld,story=third?.story||{},stage=Math.max(0,Math.floor(Number(descriptor.stage)||0)),entered=third?.entered===true,bossesDefeated=thirdWorldBossesDefeated(target),unlockedStage=Math.max(0,Math.min(10,Math.floor(Number(story.unlockedStage)||0)));
  let allowed=entered,reason=entered?"eligible":"third-world-not-entered";
  if(allowed&&descriptor.kind==="milestone"&&unlockedStage<stage){allowed=false;reason="milestone-not-unlocked";}
  if(allowed&&descriptor.kind==="final"&&(!bossesDefeated||unlockedStage<10)){allowed=false;reason="final-not-ready";}
  return Object.freeze({handled:true,allowed,reason,storyId:String(descriptor.storyId||descriptor.id||id),kind:String(descriptor.kind||""),stage,entered,bossesDefeated,unlockedStage});
 }
 function applyThirdWorldStoryCompletion(id,target=state,gate=null){
  const decision=gate?.handled?gate:thirdWorldStoryCompletionGate(id,target);if(!decision.handled||decision.allowed!==true)return Object.freeze({...decision,applied:false});
  const third=target.thirdWorld;if(!third.story||typeof third.story!=="object"||Array.isArray(third.story))third.story={introSeen:false,unlockedStage:0,finalSeen:false};
  if(decision.kind==="intro")third.story.introSeen=true;
  if(decision.kind==="final"){third.story.finalSeen=true;third.completed=true;}
  return Object.freeze({...decision,applied:true,finalSeen:third.story.finalSeen===true,storedCompleted:third.completed===true});
 }
 function reconcileThirdWorldStoryCompletionState(target=state){
  const third=target?.thirdWorld,p=target?.storyProgress;if(third?.entered!==true||!p||!Array.isArray(p.completedStories))return {applied:false,reason:"unavailable"};
  if(!third.story||typeof third.story!=="object"||Array.isArray(third.story))third.story={introSeen:false,unlockedStage:0,finalSeen:false};
  const before={introSeen:third.story.introSeen===true,finalSeen:third.story.finalSeen===true,completed:third.completed===true};
  const completed=new Set(p.completedStories),intro=thirdWorldDescriptors().find(row=>row?.kind==="intro")||null,final=thirdWorldDescriptors().find(row=>row?.kind==="final")||null;
  if(intro&&formalStoryContentReady(intro))third.story.introSeen=completed.has(String(intro.storyId||intro.id||""));
  if(final&&formalStoryContentReady(final)){const finalDone=completed.has(String(final.storyId||final.id||""))&&thirdWorldBossesDefeated(target)&&Number(third.story.unlockedStage)>=10;third.story.finalSeen=finalDone;third.completed=finalDone;}
  const after={introSeen:third.story.introSeen===true,finalSeen:third.story.finalSeen===true,completed:third.completed===true};return {applied:JSON.stringify(before)!==JSON.stringify(after),before,after};
 }'''
          p=once(p,anchor,insert,'third world completion helpers')
          old='function authReady(){return window.CIVILIZATION_AUTH_REQUIRED!==true||!!window.civilizationAuthSession;}function backgroundReady(){return window.BACKGROUND_PRELOAD_READY===true;}function openFormalStory(id){if(typeof openStory!=="function")return false;if(typeof isStoryOpen==="function"&&isStoryOpen())return true;return openStory(id,{onComplete:storyId=>{completeStory(storyId);queueResume();}});}'
          new='function authReady(){return window.CIVILIZATION_AUTH_REQUIRED!==true||!!window.civilizationAuthSession;}function backgroundReady(){return window.BACKGROUND_PRELOAD_READY===true;}function openFormalStory(id){if(typeof openStory!=="function")return false;if(typeof isStoryOpen==="function"&&isStoryOpen())return isStoryOpen(id)===true;return openStory(id,{onComplete:storyId=>{completeStory(storyId);queueResume();}});}'
          p=once(p,old,new,'openFormalStory identity')
          old='if(typeof window.isStoryOpen!=="function"||window.isStoryOpen()!==true){if(!openFormalStory(pending))return Object.freeze({version:THIRD_WORLD_POST_FLOW_DRAIN_VERSION,ok:false,drained:presented>0,presented,deferred:true,reason:"story-open-failed",pendingStory:pending});}\n   await window.waitForStoryClosed();presented++;'
          new='if(typeof window.isStoryOpen!=="function"||window.isStoryOpen()!==true){if(!openFormalStory(pending))return Object.freeze({version:THIRD_WORLD_POST_FLOW_DRAIN_VERSION,ok:false,drained:presented>0,presented,deferred:true,reason:"story-open-failed",pendingStory:pending});}\n   if(window.isStoryOpen(pending)!==true)return Object.freeze({version:THIRD_WORLD_POST_FLOW_DRAIN_VERSION,ok:true,drained:presented>0,presented,deferred:true,reason:"foreign-active-story",pendingStory:pending});\n   const lifecycle=typeof window.activeStoryLifecycleSnapshot==="function"?window.activeStoryLifecycleSnapshot():null;if(!lifecycle||lifecycle.storyId!==pending)return Object.freeze({version:THIRD_WORLD_POST_FLOW_DRAIN_VERSION,ok:false,drained:presented>0,presented,deferred:true,reason:"story-identity-unavailable",pendingStory:pending});\n   const closed=await window.waitForStoryClosed({storyId:pending,token:lifecycle.token});if(closed?.matched!==true)return Object.freeze({version:THIRD_WORLD_POST_FLOW_DRAIN_VERSION,ok:false,drained:presented>0,presented,deferred:true,reason:"story-lifecycle-mismatch",pendingStory:pending});presented++;'
          p=once(p,old,new,'drain lifecycle identity')
          p=once(p,'window.civilizationStoryProgress={version:VERSION,','window.civilizationStoryProgress={version:VERSION,thirdWorldStoryCompletionGate,applyThirdWorldStoryCompletion,reconcileThirdWorldStoryCompletionState,','progress exports')
          p=once(p,'window.THIRD_WORLD_STORY_POST_FLOW_DRAIN_VERSION=THIRD_WORLD_POST_FLOW_DRAIN_VERSION;','window.THIRD_WORLD_STORY_POST_FLOW_DRAIN_VERSION=THIRD_WORLD_POST_FLOW_DRAIN_VERSION;\n window.THIRD_WORLD_STORY_COMPLETION_OWNER_VERSION=THIRD_WORLD_STORY_COMPLETION_OWNER_VERSION;','completion owner export')
