          r=once(r,'["normalize","resume","get","setPending","completeStory","queueStory","queueBossStory","queueUniverseBossStory","thirdWorldEligibility","nextThirdWorldStory","queueThirdWorldEligibleStory","thirdWorldCompletionFramework","consumeThirdWorldSettlement","drainThirdWorldPostFlowStories","bossStoryId","universeBossStoryId","universeBossIndexForStory","completedStories"]','["normalize","resume","get","setPending","completeStory","queueStory","queueBossStory","queueUniverseBossStory","thirdWorldStoryCompletionGate","applyThirdWorldStoryCompletion","reconcileThirdWorldStoryCompletionState","thirdWorldEligibility","nextThirdWorldStory","queueThirdWorldEligibleStory","thirdWorldCompletionFramework","consumeThirdWorldSettlement","drainThirdWorldPostFlowStories","bossStoryId","universeBossStoryId","universeBossIndexForStory","completedStories"]','runtime progress APIs')
          r=once(r,'if(Number(window.CIVILIZATION_STORY_PROGRESS_VERSION)!==15||','if(Number(window.CIVILIZATION_STORY_PROGRESS_VERSION)!==16||Number(window.THIRD_WORLD_STORY_COMPLETION_OWNER_VERSION)!==1||','runtime progress version')
          probe='''\n  try{\n   const full=Number(window.THIRD_WORLD_BOSS_MAX_HP)||1100000000,allDead=Array.from({length:10},()=>({currentHp:0})),allAlive=Array.from({length:10},()=>({currentHp:full}));\n   const introTarget={thirdWorld:{entered:true,completed:false,bosses:allAlive,story:{introSeen:false,unlockedStage:0,finalSeen:false}},storyProgress:{pendingStory:null,completedStories:[]}},introGate=progress?.thirdWorldStoryCompletionGate?.("higher-dimensional-intro",introTarget),introApplied=progress?.applyThirdWorldStoryCompletion?.("higher-dimensional-intro",introTarget,introGate);\n   if(introGate?.allowed!==true||introApplied?.applied!==true||introTarget.thirdWorld.story.introSeen!==true||introTarget.thirdWorld.completed===true)fail("STORY_RUNTIME_THIRD_WORLD_INTRO_COMPLETION_OWNER","W3 Intro 完成 owner 不得漏寫 introSeen 或提前 completed",{introGate,introApplied,introTarget});\n   const blocked={thirdWorld:{entered:true,completed:false,bosses:allAlive,story:{introSeen:true,unlockedStage:10,finalSeen:false}},storyProgress:{pendingStory:null,completedStories:[]}},blockedGate=progress?.thirdWorldStoryCompletionGate?.("higher-dimensional-final",blocked);\n   if(blockedGate?.allowed!==false)fail("STORY_RUNTIME_THIRD_WORLD_FINAL_COMPLETION_GATE","十王未全滅時 final completion owner 必須 fail-closed",blockedGate);\n   const finalTarget={thirdWorld:{entered:true,completed:false,bosses:allDead,story:{introSeen:true,unlockedStage:10,finalSeen:false}},storyProgress:{pendingStory:null,completedStories:[]}},finalGate=progress?.thirdWorldStoryCompletionGate?.("higher-dimensional-final",finalTarget),finalApplied=progress?.applyThirdWorldStoryCompletion?.("higher-dimensional-final",finalTarget,finalGate);\n   if(finalGate?.allowed!==true||finalApplied?.applied!==true||finalTarget.thirdWorld.story.finalSeen!==true||finalTarget.thirdWorld.completed!==true)fail("STORY_RUNTIME_THIRD_WORLD_FINAL_COMPLETION_OWNER","正式 Final 完成後必須由單一 owner 同步 finalSeen／completed",{finalGate,finalApplied,finalTarget});\n  }catch(error){fail("STORY_RUNTIME_THIRD_WORLD_COMPLETION_OWNER_FAILED","W3 Story completion owner regression 發生錯誤",String(error?.message||error));}\n'''
