          f=once(f,'assert(/const VERSION=15;/.test(progress)&&/CIVILIZATION_STORY_PROGRESS_VERSION=VERSION/.test(progress),\'story progress 版本應為 15\');','assert(/const VERSION=16;/.test(progress)&&/CIVILIZATION_STORY_PROGRESS_VERSION=VERSION/.test(progress),\'story progress 版本應為 16\');','flow progress version')
          f=once(f,'assert(/STORY_RUNTIME_INTEGRITY_VERSION=VERSION/.test(runtime)&&/const VERSION=16;/.test(runtime),\'Story Runtime Integrity 應為 V16\');','assert(/STORY_RUNTIME_INTEGRITY_VERSION=VERSION/.test(runtime)&&/const VERSION=17;/.test(runtime),\'Story Runtime Integrity 應為 V17\');','flow runtime version')
          extra="""\nassert(/THIRD_WORLD_STORY_COMPLETION_OWNER_VERSION=THIRD_WORLD_STORY_COMPLETION_OWNER_VERSION/.test(progress),'W3 Story completion 單一 owner 版本未就緒');\nassert(/function thirdWorldStoryCompletionGate\(id,target=state\)/.test(progress)&&/function applyThirdWorldStoryCompletion\(id,target=state,gate=null\)/.test(progress),'W3 Intro／Final completion owner 未建立');\nassert(/if\(decision.kind===\"intro\"\)third.story.introSeen=true/.test(progress)&&/if\(decision.kind===\"final\"\)\{third.story.finalSeen=true;third.completed=true;\}/.test(progress),'W3 Intro／Final 完成狀態必須由同一 owner 寫入');\nassert(/const VERSION=10;/.test(storyui)&&/LIFECYCLE_WAIT_VERSION=2/.test(storyui)&&/INSTANCE_IDENTITY_VERSION=1/.test(storyui),'Story UI lifecycle identity 版本未就緒');\nassert(/activeToken=nextToken\+\+/.test(storyui)&&/token-mismatch/.test(storyui)&&/story-mismatch/.test(storyui),'Story lifecycle 必須以 token／storyId 防止誤解鎖');\nassert(/if\(activeStory\)return String\(activeStory.id\|\|\"\"\)===String\(storyId\|\|\"\"\)/.test(storyui),'已有 Story 開啟時不得被另一篇 Story 覆蓋');\n"""
