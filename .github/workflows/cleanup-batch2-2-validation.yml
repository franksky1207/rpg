name: Batch 2-2 GM Visual Center Acceptance
on:
  push:
    branches: [cleanup-batch2-2-gm-visual-center-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gm-two-category-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify syntax and formal source contract
        run: |
          node --check 3d-test/test-center.js
          node --check 3d-test/gm-battle-simulation.js
          node --check tests/runtime/gm-3d-test-center-browser.js
          node --check tests/equipment-gm/browser.cjs
          python3 scripts/formal-equipment-identities.py
          node tests/runtime/js-integrity.js
      - name: Install browser and prepare real published stage
        run: |
          python3 -m pip install Pillow==11.3.0
          npm install --prefix /tmp/gm-batch2-2 --no-save playwright@1.55.0
          /tmp/gm-batch2-2/node_modules/.bin/playwright install --with-deps chromium
          node scripts/build-publish-dry-run.cjs
      - name: Exercise actual 2.5D viewer and GM authorization
        env:
          NODE_PATH: /tmp/gm-batch2-2/node_modules
          RUNTIME_SMOKE_URL: http://127.0.0.1:4189/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 4189 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/gm-batch2-2-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4189/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/runtime/gm-3d-test-center-browser.js
          node tests/equipment-gm/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gm-batch2-2-evidence
          path: |
            /tmp/gm-batch2-2-http.log
            /tmp/gm-panel-*.png
            /tmp/gm-phase4-*.png
