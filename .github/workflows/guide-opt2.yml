name: Guide Optimization Batch2
on:
  push:
    paths:
      - '.github/workflows/guide-opt2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: |
          python3 guide_opt2_patch.py
          python3 guide_opt2_fix.py
      - name: Syntax and diff
        run: |
          set -euo pipefail
          node --check gameguide.js
          node --check mirrordungeonguide.js
          node --check cloudsaveguide.js
          node --check tests/runtime/gameguide-extension-integrity.js
          node --check tests/runtime/js-integrity.js
          git diff --check
      - name: Runtime checks
        run: |
          set -euo pipefail
          node tests/runtime/gameguide-extension-integrity.js
          node tests/runtime/js-integrity.js
          node tests/runtime/vip-unbounded-integrity.js
      - name: Story checks
        run: |
          set -euo pipefail
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
      - name: Semantic checks
        run: |
          set -euo pipefail
          grep -q 'GAME_GUIDE_EXTENSION_REGISTRY_VERSION=1' gameguide.js
          grep -q 'registerGameGuideExtension' mirrordungeonguide.js
          grep -q 'registerGameGuideExtension' cloudsaveguide.js
          ! grep -q 'window.gameGuidePage=' cloudsaveguide.js
          ! grep -q 'GAME_GUIDE_CATEGORIES' mirrordungeonguide.js
          grep -q 'gameguide.js?v=20260928-thirdworld-guide-opt2' index.html
          grep -q 'mirrordungeonguide.js?v=20260928-thirdworld-guide-opt2' index.html
          grep -q 'cloudsaveguide.js?v=20260928-thirdworld-guide-opt2' index.html
      - name: Commit formal changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameguide.js mirrordungeonguide.js cloudsaveguide.js index.html tests/runtime/js-integrity.js tests/runtime/gameguide-extension-integrity.js
          git diff --cached --quiet && exit 0
          git commit -m 'Unify game guide extensions optimization batch2'
          git push origin HEAD:main
