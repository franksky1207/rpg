name: Equipment 2.5D Sprite Pipeline
on:
  push:
    branches: [main]
    paths:
      - 'assets/era-player/**'
      - '3d-test/equipment-sprites-v1/**'
      - 'development/equipment-2_5d/**'
      - 'scripts/equipment*'
      - 'scripts/formal-equipment-identities.py'
      - 'tests/equipment-sprites/**'
      - '.github/workflows/equipment-sprites.yml'
  pull_request:
    paths:
      - 'assets/era-player/**'
      - '3d-test/equipment-sprites-v1/**'
      - 'development/equipment-2_5d/**'
      - 'development/3d-source/equipment/concepts/**'
      - 'scripts/equipment*'
      - 'tests/equipment-sprites/**'
      - '.github/workflows/equipment-sprites.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Verify authoritative 210 equipment identities independently of concept art
        run: python3 scripts/formal-equipment-identities.py
      - name: Verify real sprites and production states
        run: |
          python3 scripts/equipment-sprites.py validate
          python3 -m unittest discover -s tests/equipment-sprites -v
          node --test tests/equipment-sprites/runtime.test.mjs
      - uses: ./.github/actions/setup-ci-browser
        with:
          browsers: chromium
      - name: Raster real characters, animations and lifecycle
        env:
          CHROMIUM_PATH: ''
        run: node tests/equipment-sprites/browser.cjs
      - name: Verify development stays outside publication and generator is repeatable
        run: |
          node scripts/publish-asset-audit.cjs --json > /tmp/sprite-publish-audit.json
          python3 scripts/equipment-gm-publication.py --check
          git diff --exit-code -- assets/gm-equipment-2_5d 3d-test/equipment-sprites-v1 development/equipment-2_5d/gm-publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equipment-sprite-browser
          path: |
            /tmp/equipment-phase3-browser.json
            /tmp/equipment-phase3-browser.png
