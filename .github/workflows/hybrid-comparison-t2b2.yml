name: Hybrid Comparison T2-B2 Assets
on:
  push:
    branches: [main, batch4-3-runtime-dependency-cleanup]
    paths:
      - 'development/hybrid-comparison/**'
      - 'tests/runtime/hybrid-comparison-*'
      - 'tests/runtime/cleanup-batch4-3-current-inventory.cjs'
      - '.github/workflows/hybrid-comparison-t2b2.yml'
  workflow_dispatch:
jobs:
  asset-contract-and-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install current asset/browser dependencies
        run: |
          npm install --no-save gltf-validator@2.0.0-dev.3.10 playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify retained B-only assets and live GLB integrity
        run: |
          set -euo pipefail
          node tests/runtime/cleanup-batch4-3-current-inventory.cjs
          node tests/runtime/hybrid-comparison-art-contract.cjs
          node tests/runtime/3d-asset-registry-integrity.cjs
          node tests/runtime/3d-equipment-contract.cjs
          node tests/runtime/hybrid-comparison-playback-contract.cjs
          node tests/runtime/combat-events-integration.cjs
      - name: Verify official production closure before GM staging
        run: |
          node scripts/build-publish-dry-run.cjs
          node tests/runtime/publish-build-regression.cjs
          test ! -e .publish-stage3/development/hybrid-comparison/t2b2-v1
      - name: Verify current published GM B and formal player
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stage-hybrid-preview.cjs
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .publish-stage3 > /tmp/t2b2-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          export RUNTIME_SMOKE_URL=http://127.0.0.1:4173/index.html
          node tests/equipment-gm/browser.cjs
          node tests/equipment-formal/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2b2-current-b-only-evidence
          path: |
            /tmp/t2b2-http.log
            /tmp/gm-panel-*.png
          if-no-files-found: warn
