name: One-time Batch 11-1 Runner

on:
  push:
    paths:
      - '.github/workflows/batch11-1-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply prepared batch 11-1 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/batch11-1-era-view.yml').read_text(encoding='utf-8')
          anchor='      - name: Apply batch 11-1 shared era view refactor\n'
          start=source.index('        run: |\n',source.index(anchor))+len('        run: |\n')
          end=source.index('      - name: Syntax and source integrity self-check\n',start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/batch11_1.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python /tmp/batch11_1.py
          rm -f .github/workflows/batch11-1-runner.yml
      - name: Syntax and source integrity self-check
        shell: bash
        run: |
          node --check worldmapui.js
          node --check playersemanticsui.js
          node --check thirdworldui.js
          node --check thirdworldintegritycontract.js
          node --check tests/runtime/js-integrity.js
          node tests/runtime/js-integrity.js
          git diff --check
      - name: Commit batch 11-1 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement shared three-era adventure view owner"
          git push origin HEAD:main
