name: Batch 5 Era Appearance and Animation Settings
on:
  push:
    branches: [feat/combat-renewal-batch5-integrated-20261018]
  pull_request:
    paths: ['3d-test/**', 'index.html', 'tests/runtime/**', 'docs/COMBAT_ANIMATION_RENEWAL_BATCH5*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static, source and regression contracts
        run: |
          node --check 3d-test/mode-foundation.js
          node --check 3d-test/t3b-formal-entry.js
          node --check 3d-test/era-appearance-contract.js
          node tests/runtime/batch5-era-animation-contract.cjs
          node tests/runtime/batch10-mobile-ui-contract.cjs
          node tests/runtime/cleanup-batch4-4-final-guard.cjs
          node tests/runtime/cleanup-batch2-4-integration.cjs
          node tests/runtime/t3b-formal-controller.cjs
          node tests/runtime/t3b-formal-projection.cjs
          node tests/runtime/resource-manifest-integrity.js
          python3 scripts/formal-equipment-identities.py --help
      - name: Browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser settings and battle regressions
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/batch5-http.log 2>&1 &
          node tests/runtime/3d-mode-browser-regression.js
          node tests/runtime/batch4-mobile-combat-viewport.cjs
