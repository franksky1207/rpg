name: Equipment 2.5D GM Integration
on:
  push:
    branches:
    - main
    paths:
    - assets/era-player/**
    - 3d-test/equipment-sprites-v1/**
    - 3d-test/era-player-sprites.mjs
    - 3d-test/gm-battle-published.mjs
    - tests/equipment-*/**
    - scripts/equipment*
    - scripts/formal-equipment-identities.py
    - combatcore.js
    - index.html
    - .github/workflows/equipment-gm.yml
    - .github/actions/setup-ci-browser/**
  pull_request:
    paths:
    - assets/era-player/**
    - 3d-test/equipment-sprites-v1/**
    - 3d-test/era-player-sprites.mjs
    - 3d-test/gm-battle-published.mjs
    - tests/equipment-*/**
    - scripts/equipment*
    - scripts/formal-equipment-identities.py
    - combatcore.js
    - index.html
    - .github/workflows/equipment-gm.yml
    - .github/actions/setup-ci-browser/**
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gm-published:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python3 -m pip install Pillow==11.3.0
    - name: Verify original sources and deterministic GM publication
      run: |
        set -euo pipefail
        python3 scripts/formal-equipment-identities.py
        python3 scripts/equipment-sprites.py validate
        python3 scripts/equipment-gm-publication.py --check
        node --test tests/equipment-gm/no-attack-aura.test.mjs tests/equipment-gm/runtime.test.mjs
        node tests/equipment-gm/publication.cjs
        node tests/runtime/t4-preview-retirement.cjs
        node scripts/build-publish-dry-run.cjs
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium
    - name: Operate real sprites inside published game GM
      env:
        RUNTIME_SMOKE_URL: http://127.0.0.1:4189/index.html
      run: |
        set -euo pipefail
        python3 -m http.server 4189 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/gm-phase4-http.log 2>&1 &
        pid=$!
        trap 'kill "$pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4189/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        node tests/equipment-gm/browser.cjs
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gm-whole-suit-layout
        path: |
          /tmp/gm-panel-*.png
          /tmp/gm-phase4-*.png
