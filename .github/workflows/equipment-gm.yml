name: Equipment 2.5D GM Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gm-published:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Verify original sources and deterministic GM publication
        run: |
          set -euo pipefail
          python3 scripts/formal-equipment-identities.py
          python3 scripts/equipment-sprites.py validate
          python3 scripts/equipment-gm-publication.py --check
          node --test tests/equipment-gm/runtime.test.mjs
          node tests/equipment-gm/publication.cjs
          node tests/runtime/t4-preview-retirement.cjs
          node scripts/build-publish-dry-run.cjs
          # CI-only sandbox assets: NOT added to official Pages release.
          node scripts/stage-hybrid-preview.cjs
      - name: Install browser
        run: |
          npm install --prefix /tmp/equipment-gm-test --no-save playwright@1.55.0
          /tmp/equipment-gm-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Operate real sprites inside published game GM
        env:
          NODE_PATH: /tmp/equipment-gm-test/node_modules
          RUNTIME_SMOKE_URL: http://127.0.0.1:4189/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 4189 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/gm-phase4-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4189/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/equipment-gm/browser.cjs
          node tests/runtime/gm-3d-test-center-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gm-whole-suit-layout
          path: |
            /tmp/gm-panel-*.png
            /tmp/gm-phase4-*.png
