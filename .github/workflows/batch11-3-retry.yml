name: One-time Batch 11-3 Retry

on:
  push:
    paths:
      - '.github/workflows/batch11-3-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reuse prepared patch and finish integrity assertions
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow=Path('.github/workflows/batch11-3-runner.yml').read_text(encoding='utf-8')
          start=workflow.index('        run: |\n',workflow.index('- name: Apply batch 11-3 universe review patch'))+len('        run: |\n')
          end=workflow.index('      - name: Syntax and integrity self-check',start)
          block=workflow[start:end]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          try:
              exec(compile(script,'batch11-3-prepared.py','exec'),{})
          except SystemExit as error:
              if 'js-integrity combat anchor mismatch' not in str(error):
                  raise

          p=Path('tests/runtime/js-integrity.js'); t=p.read_text(encoding='utf-8')
          def insert_after(needle, addition):
              global t
              pos=t.find(needle)
              if pos<0: raise SystemExit('missing js-integrity needle: '+needle)
              end=t.find('\n',pos)
              if end<0: raise SystemExit('unterminated js-integrity needle')
              line=t[pos:end+1]
              if addition not in t: t=t[:end+1]+addition+t[end+1:]

          insert_after('assert(/SECOND_WORLD_CIVILIZATION_COMBAT_VERSION=2/.test(secondWorldCombat)',
          'assert(/const VERSION=2;/.test(secondWorldCombat)&&/SECOND_WORLD_COMBAT_REVIEW_POLICY_VERSION=REVIEW_POLICY_VERSION/.test(secondWorldCombat)&&/SECOND_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION=REVIEW_STATE_ISOLATION_VERSION/.test(secondWorldCombat)&&/canRunSecondWorldBossReview=canRunSecondWorldBossReview/.test(secondWorldCombat)&&/settlementReady:reviewMode\\?false:SETTLEMENT_READY/.test(secondWorldCombat),"宇宙主線 Combat 必須提供 explicit review mode，並強制 review 不具正式 settlement 資格。");\n'
          'assert(/const VERSION=9;/.test(secondWorldMainline)&&/SECOND_WORLD_MAINLINE_REVIEW_FLOW_VERSION=REVIEW_FLOW_VERSION/.test(secondWorldMainline)&&/startSecondWorldBossReview=function/.test(secondWorldMainline)&&/runSecondWorldBossCombat\\(index,\\{review:true/.test(secondWorldMainline),"宇宙回顧必須走獨立單場 review flow，共用 Combat/presentation 且不進正式 settlement。");\n')
          insert_after('assert(/SECOND_WORLD_ADVENTURE_UI_VERSION=5/.test(worldmap)',
          'assert(/SECOND_WORLD_ADVENTURE_REVIEW_VIEW_VERSION=5/.test(worldmap)&&/SECOND_WORLD_UNIVERSE_REVIEW_CARD_MODE_VERSION=1/.test(worldmap)&&/secondWorldBossCardHtml\\(boss,reviewMode=false\\)/.test(worldmap)&&/startSecondWorldBossReview/.test(worldmap)&&/reviewMode\\?regions:regions\\.filter/.test(worldmap),"宇宙紀元回顧必須共用原 Boss 卡／區域 renderer，並在 W3 歷史視圖呈現完整 100 Boss。");\n')
          insert_after('assert(/PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION=2/.test(playerSemanticsUi)',
          'assert(/THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION=2/.test(playerSemanticsUi)&&!/正式挑戰已結束/.test(playerSemanticsUi)&&!/querySelectorAll\\(\"\\.universe-boss-action\"\\)/.test(playerSemanticsUi),"宇宙回顧 action 必須由 worldmap 正式 owner 直接渲染，不得再由 player semantics DOM 後處理禁用。");\n')
          for old,new in [
            ('secondworldcombat.js?v=20260926-thirdworld-entry-batch2-3','secondworldcombat.js?v=20260928-thirdworld-batch11-3'),
            ('secondworldmainline.js?v=20260925-vip-loot-cleanup1','secondworldmainline.js?v=20260928-thirdworld-batch11-3'),
            ('worldmapui.js?v=20260928-thirdworld-batch11-2','worldmapui.js?v=20260928-thirdworld-batch11-3'),
            ('playersemanticsui.js?v=20260928-thirdworld-batch11-1','playersemanticsui.js?v=20260928-thirdworld-batch11-3'),
            ('thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-2','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-3')]: t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')

          p=Path('index.html'); idx=p.read_text(encoding='utf-8')
          for old,new in [
            ('secondworldcombat.js?v=20260926-thirdworld-entry-batch2-3','secondworldcombat.js?v=20260928-thirdworld-batch11-3'),
            ('secondworldmainline.js?v=20260925-vip-loot-cleanup1','secondworldmainline.js?v=20260928-thirdworld-batch11-3'),
            ('worldmapui.js?v=20260928-thirdworld-batch11-2','worldmapui.js?v=20260928-thirdworld-batch11-3'),
            ('playersemanticsui.js?v=20260928-thirdworld-batch11-1','playersemanticsui.js?v=20260928-thirdworld-batch11-3'),
            ('thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-2','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-3')]:
              if idx.count(old)!=1: raise SystemExit(f'index cache-bust mismatch {old}: {idx.count(old)}')
              idx=idx.replace(old,new)
          p.write_text(idx,encoding='utf-8')
      - name: Syntax and integrity self-check
        shell: bash
        run: |
          set -euo pipefail
          node --check secondworldcombat.js
          node --check secondworldmainline.js
          node --check worldmapui.js
          node --check playersemanticsui.js
          node --check thirdworldintegritycontract.js
          node tests/runtime/js-integrity.js
          git diff --check
      - name: Commit batch 11-3 to main and remove runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondworldcombat.js secondworldmainline.js worldmapui.js playersemanticsui.js thirdworldintegritycontract.js tests/runtime/js-integrity.js index.html
          git rm .github/workflows/batch11-3-runner.yml .github/workflows/batch11-3-retry.yml
          git commit -m 'Implement universe boss review battles'
          git push origin HEAD:main
