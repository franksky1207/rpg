name: Batch4 Game Guide
on:
  push:
    paths:
      - '.github/workflows/batch4-gameguide.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: |
          python3 batch4_gameguide_patch.py
          python3 batch4_gameguide_syntax_fix.py
          python3 batch4_gameguide_fix.py
      - name: Syntax and integrity
        run: |
          set -euo pipefail
          node --check gameguide.js
          node --check tests/runtime/js-integrity.js
          git diff --check
          node tests/runtime/js-integrity.js
          node tests/runtime/vip-unbounded-integrity.js
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
      - name: Semantic scan
        run: |
          set -euo pipefail
          grep -q 'GAME_GUIDE_THIRD_WORLD_VERSION=1' gameguide.js
          grep -q '高維離線' gameguide.js
          grep -q '永久削血' gameguide.js
          grep -q '界弦核心' gameguide.js
          grep -q 'gameguide.js?v=20260928-thirdworld-guide-batch4' index.html
      - name: Commit formal changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameguide.js index.html tests/runtime/js-integrity.js
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild third world game guide and finish batch4'
          git push origin HEAD:main
