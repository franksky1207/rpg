name: Region 5 Length Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/region5-length-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix region 5 page lengths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('storydata-universe-trans-domain-frontier.js')
          text=p.read_text(encoding='utf-8')
          reps=[
            ('"韓策說：「我們拆的是鎖，不是門。」,"艦橋也同步更新航圖。"','"韓策說：「我們拆的是鎖，不是門。」,"艦橋也同步更新航圖。","確實如此。"'),
            ('"你選擇後者，讓偵察艦分散到不同角度收集航跡。","艦橋也同步更新航圖。"','"你選擇後者，讓偵察艦分散到不同角度收集航跡。","艦橋也同步更新航圖。","紀衡也點頭。"'),
            ('"你回答：「追到能把路留下，不追到把別人的家打爛。」,"後隊隨即調整隊形。"','"你回答：「追到能把路留下，不追到把別人的家打爛。」,"後隊隨即調整隊形。","追蹤仍在繼續。"'),
            ('"遠征隊準備前往萬機母體的生產區。","艦橋也同步更新航圖。"','"遠征隊準備前往萬機母體的生產區。","艦橋也同步更新航圖。","後隊照令執行。"'),
            ('"你回答：「那就別留下。」,"艦橋也同步更新航圖。"','"你回答：「那就別留下。」,"艦橋也同步更新航圖。","韓策不再多問。"'),
            ('"韓策說：「那我們今天只負責把鎖打開。」,"艦橋也同步更新航圖。"','"韓策說：「那我們今天只負責把鎖打開。」,"艦橋也同步更新航圖。","諾菈也確認。"'),
            ('"席恩確認可行後，第一批補給艦獲准進站。","艦橋也同步更新航圖。"','"席恩確認可行後，第一批補給艦獲准進站。","艦橋也同步更新航圖。","席恩表示同意。"'),
            ('"田崎點頭，艦隊則向出口集結。","艦橋也同步更新航圖。"','"田崎點頭，艦隊則向出口集結。","艦橋也同步更新航圖。","田崎也留下紀錄。"'),
            ('"各艦沒有擴大戰果，只依既定任務重新編組。"','"各艦沒有擴大戰果，只依既定任務重新編組。","決定沒有改變。"',1),
            ('"今天只處理封鎖本身。","輪值指揮也把這項決定同步到所有艦艇。"','"今天只處理封鎖本身。","輪值指揮也把這項決定同步到所有艦艇。","各艦回報收到。"'),
            ('"你批准所有預備艦投入中央，不再保留後續佔領力量。","各艦沒有擴大戰果，只依既定任務重新編組。"','"你批准所有預備艦投入中央，不再保留後續佔領力量。","各艦沒有擴大戰果，只依既定任務重新編組。","主力仍保持隊形。"'),
            ('"敵方第一次失去能安全退回的位置。","輪值指揮也把這項決定同步到所有艦艇。"','"敵方第一次失去能安全退回的位置。","輪值指揮也把這項決定同步到所有艦艇。","艦隊仍照原定計畫前進。"'),
            ('"這一戰沒有談判轉折，雙方都知道誰先失去核心能力，封鎖就會結束。","輪值指揮也把這項決定同步到所有艦艇。"','"這一戰沒有談判轉折，雙方都知道誰先失去核心能力，封鎖就會結束。","輪值指揮也把這項決定同步到所有艦艇。","各艦回報收到。"'),
            ('"沒有第二艘旗艦突然出現，也沒有新的敵人接管戰場。","輪值指揮也把這項決定同步到所有艦艇。"','"沒有第二艘旗艦突然出現，也沒有新的敵人接管戰場。","輪值指揮也把這項決定同步到所有艦艇。","後隊照令執行。"'),
            ('"你要求優先讓受損艦與補給船通過，勝利不必靠佔領殘骸證明。","輪值指揮也把這項決定同步到所有艦艇。"','"你要求優先讓受損艦與補給船通過，勝利不必靠佔領殘骸證明。","輪值指揮也把這項決定同步到所有艦艇。","艦隊仍照原定計畫前進。"'),
            ('"你只把這些訊息留在航圖旁，提醒每一段路都仍有人生活。","輪值指揮也把這項決定同步到所有艦艇。"','"你只把這些訊息留在航圖旁，提醒每一段路都仍有人生活。","輪值指揮也把這項決定同步到所有艦艇。","各艦回報收到。"'),
          ]
          for item in reps:
              old,new,*count=item
              expected=count[0] if count else 1
              if text.count(old)!=expected:
                  raise SystemExit(f'expected {expected} match(es), got {text.count(old)} for {old}')
              text=text.replace(old,new,expected)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit length fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storydata-universe-trans-domain-frontier.js
          git commit -m "Fix universe region 5 story page lengths"
          git push origin main
