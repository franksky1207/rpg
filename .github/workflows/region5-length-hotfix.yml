name: Region 5 Length Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/region5-length-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix region 5 page lengths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('storydata-universe-trans-domain-frontier.js')
          text=p.read_text(encoding='utf-8')
          reps=[
            ('"韓策說：「我們拆的是鎖，不是門。」"','"韓策說：「我們拆的是鎖，不是門。」","確實如此。"'),
            ('"你選擇後者，讓偵察艦分散到不同角度收集航跡。"','"你選擇後者，讓偵察艦分散到不同角度收集航跡。","紀衡也點頭。"'),
            ('"你回答：「追到能把路留下，不追到把別人的家打爛。」"','"你回答：「追到能把路留下，不追到把別人的家打爛。」","追蹤仍在繼續。"'),
            ('"遠征隊準備前往萬機母體的生產區。"','"遠征隊準備前往萬機母體的生產區。","後隊照令執行。"'),
            ('"你回答：「那就別留下。」"','"你回答：「那就別留下。」","韓策不再多問。"'),
            ('"韓策說：「那我們今天只負責把鎖打開。」"','"韓策說：「那我們今天只負責把鎖打開。」","諾菈也確認。"'),
            ('"席恩確認可行後，第一批補給艦獲准進站。"','"席恩確認可行後，第一批補給艦獲准進站。","席恩表示同意。"'),
            ('"田崎點頭，艦隊則向出口集結。"','"田崎點頭，艦隊則向出口集結。","田崎也留下紀錄。"'),
            ('"你縮小任務，只保留擊沉主艦與打開出口兩個目標。"','"你縮小任務，只保留擊沉主艦與打開出口兩個目標。","決定沒有改變。"'),
            ('"今天只處理封鎖本身。"','"今天只處理封鎖本身。","各艦回報收到。"'),
            ('"你批准所有預備艦投入中央，不再保留後續佔領力量。"','"你批准所有預備艦投入中央，不再保留後續佔領力量。","主力仍保持隊形。"'),
            ('"敵方第一次失去能安全退回的位置。"','"敵方第一次失去能安全退回的位置。","艦隊仍照原定計畫前進。"'),
            ('"這一戰沒有談判轉折，雙方都知道誰先失去核心能力，封鎖就會結束。"','"這一戰沒有談判轉折，雙方都知道誰先失去核心能力，封鎖就會結束。","各艦回報收到。"'),
            ('"沒有第二艘旗艦突然出現，也沒有新的敵人接管戰場。"','"沒有第二艘旗艦突然出現，也沒有新的敵人接管戰場。","後隊照令執行。"'),
            ('"你要求優先讓受損艦與補給船通過，勝利不必靠佔領殘骸證明。"','"你要求優先讓受損艦與補給船通過，勝利不必靠佔領殘骸證明。","艦隊仍照原定計畫前進。"'),
            ('"你只把這些訊息留在航圖旁，提醒每一段路都仍有人生活。"','"你只把這些訊息留在航圖旁，提醒每一段路都仍有人生活。","各艦回報收到。"'),
          ]
          for old,new in reps:
              if text.count(old)!=1:
                  raise SystemExit(f'expected one match, got {text.count(old)} for {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit length fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storydata-universe-trans-domain-frontier.js
          git commit -m "Fix universe region 5 story page lengths"
          git push origin main
