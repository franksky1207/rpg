name: tmp-vip-loot-cleanup2
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/tmp-vip-loot-cleanup2.yml'
      - '.github/tmp/apply_vip_loot_cleanup2.py'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply behavior integrity
        run: python .github/tmp/apply_vip_loot_cleanup2.py
      - name: Syntax checks
        run: node --check tests/runtime/js-integrity.js
      - name: Runtime integrity
        run: node tests/runtime/js-integrity.js
      - name: Audit universe reward consumers
        run: |
          echo '=== equipmentRewards consumers ==='
          grep -RIn --include='*.js' 'equipmentRewards' . --exclude-dir=.git || true
          echo '=== legacy settlement fields around second world ==='
          grep -RIn --include='*.js' 'settled\.item\|result\.item\|settled\.sale\|result\.sale\|settled\.kept\|result\.kept' . --exclude-dir=.git || true
      - name: Cleanup temporary files and commit
        run: |
          rm -f .github/tmp/apply_vip_loot_cleanup2.py .github/workflows/tmp-vip-loot-cleanup2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/runtime/js-integrity.js .github/tmp/apply_vip_loot_cleanup2.py .github/workflows/tmp-vip-loot-cleanup2.yml
          git commit -m 'Add VIP loot behavior integrity tests'
          git push
