name: Batch 12-3 Story Completion Retry
on:
  push:
    paths:
      - '.github/workflows/batch12-3-story-completion-retry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply batch 12-3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def repl(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              actual=s.count(old)
              if actual!=count: raise SystemExit(f'{path}: anchor count {actual} != {count}: {old[:100]}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          repl('storyprogress.js',' const VERSION=13;\n const THIRD_WORLD_QUEUE_VERSION=1;', ' const VERSION=14;\n const THIRD_WORLD_QUEUE_VERSION=1;\n const THIRD_WORLD_SETTLEMENT_BRIDGE_VERSION=1;\n const THIRD_WORLD_COMPLETION_FRAMEWORK_VERSION=1;')
          repl('storyprogress.js',' function queueStory(id){if(!id||!window.CIVILIZATION_STORIES?.[id])return null;normalizeProgress(state,{skipBackfill:true});const p=state.storyProgress;if(!p||p.completedStories.includes(id)||p.pendingStory&&p.pendingStory!==id)return null;if(p.pendingStory!==id){p.pendingStory=id;normalizeProgress(state);persist();}queueResume();return id;}', ' function queueStory(id,{resume=true}={}){if(!id||!window.CIVILIZATION_STORIES?.[id])return null;normalizeProgress(state,{skipBackfill:true});const p=state.storyProgress;if(!p||p.completedStories.includes(id)||p.pendingStory&&p.pendingStory!==id)return null;if(p.pendingStory!==id){p.pendingStory=id;normalizeProgress(state);persist();}if(resume)queueResume();return id;}')
          repl('storyprogress.js',' function queueThirdWorldEligibleStory(){\n  if(typeof state==="undefined"||!state?.thirdWorld?.entered)return null;\n  const p=ensureProgress({skipBackfill:true});if(!p||p.pendingStory)return null;\n  const row=nextThirdWorldStory(state,{requireContent:true});return row?queueStory(row.storyId):null;\n }', ' function queueThirdWorldEligibleStory({resume=true}={}){\n  if(typeof state==="undefined"||!state?.thirdWorld?.entered)return null;\n  const p=ensureProgress({skipBackfill:true});if(!p||p.pendingStory)return null;\n  const row=nextThirdWorldStory(state,{requireContent:true});return row?queueStory(row.storyId,{resume}):null;\n }\n function thirdWorldStoryCompletionFramework(target=state){\n  const third=target?.thirdWorld||{},snapshot=thirdWorldStoryEligibility(target),finalRow=snapshot.rows.find(row=>row.kind==="final")||null;\n  const completionReady=third.entered===true&&snapshot.bossesDefeated===true&&snapshot.unlockedStage>=10;\n  return Object.freeze({version:THIRD_WORLD_COMPLETION_FRAMEWORK_VERSION,entered:third.entered===true,bossesDefeated:snapshot.bossesDefeated===true,unlockedStage:snapshot.unlockedStage,completionReady,finalEligible:completionReady&&finalRow?.eligible===true,finalQueueable:completionReady&&finalRow?.queueable===true,finalStoryId:finalRow?.storyId||"higher-dimensional-final",finalSeen:third.story?.finalSeen===true,storedCompleted:third.completed===true,readyForCompletionOwner:completionReady});\n }\n function consumeThirdWorldSettlement(settlement,{queue=true}={}){\n  if(!settlement||settlement.ok!==true||Number(settlement.world)!==3)return Object.freeze({version:THIRD_WORLD_SETTLEMENT_BRIDGE_VERSION,accepted:false,reason:"invalid-settlement",unlockedStages:Object.freeze([]),milestoneStages:Object.freeze([]),finalStageUnlocked:false,completion:thirdWorldStoryCompletionFramework(state),queuedStoryId:null});\n  const unlockedStages=Array.from(new Set((Array.isArray(settlement.unlockedStoryStages)?settlement.unlockedStoryStages:[]).map(value=>Math.floor(Number(value))).filter(value=>value>=1&&value<=10))).sort((a,b)=>a-b),milestoneStages=unlockedStages.filter(stage=>stage<=9),finalStageUnlocked=unlockedStages.includes(10),completion=thirdWorldStoryCompletionFramework(state);\n  const queuedStoryId=queue?queueThirdWorldEligibleStory({resume:false}):null;\n  return Object.freeze({version:THIRD_WORLD_SETTLEMENT_BRIDGE_VERSION,accepted:true,unlockedStages:Object.freeze(unlockedStages),milestoneStages:Object.freeze(milestoneStages),finalStageUnlocked,completion,queuedStoryId:queuedStoryId||null,presentationDeferred:true});\n }')
          repl('storyprogress.js','queueUniverseBossStory,thirdWorldEligibility:thirdWorldStoryEligibility,nextThirdWorldStory,queueThirdWorldEligibleStory,bossStoryId:', 'queueUniverseBossStory,thirdWorldEligibility:thirdWorldStoryEligibility,nextThirdWorldStory,queueThirdWorldEligibleStory,thirdWorldCompletionFramework:thirdWorldStoryCompletionFramework,consumeThirdWorldSettlement,bossStoryId:')
          repl('storyprogress.js',' window.THIRD_WORLD_STORY_QUEUE_VERSION=THIRD_WORLD_QUEUE_VERSION;\n window.THIRD_WORLD_STORY_ELIGIBILITY_VERSION=THIRD_WORLD_ELIGIBILITY_VERSION;', ' window.THIRD_WORLD_STORY_QUEUE_VERSION=THIRD_WORLD_QUEUE_VERSION;\n window.THIRD_WORLD_STORY_SETTLEMENT_BRIDGE_VERSION=THIRD_WORLD_SETTLEMENT_BRIDGE_VERSION;\n window.THIRD_WORLD_STORY_COMPLETION_FRAMEWORK_VERSION=THIRD_WORLD_COMPLETION_FRAMEWORK_VERSION;\n window.THIRD_WORLD_STORY_ELIGIBILITY_VERSION=THIRD_WORLD_ELIGIBILITY_VERSION;')
          repl('storyprogress.js',' window.queueThirdWorldEligibleStory=queueThirdWorldEligibleStory;\n installUniverseFirstClearHook();', ' window.queueThirdWorldEligibleStory=queueThirdWorldEligibleStory;\n window.thirdWorldStoryCompletionFramework=thirdWorldStoryCompletionFramework;\n window.consumeThirdWorldStorySettlement=consumeThirdWorldSettlement;\n installUniverseFirstClearHook();')

          repl('thirdworldphase.js',' const VERSION=5;', ' const VERSION=6;\n const THIRD_WORLD_ENTRY_STORY_TRIGGER_VERSION=1;')
          repl('thirdworldphase.js','finalizeAfterSave:()=>{if(typeof window.resetWorldTransitionTransientRuntime==="function")window.resetWorldTransitionTransientRuntime();if(typeof window.finalizeOfflineCheckpointForWorldTransition==="function")window.finalizeOfflineCheckpointForWorldTransition();},sessionMarker:', 'finalizeAfterSave:()=>{if(typeof window.resetWorldTransitionTransientRuntime==="function")window.resetWorldTransitionTransientRuntime();if(typeof window.finalizeOfflineCheckpointForWorldTransition==="function")window.finalizeOfflineCheckpointForWorldTransition();queueMicrotask(()=>window.civilizationStoryProgress?.resume?.());},sessionMarker:')
          repl('thirdworldphase.js',' window.THIRD_WORLD_ENTRY_TRANSITION_VERSION=2;', ' window.THIRD_WORLD_ENTRY_TRANSITION_VERSION=2;\n window.THIRD_WORLD_ENTRY_STORY_TRIGGER_VERSION=THIRD_WORLD_ENTRY_STORY_TRIGGER_VERSION;')

          repl('thirdworldprogress.js',' const VERSION=4;\n const SETTLEMENT_VERSION=4;', ' const VERSION=5;\n const SETTLEMENT_VERSION=5;\n const STORY_FRAMEWORK_BRIDGE_VERSION=1;\n const COMPLETION_READY_FRAMEWORK_VERSION=1;')
          repl('thirdworldprogress.js','  const titleChanged=titleGrant?.changed===true,progressEventPending=titleChanged||storyChanged;', '  const completionReady=aggregateAfter.aliveCount===0&&storyAfter>=10;\n  const titleChanged=titleGrant?.changed===true,progressEventPending=titleChanged||storyChanged;')
          repl('thirdworldprogress.js','  if(fivePointBlocked)eventSequence.push(freeze({type:"five-point-front",bossIndex:checked.bossIndex,gapHp:Number(challengeAfter?.gapHp)||0,gapPoints:Number(challengeAfter?.gapPoints)||0}));', '  if(fivePointBlocked)eventSequence.push(freeze({type:"five-point-front",bossIndex:checked.bossIndex,gapHp:Number(challengeAfter?.gapHp)||0,gapPoints:Number(challengeAfter?.gapPoints)||0}));\n  if(completionReady)eventSequence.push(freeze({type:"completion-ready",storyStage:10,finalStoryId:"higher-dimensional-final"}));')
          repl('thirdworldprogress.js','   bossDefeatedNow,stageTransition,challengeAfter,fivePointBlocked,completionReady:aggregateAfter.aliveCount===0,', '   bossDefeatedNow,stageTransition,challengeAfter,fivePointBlocked,completionReady,')
          repl('thirdworldprogress.js','  return freeze({\n   ok:true,world:3,settlementVersion:SETTLEMENT_VERSION,phase:"permanent-hp-exp-strings-equipment-progression",bossIndex:value.bossIndex,bossId:value.bossId,', '  const settlement={\n   ok:true,world:3,settlementVersion:SETTLEMENT_VERSION,phase:"permanent-hp-exp-strings-equipment-progression",bossIndex:value.bossIndex,bossId:value.bossId,')
          repl('thirdworldprogress.js','   rewardsPending:false,equipmentPending:false,progressionPending:false,saved:true\n  });\n }', '   rewardsPending:false,equipmentPending:false,progressionPending:false,saved:true\n  };\n  const storyFramework=typeof window.civilizationStoryProgress?.consumeThirdWorldSettlement==="function"?window.civilizationStoryProgress.consumeThirdWorldSettlement(settlement,{queue:true}):freeze({version:STORY_FRAMEWORK_BRIDGE_VERSION,accepted:false,reason:"story-owner-missing",queuedStoryId:null,presentationDeferred:true});\n  return freeze({...settlement,storyFramework});\n }')
          repl('thirdworldprogress.js',' window.THIRD_WORLD_PROGRESS_VERSION=VERSION;\n window.THIRD_WORLD_SETTLEMENT_VERSION=SETTLEMENT_VERSION;', ' window.THIRD_WORLD_PROGRESS_VERSION=VERSION;\n window.THIRD_WORLD_SETTLEMENT_VERSION=SETTLEMENT_VERSION;\n window.THIRD_WORLD_STORY_FRAMEWORK_BRIDGE_VERSION=STORY_FRAMEWORK_BRIDGE_VERSION;\n window.THIRD_WORLD_COMPLETION_READY_FRAMEWORK_VERSION=COMPLETION_READY_FRAMEWORK_VERSION;')

          repl('storyruntimeintegrity.js',' const VERSION=13;', ' const VERSION=14;')
          repl('storyruntimeintegrity.js','"queueThirdWorldEligibleStory","bossStoryId"', '"queueThirdWorldEligibleStory","thirdWorldCompletionFramework","consumeThirdWorldSettlement","bossStoryId"')
          repl('storyruntimeintegrity.js','Number(window.CIVILIZATION_STORY_PROGRESS_VERSION)!==13||Number(window.THIRD_WORLD_STORY_QUEUE_VERSION)!==1', 'Number(window.CIVILIZATION_STORY_PROGRESS_VERSION)!==14||Number(window.THIRD_WORLD_STORY_QUEUE_VERSION)!==1||Number(window.THIRD_WORLD_STORY_SETTLEMENT_BRIDGE_VERSION)!==1||Number(window.THIRD_WORLD_STORY_COMPLETION_FRAMEWORK_VERSION)!==1')
          anchor='    if(partialSnapshot?.rows?.find(row=>row.kind==="final")?.eligible===true)fail("STORY_RUNTIME_THIRD_WORLD_FINAL_GATE","十王未全滅時 final 不得 eligible",partialSnapshot);'
          repl('storyruntimeintegrity.js',anchor,anchor+'\n    const completion=progress.thirdWorldCompletionFramework?.(blankCompleted);\n    if(completion?.completionReady!==true||completion?.finalEligible!==true||completion?.storedCompleted!==false)fail("STORY_RUNTIME_THIRD_WORLD_COMPLETION_READY","十王全滅＋stage10 應只形成 completion/final eligibility，不得自動 completed",completion);\n    const beforeCompletion=JSON.stringify(blankCompleted);progress.thirdWorldCompletionFramework?.(blankCompleted);if(JSON.stringify(blankCompleted)!==beforeCompletion)fail("STORY_RUNTIME_THIRD_WORLD_COMPLETION_MUTATED","Completion Framework 必須純推導，不得修改正式 state");')

          repl('thirdworldintegritycontract.js',' const VERSION=33;', ' const VERSION=34;')
          repl('thirdworldintegritycontract.js','THIRD_WORLD_PHASE_VERSION:5,', 'THIRD_WORLD_PHASE_VERSION:6,')
          repl('thirdworldintegritycontract.js','THIRD_WORLD_ENTRY_RECONCILIATION_VERSION:2,THIRD_WORLD_CORE_RECONCILIATION_VERSION:1,', 'THIRD_WORLD_ENTRY_RECONCILIATION_VERSION:2,THIRD_WORLD_ENTRY_STORY_TRIGGER_VERSION:1,THIRD_WORLD_CORE_RECONCILIATION_VERSION:1,')
          repl('thirdworldintegritycontract.js','THIRD_WORLD_PROGRESS_VERSION:4,THIRD_WORLD_SETTLEMENT_VERSION:4,', 'THIRD_WORLD_PROGRESS_VERSION:5,THIRD_WORLD_SETTLEMENT_VERSION:5,THIRD_WORLD_STORY_FRAMEWORK_BRIDGE_VERSION:1,THIRD_WORLD_COMPLETION_READY_FRAMEWORK_VERSION:1,')

          repl('tests/story/flow.js',"assert(/const VERSION=13;/.test(progress)&&/CIVILIZATION_STORY_PROGRESS_VERSION=VERSION/.test(progress),'story progress 版本應為 13');", "assert(/const VERSION=14;/.test(progress)&&/CIVILIZATION_STORY_PROGRESS_VERSION=VERSION/.test(progress),'story progress 版本應為 14');")
          repl('tests/story/flow.js',"assert(/STORY_RUNTIME_INTEGRITY_VERSION=VERSION/.test(runtime)&&/const VERSION=13;/.test(runtime),'Story Runtime Integrity 應為 V13');", "assert(/STORY_RUNTIME_INTEGRITY_VERSION=VERSION/.test(runtime)&&/const VERSION=14;/.test(runtime),'Story Runtime Integrity 應為 V14');")
          repl('tests/story/flow.js',"assert(!/thirdWorldPendingStory|thirdWorldStoryQueue\\s*=\\s*\\[|pendingThirdWorldStory/.test(progress),'不得新增 W3 私有 persistent story queue');", "assert(!/thirdWorldPendingStory|thirdWorldStoryQueue\\s*=\\s*\\[|pendingThirdWorldStory/.test(progress),'不得新增 W3 私有 persistent story queue');\nassert(/consumeThirdWorldSettlement/.test(progress)&&/thirdWorldCompletionFramework/.test(progress),'12-3 必須建立 settlement→shared Story bridge 與 Completion Framework');\nassert(/queueThirdWorldEligibleStory\\(\\{resume:false\\}\\)/.test(progress),'settlement bridge 必須延後 Story presentation，等待 12-4 post-flow coordinator');")

          cache={
            'thirdworldphase.js?v=20260927-thirdworld-ui-opt9-3fix1':'thirdworldphase.js?v=20260928-thirdworld-batch12-3',
            'thirdworldprogress.js?v=20260927-thirdworld-progress-batch6-opt4':'thirdworldprogress.js?v=20260928-thirdworld-batch12-3',
            'thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-o3':'thirdworldintegritycontract.js?v=20260928-thirdworld-batch12-3',
            'storyprogress.js?v=20260928-thirdworld-batch12-2':'storyprogress.js?v=20260928-thirdworld-batch12-3',
            'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-2':'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-3',
          }
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for old,new in cache.items():
              if s.count(old)!=1: raise SystemExit(f'index cache anchor {old} count={s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Self-check
        shell: bash
        run: |
          set -euo pipefail
          node --check storyprogress.js
          node --check storyruntimeintegrity.js
          node --check thirdworldphase.js
          node --check thirdworldprogress.js
          node --check thirdworldintegritycontract.js
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'THIRD_WORLD_STORY_SETTLEMENT_BRIDGE_VERSION=THIRD_WORLD_SETTLEMENT_BRIDGE_VERSION' storyprogress.js
          grep -q 'THIRD_WORLD_COMPLETION_READY_FRAMEWORK_VERSION=COMPLETION_READY_FRAMEWORK_VERSION' thirdworldprogress.js
          grep -q 'thirdworldprogress.js?v=20260928-thirdworld-batch12-3' index.html
          grep -q 'storyprogress.js?v=20260928-thirdworld-batch12-3' index.html
      - name: Commit batch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storyprogress.js storyruntimeintegrity.js thirdworldphase.js thirdworldprogress.js thirdworldintegritycontract.js tests/story/flow.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Connect high-dimensional story settlement framework'
          git push origin HEAD:main
