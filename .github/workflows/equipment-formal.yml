name: Equipment 2.5D Formal Battle
on:
  push:
    branches:
    - main
    paths:
    - assets/era-player/**
    - 3d-test/equipment-sprites-v1/**
    - 3d-test/era-player-sprites.mjs
    - 3d-test/gm-battle-published.mjs
    - tests/equipment-*/**
    - scripts/equipment*
    - scripts/formal-equipment-identities.py
    - combatcore.js
    - index.html
    - .github/workflows/equipment-formal.yml
    - scripts/ci-*
    - .github/actions/setup-ci-browser/**
  pull_request:
    paths:
    - assets/era-player/**
    - 3d-test/equipment-sprites-v1/**
    - 3d-test/era-player-sprites.mjs
    - 3d-test/gm-battle-published.mjs
    - tests/equipment-*/**
    - scripts/equipment*
    - scripts/formal-equipment-identities.py
    - combatcore.js
    - index.html
    - .github/workflows/equipment-formal.yml
    - scripts/ci-*
    - .github/actions/setup-ci-browser/**
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  formal-f1:
    name: F1 — Formal equipment and battle
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python3 -m pip install Pillow==11.3.0
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium
    - name: Run F1 with command timings
      shell: bash
      run: |
        set -euo pipefail
        node scripts/build-publish-dry-run.cjs
        node scripts/stage-hybrid-preview.cjs
        python3 -m http.server 4189 --bind 127.0.0.1 --directory .publish-stage3 > /tmp/ci-http.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4189/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        curl -fsS http://127.0.0.1:4189/index.html >/dev/null
        node scripts/ci-run-suite.cjs F1
      env:
        RUNTIME_SMOKE_URL: http://127.0.0.1:4189/index.html
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: formal-F1-${{ github.run_attempt }}
        path: |-
          /tmp/mirror-void-*.png
          /tmp/mirror-void-*.json
          /tmp/formal-*.png
          /tmp/weapons-*.png
          /tmp/equipment-weapons-*.json
          /tmp/equipment-formal-*.json
          /tmp/batch11-audio-lazy-browser.json
          /tmp/unified-mobile-*.png
          /tmp/formal-http.log
          /tmp/equipment-phase6-dependencies.json

          ci-suite-*.json
          /tmp/ci-http.log
        if-no-files-found: ignore
        retention-days: 7
  formal-f2:
    name: F2 — Dungeons and cross-era
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python3 -m pip install Pillow==11.3.0
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium
    - name: Run F2 with command timings
      shell: bash
      run: |
        set -euo pipefail
        node scripts/build-publish-dry-run.cjs
        node scripts/stage-hybrid-preview.cjs
        python3 -m http.server 4189 --bind 127.0.0.1 --directory .publish-stage3 > /tmp/ci-http.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4189/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        curl -fsS http://127.0.0.1:4189/index.html >/dev/null
        node scripts/ci-run-suite.cjs F2
      env:
        RUNTIME_SMOKE_URL: http://127.0.0.1:4189/index.html
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: formal-F2-${{ github.run_attempt }}
        path: |-
          /tmp/mirror-void-*.png
          /tmp/mirror-void-*.json
          /tmp/formal-*.png
          /tmp/weapons-*.png
          /tmp/equipment-weapons-*.json
          /tmp/equipment-formal-*.json
          /tmp/batch11-audio-lazy-browser.json
          /tmp/unified-mobile-*.png
          /tmp/formal-http.log
          /tmp/equipment-phase6-dependencies.json

          ci-suite-*.json
          /tmp/ci-http.log
        if-no-files-found: ignore
        retention-days: 7
  formal-f3:
    name: F3 — Layout GM and audio
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python3 -m pip install Pillow==11.3.0
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium
    - name: Run F3 with command timings
      shell: bash
      run: |
        set -euo pipefail
        node scripts/build-publish-dry-run.cjs
        node scripts/stage-hybrid-preview.cjs
        python3 -m http.server 4189 --bind 127.0.0.1 --directory .publish-stage3 > /tmp/ci-http.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4189/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        curl -fsS http://127.0.0.1:4189/index.html >/dev/null
        node scripts/ci-run-suite.cjs F3
      env:
        RUNTIME_SMOKE_URL: http://127.0.0.1:4189/index.html
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: formal-F3-${{ github.run_attempt }}
        path: |-
          /tmp/mirror-void-*.png
          /tmp/mirror-void-*.json
          /tmp/formal-*.png
          /tmp/weapons-*.png
          /tmp/equipment-weapons-*.json
          /tmp/equipment-formal-*.json
          /tmp/batch11-audio-lazy-browser.json
          /tmp/unified-mobile-*.png
          /tmp/formal-http.log
          /tmp/equipment-phase6-dependencies.json

          ci-suite-*.json
          /tmp/ci-http.log
        if-no-files-found: ignore
        retention-days: 7
  gate:
    name: equipment-formal-gate
    needs:
    - formal-f1
    - formal-f2
    - formal-f3
    if: always()
    runs-on: ubuntu-latest
    steps:
    - env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYGATE'
        import os,json
        jobs=json.loads(os.environ['NEEDS_JSON'])
        for name,item in jobs.items():
            print(name,item['result'])
            assert item['result']=='success', f"required job {name} did not pass"
        PYGATE
