name: Build dungeon void battle backgrounds

on:
  push:
    paths:
      - '.github/workflows/build-dungeon-void-battle-backgrounds.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert and wire dungeon void battle backgrounds
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          jobs=[
              ('assets/backgrounds-source/dungeon-void-battle/desktop.png','assets/backgrounds/dungeon-void-battle/desktop.webp',1536),
              ('assets/backgrounds-source/dungeon-void-battle/mobile.png','assets/backgrounds/dungeon-void-battle/mobile.webp',1080),
          ]
          for src_s,dst_s,max_w in jobs:
              src=Path(src_s); dst=Path(dst_s)
              if not src.exists():
                  raise SystemExit(f'missing source: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              im=Image.open(src).convert('RGB')
              if im.width>max_w:
                  h=round(im.height*max_w/im.width)
                  im=im.resize((max_w,h),Image.Resampling.LANCZOS)
              im.save(dst,'WEBP',quality=72,method=6)
              print(src,im.size,'->',dst,dst.stat().st_size,'bytes')

          css=Path('backgrounds.css')
          s=css.read_text()
          marker='/* dungeon-void-battle background v1 */'
          if marker not in s:
              s += '''\n\n/* dungeon-void-battle background v1 */\n@media (min-width:761px){\n  #main>.void-shell:has(.void-combat){\n    width:100vw;\n    max-width:none!important;\n    min-height:calc(100vh - 57px)!important;\n    min-height:calc(100dvh - 57px)!important;\n    margin-top:-18px;\n    margin-bottom:-40px;\n    margin-left:calc(50% - 50vw);\n    margin-right:calc(50% - 50vw);\n    padding-top:30px;\n    padding-right:max(24px,calc((100vw - 1200px)/2 + 18px));\n    padding-bottom:52px;\n    padding-left:max(24px,calc((100vw - 1200px)/2 + 18px));\n    background-image:\n      linear-gradient(180deg,rgba(5,8,14,.18),rgba(12,5,20,.46)),\n      url("assets/backgrounds/dungeon-void-battle/desktop.webp?v=20260914-dungeon-void-battle-desktop1");\n    background-position:center center,center center;\n    background-size:cover,cover;\n    background-repeat:no-repeat,no-repeat;\n  }\n  #main>.void-shell:has(.void-combat)>.void-panel{\n    max-width:1120px;\n    margin-left:auto;\n    margin-right:auto;\n    background:linear-gradient(180deg,rgba(16,33,41,.70),rgba(12,21,26,.80));\n    backdrop-filter:blur(3px);\n    -webkit-backdrop-filter:blur(3px);\n  }\n  #main>.void-shell:has(.void-combat) .combatant{\n    backdrop-filter:blur(3px);\n    -webkit-backdrop-filter:blur(3px);\n  }\n}\n\n@media (max-width:760px){\n  #main>.void-shell:has(.void-combat){\n    width:100vw;\n    max-width:none;\n    min-height:calc(100vh - 52px);\n    min-height:calc(100dvh - 52px);\n    margin-top:-10px;\n    margin-bottom:-24px;\n    margin-left:calc(50% - 50vw);\n    margin-right:calc(50% - 50vw);\n    padding-top:18px;\n    padding-right:12px;\n    padding-bottom:28px;\n    padding-left:12px;\n    background-image:\n      linear-gradient(180deg,rgba(5,8,14,.20),rgba(12,5,20,.50)),\n      url("assets/backgrounds/dungeon-void-battle/mobile.webp?v=20260914-dungeon-void-battle-mobile1");\n    background-position:center center,center center;\n    background-size:cover,cover;\n    background-repeat:no-repeat,no-repeat;\n  }\n  #main>.void-shell:has(.void-combat)>.void-panel{\n    background:linear-gradient(180deg,rgba(16,33,41,.72),rgba(12,21,26,.82));\n    backdrop-filter:blur(2px);\n    -webkit-backdrop-filter:blur(2px);\n  }\n}\n'''
              css.write_text(s)

          polish=Path('dungeondesktoppolish.css')
          p=polish.read_text()
          old='html body #main .void-shell:not(:has(.void-result-grid)){' 
          new='html body #main .void-shell:not(:has(.void-result-grid)):not(:has(.void-combat)){' 
          if old not in p:
              raise SystemExit('unexpected void desktop shell selector')
          polish.write_text(p.replace(old,new,1))

          idx=Path('index.html')
          t=idx.read_text()
          old_bg='backgrounds.css?v=20260914-dungeon-void1'
          new_bg='backgrounds.css?v=20260914-dungeon-void-battle1'
          old_polish='dungeondesktoppolish.css?v=20260914-dungeon-desktop7'
          new_polish='dungeondesktoppolish.css?v=20260914-dungeon-desktop8'
          if old_bg not in t or old_polish not in t:
              raise SystemExit('unexpected css cache token')
          t=t.replace(old_bg,new_bg,1).replace(old_polish,new_polish,1)
          idx.write_text(t)
          PY
      - name: Commit optimized backgrounds and wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/backgrounds/dungeon-void-battle/desktop.webp assets/backgrounds/dungeon-void-battle/mobile.webp
          git add backgrounds.css dungeondesktoppolish.css index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add dungeon void battle backgrounds'
          git push
