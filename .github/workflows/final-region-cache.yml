name: Final Region Cache Bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-region-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update final region cache bust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='storydata-universe-cosmic-unification-war.js?v=20260923-universe-story-batch3'
          new='storydata-universe-cosmic-unification-war.js?v=20260923-universe-region10-final1'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one final-region cache target, got {count}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git rm .github/workflows/final-region-cache.yml
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/final-region-cache.yml
          git commit -m "Bump cache for universe final region"
          git push origin main
