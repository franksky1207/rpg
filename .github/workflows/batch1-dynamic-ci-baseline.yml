name: Batch 1 Cross-Mode Dynamic CI Baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute real regression entrypoints and record subprocess wall clock
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/batch1-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break || sleep 0.2; done
          node scripts/batch1-dynamic-ci-baseline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch1-dynamic-ci-baseline
          path: |
            batch1-dynamic-ci-baseline.json
            /tmp/batch1-http.log
          if-no-files-found: warn
