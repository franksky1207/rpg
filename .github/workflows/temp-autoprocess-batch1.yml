          # 2: offline gear uses the same disposition owner for every quality.
          replace_once('offlineprogress.js','const OFFLINE_GEAR_ACCUMULATOR_VERSION=3;','const OFFLINE_GEAR_ACCUMULATOR_VERSION=4;')
          old=''' function createGearAccumulator({target=null,reject,score,notifyUpgrade=true}={}){
  const s=isObject(target)?target:state,scoreItem=typeof score==="function"?score:(item=>equipmentScore(item)),types=equipmentTypes(),bestByType=new Map(),mythics=[],rejected=[];let droppedCount=0;
  function rejectItem(item){if(!item)return;rejected.push(item);if(typeof reject==="function")reject(item);}
  function consider(raw){const item=normalizeOfflineDrop(raw);if(!item)return;droppedCount++;if(Number(item.q)===5){mythics.push(item);return;}const type=item.type;if(!types.includes(type)){rejectItem(item);return;}const previous=bestByType.get(type);if(!previous||scoreItem(item)>scoreItem(previous)){if(previous)rejectItem(previous);bestByType.set(type,item);}else rejectItem(item);}
  function finalize(){
   if(!Array.isArray(s.inventory))s.inventory=[];
   const keptOrdinary=[],keptMythics=[];
   bestByType.forEach((item,type)=>{const current=s.equipment?.[type]||null;if(scoreItem(item)>scoreItem(current))keptOrdinary.push(item);else rejectItem(item);});
   const mythicAutoProcess=s?.settings?.autoSell?.[5]===true,keepUpgrade=s?.settings?.keepUpgrade===true;
   mythics.forEach(item=>{const current=s.equipment?.[item.type]||null,upgrade=scoreItem(item)>scoreItem(current);if(mythicAutoProcess&&!(keepUpgrade&&upgrade))rejectItem(item);else keptMythics.push(item);});
   keptOrdinary.forEach(item=>s.inventory.push(item));keptMythics.forEach(item=>s.inventory.push(item));
   const keptUpgrade=keptOrdinary.length>0||keptMythics.some(item=>scoreItem(item)>scoreItem(s.equipment?.[item.type]||null));
   if(keptUpgrade&&notifyUpgrade!==false&&isFormalStateTarget(s)){try{upgradeDropNoticePending=true;}catch(_){}}
   return {droppedCount,rejected,keptOrdinary,mythics:keptMythics,keptCount:keptOrdinary.length+keptMythics.length};
  }
  return {consider,finalize};
 }
'''
          new=''' function createGearAccumulator({target=null,reject,score,notifyUpgrade=true}={}){
  const s=isObject(target)?target:state,scoreItem=typeof score==="function"?score:(item=>equipmentScore(item)),types=equipmentTypes(),kept=[],rejected=[];let droppedCount=0;
  function rejectItem(item){if(!item)return;rejected.push(item);if(typeof reject==="function")reject(item);}
  function decision(item){if(typeof window.equipmentDropDisposition!=="function")throw new Error("Equipment auto-process policy owner unavailable");return window.equipmentDropDisposition(item,s,{score:scoreItem});}
  function consider(raw){const item=normalizeOfflineDrop(raw);if(!item)return;droppedCount++;if(!types.includes(item.type)){rejectItem(item);return;}const result=decision(item);if(result?.process===true)rejectItem(item);else kept.push(item);}
  function finalize(){
   if(!Array.isArray(s.inventory))s.inventory=[];
   const keptOrdinary=kept.filter(item=>Number(item.q)!==5),keptMythics=kept.filter(item=>Number(item.q)===5);
   keptOrdinary.forEach(item=>s.inventory.push(item));keptMythics.forEach(item=>s.inventory.push(item));
   const keptUpgrade=kept.some(item=>scoreItem(item)>scoreItem(s.equipment?.[item.type]||null));
