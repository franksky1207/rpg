  if(a.target.inventory.map(item=>item.id).join("|")!=="existing|weapon-best|mythic-upgrade")errors.push({code:"TARGET_INVENTORY_RESULT",inventory:a.target.inventory});
  if(a.rejected.join("|")!=="weapon-lower|armor-lower|mythic-equal"||a.result.keptCount!==2||a.result.droppedCount!==5)errors.push({code:"TARGET_SELECTION_RESULT",rejected:a.rejected,result:a.result});
  if(a.target.equipment.weapon.score!==50||a.target.equipment.armor.score!==80||a.target.equipment.shoes.score!==1||a.target.equipment.accessory.score!==10)errors.push({code:"TARGET_EQUIPMENT_MUTATED"});
  return Object.freeze({version:2,passed:errors.length===0,targetIsolation:true,deterministic:true,mythicAutoProcess:true,errors:Object.freeze(errors)});
 }
'''
