   return {droppedCount,rejected,keptOrdinary,mythics:keptMythics,keptCount:kept.length};
  }
  return {consider,finalize};
 }
'''
          replace_once('offlineprogress.js',old,new)
          old_reg=''' function runGearAccumulatorRegression(){
  const errors=[];
  function probe(){const target={equipment:{weapon:{score:50},armor:{score:80},shoes:{score:1},accessory:{score:10}},inventory:[{id:"existing",score:1}],settings:{autoSell:[false,false,false,false,false,true],keepUpgrade:true}},rejected=[],gear=createGearAccumulator({target,reject:item=>rejected.push(item.id),score:item=>Number(item?.score)||0,notifyUpgrade:false});gear.consider({id:"weapon-best",type:"weapon",q:4,score:60});gear.consider({id:"weapon-lower",type:"weapon",q:4,score:55});gear.consider({id:"armor-lower",type:"armor",q:4,score:70});gear.consider({id:"mythic-equal",type:"shoes",q:5,score:1});gear.consider({id:"mythic-upgrade",type:"accessory",q:5,score:20});const result=gear.finalize();return {target,rejected,result};}
  const a=probe(),b=probe();
