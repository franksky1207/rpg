name: Publication Dry Run (Stage 3)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.css'
      - '**/*.html'
      - 'resource-manifest.json'
      - 'assets/**'
      - 'audio/**'
      - 'vendor/**'
      - '3d-test/**'
      - 'scripts/*.cjs'
      - 'scripts/generate-resource-manifest.py'
      - '.github/workflows/publish-dry-run.yml'
      - 'docs/PUBLISH_ASSET*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build offline website candidate (no deployment)
        run: |
          node tests/runtime/publish-build-regression.cjs
          node scripts/build-publish-dry-run.cjs
      - name: Upload size and dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage3-publish-size-report
          path: publish-stage3-report.json
          if-no-files-found: warn
      - name: Upload generated website candidate (no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: stage3-website-candidate
          path: .publish-stage3/
          include-hidden-files: true
          if-no-files-found: error
