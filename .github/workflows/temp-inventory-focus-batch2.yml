name: Temporary Inventory Focus Batch2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-inventory-focus-batch2.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply inventory post-redeem focus and integrity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          Path('inventoryfocus.js').write_text('''(function(){\n const VERSION=2;\n let pendingMode=null;\n\n function requestEntryFocus(){pendingMode="entry";return true;}\n function requestPostRedeemFocus(){pendingMode="post-redeem";return true;}\n function hasLostGear(){return Array.isArray(state?.lostGear)&&state.lostGear.length>0;}\n function hasUpgrade(){\n  if(!Array.isArray(state?.inventory)||typeof equipmentScore!=="function")return false;\n  const types=Array.isArray(window.EQUIPMENT_TYPES)?window.EQUIPMENT_TYPES:(typeof EQUIPMENT_TYPES!=="undefined"?EQUIPMENT_TYPES:[]);\n  return types.some(type=>{\n   const current=state?.equipment?.[type]||null;\n   const currentScore=equipmentScore(current);\n   return state.inventory.some(item=>item?.type===type&&equipmentScore(item)>currentScore);\n  });\n }\n function scrollTarget(target){\n  if(!target)return false;\n  target.scrollIntoView({block:"center",inline:"nearest",behavior:"auto"});\n  return true;\n }\n function runFocus(mode){\n  if(typeof document==="undefined"||!document.querySelector(".inventory-page"))return false;\n  if(hasLostGear())return scrollTarget(document.querySelector(".inventory-page .lost-gear-card"));\n  if(hasUpgrade())return scrollTarget(document.querySelector('.inventory-page [onclick="equipBestAll()"]'));\n  if(mode==="entry"&&typeof window.scrollTo==="function")window.scrollTo({top:0,left:0,behavior:"auto"});\n  return true;\n }\n function applyFocus(){\n  if(!pendingMode)return false;\n  const mode=pendingMode;\n  pendingMode=null;\n  const run=()=>runFocus(mode);\n  if(typeof requestAnimationFrame==="function")requestAnimationFrame(()=>requestAnimationFrame(run));\n  else setTimeout(run,0);\n  return true;\n }\n function enterInventory(base,args,context){\n  requestEntryFocus();\n  const result=base.apply(context,args);\n  applyFocus();\n  return result;\n }\n\n const baseGo=typeof window.go==="function"?window.go:null;\n if(baseGo){\n  window.go=function(...args){\n   if(args[0]==="inventory")return enterInventory(baseGo,args,this);\n   return baseGo.apply(this,args);\n  };\n }\n const baseAdventureInventory=typeof window.openAdventureInventory==="function"?window.openAdventureInventory:null;\n if(baseAdventureInventory){\n  window.openAdventureInventory=function(...args){return enterInventory(baseAdventureInventory,args,this);};\n }\n\n window.requestInventoryEntryFocus=requestEntryFocus;\n window.requestInventoryPostRedeemFocus=requestPostRedeemFocus;\n window.applyInventoryEntryFocus=applyFocus;\n window.inventoryHasEquipmentUpgrade=hasUpgrade;\n window.INVENTORY_ENTRY_FOCUS_VERSION=VERSION;\n})();\n''')

          p=Path('ui.js'); s=p.read_text()
          old='function redeemGear(i){const r=redeemLostGear(i);if(!r.ok)return alert(r.reason);save();render()}'
          new='function redeemGear(i){const r=redeemLostGear(i);if(!r.ok)return alert(r.reason);save();if(typeof window.requestInventoryPostRedeemFocus==="function")window.requestInventoryPostRedeemFocus();render();if(typeof window.applyInventoryEntryFocus==="function")window.applyInventoryEntryFocus()}'
          assert s.count(old)==1, f'redeemGear match count={s.count(old)}'
          p.write_text(s.replace(old,new,1))

          p=Path('tests/runtime/js-integrity.js'); s=p.read_text()
          anchor='const specialEncounter=read("specialencounter.js");\n'
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'const inventoryFocus=read("inventoryfocus.js");\n',1)
          marker='assert(!fs.existsSync("level100balance.js"),"level100balance.js 已退休，repo 不應再保留舊檔。");\n'
          assert s.count(marker)==1
          probes='''\nassert(pos("inventoryfocus.js")>pos("equipmentlock.js"),"inventoryfocus.js 必須在 equipmentlock.js 後載入，以共用正式裝備比較 owner。");\nassert(/INVENTORY_ENTRY_FOCUS_VERSION=VERSION/.test(inventoryFocus)&&/const VERSION=2;/.test(inventoryFocus),"背包進入定位 owner 應為 V2。");\nassert(/requestInventoryEntryFocus=requestEntryFocus/.test(inventoryFocus)&&/requestInventoryPostRedeemFocus=requestPostRedeemFocus/.test(inventoryFocus)&&/applyInventoryEntryFocus=applyFocus/.test(inventoryFocus),"背包定位必須提供 entry、post-redeem 與 apply API。");\nconst inventoryLostPos=inventoryFocus.indexOf("if(hasLostGear())");\nconst inventoryUpgradePos=inventoryFocus.indexOf("if(hasUpgrade())");\nconst inventoryTopPos=inventoryFocus.indexOf('mode==="entry"');\nassert(inventoryLostPos>=0&&inventoryUpgradePos>inventoryLostPos&&inventoryTopPos>inventoryUpgradePos,"背包進入定位優先序必須為遺失裝備 → 較強裝備 → 頂部。");\nassert(/scrollIntoView/.test(inventoryFocus)&&/\.lost-gear-card/.test(inventoryFocus)&&/equipBestAll/.test(inventoryFocus),"背包定位必須使用實際 DOM 目標，不得依賴固定像素位置。");\nassert(/if\(args\[0\]===\"inventory\"\)return enterInventory/.test(inventoryFocus)&&/openAdventureInventory=function/.test(inventoryFocus),"首頁與冒險背包入口必須共用同一套 entry focus owner。");\nassert(/const mode=pendingMode;[\\s\\S]*pendingMode=null/.test(inventoryFocus),"背包定位 pending 必須在套用時一次性消耗。");\nassert(/mode===\"post-redeem\"/.test(inventoryFocus)||/mode==="entry"/.test(inventoryFocus),"背包定位必須區分 entry 與 post-redeem 模式。");\nassert(/function redeemGear\(i\)[\\s\\S]*requestInventoryPostRedeemFocus[\\s\\S]*render\(\)[\\s\\S]*applyInventoryEntryFocus/.test(ui),"成功贖回後必須在 render 前建立 post-redeem request，並在 render 後套用定位。");\nassert(index.includes('inventoryfocus.js?v=20260925-inventory-focus-batch2'),"index.html 必須載入最新 inventoryfocus.js cache-bust。");\n'''
          s=s.replace(marker,marker+probes,1)
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          old='inventoryfocus.js?v=20260925-inventory-focus-batch1'; new='inventoryfocus.js?v=20260925-inventory-focus-batch2'
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='ui.js?v=20260925-universe-auto-focus1'; new='ui.js?v=20260925-inventory-focus-batch2'
          assert s.count(old)==1; s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check inventoryfocus.js
          node --check ui.js
          node --check tests/runtime/js-integrity.js
          node tests/runtime/js-integrity.js
          grep -q 'INVENTORY_ENTRY_FOCUS_VERSION=VERSION' inventoryfocus.js
          grep -q 'requestInventoryPostRedeemFocus' ui.js
          grep -q 'inventoryfocus.js?v=20260925-inventory-focus-batch2' index.html
          grep -q 'ui.js?v=20260925-inventory-focus-batch2' index.html

          rm .github/workflows/temp-inventory-focus-batch2.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add inventoryfocus.js ui.js tests/runtime/js-integrity.js index.html .github/workflows/temp-inventory-focus-batch2.yml
          git commit -m "Complete prioritized inventory focus flow"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
          gh workflow run story-integrity.yml --ref main
