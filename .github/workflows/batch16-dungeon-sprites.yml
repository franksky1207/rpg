name: Batch16 Dungeon Sprite Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dungeon-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install Pillow==11.3.0
          npm install --prefix /tmp/batch16-browser --no-save playwright@1.55.0
          /tmp/batch16-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate exact identities, protected owners and publish candidate
        run: |
          python3 tests/runtime/batch13-monster-assets.py
          python3 scripts/generate-monster-trial-registry.py --check
          node tests/runtime/batch16-dungeon-contract.cjs
          node tests/runtime/batch16-cache.cjs
          node --test tests/runtime/batch13-monster-pool.test.mjs
          node scripts/build-publish-dry-run.cjs
      - name: All dungeon identities, mirror and fault recovery on published candidate
        env:
          NODE_PATH: /tmp/batch16-browser/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/batch16-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep .25
          done
          node tests/runtime/batch16-all-identities-browser.cjs
          node tests/runtime/batch16-mirror-browser.cjs
          node tests/runtime/batch16-live-dungeons-browser.cjs
          node tests/runtime/batch16-cross-mode-browser.cjs
          node tests/runtime/batch16-monster-recovery-browser.cjs
          node tests/runtime/batch16-resource-timeout-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch16-dungeon-evidence
          path: |
            /tmp/batch16-*.json
            /tmp/batch16-*.png
