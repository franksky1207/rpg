name: Temporary Fix Special Heal Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-special-heal-integrity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix integrity assertion
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('tests/runtime/js-integrity.js'); s=p.read_text(); old='assert(/if\\(!special\\)return false;\n  if\\(typeof restorePlayerHp===\"function\"\\)restorePlayerHp\\(\\{save:false\\}\\);\n  else state\\.hp=playerCombatStats\\(\\)\\.hp;/.test(specialEncounter),\"特殊遭遇正式觸發後必須先回滿血再開戰。\");'; new='assert(specialEncounter.includes(\'if(!special)return false;\\n  if(typeof restorePlayerHp===\"function\")restorePlayerHp({save:false});\\n  else state.hp=playerCombatStats().hp;\'),\"特殊遭遇正式觸發後必須先回滿血再開戰。\");'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          rm .github/workflows/temp-fix-special-heal-integrity.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add tests/runtime/js-integrity.js .github/workflows/temp-fix-special-heal-integrity.yml
          git commit -m "Fix special encounter heal integrity assertion"
          git push origin HEAD:main
