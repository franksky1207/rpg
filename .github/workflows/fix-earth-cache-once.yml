name: One-time Earth Story Cache Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-earth-cache-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time Earth story cache patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump Earth story cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='storydata-earth.js?v=20260916-story-earth2'
          new='storydata-earth.js?v=20260917-story-earth-cn1'
          if old not in s:
              raise SystemExit(f'expected cache token not found: {old}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump Earth story Chinese cleanup cache'
          git push origin main
