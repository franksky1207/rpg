name: One-time Runtime Cache Integrity Fix

on:
  push:
    paths:
      - '.github/workflows/fix-runtime-cache-integrity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync runtime integrity cache-bust expectations
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/runtime/js-integrity.js')
          text = p.read_text(encoding='utf-8')
          old = '''assert(index.includes('src="calamityrun.js?v=20260927-run-opt-batch2"')&&index.includes('src="backgroundprogress.js?v=20260927-run-opt-batch1"')&&index.includes('src="thirdworldphase.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldcore.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldmigrationregression.js?v=20260927-thirdworld-ui-opt9-4fix1"')&&index.includes('src="thirdworldrun.js?v=20260927-run-opt-batch2"')&&index.includes('src="continuousrunintegrity.js?v=20260927-run-opt-batch2"')&&index.includes('src="thirdworldsubsystemintegrity.js?v=20260927-thirdworld-ui-opt9-3"')&&index.includes('src="thirdworldintegritycontract.js?v=20260927-thirdworld-ui-opt9-5"'),"index.html 必須同步載入目前正式連戰與第三紀元 owner cache-bust。");'''
          new = '''assert(index.includes('src="calamityrun.js?v=20260927-run-opt-batch2"')&&index.includes('src="backgroundprogress.js?v=20260927-run-opt-batch1"')&&index.includes('src="thirdworldphase.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldcore.js?v=20260927-thirdworld-ui-opt9-3fix1"')&&index.includes('src="thirdworldmigrationregression.js?v=20260928-thirdworld-batch10-opt2"')&&index.includes('src="thirdworldrun.js?v=20260928-thirdworld-batch10-opt1"')&&index.includes('src="continuousrunintegrity.js?v=20260927-run-opt-batch2"')&&index.includes('src="thirdworldsubsystemintegrity.js?v=20260928-thirdworld-batch10-opt1"')&&index.includes('src="thirdworldintegritycontract.js?v=20260928-thirdworld-batch10-opt1"'),"index.html 必須同步載入目前正式連戰與第三紀元 owner cache-bust。");'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one stale assertion, found {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime/js-integrity.js
          git diff --cached --check
          git commit -m "Sync runtime integrity cache expectations"
          git push origin HEAD:main
