name: Review Combat Monster Sprite Acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-sprites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve all three era review battles and both calamity reviews
        run: node tests/runtime/review-combat-monster-sprites.cjs
      - name: Verify publish manifest and module inclusion
        run: node scripts/build-publish-dry-run.cjs
