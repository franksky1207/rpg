name: Asset Version Manifest
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.css'
      - 'index.html'
      - 'assets/backgrounds/**'
      - 'audio/assets/**'
      - '3d-test/assets/**'
      - 'assets/3d/**'
      - 'assets/models/**'
      - 'vendor/babylonjs/**'
      - 'scripts/generate-resource-manifest.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asset-version-manifest
  cancel-in-progress: false
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish a manifest from current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            python3 scripts/generate-resource-manifest.py > resource-manifest.json
            git add resource-manifest.json
            if git diff --cached --quiet; then
              echo "Content fingerprints already current."
              exit 0
            fi
            git commit -m "chore: refresh deployed resource fingerprint manifest"
            if git push origin HEAD:main; then
              echo "Manifest published."
              exit 0
            fi
            sleep 2
          done
          echo "Manifest update failed after main changed repeatedly." >&2
          exit 1
