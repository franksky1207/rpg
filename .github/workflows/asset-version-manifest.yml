name: Asset Version Manifest
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.css'
      - 'index.html'
      - 'assets/backgrounds/**'
      - 'vendor/babylonjs/**'
      - 'scripts/generate-resource-manifest.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asset-version-manifest
  cancel-in-progress: false
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate per-file asset versions
        shell: bash
        run: |
          python3 scripts/generate-resource-manifest.py > resource-manifest.json
      - name: Publish only if resource bytes changed
        shell: bash
        run: |
          set -e
          if git diff --quiet -- resource-manifest.json && [ -f resource-manifest.json ] && git ls-files --error-unmatch resource-manifest.json >/dev/null 2>&1; then
            echo "Resource hashes unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resource-manifest.json
          git commit -m "chore: refresh deployed resource fingerprint manifest"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git reset --soft origin/main
            python3 scripts/generate-resource-manifest.py > resource-manifest.json
            git add resource-manifest.json
            git commit -m "chore: refresh deployed resource fingerprint manifest"
          fi
          git push origin HEAD:main
