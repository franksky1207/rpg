name: Batch19 Absolute Sprite Sizing
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  absolute-sizing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix /tmp/batch19-browser --no-save playwright@1.55.0
          /tmp/batch19-browser/node_modules/.bin/playwright install --with-deps chromium
          node tests/runtime/batch19-absolute-sizing-contract.cjs
          node scripts/build-publish-dry-run.cjs
      - name: Measure actual native battle Alpha against compact combat frame
        env:
          NODE_PATH: /tmp/batch19-browser/node_modules
          CHROMIUM_PATH: ''
          B19_REPORT: /tmp/batch19-native.json
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/batch19-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node development/combat-animation/batch19-1/measure-live.cjs
          node tests/runtime/batch19-fallback-size-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch19-absolute-sizing-evidence
          path: |
            /tmp/batch19-*.json
            /tmp/batch19-*.png
