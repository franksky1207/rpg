name: Hybrid Comparison T2-A
on:
  push:
    branches: [main]
    paths:
      - 'scripts/hybrid-comparison-*.cjs'
      - 'tests/runtime/hybrid-comparison-contract.cjs'
      - 'development/hybrid-comparison/**'
      - 'docs/3D_HYBRID_T2A*'
      - 'PROJECT_HANDOFF.md'
      - 'docs/3D_HYBRID_TRANSITION_EXECUTION_ROADMAP_2026-10-12.md'
      - '.github/workflows/hybrid-comparison-t2a.yml'
  workflow_dispatch:
jobs:
  contract-and-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate isolated fixture, references and comparison contracts
        run: |
          node scripts/hybrid-comparison-fixtures.cjs --check
          node tests/runtime/hybrid-comparison-contract.cjs
          node tests/runtime/3d-formal-snapshots-contract.cjs
          node tests/runtime/3d-shared-loader-contract.cjs
          node tests/runtime/combat-events-contract.cjs
          node tests/runtime/combat-events-integration.cjs
          node tests/runtime/3d-equipment-contract.cjs
          node tests/runtime/js-integrity.js
          node tests/runtime/resource-manifest-integrity.js
      - name: Verify actual lean publication closure and development exclusion
        run: |
          node scripts/build-publish-dry-run.cjs
          node tests/runtime/publish-build-regression.cjs
          test ! -e .publish-stage3/development/hybrid-comparison/t2a-v1/owner-fixtures.json
          test ! -e .publish-stage3/scripts/hybrid-comparison-fixtures.cjs
