name: Temporary Void formula batch2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-void-formula-batch2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Void formula cache and integrity probes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          old='dungeonvoid.js?v=20260923-civ-owner-batch1'
          new='dungeonvoid.js?v=20260924-void-linear-v2'
          if s.count(old)!=1:
              raise SystemExit(f'unexpected dungeonvoid cache-bust match count: {s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/runtime/js-integrity.js')
          s=p.read_text()
          anchor='const levelAudit=read("levelprogressionaudit.js");\n'
          insert='const levelAudit=read("levelprogressionaudit.js");\nconst dungeonVoid=read("dungeonvoid.js");\nconst dungeonGm=read("dungeongm.js");\n'
          if s.count(anchor)!=1:
              raise SystemExit(f'unexpected integrity read anchor count: {s.count(anchor)}')
          s=s.replace(anchor,insert,1)

          anchor='assert(/PLAYER_TITLE_CATALOG_VERSION=3/.test(titleCore),"playertitlecore.js 正式稱號 catalog 應為 V3。");\n'
          block='''assert(/PLAYER_TITLE_CATALOG_VERSION=3/.test(titleCore),"playertitlecore.js 正式稱號 catalog 應為 V3。");

assert(/const VOID_MIRAGE_HP_BASE=100\\.0;/.test(dungeonVoid)&&/const VOID_MIRAGE_HP_PER_FLOOR=9\\.6;/.test(dungeonVoid),"虛空 HP 線性公式應為 100.0 + 9.6F。");
assert(/const VOID_MIRAGE_ATK_BASE=10\\.0;/.test(dungeonVoid)&&/const VOID_MIRAGE_ATK_PER_FLOOR=1\\.3;/.test(dungeonVoid),"虛空 ATK 線性公式應為 10.0 + 1.3F。");
assert(/const VOID_MIRAGE_DEF_BASE=5\\.0;/.test(dungeonVoid)&&/const VOID_MIRAGE_DEF_PER_FLOOR=0\\.6;/.test(dungeonVoid),"虛空 DEF 線性公式應為 5.0 + 0.6F。");
assert(/formulaVersion:2/.test(dungeonVoid),"虛空公式版本應為 V2。");
assert(/Math\\.ceil\\(VOID_MIRAGE_HP_BASE\\+VOID_MIRAGE_HP_PER_FLOOR\\*f\\)/.test(dungeonVoid)&&/Math\\.ceil\\(VOID_MIRAGE_ATK_BASE\\+VOID_MIRAGE_ATK_PER_FLOOR\\*f\\)/.test(dungeonVoid)&&/Math\\.ceil\\(VOID_MIRAGE_DEF_BASE\\+VOID_MIRAGE_DEF_PER_FLOOR\\*f\\)/.test(dungeonVoid),"虛空 baseStats 必須直接使用正式線性公式。");
assert(!/VOID_MIRAGE_(?:HP|ATK|DEF)_MULTIPLIER/.test(dungeonVoid),"虛空 V2 不得復活舊倍率公式。");
assert(/voidMirageBaseStats\\(floor\\)/.test(dungeonGm)&&/buildVoidMirageEnemy\\(floor/.test(dungeonGm),"GM 虛空測試必須共用正式虛空公式 owner。");
assert(index.includes('src="dungeonvoid.js?v=20260924-void-linear-v2"'),"index.html 必須載入虛空線性公式 V2 cache-bust。");
'''
          if s.count(anchor)!=1:
              raise SystemExit(f'unexpected integrity formula anchor count: {s.count(anchor)}')
          p.write_text(s.replace(anchor,block,1))
          PY
          rm .github/workflows/temp-void-formula-batch2.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add index.html tests/runtime/js-integrity.js .github/workflows/temp-void-formula-batch2.yml
          git commit -m "Align Void formula cache and integrity probes"
          git push origin HEAD:main
