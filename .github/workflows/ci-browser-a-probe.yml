name: Browser dependencies A-only probe
on:
  push:
    branches:
      - ci/browser-deps-probe-20261026
    paths:
      - .github/workflows/ci-browser-a-probe.yml
permissions:
  contents: read
jobs:
  probe:
    name: Chromium and WebKit without apt installation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Report runner and native dependency presence
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          npm install --no-save playwright@1.55.0
          echo '--- apt dry run (informational only) ---'
          npx playwright install-deps --dry-run chromium webkit || true
      - name: Install browser executables only (NO with-deps)
        shell: bash
        run: |
          set -euo pipefail
          time npx playwright install chromium webkit
      - name: Launch Chromium and WebKit with a real page
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { chromium, webkit } = require('playwright');
          (async () => {
            for (const [name, type] of Object.entries({ chromium, webkit })) {
              const start = Date.now();
              const browser = await type.launch({ headless: true });
              try {
                const page = await browser.newPage();
                await page.goto('data:text/html,<html><title>ci-probe</title><body>ok</body></html>');
                const title = await page.title();
                if (title !== 'ci-probe') throw new Error(name + ': unexpected title ' + title);
                console.log('PASS', name, browser.version(), Date.now() - start, 'ms');
              } finally { await browser.close(); }
            }
          })().catch(e => { console.error(e); process.exitCode = 1; });
          NODE
