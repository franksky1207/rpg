name: Batch 2-4 Integration and Regression
on:
  push:
    branches: [cleanup-batch2-4-integration-20261017, batch3-1-old-concept-prune, batch3-2-retire-concept-tools]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-batches-no-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real image validation requirements
        run: python3 -m pip install Pillow==11.3.0
      - name: Formal source and dependency integration
        run: |
          set -euo pipefail
          if [ -f tests/runtime/cleanup-batch3-1-tree.cjs ]; then node tests/runtime/cleanup-batch3-1-tree.cjs; fi
          node tests/runtime/cleanup-batch2-4-integration.cjs
          python3 scripts/formal-equipment-identities.py
          node tests/runtime/js-integrity.js
          node tests/runtime/t4-preview-retirement.cjs
          node tests/runtime/combat-events-contract.cjs
          node tests/runtime/combat-events-integration.cjs
          node tests/runtime/t3b-formal-owner-clock.cjs
          node tests/runtime/newstate-save-owner-integrity.js
          node tests/runtime/gm-runtime-auth-preferences-integrity.js
          node tests/runtime/gm-runtime-early-restore-integrity.js
          node tests/runtime/alternate-universe-old-save-integrity.js
          node tests/runtime/alternate-universe-combat-integrity.js
          node tests/runtime/alternate-universe-progression-integrity.js
          node tests/runtime/resource-cache-integrity.js
          node tests/runtime/resource-cache-behavior.js
          node tests/runtime/resource-cache-prefetch-integrity.js
          node tests/audio-lifecycle.test.cjs
          node tests/audio-regression.test.cjs
      - name: Real isolated release and GM B asset stage
        run: |
          set -euo pipefail
          node scripts/publish-asset-audit.cjs
          node scripts/build-publish-dry-run.cjs
          node scripts/stage-hybrid-preview.cjs
          node tests/runtime/cleanup-batch2-3-staging.cjs
          node tests/runtime/publish-build-regression.cjs
      - name: Install headless browser
        run: |
          npm install --prefix /tmp/rpg-batch2-4 --no-save playwright@1.55.0
          /tmp/rpg-batch2-4/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual game and GM regression in published candidate
        env:
          NODE_PATH: /tmp/rpg-batch2-4/node_modules
          RUNTIME_SMOKE_URL: http://127.0.0.1:4189/index.html
          SMOKE_URL: http://127.0.0.1:4189/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 4189 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/rpg-batch2-4-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:4189/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/runtime/gm-3d-test-center-browser.js
          node tests/equipment-gm/browser.cjs
          node tests/equipment-formal/browser.cjs
          node tests/runtime/combat-events-browser.js
          node tests/runtime/combat-events-owner-browser.js
          node tests/runtime/browser-smoke.js
          # Retired T1-A GM v5 scene harness requires a deleted legacy 3D menu.
          # Preserve shared formal snapshot contract; exercise current GM v6 above.
          node tests/runtime/3d-formal-snapshots-contract.cjs
          node tests/runtime/breakthrough-core-integrity.js
          node tests/runtime/reincarnation-permanent-gear-carryover-integrity.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch2-4-regression-evidence
          path: |
            publish-stage3-report.json
            /tmp/rpg-batch2-4-server.log
            /tmp/gm-panel-*.png
            /tmp/gm-phase4-*.png
          if-no-files-found: warn
