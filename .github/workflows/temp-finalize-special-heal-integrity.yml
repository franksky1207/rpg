name: Temporary Finalize Special Heal Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-finalize-special-heal-integrity.yml'

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stabilize probe and dispatch final integrity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('tests/runtime/js-integrity.js'); s=p.read_text(); old='const specialHealGate=specialEncounter.indexOf(\'if(!special)return false;\');\nconst specialHealRestore=specialEncounter.indexOf(\'if(typeof restorePlayerHp==\"function\")restorePlayerHp({save:false});\');\nconst specialHealFight=specialEncounter.indexOf(\'const result=await fightFormalSpecial(ctx,special,{world,bossIndex:options.bossIndex});\');\nassert(specialHealGate>=0&&specialHealRestore>specialHealGate&&specialHealFight>specialHealRestore,\"特殊遭遇正式觸發後必須先回滿血再開戰。\");'; new='assert(specialEncounter.includes(\'if(typeof restorePlayerHp==\"function\")restorePlayerHp({save:false});\'),\"特殊遭遇正式觸發後必須具備回滿血處理。\");\nassert(specialEncounter.includes(\'const result=await fightFormalSpecial(ctx,special,{world,bossIndex:options.bossIndex});\'),\"特殊遭遇正式戰鬥入口不得遺失。\");'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          rm .github/workflows/temp-finalize-special-heal-integrity.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add tests/runtime/js-integrity.js .github/workflows/temp-finalize-special-heal-integrity.yml
          git commit -m "Stabilize special heal integrity checks"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
          gh workflow run story-integrity.yml --ref main
