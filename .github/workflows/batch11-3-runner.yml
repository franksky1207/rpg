name: One-time Batch 11-3 Universe Review

on:
  push:
    paths:
      - '.github/workflows/batch11-3-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply batch 11-3 universe review patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def rep(path, old, new, count=1):
              text=read(path); found=text.count(old)
              if found!=count: raise SystemExit(f'{path}: expected {count} match(es), found {found}: {old[:120]!r}')
              write(path,text.replace(old,new))
          def sub(path, pattern, repl, count=1):
              text=read(path); new,n=re.subn(pattern,repl,text,count=count,flags=re.S)
              if n!=count: raise SystemExit(f'{path}: regex expected {count}, found {n}: {pattern[:120]!r}')
              write(path,new)

          # secondworldcombat.js: explicit review mode, same combat core, no formal settlement/progress.
          rep('secondworldcombat.js',' const VERSION=1;\n const SETTLEMENT_READY=true;',' const VERSION=2;\n const SETTLEMENT_READY=true;\n const REVIEW_POLICY_VERSION=1;\n const REVIEW_STATE_ISOLATION_VERSION=1;')
          rep('secondworldcombat.js', ''' function canRunSecondWorldBossCombat(value,target=null){\n  const index=clampBossIndex(value);\n  if(index<0)return false;\n  if(target&&target.ignoreUnlock===true)return true;\n  const targetState=target?.state||null;\n  if(!secondWorldFormalCombatEnabled(targetState))return false;\n  return typeof window.canChallengeSecondWorldBoss===\"function\"&&window.canChallengeSecondWorldBoss(index,targetState);\n }\n''', ''' function canRunSecondWorldBossCombat(value,target=null){\n  const index=clampBossIndex(value);\n  if(index<0)return false;\n  if(target&&target.ignoreUnlock===true)return true;\n  const targetState=target?.state||null;\n  if(!secondWorldFormalCombatEnabled(targetState))return false;\n  return typeof window.canChallengeSecondWorldBoss===\"function\"&&window.canChallengeSecondWorldBoss(index,targetState);\n }\n function canRunSecondWorldBossReview(value,target=null){\n  const index=clampBossIndex(value);\n  const holder=target&&typeof target===\"object\"?target:(typeof state!==\"undefined\"&&state&&typeof state===\"object\"?state:null);\n  if(index<0||holder?.thirdWorld?.entered!==true||holder?.secondWorld?.entered!==true)return false;\n  return typeof window.secondWorldBossKilled===\"function\"&&window.secondWorldBossKilled(index,holder)===true;\n }\n''')
          rep('secondworldcombat.js', '''  const targetState=options.state&&typeof options.state===\"object\"?options.state:(typeof state!==\"undefined\"&&state&&typeof state===\"object\"?state:null);\n  if(options.ignoreUnlock!==true&&!secondWorldFormalCombatEnabled(targetState))return {ok:false,reason:\"宇宙紀元已轉為回顧，無法產生正式主線進度。\"};\n  if(options.ignoreUnlock!==true&&!(typeof window.canChallengeSecondWorldBoss===\"function\"&&window.canChallengeSecondWorldBoss(index,targetState))){\n   return {ok:false,reason:\"此宇宙紀元 Boss 尚未解鎖。\"};\n  }\n''', '''  const targetState=options.state&&typeof options.state===\"object\"?options.state:(typeof state!==\"undefined\"&&state&&typeof state===\"object\"?state:null);\n  const reviewMode=options.review===true;\n  if(reviewMode){\n   if(!canRunSecondWorldBossReview(index,targetState))return {ok:false,review:true,reason:\"只有已完成的宇宙紀元主線 Boss 可以進行回顧。\"};\n  }else{\n   if(options.ignoreUnlock!==true&&!secondWorldFormalCombatEnabled(targetState))return {ok:false,reason:\"宇宙紀元已轉為回顧，無法產生正式主線進度。\"};\n   if(options.ignoreUnlock!==true&&!(typeof window.canChallengeSecondWorldBoss===\"function\"&&window.canChallengeSecondWorldBoss(index,targetState))){\n    return {ok:false,reason:\"此宇宙紀元 Boss 尚未解鎖。\"};\n   }\n  }\n''')
          rep('secondworldcombat.js', '''   ok:true,\n   win:combat.win===true,\n''', '''   ok:true,\n   review:reviewMode,\n   win:combat.win===true,\n''')
          rep('secondworldcombat.js','   settlementReady:SETTLEMENT_READY,\n','   settlementReady:reviewMode?false:SETTLEMENT_READY,\n')
          rep('secondworldcombat.js', '''  if(SETTLEMENT_READY!==true)errors.push({code:\"SETTLEMENT_GATE\"});\n  return {passed:errors.length===0,version:VERSION,settlementReady:SETTLEMENT_READY,errors};\n }\n''', '''  if(SETTLEMENT_READY!==true)errors.push({code:\"SETTLEMENT_GATE\"});\n  try{\n   const reviewState={level:1000,hp:12345,secondWorld:{entered:true,civilizationLevel:10,mainline:{bossKilled:Array.from({length:100},()=>true)}},thirdWorld:{entered:true}};\n   const before=JSON.stringify(reviewState),player={hp:1000000,atk:1000000000,def:1000000,crit:0,dodge:0};\n   const review=runSecondWorldBossCombat(99,{review:true,state:reviewState,player,startHp:player.hp,encounter:secondWorldBossEncounter(99,{traits:[]}),logs:false,preparePresentation:false,rng:()=>.99});\n   if(review?.ok!==true||review?.review!==true||review?.settlementReady!==false||review?.formalProgressChanged!==false||review?.xp!==0||review?.darkMatter!==0||review?.darkEnergy!==0||!Array.isArray(review?.items)||review.items.length!==0)errors.push({code:\"REVIEW_ZERO_PROGRESS\",review});\n   if(JSON.stringify(reviewState)!==before)errors.push({code:\"REVIEW_STATE_MUTATION\"});\n   if(canRunSecondWorldBossCombat(99,{state:reviewState})!==false||canRunSecondWorldBossReview(99,reviewState)!==true)errors.push({code:\"REVIEW_FORMAL_GATE_ISOLATION\"});\n  }catch(error){errors.push({code:\"REVIEW_INTEGRITY_EXCEPTION\",error:String(error?.message||error)});}\n  return {passed:errors.length===0,version:VERSION,settlementReady:SETTLEMENT_READY,reviewPolicyVersion:REVIEW_POLICY_VERSION,reviewStateIsolationVersion:REVIEW_STATE_ISOLATION_VERSION,errors};\n }\n''')
          rep('secondworldcombat.js', ''' window.canRunSecondWorldBossCombat=canRunSecondWorldBossCombat;\n window.runSecondWorldBossCombat=runSecondWorldBossCombat;\n window.SECOND_WORLD_CIVILIZATION_COMBAT_VERSION=2;\n''', ''' window.canRunSecondWorldBossCombat=canRunSecondWorldBossCombat;\n window.canRunSecondWorldBossReview=canRunSecondWorldBossReview;\n window.runSecondWorldBossCombat=runSecondWorldBossCombat;\n window.SECOND_WORLD_CIVILIZATION_COMBAT_VERSION=2;\n window.SECOND_WORLD_COMBAT_REVIEW_POLICY_VERSION=REVIEW_POLICY_VERSION;\n window.SECOND_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION=REVIEW_STATE_ISOLATION_VERSION;\n''')

          # secondworldmainline.js: review flow reuses encounter/combat/presentation but bypasses settlement/rewards/offline/death penalty.
          rep('secondworldmainline.js',' const VERSION=8;\n const BACKGROUND_GM_GATE_VERSION=1;',' const VERSION=9;\n const BACKGROUND_GM_GATE_VERSION=1;\n const REVIEW_FLOW_VERSION=1;\n const REVIEW_STATE_ISOLATION_VERSION=1;')
          rep('secondworldmainline.js', ''' function createContext(index,boss,continuous){\n  return {\n   bossIndex:index,boss,continuous:continuous===true,stopRequested:false,stopReason:null,\n   completed:0,wins:0,totalXp:0,totalDarkMatter:0,totalDarkEnergy:0,items:[],autoSoldCount:0,\n   startedAt:Date.now(),backgroundStarted:false,lastCombat:null,lastPenalty:null,currentEncounter:null,presenting:false,catchUpNeedsFinalSync:false\n  };\n }\n''', ''' function createContext(index,boss,continuous,review=false){\n  return {\n   bossIndex:index,boss,continuous:continuous===true,review:review===true,stopRequested:false,stopReason:null,\n   completed:0,wins:0,totalXp:0,totalDarkMatter:0,totalDarkEnergy:0,items:[],autoSoldCount:0,\n   startedAt:Date.now(),backgroundStarted:false,lastCombat:null,lastPenalty:null,currentEncounter:null,presenting:false,catchUpNeedsFinalSync:false,reviewPlayerStartHp:0,reviewPlayerMaxHp:0\n  };\n }\n''')
          anchor=' function publishContext(ctx){activeContext=ctx;window.activeSecondWorldMainlineContext=ctx;}\n'
          insert=''' function showReviewResult(boss,combat){\n  const {title,detail,modal}=battleModal();if(!title||!detail||!modal)return;\n  title.textContent=\"宇宙紀元・回顧\";\n  detail.innerHTML=`<div class=\"settlement-section\"><div class=\"settlement-section-title\">${boss?.name||\"宇宙紀元 Boss\"} Lv.${boss?.level||\"—\"}</div><div class=\"notice\"><b>${combat?.win===true?\"回顧勝利\":\"回顧挑戰結束\"}</b><div class=\"muted\" style=\"margin-top:6px\">本場為單場純回顧挑戰，不產生 EXP、暗物質、暗能量、裝備、主線進度、文明災厄、特殊遭遇、離線樣本或死亡懲罰；正式角色 HP 與所有正式 state 皆不變。</div></div><div class=\"muted\" style=\"margin-top:10px\">戰鬥回合：${Math.max(0,Number(combat?.turns)||0)}</div></div>`;\n  modal.classList.add(\"show\");\n }\n'''+anchor
          rep('secondworldmainline.js',anchor,insert)
          review_flow=''' async function runReviewFlow(index){\n  if(busy||typeof battleBusy!==\"undefined\"&&battleBusy)return false;\n  const targetState=typeof state!==\"undefined\"&&state&&typeof state===\"object\"?state:null;\n  if(!(typeof window.canRunSecondWorldBossReview===\"function\"&&window.canRunSecondWorldBossReview(index,targetState)))return alert(\"此宇宙紀元 Boss 尚未完成，無法回顧。\");\n  const boss=typeof window.secondWorldBoss===\"function\"?window.secondWorldBoss(index):null;if(!boss)return false;\n  const player=typeof window.playerCombatStats===\"function\"?window.playerCombatStats():null;if(!player)return false;\n  const encounter=typeof window.secondWorldBossEncounter===\"function\"?window.secondWorldBossEncounter(index):null;if(!encounter)return false;\n  const ctx=createContext(index,boss,false,true);ctx.currentEncounter=encounter;ctx.reviewPlayerMaxHp=Math.max(1,Number(player.hp)||1);ctx.reviewPlayerStartHp=ctx.reviewPlayerMaxHp;publishContext(ctx);\n  const before=JSON.stringify(targetState);busy=true;if(typeof battleBusy!==\"undefined\")battleBusy=true;if(typeof window.setAdventureReviewBattleActive===\"function\")window.setAdventureReviewBattleActive(true);\n  let combat=null;\n  try{\n   if(typeof render===\"function\")render();\n   combat=window.runSecondWorldBossCombat(index,{review:true,state:targetState,player,startHp:ctx.reviewPlayerStartHp,encounter,logs:true,preparePresentation:true});ctx.lastCombat=combat;\n   if(!combat?.ok||combat.review!==true||combat.settlementReady!==false)throw new Error(combat?.reason||\"宇宙回顧戰建立失敗。\");\n   ctx.presenting=true;try{await presentCombat(combat);}finally{ctx.presenting=false;}\n   if(JSON.stringify(targetState)!==before)throw new Error(\"宇宙回顧戰不應修改正式 state。\");\n   setTimeout(()=>showReviewResult(boss,combat),0);\n   return true;\n  }catch(error){console.error(\"[文明戰線] 宇宙紀元回顧失敗\",error);alert(\"宇宙紀元回顧發生錯誤，正式進度未受影響。\");return false;}\n  finally{\n   ctx.currentEncounter=null;ctx.presenting=false;\n   if(typeof window.clearCombatPresentation===\"function\")window.clearCombatPresentation(\"second-world-review-finalize\");\n   if(typeof window.setAdventureReviewBattleActive===\"function\")window.setAdventureReviewBattleActive(false);\n   busy=false;if(typeof battleBusy!==\"undefined\")battleBusy=false;clearContext(ctx);\n   if(typeof render===\"function\")render();\n  }\n }\n\n'''
          rep('secondworldmainline.js',' async function runFlow(index,continuous){\n',review_flow+' async function runFlow(index,continuous){\n')
          rep('secondworldmainline.js', ''' window.startSecondWorldBossBattle=function(value){return runFlow(Math.floor(Number(value)),false);};\n window.startSecondWorldBossContinuous=function(value){return runFlow(Math.floor(Number(value)),true);};\n''', ''' window.startSecondWorldBossBattle=function(value){return runFlow(Math.floor(Number(value)),false);};\n window.startSecondWorldBossContinuous=function(value){return runFlow(Math.floor(Number(value)),true);};\n window.startSecondWorldBossReview=function(value){return runReviewFlow(Math.floor(Number(value)));};\n''')
          rep('secondworldmainline.js', ''' window.SECOND_WORLD_MAINLINE_VERSION=VERSION;\n window.SECOND_WORLD_BACKGROUND_GM_GATE_VERSION=BACKGROUND_GM_GATE_VERSION;\n''', ''' window.SECOND_WORLD_MAINLINE_VERSION=VERSION;\n window.SECOND_WORLD_MAINLINE_REVIEW_FLOW_VERSION=REVIEW_FLOW_VERSION;\n window.SECOND_WORLD_MAINLINE_REVIEW_STATE_ISOLATION_VERSION=REVIEW_STATE_ISOLATION_VERSION;\n window.SECOND_WORLD_BACKGROUND_GM_GATE_VERSION=BACKGROUND_GM_GATE_VERSION;\n''')
          rep('secondworldmainline.js', '''  passed:typeof window.startSecondWorldBossBattle===\"function\"&&typeof window.startSecondWorldBossContinuous===\"function\"&&typeof window.requestSecondWorldContinuousStop===\"function\"&&typeof window.secondWorldMainlinePresentationActive===\"function\"&&window.SECOND_WORLD_COMBAT_SETTLEMENT_READY===true&&Number(window.BACKGROUND_PROGRESS_FAST_CATCH_UP_POLICY_VERSION)===1&&Number(window.SECOND_WORLD_ATOMIC_SETTLEMENT_VERSION)===1,\n  version:VERSION,backgroundGmGateVersion:BACKGROUND_GM_GATE_VERSION\n''', '''  passed:typeof window.startSecondWorldBossBattle===\"function\"&&typeof window.startSecondWorldBossContinuous===\"function\"&&typeof window.startSecondWorldBossReview===\"function\"&&typeof window.requestSecondWorldContinuousStop===\"function\"&&typeof window.secondWorldMainlinePresentationActive===\"function\"&&window.SECOND_WORLD_COMBAT_SETTLEMENT_READY===true&&Number(window.SECOND_WORLD_COMBAT_REVIEW_POLICY_VERSION)===1&&Number(window.BACKGROUND_PROGRESS_FAST_CATCH_UP_POLICY_VERSION)===1&&Number(window.SECOND_WORLD_ATOMIC_SETTLEMENT_VERSION)===1,\n  version:VERSION,backgroundGmGateVersion:BACKGROUND_GM_GATE_VERSION,reviewFlowVersion:REVIEW_FLOW_VERSION,reviewStateIsolationVersion:REVIEW_STATE_ISOLATION_VERSION\n''')

          # worldmapui.js: same W2 card/region renderer gets formal/review mode; W3 universe review shows all 100 bosses.
          rep('worldmapui.js', '''  function secondWorldVisibleBosses(region){\n    if(!region||typeof window.secondWorldBossesForRegion!==\"function\")return [];\n    return window.secondWorldBossesForRegion(region.index).filter(boss=>typeof window.secondWorldBossVisible===\"function\"&&window.secondWorldBossVisible(boss.index));\n  }\n''', '''  function secondWorldVisibleBosses(region,reviewMode=false){\n    if(!region||typeof window.secondWorldBossesForRegion!==\"function\")return [];\n    const bosses=window.secondWorldBossesForRegion(region.index);\n    return reviewMode?bosses:bosses.filter(boss=>typeof window.secondWorldBossVisible===\"function\"&&window.secondWorldBossVisible(boss.index));\n  }\n''')
          sub('worldmapui.js',r'  function secondWorldBossCardHtml\(boss\)\{.*?\n  \}\n\n  function secondWorldRegionHtml\(region,activeIndex\)\{', '''  function secondWorldBossCardHtml(boss,reviewMode=false){\n    const killed=typeof window.secondWorldBossKilled===\"function\"&&window.secondWorldBossKilled(boss.index);\n    const canChallenge=!reviewMode&&typeof window.canChallengeSecondWorldBoss===\"function\"&&window.canChallengeSecondWorldBoss(boss.index);\n    const latestProgress=!reviewMode&&Number(boss.index)===secondWorldLatestProgressBossIndex();\n    const stats=typeof window.secondWorldBossBaseStats===\"function\"?window.secondWorldBossBaseStats(boss.index):null;\n    const status=reviewMode?(killed?\"已完成・可回顧\":\"未完成\"):killed?\"已擊敗\":canChallenge?\"可挑戰\":\"尚未開放\";\n    const statLine=stats?`<div class=\"universe-boss-stats\">HP ${stats.hp.toLocaleString()}　ATK ${stats.atk.toLocaleString()}　DEF ${stats.def.toLocaleString()}</div>`:\"\";\n    const active=window.activeSecondWorldMainlineContext;\n    const activeHere=active?.continuous===true&&Number(active.bossIndex)===Number(boss.index);\n    let action=\"\";\n    if(reviewMode){\n      action=killed&&typeof window.startSecondWorldBossReview===\"function\"?`<div class=\"universe-boss-actions\"><button class=\"btn blue universe-boss-action universe-boss-review-action\" type=\"button\" onclick=\"startSecondWorldBossReview(${boss.index})\">回顧挑戰</button></div>`:`<button class=\"btn universe-boss-action\" type=\"button\" disabled>未完成</button>`;\n    }else if(activeHere)action=`<button class=\"btn danger universe-boss-action\" type=\"button\" onclick=\"requestSecondWorldContinuousStop()\">本場結束後停止</button>`;\n    else{\n      const buttons=[];\n      if(canChallenge&&window.SECOND_WORLD_COMBAT_SETTLEMENT_READY===true&&typeof window.startSecondWorldBossBattle===\"function\"){\n        buttons.push(`<button class=\"btn blue universe-boss-action\" type=\"button\" onclick=\"startSecondWorldBossBattle(${boss.index})\">${killed?\"再次挑戰\":\"挑戰 Boss\"}</button>`);\n        buttons.push(`<button class=\"btn universe-boss-action\" type=\"button\" onclick=\"startSecondWorldBossContinuous(${boss.index})\">連續戰鬥</button>`);\n      }\n      if(latestProgress)buttons.push(`<button class=\"btn universe-boss-action\" type=\"button\" data-universe-contextual-inventory=\"1\" onclick=\"openAdventureInventory()\">背包</button>`);\n      if(buttons.length)action=`<div class=\"universe-boss-actions\">${buttons.join(\"\")}</div>`;\n    }\n    return `<div class=\"map-card universe-boss-card ${killed?\"cleared\":\"\"} ${reviewMode?\"review\":\"\"}\" data-second-world-boss=\"${boss.index}\" aria-label=\"${boss.name} Lv.${boss.level}，${status}\"><b>${boss.name}</b><div class=\"muted\">Lv.${boss.level}</div>${statLine}<div class=\"map-status\">${activeHere?\"連續戰鬥中\":status}</div>${action}</div>`;\n  }\n\n  function secondWorldRegionHtml(region,activeIndex,reviewMode=false){''')
          rep('worldmapui.js','    const visibleBosses=secondWorldVisibleBosses(region);\n','    const visibleBosses=secondWorldVisibleBosses(region,reviewMode);\n')
          rep('worldmapui.js','${visibleBosses.map(secondWorldBossCardHtml).join(\"\")}','${visibleBosses.map(boss=>secondWorldBossCardHtml(boss,reviewMode)).join(\"\")}')
          # Review combat page uses local combat HP and no formal resource/EXP display.
          rep('worldmapui.js', '''    const s=typeof playerCombatStats===\"function\"?playerCombatStats():{hp:1};\n    const progress=typeof window.levelProgressSnapshot===\"function\"?window.levelProgressSnapshot(state):{atCap:false,exp:Number(state.exp)||0,need:1,percent:0};\n    const hpPct=s.hp?Math.max(0,Math.min(100,(Number(state.hp)||0)/s.hp*100)):0;\n''', '''    const s=typeof playerCombatStats===\"function\"?playerCombatStats():{hp:1};\n    const review=ctx?.review===true,playerMax=review?Math.max(1,Number(ctx.reviewPlayerMaxHp)||Number(s.hp)||1):Math.max(1,Number(s.hp)||1),playerShownHp=review?Math.max(0,Number(ctx.reviewPlayerStartHp)||playerMax):Math.max(0,Number(state.hp)||0);\n    const progress=typeof window.levelProgressSnapshot===\"function\"?window.levelProgressSnapshot(state):{atCap:false,exp:Number(state.exp)||0,need:1,percent:0};\n    const hpPct=playerMax?Math.max(0,Math.min(100,playerShownHp/playerMax*100)):0;\n''')
          rep('worldmapui.js','    const head=continuous?`連續戰鬥・第 ${round} 場`:\"單場戰鬥\";\n','    const head=review?\"宇宙紀元・回顧｜單場\":continuous?`連續戰鬥・第 ${round} 場`:\"單場戰鬥\";\n')
          old_player='''       <div class=\"combatant player\" id=\"combatPlayerCard\"><div class=\"combat-damage\" id=\"combatPlayerDamage\"></div><h2>${typeof playerNameHtml===\"function\"?playerNameHtml():\"玩家\"} Lv.${state.level}</h2><div class=\"muted\">暗物質 ${Math.max(0,Math.floor(Number(state.secondWorld?.darkMatter)||0)).toLocaleString()}　暗能量 ${Math.max(0,Math.floor(Number(state.secondWorld?.darkEnergy)||0)).toLocaleString()}</div><div class=\"big-hp\"><div class=\"status-label\"><span>HP</span><span id=\"combatPlayerHp\">${Math.max(0,Math.floor(Number(state.hp)||0))} / ${s.hp}</span></div><div class=\"bar\"><span class=\"hp\" id=\"combatPlayerBar\" style=\"width:${hpPct}%\"></span></div></div><div class=\"xp-block\"><div class=\"status-label\"><span>EXP</span><span>${progress.atCap?\"MAX\":progress.exp+\" / \"+progress.need}</span></div><div class=\"bar\"><span class=\"xp\" style=\"width:${progress.percent}%\"></span></div></div></div>\n'''
          new_player='''       <div class=\"combatant player\" id=\"combatPlayerCard\"><div class=\"combat-damage\" id=\"combatPlayerDamage\"></div><h2>${typeof playerNameHtml===\"function\"?playerNameHtml():\"玩家\"} Lv.${state.level}</h2>${review?'<div class=\"muted\">純回顧挑戰｜無正式收益</div>':`<div class=\"muted\">暗物質 ${Math.max(0,Math.floor(Number(state.secondWorld?.darkMatter)||0)).toLocaleString()}　暗能量 ${Math.max(0,Math.floor(Number(state.secondWorld?.darkEnergy)||0)).toLocaleString()}</div>`}<div class=\"big-hp\"><div class=\"status-label\"><span>HP</span><span id=\"combatPlayerHp\">${Math.max(0,Math.floor(playerShownHp))} / ${Math.max(1,Math.floor(playerMax))}</span></div><div class=\"bar\"><span class=\"hp\" id=\"combatPlayerBar\" style=\"width:${hpPct}%\"></span></div></div>${review?\"\":`<div class=\"xp-block\"><div class=\"status-label\"><span>EXP</span><span>${progress.atCap?\"MAX\":progress.exp+\" / \"+progress.need}</span></div><div class=\"bar\"><span class=\"xp\" style=\"width:${progress.percent}%\"></span></div></div>`}</div>\n'''
          rep('worldmapui.js',old_player,new_player)
          # Adventure page mode owns review semantics directly; no DOM post-processing.
          rep('worldmapui.js', '''    syncSecondWorldRegionOpenState();\n    const activeIndex=secondWorldActiveRegionIndex();\n    const visible=regions.filter(secondWorldRegionVisible);\n    if(window.getAdventureEraView?.()===\"galaxy-review\")return galaxyReviewAdventureHtml();\n    return `<section class=\"map-screen universe-adventure-screen\"><div class=\"page-top\"><button class=\"btn back-btn\" onclick=\"go('home')\">← 返回主頁</button><h2 class=\"page-title\">冒險</h2><span></span></div>${adventureEraTabsHtml()}<div class=\"notice universe-adventure-notice\"><b>宇宙主線戰線</b><div class=\"muted\" style=\"margin-top:6px\">宇宙主線正式開放：擊敗 Boss 可獲得 EXP、暗物質、暗能量與 1 件專屬裝備。</div></div><div class=\"world-region-list universe-region-list\">${visible.map(region=>secondWorldRegionHtml(region,activeIndex)).join(\"\")}</div></section>`;\n''', '''    syncSecondWorldRegionOpenState();\n    const activeIndex=secondWorldActiveRegionIndex(),era=window.getAdventureEraView?.();\n    if(era===\"galaxy-review\")return galaxyReviewAdventureHtml();\n    const reviewMode=currentAdventureWorldPhase()===3&&era===\"universe-review\";\n    const visible=reviewMode?regions:regions.filter(secondWorldRegionVisible);\n    const notice=reviewMode?'<div class=\"notice universe-adventure-notice\"><b>宇宙紀元・回顧</b><div class=\"muted\" style=\"margin-top:6px\">第二紀元已完成的 10 大區、100 名主線 Boss 均可進行單場回顧。回顧戰為純挑戰，不影響目前正式進度。</div></div>':'<div class=\"notice universe-adventure-notice\"><b>宇宙主線戰線</b><div class=\"muted\" style=\"margin-top:6px\">宇宙主線正式開放：擊敗 Boss 可獲得 EXP、暗物質、暗能量與 1 件專屬裝備。</div></div>';\n    return `<section class=\"map-screen universe-adventure-screen ${reviewMode?\"universe-review-adventure-screen\":\"\"}\"><div class=\"page-top\"><button class=\"btn back-btn\" onclick=\"go('home')\">← 返回主頁</button><h2 class=\"page-title\">冒險</h2><span></span></div>${adventureEraTabsHtml()}${notice}<div class=\"world-region-list universe-region-list\">${visible.map(region=>secondWorldRegionHtml(region,activeIndex,reviewMode)).join(\"\")}</div></section>`;\n''')
          rep('worldmapui.js','  window.SECOND_WORLD_ADVENTURE_REVIEW_VIEW_VERSION=4;\n','  window.SECOND_WORLD_ADVENTURE_REVIEW_VIEW_VERSION=5;\n  window.SECOND_WORLD_UNIVERSE_REVIEW_CARD_MODE_VERSION=1;\n')

          # playersemanticsui.js: retire the old DOM-disabling universe review behavior; worldmap owns it now.
          rep('playersemanticsui.js',' const VERSION=10;\n',' const VERSION=11;\n')
          sub('playersemanticsui.js',r' function applyThirdWorldUniverseReviewSemantics\(\)\{.*?\n \}\n function apply\(\)\{', ''' function applyThirdWorldUniverseReviewSemantics(){\n  if(typeof document===\"undefined\"||phase()!==3||window.getAdventureEraView?.()!==\"universe-review\")return false;\n  return !!document.querySelector(\".universe-review-adventure-screen\");\n }\n function apply(){''')
          rep('playersemanticsui.js',' window.THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION=1;\n',' window.THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION=2;\n')

          # thirdworld integrity extension also guards the cross-era W2 review owners.
          rep('thirdworldintegritycontract.js',' const VERSION=28;\n',' const VERSION=29;\n')
          rep('thirdworldintegritycontract.js','  PLAYER_SEMANTICS_UI_VERSION:10,PLAYER_SEMANTICS_WORLD_PHASE_VERSION:3,PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION:2,PLAYER_ADVENTURE_ERA_VIEW_ROUTING_VERSION:1,CHARACTER_WORLD_PHASE_SEMANTICS_VERSION:2,THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION:1,\n','  PLAYER_SEMANTICS_UI_VERSION:11,PLAYER_SEMANTICS_WORLD_PHASE_VERSION:3,PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION:2,PLAYER_ADVENTURE_ERA_VIEW_ROUTING_VERSION:1,CHARACTER_WORLD_PHASE_SEMANTICS_VERSION:2,THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION:2,\n  SECOND_WORLD_COMBAT_VERSION:2,SECOND_WORLD_COMBAT_REVIEW_POLICY_VERSION:1,SECOND_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION:1,SECOND_WORLD_MAINLINE_VERSION:9,SECOND_WORLD_MAINLINE_REVIEW_FLOW_VERSION:1,SECOND_WORLD_MAINLINE_REVIEW_STATE_ISOLATION_VERSION:1,SECOND_WORLD_ADVENTURE_REVIEW_VIEW_VERSION:5,SECOND_WORLD_UNIVERSE_REVIEW_CARD_MODE_VERSION:1,\n')
          rep('thirdworldintegritycontract.js','\"getAdventureEraView\",\"setAdventureEraView\",\"adventureEraTabsHtml\",\"adventureEraViewLocked\",\"setAdventureReviewBattleActive\",\"isAdventureReviewBattleActive\",\"thirdWorldAdventurePageHtml\"','\"getAdventureEraView\",\"setAdventureEraView\",\"adventureEraTabsHtml\",\"adventureEraViewLocked\",\"setAdventureReviewBattleActive\",\"isAdventureReviewBattleActive\",\"canRunSecondWorldBossReview\",\"startSecondWorldBossReview\",\"thirdWorldAdventurePageHtml\"')

          # tests/runtime/js-integrity.js: static owner/review-mode/no-DOM-disable assertions + updated cache-busts.
          p=Path('tests/runtime/js-integrity.js'); t=p.read_text(encoding='utf-8')
          anchor='assert(/SECOND_WORLD_CIVILIZATION_COMBAT_VERSION=2/.test(secondWorldCombat),"secondworldcombat.js 宇宙文明戰鬥 owner 應為 V2。\\");\n'
          if t.count(anchor)!=1: raise SystemExit('js-integrity combat anchor mismatch')
          t=t.replace(anchor,anchor+'assert(/const VERSION=2;/.test(secondWorldCombat)&&/SECOND_WORLD_COMBAT_REVIEW_POLICY_VERSION=REVIEW_POLICY_VERSION/.test(secondWorldCombat)&&/SECOND_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION=REVIEW_STATE_ISOLATION_VERSION/.test(secondWorldCombat)&&/canRunSecondWorldBossReview=canRunSecondWorldBossReview/.test(secondWorldCombat)&&/settlementReady:reviewMode\\?false:SETTLEMENT_READY/.test(secondWorldCombat),"宇宙主線 Combat 必須提供 explicit review mode，並強制 review 不具正式 settlement 資格。\\");\nassert(/const VERSION=9;/.test(secondWorldMainline)&&/SECOND_WORLD_MAINLINE_REVIEW_FLOW_VERSION=REVIEW_FLOW_VERSION/.test(secondWorldMainline)&&/startSecondWorldBossReview=function/.test(secondWorldMainline)&&/runSecondWorldBossCombat\\(index,\\{review:true/.test(secondWorldMainline)&&!/beginSecondWorldOfflineBattleSample[\\s\\S]{0,700}runSecondWorldBossCombat\\(index,\\{review:true/.test(secondWorldMainline),"宇宙回顧必須走獨立單場 review flow，共用 Combat/presentation 但不得建立 Offline sample。\\");\n')
          anchor2='assert(/SECOND_WORLD_ADVENTURE_UI_VERSION=5/.test(worldmap),"worldmapui.js 宇宙冒險 UI 應為 V5。\\");\n'
          if t.count(anchor2)!=1: raise SystemExit('js-integrity worldmap anchor mismatch')
          t=t.replace(anchor2,anchor2+'assert(/SECOND_WORLD_ADVENTURE_REVIEW_VIEW_VERSION=5/.test(worldmap)&&/SECOND_WORLD_UNIVERSE_REVIEW_CARD_MODE_VERSION=1/.test(worldmap)&&/secondWorldBossCardHtml\\(boss,reviewMode=false\\)/.test(worldmap)&&/startSecondWorldBossReview/.test(worldmap)&&/reviewMode\\?regions:regions\\.filter/.test(worldmap),"宇宙紀元回顧必須共用原 Boss 卡／區域 renderer，並在 W3 歷史視圖呈現完整 100 Boss。\\");\n')
          anchor3='assert(/PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION=2/.test(playerSemanticsUi)&&/PLAYER_ADVENTURE_ERA_VIEW_ROUTING_VERSION=1/.test(playerSemanticsUi)&&/getAdventureEraView/.test(playerSemanticsUi)&&/universe-review/.test(playerSemanticsUi),"高維冒險 routing 必須委派共用 era view owner。\\");\n'
          if t.count(anchor3)!=1: raise SystemExit('js-integrity semantics anchor mismatch')
          t=t.replace(anchor3,anchor3+'assert(/THIRD_WORLD_UNIVERSE_REVIEW_SEMANTICS_VERSION=2/.test(playerSemanticsUi)&&!/正式挑戰已結束/.test(playerSemanticsUi)&&!/querySelectorAll\\(\"\\.universe-boss-action\"\\)/.test(playerSemanticsUi),"宇宙回顧 action 必須由 worldmap 正式 owner 直接渲染，不得再由 player semantics DOM 後處理禁用。\\");\n')
          for old,new in [
            ('secondworldcombat.js?v=20260926-thirdworld-entry-batch2-3','secondworldcombat.js?v=20260928-thirdworld-batch11-3'),
            ('secondworldmainline.js?v=20260925-vip-loot-cleanup1','secondworldmainline.js?v=20260928-thirdworld-batch11-3'),
            ('worldmapui.js?v=20260928-thirdworld-batch11-2','worldmapui.js?v=20260928-thirdworld-batch11-3'),
            ('playersemanticsui.js?v=20260928-thirdworld-batch11-1','playersemanticsui.js?v=20260928-thirdworld-batch11-3'),
            ('thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-2','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-3')]: t=t.replace(old,new)
          p.write_text(t,encoding='utf-8')

          # index cache-busts.
          for path,old,new in [
            ('index.html','secondworldcombat.js?v=20260926-thirdworld-entry-batch2-3','secondworldcombat.js?v=20260928-thirdworld-batch11-3'),
            ('index.html','secondworldmainline.js?v=20260925-vip-loot-cleanup1','secondworldmainline.js?v=20260928-thirdworld-batch11-3'),
            ('index.html','worldmapui.js?v=20260928-thirdworld-batch11-2','worldmapui.js?v=20260928-thirdworld-batch11-3'),
            ('index.html','playersemanticsui.js?v=20260928-thirdworld-batch11-1','playersemanticsui.js?v=20260928-thirdworld-batch11-3'),
            ('index.html','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-2','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-3')]: rep(path,old,new)
      - name: Syntax and integrity self-check
        shell: bash
        run: |
          set -euo pipefail
          node --check secondworldcombat.js
          node --check secondworldmainline.js
          node --check worldmapui.js
          node --check playersemanticsui.js
          node --check thirdworldintegritycontract.js
          node tests/runtime/js-integrity.js
          git diff --check
      - name: Commit batch 11-3 to main and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondworldcombat.js secondworldmainline.js worldmapui.js playersemanticsui.js thirdworldintegritycontract.js tests/runtime/js-integrity.js index.html
          git rm .github/workflows/batch11-3-runner.yml
          git commit -m 'Implement universe boss review battles'
          git push origin HEAD:main
