name: One-time Story Batch 4 Index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/story-batch4-index-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time story batch 4 index patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire story.css and exact cache tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='<link rel="stylesheet" href="cloudsave.css?v=20260916-cloud-save-batch1"></head>'
          replacement='<link rel="stylesheet" href="cloudsave.css?v=20260916-cloud-save-batch1"><link rel="stylesheet" href="story.css?v=20260917-story-batch4"></head>'
          if anchor not in s: raise SystemExit('head anchor missing')
          s=s.replace(anchor,replacement,1)
          pairs={
            'storyui.js?v=20260917-story-clean1':'storyui.js?v=20260917-story-batch4',
            'storyprogress.js?v=20260917-story-batch3':'storyprogress.js?v=20260917-story-batch4',
            'storyrecordtabs.js?v=20260917-story-batch3':'storyrecordtabs.js?v=20260917-story-batch4',
            'storyruntimeintegrity.js?v=20260917-story-batch3':'storyruntimeintegrity.js?v=20260917-story-batch4'
          }
          for old,new in pairs.items():
            if s.count(old)!=1: raise SystemExit(f'expected exactly one token: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit index wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire story batch 4 assets'
          git push origin main
