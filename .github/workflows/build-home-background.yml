name: Build home background

on:
  push:
    paths:
      - '.github/workflows/build-home-background.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert source PNG to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('assets/backgrounds-source/home/desktop.png')
          dst = Path('assets/backgrounds/home/desktop.webp')
          dst.parent.mkdir(parents=True, exist_ok=True)

          im = Image.open(src).convert('RGB')
          max_w = 1536
          if im.width > max_w:
              h = round(im.height * max_w / im.width)
              im = im.resize((max_w, h), Image.Resampling.LANCZOS)
          im.save(dst, 'WEBP', quality=72, method=6)
          print(src, im.size, '->', dst, dst.stat().st_size, 'bytes')
          PY
      - name: Commit optimized background
        run: |
          if [ -z "$(git status --porcelain -- assets/backgrounds/home/desktop.webp)" ]; then
            echo 'No background change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/backgrounds/home/desktop.webp
          git commit -m 'Build optimized home desktop background'
          git push
