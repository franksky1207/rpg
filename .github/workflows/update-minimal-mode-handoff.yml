name: Update minimal mode handoff

on:
  push:
    paths:
      - '.github/workflows/update-minimal-mode-handoff.yml'

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PROJECT_HANDOFF.md
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('PROJECT_HANDOFF.md')
          text=p.read_text(encoding='utf-8')

          if '## 3.7 主線極簡模式' not in text:
              anchor='- `MAIN_BOSS_CONTINUOUS_VERSION = 1`。\n\n---\n\n# 4. 裝備、掉落、VIP、專精、強化'
              block='''- `MAIN_BOSS_CONTINUOUS_VERSION = 1`。\n\n## 3.7 主線極簡模式\n\n- 正式名稱：**極簡模式**；定位是主線連續戰鬥的顯示模式，不是省電保證。\n- 正式檔案：`mainminimalmode.js`、`mainminimalmode.css`、`mainminimalmodeintegrity.js`；詳細維護規格另見 `MINIMAL_MODE.md`。\n- 只在主線**連續戰鬥**顯示入口；單場不顯示。\n- overlay 掛在 `body`，不建立第二套戰鬥、計時、結算、劇情或 state owner。\n- `battlepipeline.js` 正式呼叫 `mainMinimalModeEnsureCombatHeader()` 與 `mainMinimalModeHandleBattleResult()`；`specialencounter.js` 在特殊遭遇失敗結算後呼叫 `mainMinimalModeHandleSpecialResult()`。\n- 極簡模式不 wrapper `adventureCombatPage()`／`showBattleResult()`，也不以 `MutationObserver` 監看結算 modal。\n- 畫面狀態：`running`＝戰鬥持續進行中；`stopped`＝戰鬥已停止／滑動查看戰鬥結果；`story`＝戰鬥已完成／有新的劇情等待查看／滑動繼續。\n- 背景政策固定為 `follow-gm-background-setting`：極簡模式本身不呼叫 `backgroundProgressStart()`／`backgroundProgressStop()`，背景時間補償仍由 `backgroundprogress.js` 與 GM「背景戰鬥」開關決定。\n- `MAIN_MINIMAL_MODE_HOOK_VERSION = 2`；`MAIN_MINIMAL_MODE_BACKGROUND_POLICY_VERSION = 1`；`MAIN_MINIMAL_MODE_INTEGRITY_VERSION = 2`。\n- 舊 `mainpowersave.js`／`mainpowersave.css` 與 `PowerSave`／`power-save` runtime 命名已退休，不得恢復。\n\n---\n\n# 4. 裝備、掉落、VIP、專精、強化'''
              if anchor not in text:
                  raise SystemExit('section 3.6 anchor not found')
              text=text.replace(anchor,block,1)

          if '`mainminimalmodeintegrity.js`：主線極簡模式 hook／背景政策／舊 PowerSave API 退休。' not in text:
              anchor='5. `bosscontinuousintegrity.js`：Boss 單場／連戰、鎖王、背景推進、離線排除等。\n6. `accountcloudintegrity.js`：Auth／Cloud Save／舊 JSON API 退休。'
              repl='5. `bosscontinuousintegrity.js`：Boss 單場／連戰、鎖王、背景推進、離線排除等。\n6. `mainminimalmodeintegrity.js`：主線極簡模式 hook／背景政策／舊 PowerSave API 退休。\n7. `accountcloudintegrity.js`：Auth／Cloud Save／舊 JSON API 退休。'
              if anchor in text:
                  text=text.replace(anchor,repl,1)
                  text=text.replace('7. `runtimeintegrity.js`：專案主 runtime 檢查。\n8. `mirrorfinalintegrity.js`', '8. `runtimeintegrity.js`：專案主 runtime 檢查。\n9. `mirrorfinalintegrity.js`',1)
                  text=text.replace('9. `storymigration.js`\n10. `storyprogress.js`\n11. `storyrecordtabs.js`\n12. `storyruntimeintegrity.js`：故事最終 runtime 行為檢查。\n13. `backgroundpreload.js` 最後處理正式背景 reveal。', '10. `storymigration.js`\n11. `storyprogress.js`\n12. `storyrecordtabs.js`\n13. `storyruntimeintegrity.js`：故事最終 runtime 行為檢查。\n14. `backgroundpreload.js` 最後處理正式背景 reveal。',1)

          retired='- `mainpowersave.js`／`mainpowersave.css` 舊省電模式命名與 `PowerSave`／`power-save` runtime API／selector。\n'
          if retired not in text:
              anchor='- `BACKGROUND_PROGRESS_MAIN_BOSS_EXCLUDED_VERSION`。\n'
              if anchor not in text:
                  raise SystemExit('retired anchor not found')
              text=text.replace(anchor,anchor+retired,1)

          for item in ['- `MINIMAL_MODE.md`\n','- `mainminimalmode.js`\n','- `mainminimalmode.css`\n','- `mainminimalmodeintegrity.js`\n']:
              if item not in text:
                  anchor='- `battlepipeline.js`\n'
                  if anchor not in text:
                      raise SystemExit('source list anchor not found')
                  text=text.replace(anchor,anchor+item,1)

          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit handoff update
        shell: bash
        run: |
          if git diff --quiet -- PROJECT_HANDOFF.md; then
            echo 'No handoff changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_HANDOFF.md
          git commit -m 'docs: formalize minimal mode handoff'
          git push
