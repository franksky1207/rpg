name: Batch 12-O4 Apply
on:
  push:
    paths:
      - '.github/workflows/batch12-o4-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python3 batch12_o4_patch.py
      - name: Self-check
        run: |
          set -euo pipefail
          node --check thirdworlddata.js
          node --check thirdworldintegritycontract.js
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
          node tests/runtime/js-integrity.js
          git diff --check
          ! grep -n 'pp`' thirdworlddata.js
          grep -q 'THIRD_WORLD_BOSS_SPECIALIZATION_PRESENTATION_VERSION = 2' PROJECT_HANDOFF.md
          grep -q '第 12-O4' PROJECT_HANDOFF.md
          grep -q 'thirdworlddata.js?v=20260928-thirdworld-batch12-o4' index.html
          grep -q 'thirdworldintegritycontract.js?v=20260928-thirdworld-batch12-o4' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thirdworlddata.js thirdworldintegritycontract.js tests/runtime/js-integrity.js index.html PROJECT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Close batch 12 optimization and refresh handoff'
          git push origin HEAD:main
