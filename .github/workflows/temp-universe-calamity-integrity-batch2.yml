name: Temporary Universe Calamity Integrity Batch2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-universe-calamity-integrity-batch2.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add permanent universe calamity background integrity probes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p=Path('tests/runtime/js-integrity.js')
          s=p.read_text()

          read_anchor='''const secondWorldCalamityIntegrity=read("secondworldcalamityintegrity.js");\n'''
          read_insert='''const secondWorldCalamityIntegrity=read("secondworldcalamityintegrity.js");\nconst secondWorldCalamityRun=read("secondworldcalamityrun.js");\nconst secondWorldCalamityUi=read("secondworldcalamityui.js");\n'''
          assert s.count(read_anchor)==1,s.count(read_anchor)
          s=s.replace(read_anchor,read_insert,1)

          anchor='''assert(/PLAYER_TITLE_CATALOG_VERSION=3/.test(titleCore),"playertitlecore.js 正式稱號 catalog 應為 V3。");\n\n'''
          probes='''assert(/PLAYER_TITLE_CATALOG_VERSION=3/.test(titleCore),"playertitlecore.js 正式稱號 catalog 應為 V3。");\n\nassert(/const CONTINUOUS_VERSION=2;/.test(secondWorldCalamityRun),"宇宙災厄連續討伐版本應為 V2。");\nassert(/SECOND_WORLD_CALAMITY_BACKGROUND_VERSION=1/.test(secondWorldCalamityRun)&&/SECOND_WORLD_CALAMITY_FAST_CATCH_UP_POLICY_VERSION=1/.test(secondWorldCalamityRun),"宇宙災厄必須宣告背景戰鬥與 fast catch-up owner 版本。");\nassert(/backgroundProgressStart\\(\"calamity\",\\{mode:\"continuous\"\\}\\)/.test(secondWorldCalamityRun)&&/backgroundProgressStop\\(\"calamity\"\\)/.test(secondWorldCalamityRun),"宇宙災厄連續討伐必須共用 calamity 背景 start/stop owner。");\nassert(/backgroundProgressFastCatchUpActive\\(\"calamity\"\\)/.test(secondWorldCalamityRun)&&/backgroundProgressCatchUpPolicy\\(\"calamity\",next,false\\)/.test(secondWorldCalamityRun),"宇宙災厄連續討伐必須接上 fast catch-up policy。");\nassert(/startBackground\\(\\);[\\s\\S]*const previewPolicy=catchUpPreviewPolicy\\(\\);/.test(secondWorldCalamityRun),"宇宙災厄 continuous 必須先啟動背景 flow，再套用 catch-up policy。");\nassert(/save:fast\\?previewPolicy\\?\\.shouldCheckpoint===true:options\\.save/.test(secondWorldCalamityRun)&&/preparePresentation:fast\\?previewPolicy\\?\\.shouldPresentBattle===true:options\\.preparePresentation/.test(secondWorldCalamityRun),"宇宙災厄 fast catch-up 必須降低存檔與演出頻率。");\nassert(/if\\(activeRun\\.mode===\"continuous\"&&backgroundEnabled\\(\\)\\)return;/.test(secondWorldCalamityRun)&&/addEventListener\\(\"pagehide\",stopForPageHide\\)/.test(secondWorldCalamityRun),"宇宙災厄 pagehide 必須在背景戰鬥開啟時保留連續討伐。");\nassert(/backgroundProgressSleep\\(ms,\"calamity\"\\)/.test(secondWorldCalamityUi)&&/backgroundProgressCatchUpStep\\(\"calamity\"\\)/.test(secondWorldCalamityUi)&&/backgroundProgressConsumeCatchUpCredit\\(delay,\"calamity\"\\)/.test(secondWorldCalamityUi),"宇宙災厄 UI 必須共用 calamity 背景 sleep、catch-up step 與 credit。");\nassert(/backgroundProgressCatchUpFinalPolicy\\(\"calamity\"\\)/.test(secondWorldCalamityUi)&&/combatOuterGapMs\\(\"calamity\",\"battle\"\\)/.test(secondWorldCalamityUi),"宇宙災厄 UI 必須在追趕完成後收斂並維持正式場間節奏。");\nassert(index.includes('src="secondworldcalamityrun.js?v=20260924-universe-background-batch1"')&&index.includes('src="secondworldcalamityui.js?v=20260924-universe-background-batch1"'),"index.html 必須載入宇宙災厄背景戰鬥 Batch1 cache-bust。");\n\n'''
          assert s.count(anchor)==1,s.count(anchor)
          s=s.replace(anchor,probes,1)
          p.write_text(s)
          PY
          node --check tests/runtime/js-integrity.js
          node tests/runtime/js-integrity.js
          rm .github/workflows/temp-universe-calamity-integrity-batch2.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add tests/runtime/js-integrity.js .github/workflows/temp-universe-calamity-integrity-batch2.yml
          git commit -m "Lock universe calamity background battle integrity"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
