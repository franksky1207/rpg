name: Build dungeon arena backgrounds

on:
  push:
    paths:
      - '.github/workflows/build-dungeon-arena-backgrounds.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert and wire dungeon arena backgrounds
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          jobs=[
              ('assets/backgrounds-source/dungeon-arena/desktop.png','assets/backgrounds/dungeon-arena/desktop.webp',1536),
              ('assets/backgrounds-source/dungeon-arena/mobile.png','assets/backgrounds/dungeon-arena/mobile.webp',1080),
          ]
          for src_s,dst_s,max_w in jobs:
              src=Path(src_s); dst=Path(dst_s)
              if not src.exists():
                  raise SystemExit(f'missing source: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              im=Image.open(src).convert('RGB')
              if im.width>max_w:
                  h=round(im.height*max_w/im.width)
                  im=im.resize((max_w,h),Image.Resampling.LANCZOS)
              im.save(dst,'WEBP',quality=72,method=6)
              print(src,im.size,'->',dst,dst.stat().st_size,'bytes')

          css=Path('backgrounds.css')
          s=css.read_text()
          marker='/* dungeon-arena background v1 */'
          if marker not in s:
              s += '''\n\n/* dungeon-arena background v1 */\n@media (min-width:761px){\n  #main>.function-page.dungeon-page-shell.arena-shell{\n    width:100vw;\n    max-width:none;\n    min-height:calc(100vh - 57px);\n    min-height:calc(100dvh - 57px);\n    margin-top:-18px;\n    margin-bottom:-40px;\n    margin-left:calc(50% - 50vw);\n    margin-right:calc(50% - 50vw);\n    padding-top:36px;\n    padding-right:max(24px,calc((100vw - 1200px)/2 + 18px));\n    padding-bottom:64px;\n    padding-left:max(24px,calc((100vw - 1200px)/2 + 18px));\n    background-image:\n      linear-gradient(180deg,rgba(6,10,17,.24),rgba(8,9,15,.50)),\n      url("assets/backgrounds/dungeon-arena/desktop.webp?v=20260914-dungeon-arena-desktop1");\n    background-position:center center,center center;\n    background-size:cover,cover;\n    background-repeat:no-repeat,no-repeat;\n  }\n  #main>.function-page.dungeon-page-shell.arena-shell>.back-home,\n  #main>.function-page.dungeon-page-shell.arena-shell>.arena-panel{\n    max-width:1020px;\n    margin-left:auto;\n    margin-right:auto;\n  }\n  #main>.function-page.dungeon-page-shell.arena-shell>.arena-panel{\n    background:linear-gradient(180deg,rgba(40,34,24,.64),rgba(20,19,17,.74));\n    backdrop-filter:blur(3px);\n    -webkit-backdrop-filter:blur(3px);\n  }\n}\n\n@media (max-width:760px){\n  #main>.function-page.dungeon-page-shell.arena-shell{\n    width:100vw;\n    max-width:none;\n    min-height:calc(100vh - 52px);\n    min-height:calc(100dvh - 52px);\n    margin-top:-10px;\n    margin-bottom:-24px;\n    margin-left:calc(50% - 50vw);\n    margin-right:calc(50% - 50vw);\n    padding-top:20px;\n    padding-right:12px;\n    padding-bottom:28px;\n    padding-left:12px;\n    background-image:\n      linear-gradient(180deg,rgba(6,10,17,.24),rgba(8,9,15,.52)),\n      url("assets/backgrounds/dungeon-arena/mobile.webp?v=20260914-dungeon-arena-mobile1");\n    background-position:center center,center center;\n    background-size:cover,cover;\n    background-repeat:no-repeat,no-repeat;\n  }\n  #main>.function-page.dungeon-page-shell.arena-shell>.arena-panel{\n    background:linear-gradient(180deg,rgba(40,34,24,.72),rgba(20,19,17,.80));\n    backdrop-filter:blur(2px);\n    -webkit-backdrop-filter:blur(2px);\n  }\n}\n'''
              css.write_text(s)

          polish=Path('dungeondesktoppolish.css')
          p=polish.read_text()
          old='''  /* Arena: use desktop width better while keeping the existing hierarchy. */\n  #main .arena-shell{\n    max-width:1100px;\n    margin-left:auto;\n    margin-right:auto;\n  }\n'''
          new='''  /* Arena: background/layout is now owned by backgrounds.css; keep panel sizing here. */\n'''
          if old not in p:
              raise SystemExit('unexpected arena desktop shell block')
          polish.write_text(p.replace(old,new,1))

          idx=Path('index.html')
          t=idx.read_text()
          t=t.replace('backgrounds.css?v=20260913-dungeon-bounty-battle1','backgrounds.css?v=20260914-dungeon-arena1',1)
          t=t.replace('dungeondesktoppolish.css?v=20260913-dungeon-desktop5','dungeondesktoppolish.css?v=20260914-dungeon-desktop6',1)
          idx.write_text(t)
          PY
      - name: Commit optimized backgrounds and wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/backgrounds/dungeon-arena/desktop.webp assets/backgrounds/dungeon-arena/mobile.webp
          git add backgrounds.css dungeondesktoppolish.css index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add dungeon arena backgrounds'
          git push
