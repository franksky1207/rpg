name: Region 5 Cache Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/region5-cache-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump region 5 story cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='storydata-universe-trans-domain-frontier.js?v=20260923-universe-story-batch3'
          new='storydata-universe-trans-domain-frontier.js?v=20260923-universe-region5-dialogue1'
          if text.count(old)!=1:
              raise SystemExit(f'expected one cache target, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit cache update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bump cache for universe region 5 stories"
          git push origin main
