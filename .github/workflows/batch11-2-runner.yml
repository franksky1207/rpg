name: One-time Batch 11-2 Higher-Dimensional Review

on:
  push:
    paths:
      - '.github/workflows/batch11-2-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply batch 11-2 review patch
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); c=text.count(old)
              if c!=1: raise SystemExit(f'{path}: expected one match, found {c}: {old[:100]!r}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          # --- thirdworldcombat.js ---
          rep('thirdworldcombat.js',' const VERSION=5;\n const SNAPSHOT_VERSION=1;',' const VERSION=6;\n const SNAPSHOT_VERSION=2;\n const REVIEW_POLICY_VERSION=1;\n const REVIEW_STATE_ISOLATION_VERSION=1;')
          rep('thirdworldcombat.js', '''  const target=targetState(options);\n  const progress=target&&typeof window.thirdWorldBossProgressSnapshot===\"function\"?window.thirdWorldBossProgressSnapshot(index,target):null;\n  const allowOverride=options.ignoreUnlock===true;\n  const storedHp=progress?finiteWhole(progress.currentHp,boss.maxHp):finiteWhole(boss.maxHp,1);\n  const requestedHp=allowOverride&&options.formalStartHp!=null?finiteWhole(options.formalStartHp,storedHp):storedHp;\n  const formalStartHp=Math.max(0,Math.min(finiteWhole(boss.maxHp,1),requestedHp));\n  if(formalStartHp<=0)return null;\n  const stats=window.thirdWorldBossStats(index,formalStartHp);\n  const abilities=window.thirdWorldBossAbilities(index,formalStartHp);\n''', '''  const target=targetState(options);\n  const progress=target&&typeof window.thirdWorldBossProgressSnapshot===\"function\"?window.thirdWorldBossProgressSnapshot(index,target):null;\n  const reviewMode=options.review===true;\n  const bossMaxHp=Math.max(1,finiteWhole(boss.maxHp,1));\n  if(reviewMode&&progress?.defeated!==true)return null;\n  const allowOverride=!reviewMode&&options.ignoreUnlock===true;\n  const storedHp=progress?finiteWhole(progress.currentHp,bossMaxHp):bossMaxHp;\n  const requestedHp=allowOverride&&options.formalStartHp!=null?finiteWhole(options.formalStartHp,storedHp):storedHp;\n  const formalStartHp=reviewMode?0:Math.max(0,Math.min(bossMaxHp,requestedHp));\n  if(!reviewMode&&formalStartHp<=0)return null;\n  const stageBasisHp=reviewMode?Math.max(1,Math.floor(bossMaxHp*.1)):formalStartHp;\n  const enemyStartHp=reviewMode?bossMaxHp:formalStartHp;\n  const stats=window.thirdWorldBossStats(index,stageBasisHp);\n  const abilities=window.thirdWorldBossAbilities(index,stageBasisHp);\n''')
          rep('thirdworldcombat.js', '''   bossMaxHp:enemy.hp,\n   formalStartHp,\n   enemyHealCap:formalStartHp,\n   stage,\n''', '''   bossMaxHp:enemy.hp,\n   formalStartHp,\n   enemyStartHp,\n   enemyHealCap:enemyStartHp,\n   stageBasisHp,\n   reviewMode,\n   stage,\n''')
          rep('thirdworldcombat.js', '''  const target=targetState(options);\n  const snapshot=createThirdWorldBossCombatSnapshot(value,options);\n  if(!snapshot)return Object.freeze({ok:false,world:3,reason:\"找不到可戰鬥的高維 Boss，或該 Boss 已被擊破。\"});\n  if(options.ignoreUnlock!==true){\n''', '''  const target=targetState(options);\n  const reviewMode=options.review===true;\n  const snapshot=createThirdWorldBossCombatSnapshot(value,options);\n  if(!snapshot)return Object.freeze({ok:false,world:3,review:reviewMode,reason:reviewMode?\"只有已擊破的高維 Boss 可以進行回顧。\":\"找不到可戰鬥的高維 Boss，或該 Boss 已被擊破。\"});\n  if(!reviewMode&&options.ignoreUnlock!==true){\n''')
          rep('thirdworldcombat.js', '''  const playerMaxHp=Math.max(1,numberOr(player.hp,1));\n  const startHp=options.startHp==null?Math.max(0,numberOr(target?.hp,playerMaxHp)):Math.max(0,numberOr(options.startHp,playerMaxHp));\n''', '''  const playerMaxHp=Math.max(1,numberOr(player.hp,1));\n  const startHp=options.startHp==null?(reviewMode?playerMaxHp:Math.max(0,numberOr(target?.hp,playerMaxHp))):Math.max(0,numberOr(options.startHp,playerMaxHp));\n''')
          rep('thirdworldcombat.js','   enemyStartHp:snapshot.formalStartHp,\n','   enemyStartHp:snapshot.enemyStartHp,\n')
          rep('thirdworldcombat.js','  const combatEndHp=Math.max(0,Math.min(snapshot.formalStartHp,finiteWhole(combat.enemyHp,snapshot.formalStartHp)));\n','  const combatEndHp=Math.max(0,Math.min(snapshot.enemyStartHp,finiteWhole(combat.enemyHp,snapshot.enemyStartHp)));\n')
          rep('thirdworldcombat.js', '''  const formalRun=options.ignoreUnlock!==true;\n  const challengeAllowedAtStart=snapshot.challengeStatus?.allowed===true;\n  const settlementBasis=createSettlementBasis({\n   bossIndex:snapshot.bossIndex,\n   bossId:snapshot.bossId,\n   formalStartHp:snapshot.formalStartHp,\n   combatEndHp,\n''', '''  const formalRun=!reviewMode&&options.ignoreUnlock!==true;\n  const challengeAllowedAtStart=!reviewMode&&snapshot.challengeStatus?.allowed===true;\n  const settlementBasis=createSettlementBasis({\n   bossIndex:snapshot.bossIndex,\n   bossId:snapshot.bossId,\n   formalStartHp:reviewMode?0:snapshot.formalStartHp,\n   combatEndHp:reviewMode?0:combatEndHp,\n''')
          rep('thirdworldcombat.js', '''   ok:true,\n   world:3,\n   headless:!presentationRequested,\n''', '''   ok:true,\n   world:3,\n   review:reviewMode,\n   headless:!presentationRequested,\n''')
          rep('thirdworldcombat.js', '''   bossName:snapshot.bossName,\n   formalStartHp:settlementBasis.formalStartHp,\n   combatEndHp:settlementBasis.combatEndHp,\n   effectiveDamagePreview:settlementBasis.effectivePermanentDamage,\n   effectivePermanentDamage:settlementBasis.effectivePermanentDamage,\n''', '''   bossName:snapshot.bossName,\n   formalStartHp:settlementBasis.formalStartHp,\n   enemyStartHp:snapshot.enemyStartHp,\n   combatEndHp:reviewMode?combatEndHp:settlementBasis.combatEndHp,\n   effectiveDamagePreview:reviewMode?0:settlementBasis.effectivePermanentDamage,\n   effectivePermanentDamage:reviewMode?0:settlementBasis.effectivePermanentDamage,\n''')
          rep('thirdworldcombat.js', '''   const partial=createThirdWorldBossCombatSnapshot(7,{ignoreUnlock:true,formalStartHp:Math.floor(max*.55)});\n   if(!partial||partial.enemyHealCap!==partial.formalStartHp||partial.enemyHealCap>=partial.bossMaxHp)fail(\"FORMAL_HP_HEAL_CAP\",partial||null);\n''', '''   const partial=createThirdWorldBossCombatSnapshot(7,{ignoreUnlock:true,formalStartHp:Math.floor(max*.55)});\n   if(!partial||partial.enemyHealCap!==partial.formalStartHp||partial.enemyHealCap>=partial.bossMaxHp)fail(\"FORMAL_HP_HEAL_CAP\",partial||null);\n   const reviewState={secondWorld:{entered:true},thirdWorld:{entered:true,bosses:Array.from({length:Number(window.THIRD_WORLD_BOSS_COUNT)||10},(_,index)=>({currentHp:index===4?0:max}))}};\n   const review=createThirdWorldBossCombatSnapshot(4,{state:reviewState,review:true});\n   if(!review||review.reviewMode!==true||review.stage!==9||review.formalStartHp!==0||review.enemyStartHp!==max||review.enemyHealCap!==max||review.stageBasisHp!==Math.floor(max*.1)||markKeys.some(key=>review.enemyEffectProfile?.[key]?.active!==true))fail(\"REVIEW_FINAL_FORM_FULL_HP\",review||null);\n''')
          rep('thirdworldcombat.js','  return Object.freeze({version:5,passed:errors.length===0,errors:Object.freeze(errors.slice())});\n','  return Object.freeze({version:6,reviewPolicyVersion:REVIEW_POLICY_VERSION,reviewStateIsolationVersion:REVIEW_STATE_ISOLATION_VERSION,passed:errors.length===0,errors:Object.freeze(errors.slice())});\n')
          rep('thirdworldcombat.js', ''' window.THIRD_WORLD_COMBAT_SNAPSHOT_VERSION=SNAPSHOT_VERSION;\n window.THIRD_WORLD_COMBAT_RESULT_CONTRACT_VERSION=RESULT_CONTRACT_VERSION;\n''', ''' window.THIRD_WORLD_COMBAT_SNAPSHOT_VERSION=SNAPSHOT_VERSION;\n window.THIRD_WORLD_COMBAT_REVIEW_POLICY_VERSION=REVIEW_POLICY_VERSION;\n window.THIRD_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION=REVIEW_STATE_ISOLATION_VERSION;\n window.THIRD_WORLD_COMBAT_RESULT_CONTRACT_VERSION=RESULT_CONTRACT_VERSION;\n''')

          # --- worldmapui.js shared review-runtime lock ---
          rep('worldmapui.js','  let galaxyReviewBattleActive=false;\n','  let galaxyReviewBattleActive=false;\n  let adventureReviewBattleActive=false;\n')
          rep('worldmapui.js','    return galaxyReviewBattleActive===true||thirdRun?.active===true||!!secondRun||globalBattleBusy;\n','    return galaxyReviewBattleActive===true||adventureReviewBattleActive===true||thirdRun?.active===true||!!secondRun||globalBattleBusy;\n')
          rep('worldmapui.js', '''  window.getAdventureEraView=function(){return syncAdventureEraViewWorldPhase();};\n  window.adventureEraViewLocked=adventureEraViewLocked;\n''', '''  window.getAdventureEraView=function(){return syncAdventureEraViewWorldPhase();};\n  window.setAdventureReviewBattleActive=function(value){adventureReviewBattleActive=value===true;return adventureReviewBattleActive;};\n  window.isAdventureReviewBattleActive=function(){return adventureReviewBattleActive===true;};\n  window.adventureEraViewLocked=adventureEraViewLocked;\n''')
          rep('worldmapui.js','  window.ADVENTURE_ERA_RUNTIME_LOCK_VERSION=1;\n','  window.ADVENTURE_ERA_RUNTIME_LOCK_VERSION=2;\n')

          # --- thirdworldui.js review presentation and lifecycle ---
          rep('thirdworldui.js',' const VERSION=7;\n',' const VERSION=8;\n')
          rep('thirdworldui.js',' const COMBAT_PAGE_UI_VERSION=1;\n',' const COMBAT_PAGE_UI_VERSION=1;\n const REVIEW_UI_VERSION=1;\n')
          rep('thirdworldui.js',' let pendingCoreConfirmation=null;\n',' let pendingCoreConfirmation=null;\n let reviewContext=null;\n let reviewResultModal=null;\n')
          rep('thirdworldui.js','  if(snapshot?.defeated)return {className:\"defeated\",label:\"已擊破\",detail:\"永久 HP 已歸零\"};\n','  if(snapshot?.defeated)return {className:\"defeated\",label:\"已擊破／回顧\",detail:\"固定 10% 最終型態、滿 HP 的單場無收益回顧\"};\n')
          rep('thirdworldui.js','  if(snapshot?.defeated)return `<button class=\"btn third-world-boss-action\" type=\"button\" disabled>已擊破</button>`;\n','  if(snapshot?.defeated)return `<button class=\"btn blue third-world-boss-action third-world-boss-review-action\" type=\"button\" onclick=\"startThirdWorldBossReviewFromPlayerUi(${whole(index)})\">回顧挑戰</button>`;\n')
          rep('thirdworldui.js', ''' function unavailableHtml(message){return `<section class=\"map-screen third-world-adventure-screen\">${topBarHtml(false)}<div class=\"notice\"><b>${message}</b></div></section>`;}\n function combatPageHtml(){\n''', ''' function unavailableHtml(message){return `<section class=\"map-screen third-world-adventure-screen\">${topBarHtml(false)}<div class=\"notice\"><b>${message}</b></div></section>`;}\n function reviewCombatPageHtml(){\n  const ctx=reviewContext,combat=ctx?.combat;if(!ctx||!combat)return \"\";\n  const playerMax=Math.max(1,whole(combat.playerMaxHp||combat.playerStartHp||1)),playerStart=Math.max(0,Math.min(playerMax,whole(combat.playerStartHp??playerMax))),playerPct=playerStart/playerMax*100;\n  const enemyMax=Math.max(1,whole(combat.enemyMaxHp||combat.e?.hp||window.THIRD_WORLD_BOSS_MAX_HP||1)),enemyStart=Math.max(0,Math.min(enemyMax,whole(combat.enemyStartHp??enemyMax))),enemyPct=enemyStart/enemyMax*100;\n  return `<section class=\"combat-screen third-world-combat-screen third-world-review-combat-screen\"><div class=\"combat-head main-minimal-mode-head third-world-combat-head\"><span class=\"main-minimal-mode-head-label third-world-combat-head-label\"><span>高維回顧・單場</span><small>Stage 9｜10% 最終型態｜Boss 滿 HP｜無正式收益</small></span></div><div class=\"combat-arena\"><div class=\"combatant player\" id=\"combatPlayerCard\"><div class=\"combat-damage\" id=\"combatPlayerDamage\"></div><h2>${typeof playerNameHtml===\"function\"?playerNameHtml():\"玩家\"} Lv.${whole(state?.level)}</h2><div class=\"big-hp\"><div class=\"status-label\"><span>HP</span><span id=\"combatPlayerHp\">${fmt(playerStart)} / ${fmt(playerMax)}</span></div><div class=\"bar\"><span class=\"hp\" id=\"combatPlayerBar\" style=\"width:${playerPct}%\"></span></div></div></div><div class=\"combat-vs\">VS</div><div class=\"combatant enemy\" id=\"combatEnemyCard\"><div class=\"combat-damage\" id=\"combatEnemyDamage\"></div><h2 id=\"combatEnemyName\">${ctx.bossName}</h2><div class=\"big-hp\"><div class=\"status-label\"><span>HP</span><span id=\"combatEnemyHp\">${fmt(enemyStart)} / ${fmt(enemyMax)}</span></div><div class=\"bar\"><span class=\"hp\" id=\"combatEnemyBar\" style=\"width:${enemyPct}%\"></span></div></div></div></div><div class=\"combat-message\" id=\"combatMessage\">高維回顧進行中</div></section>`;\n }\n function closeReviewResult(){\n  reviewResultModal?.classList.remove(\"show\");reviewResultModal?.remove();reviewResultModal=null;reviewContext=null;\n  if(typeof window.setAdventureReviewBattleActive===\"function\")window.setAdventureReviewBattleActive(false);\n  if(typeof window.clearCombatPresentation===\"function\")window.clearCombatPresentation(\"third-world-review-end\");\n  if(typeof window.render===\"function\")window.render();\n  return true;\n }\n function showReviewResult(result){\n  if(typeof document===\"undefined\"){closeReviewResult();return;}\n  reviewResultModal=document.createElement(\"div\");reviewResultModal.className=\"modal show\";reviewResultModal.id=\"thirdWorldReviewResultModal\";reviewResultModal.setAttribute(\"role\",\"dialog\");reviewResultModal.setAttribute(\"aria-modal\",\"true\");\n  const outcome=result?.win===true?\"回顧勝利\":result?.playerDied===true?\"回顧挑戰結束\":\"回顧戰結束\";\n  reviewResultModal.innerHTML=`<div class=\"modal-box\"><h3>${outcome}</h3><div class=\"notice\"><b>${reviewContext?.bossName||\"高維存在\"}</b><div class=\"muted\" style=\"margin-top:6px;line-height:1.55\">固定 Stage 9／10% 最終型態，以完整 ${fmt(window.THIRD_WORLD_BOSS_MAX_HP)} HP 進行單場回顧。<br>本場不產生 EXP、維度之弦、裝備、Boss 永久削血、稱號、劇情、核心或任何正式進度。</div></div><div class=\"controls\" style=\"margin-top:16px\"><button class=\"btn primary\" type=\"button\" onclick=\"closeThirdWorldReviewResultModal()\">返回高維戰線</button></div></div>`;\n  document.body.appendChild(reviewResultModal);\n }\n function combatPageHtml(){\n''')
          rep('thirdworldui.js', '''  clearCoreFeedbackOnFreshEntry();\n  if(currentPhase()!==3)return unavailableHtml(\"目前尚未正式進入高維紀元。\");\n  const combatHtml=combatPageHtml();if(combatHtml)return combatHtml;\n''', '''  clearCoreFeedbackOnFreshEntry();\n  if(currentPhase()!==3)return unavailableHtml(\"目前尚未正式進入高維紀元。\");\n  const reviewHtml=reviewCombatPageHtml();if(reviewHtml)return reviewHtml;\n  const combatHtml=combatPageHtml();if(combatHtml)return combatHtml;\n''')
          rep('thirdworldui.js', '''  if(typeof window.thirdWorldCoreInjectionPlan!==\"function\")errors.push(\"CORE_PLAN_OWNER_MISSING\");\n  if(typeof window.injectAllThirdWorldCoreStrings!==\"function\")errors.push(\"CORE_INJECTION_OWNER_MISSING\");\n''', '''  if(typeof window.thirdWorldCoreInjectionPlan!==\"function\")errors.push(\"CORE_PLAN_OWNER_MISSING\");\n  if(typeof window.injectAllThirdWorldCoreStrings!==\"function\")errors.push(\"CORE_INJECTION_OWNER_MISSING\");\n  if(typeof window.runThirdWorldBossCombat!==\"function\"||Number(window.THIRD_WORLD_COMBAT_REVIEW_POLICY_VERSION)!==1)errors.push(\"REVIEW_COMBAT_OWNER_MISSING\");\n  if(typeof window.setAdventureReviewBattleActive!==\"function\"||typeof window.isAdventureReviewBattleActive!==\"function\")errors.push(\"REVIEW_RUNTIME_LOCK_OWNER_MISSING\");\n''')
          rep('thirdworldui.js', ''' window.toggleThirdWorldCommonAbilities=function(){commonAbilitiesOpen=!commonAbilitiesOpen;if(typeof window.render===\"function\")window.render();};\n window.startThirdWorldRunFromPlayerUi=async function(value){\n''', ''' window.toggleThirdWorldCommonAbilities=function(){commonAbilitiesOpen=!commonAbilitiesOpen;if(typeof window.render===\"function\")window.render();};\n window.startThirdWorldBossReviewFromPlayerUi=async function(value){\n  const index=whole(value),snap=bossSnapshot(index),run=runSnapshot();\n  if(currentPhase()!==3||snap?.defeated!==true)return false;\n  if(run.active===true||reviewContext||window.adventureEraViewLocked?.()===true)return false;\n  const player=typeof window.playerCombatStats===\"function\"?window.playerCombatStats():null;if(!player)return false;\n  if(typeof window.runThirdWorldBossCombat!==\"function\"||typeof window.prepareCombatPresentation!==\"function\"||typeof window.animateStructuredCombatPresentation!==\"function\")return false;\n  if(typeof window.setAdventureReviewBattleActive===\"function\")window.setAdventureReviewBattleActive(true);\n  try{\n   const result=window.runThirdWorldBossCombat(index,{review:true,preparePresentation:true,logs:true,startHp:player.hp,playerHealCap:player.hp});\n   if(result?.ok!==true||result?.review!==true||result?.formalSettlementEligible===true)throw new Error(result?.reason||\"高維回顧建立失敗。\");\n   reviewContext={bossIndex:index,bossName:String(result.bossName||bossDefs()[index]?.name||\"高維存在\"),combat:result.combat,result};\n   if(typeof window.render===\"function\")window.render();\n   window.prepareCombatPresentation(result.combat,{logs:true});\n   await window.animateStructuredCombatPresentation(result.combat,{clearAfter:false,clearReason:\"third-world-review-combat-end\"});\n   showReviewResult(result);\n   return true;\n  }catch(error){\n   console.error(\"[文明戰線] 高維回顧失敗\",error);reviewContext=null;\n   if(typeof window.setAdventureReviewBattleActive===\"function\")window.setAdventureReviewBattleActive(false);\n   if(typeof window.clearCombatPresentation===\"function\")window.clearCombatPresentation(\"third-world-review-error\");\n   if(typeof window.render===\"function\")window.render();\n   alert(\"高維回顧發生錯誤，正式進度未受影響。\");return false;\n  }\n };\n window.closeThirdWorldReviewResultModal=closeReviewResult;\n window.isThirdWorldReviewBattleActive=function(){return !!reviewContext;};\n window.startThirdWorldRunFromPlayerUi=async function(value){\n''')
          rep('thirdworldui.js', ''' window.THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION=COMBAT_PAGE_UI_VERSION;\n window.THIRD_WORLD_PLAYER_UI_ERA_TABS_VERSION=1;\n''', ''' window.THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION=COMBAT_PAGE_UI_VERSION;\n window.THIRD_WORLD_PLAYER_UI_ERA_TABS_VERSION=1;\n window.THIRD_WORLD_PLAYER_UI_REVIEW_VERSION=REVIEW_UI_VERSION;\n''')

          # --- canonical integrity contract ---
          rep('thirdworldintegritycontract.js',' const VERSION=27;\n',' const VERSION=28;\n')
          rep('thirdworldintegritycontract.js','  THIRD_WORLD_COMBAT_VERSION:5,THIRD_WORLD_COMBAT_RESULT_CONTRACT_VERSION:2,','  THIRD_WORLD_COMBAT_VERSION:6,THIRD_WORLD_COMBAT_SNAPSHOT_VERSION:2,THIRD_WORLD_COMBAT_REVIEW_POLICY_VERSION:1,THIRD_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION:1,THIRD_WORLD_COMBAT_RESULT_CONTRACT_VERSION:2,')
          rep('thirdworldintegritycontract.js','  THIRD_WORLD_PLAYER_UI_VERSION:7,','  THIRD_WORLD_PLAYER_UI_VERSION:8,')
          rep('thirdworldintegritycontract.js','THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION:1,THIRD_WORLD_PLAYER_UI_ERA_TABS_VERSION:1,','THIRD_WORLD_PLAYER_UI_COMBAT_PAGE_VERSION:1,THIRD_WORLD_PLAYER_UI_ERA_TABS_VERSION:1,THIRD_WORLD_PLAYER_UI_REVIEW_VERSION:1,')
          rep('thirdworldintegritycontract.js','  ADVENTURE_ERA_VIEW_OWNER_VERSION:1,ADVENTURE_ERA_SESSION_POLICY_VERSION:1,ADVENTURE_ERA_RUNTIME_LOCK_VERSION:1,','  ADVENTURE_ERA_VIEW_OWNER_VERSION:1,ADVENTURE_ERA_SESSION_POLICY_VERSION:1,ADVENTURE_ERA_RUNTIME_LOCK_VERSION:2,')
          rep('thirdworldintegritycontract.js','\"getAdventureEraView\",\"setAdventureEraView\",\"adventureEraTabsHtml\",\"adventureEraViewLocked\",\"thirdWorldAdventurePageHtml\"','\"getAdventureEraView\",\"setAdventureEraView\",\"adventureEraTabsHtml\",\"adventureEraViewLocked\",\"setAdventureReviewBattleActive\",\"isAdventureReviewBattleActive\",\"thirdWorldAdventurePageHtml\"')
          rep('thirdworldintegritycontract.js','\"validateThirdWorldPlayerUi\",\"openThirdWorldCoreInjectionConfirm\"','\"validateThirdWorldPlayerUi\",\"startThirdWorldBossReviewFromPlayerUi\",\"closeThirdWorldReviewResultModal\",\"openThirdWorldCoreInjectionConfirm\"')

          # --- runtime static integrity ---
          p=Path('tests/runtime/js-integrity.js'); t=p.read_text(encoding='utf-8')
          t=t.replace('ADVENTURE_ERA_RUNTIME_LOCK_VERSION=1','ADVENTURE_ERA_RUNTIME_LOCK_VERSION=2')
          anchor='assert(/PLAYER_ADVENTURE_WORLD_PHASE_ROUTING_VERSION=2/.test(playerSemanticsUi)&&/PLAYER_ADVENTURE_ERA_VIEW_ROUTING_VERSION=1/.test(playerSemanticsUi)&&/getAdventureEraView/.test(playerSemanticsUi)&&/universe-review/.test(playerSemanticsUi),"高維冒險 routing 必須委派共用 era view owner。\");\n'
          insert=anchor+'assert(/THIRD_WORLD_COMBAT_REVIEW_POLICY_VERSION=REVIEW_POLICY_VERSION/.test(thirdWorldCombat)&&/THIRD_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION=REVIEW_STATE_ISOLATION_VERSION/.test(thirdWorldCombat)&&/stageBasisHp=reviewMode\\?Math\\.max\\(1,Math\\.floor\\(bossMaxHp\\*\\.1\\)\\):formalStartHp/.test(thirdWorldCombat)&&/enemyStartHp=reviewMode\\?bossMaxHp:formalStartHp/.test(thirdWorldCombat),"高維回顧必須固定 10% Stage 基準但以 Boss 滿 HP 開場，且宣告零正式 state 污染政策。\");\nassert(/startThirdWorldBossReviewFromPlayerUi=async function/.test(thirdWorldUi)&&/review:true/.test(thirdWorldUi)&&/formalSettlementEligible===true/.test(thirdWorldUi)&&/THIRD_WORLD_PLAYER_UI_REVIEW_VERSION=REVIEW_UI_VERSION/.test(thirdWorldUi),"高維已擊破王必須走獨立單場 review path，且拒絕正式 settlement。\");\nassert(/setAdventureReviewBattleActive=function/.test(worldmap)&&/isAdventureReviewBattleActive=function/.test(worldmap)&&/adventureReviewBattleActive===true/.test(worldmap),"共用冒險紀元 owner 必須鎖定回顧戰期間的紀元切換。\");\n'
          if t.count(anchor)!=1: raise SystemExit('tests/runtime/js-integrity.js: routing anchor mismatch')
          t=t.replace(anchor,insert)
          p.write_text(t,encoding='utf-8')

          # --- cache bust ---
          rep('index.html','thirdworldcombat.js?v=20260927-thirdworld-combat-opt3','thirdworldcombat.js?v=20260928-thirdworld-batch11-2')
          rep('index.html','worldmapui.js?v=20260928-thirdworld-batch11-1','worldmapui.js?v=20260928-thirdworld-batch11-2')
          rep('index.html','thirdworldui.js?v=20260928-thirdworld-batch11-1','thirdworldui.js?v=20260928-thirdworld-batch11-2')
          rep('index.html','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-1','thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-2')
          # keep cache-bust assertions synchronized where present
          p=Path('tests/runtime/js-integrity.js'); t=p.read_text(encoding='utf-8')
