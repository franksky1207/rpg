name: One-time Batch 11-O2 Review Runtime Convergence

on:
  push:
    paths:
      - '.github/workflows/batch11-o2-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply batch 11-O2 patch
        run: python .github/scripts/batch11-o2-patch.py
      - name: Syntax and runtime integrity self-check
        run: |
          set -euo pipefail
          node --check worldmapui.js
          node --check thirdworldintegritycontract.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'src="worldmapui.js?v=20260928-thirdworld-batch11-o2"' index.html
          grep -q 'src="thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-o2"' index.html
          ! grep -q 'let galaxyReviewBattleActive=' worldmapui.js
          grep -q 'registerWorldTransitionRuntimeBlocker("adventure-review-runtime",adventureReviewWorldTransitionBlocker)' worldmapui.js
      - name: Commit batch 11-O2 and remove temporary files
        run: |
          set -euo pipefail
          rm .github/workflows/batch11-o2-runner.yml .github/scripts/batch11-o2-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Converge cross-era review runtime owner'
          git push origin HEAD:main
