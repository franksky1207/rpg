name: Apply void auto-run owner batch 1

on:
  push:
    paths:
      - '.github/workflows/apply-void-auto-owner-batch1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/void_auto_owner_batch1.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dungeonvoid.js dungeonvoidui.js PROJECT_HANDOFF.md index.html
          git commit -m 'refactor: make void core the sole auto-run owner'
          git push
