name: Temporary Final Integrity Dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-dispatch-final-integrity.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dispatcher and run exact-head integrity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm .github/workflows/temp-dispatch-final-integrity.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add .github/workflows/temp-dispatch-final-integrity.yml
          git commit -m "Remove temporary final integrity dispatcher"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
          gh workflow run story-integrity.yml --ref main
