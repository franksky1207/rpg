name: Story Batch 3 Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/story-batch3-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align formal universe story filenames with main
        shell: python
        run: |
          from pathlib import Path
          mapping={
            'storydata-universe-supercluster-frontier.js':'storydata-universe-star-cluster-frontier.js',
            'storydata-universe-cosmic-web.js':'storydata-universe-stellar-battlefront.js',
            'storydata-universe-dark-matter-sea.js':'storydata-universe-cosmic-filament.js',
            'storydata-universe-deep-space.js':'storydata-universe-stellar-great-wall.js',
            'storydata-universe-void.js':'storydata-universe-cosmic-deep-domain.js',
            'storydata-universe-multi-domain.js':'storydata-universe-trans-domain-frontier.js',
            'storydata-universe-cosmic-center.js':'storydata-universe-myriad-domain-frontline.js',
          }
          for name in ['index.html','tests/story/source-purity.js','tests/story/integrity.js','tests/story/flow.js']:
            p=Path(name); s=p.read_text()
            for old,new in mapping.items(): s=s.replace(old,new)
            if name=='index.html': s=s.replace('20260923-universe-story-load-batch2','20260923-universe-story-batch3')
            p.write_text(s)
      - name: Commit corrected formal load path
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html tests/story/source-purity.js tests/story/integrity.js tests/story/flow.js
          git diff --cached --quiet || git commit -m "Align universe story runtime filenames with main"
          git push
