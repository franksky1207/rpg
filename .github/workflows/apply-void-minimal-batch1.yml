name: Apply void minimal mode batch 1

on:
  push:
    paths:
      - '.github/workflows/apply-void-minimal-batch1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch void minimal mode batch 1
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('dungeonvoidui.js')
          text=p.read_text(encoding='utf-8')
          start=text.index(' function combatHtml(fr,run){')
          end=text.index('\n function resultHtml(run){', start)
          chunk=text[start:end]
          old='<div class="void-title">【虛空幻境】</div>'
          new='<div class="void-title main-minimal-mode-head"><span class="main-minimal-mode-head-label">【虛空幻境】</span>${run?.active?`<button type="button" class="main-minimal-mode-enter" onclick="openVoidMirageMinimalMode()">極簡模式</button>`:""}</div>'
          if old not in chunk:
              raise SystemExit('combat title anchor not found')
          chunk=chunk.replace(old,new,1)
          text=text[:start]+chunk+text[end:]

          anchor=''' window.returnFromVoidMirage=function(){voidUi={phase:"idle",running:false,exitAfterFloor:false,floorResult:null,finalRun:null,message:""};view="dungeon";render();};\n\n injectStyles();\n})();'''
          block=''' window.returnFromVoidMirage=function(){voidUi={phase:"idle",running:false,exitAfterFloor:false,floorResult:null,finalRun:null,message:""};view="dungeon";render();};\n\n function voidMinimalModeIsActive(){\n  const run=typeof getVoidMirageRunSnapshot==="function"?getVoidMirageRunSnapshot():null;\n  return voidUi.phase==="combat"&&!!voidUi.floorResult&&run?.active===true;\n }\n function registerVoidMinimalModeAdapter(){\n  if(typeof window.registerMinimalModeAdapter!=="function")return false;\n  return window.registerMinimalModeAdapter("void-mirage",{\n   isActive:voidMinimalModeIsActive,\n   runningStatus:"虛空幻境持續挑戰中",\n   centerClass:"main-minimal-mode-center--stacked",\n   contentHtml(){return `<div class="main-minimal-mode-block"><div class="main-minimal-mode-label">目前敵人</div><div class="main-minimal-mode-value" data-void-minimal-mode-enemy>戰鬥中</div></div>`;},\n   sync(root,mode){\n    const enemy=root.querySelector("[data-void-minimal-mode-enemy]");\n    if(!enemy||mode!=="running")return;\n    const run=typeof getVoidMirageRunSnapshot==="function"?getVoidMirageRunSnapshot():null;\n    enemy.textContent=voidUi.floorResult?.enemy?.name||run?.lastEnemy?.name||"戰鬥中";\n   }\n  });\n }\n window.openVoidMirageMinimalMode=function(){\n  registerVoidMinimalModeAdapter();\n  return typeof window.openMinimalMode==="function"&&window.openMinimalMode("void-mirage")===true;\n };\n registerVoidMinimalModeAdapter();\n\n injectStyles();\n})();'''
          if anchor not in text:
              raise SystemExit('void footer anchor not found')
          text=text.replace(anchor,block,1)
          p.write_text(text,encoding='utf-8')

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          replacements={
           'mainminimalmode.css?v=20260917-main-minimal-slider-visibility1':'mainminimalmode.css?v=20260917-void-adapter-batch1',
           'mainminimalmode.js?v=20260917-main-minimal-mode-formal1':'mainminimalmode.js?v=20260917-void-adapter-batch1',
           'dungeonvoidui.js?v=20260915-void-claim-confirm1':'dungeonvoidui.js?v=20260917-void-minimal-batch1'
          }
          for old,new in replacements.items():
              if old not in text:
                  raise SystemExit(f'index cache anchor not found: {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit batch 1
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dungeonvoidui.js index.html
          git commit -m 'feat: wire void mirage into minimal mode framework'
          git push
