name: Formalize enhancement GM testing
on:
  push:
    paths:
      - '.github/workflows/formalize-enhancement-gm.yml'
permissions:
  contents: write
jobs:
  formalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refactor enhancement combat and GM test stats
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('enhancementcombat.js')
          s=p.read_text()
          s=s.replace(''' function enhancedEquippedStats(){\n  const out={hp:baseHP(state.level),atk:baseATK(state.level),def:baseDEF(state.level),crit:0,dodge:0};''',''' function statsWithEnhancementLevels(levelSource=null){\n  const base=typeof window.rawEquippedStats==="function"?window.rawEquippedStats():{hp:baseHP(state.level),atk:baseATK(state.level),def:baseDEF(state.level),crit:0,dodge:0};\n  const out={...base};''',1)
          old='''   out.hp+=Number(item.hp)||0;\n   out.atk+=Number(item.atk)||0;\n   out.def+=Number(item.def)||0;\n   out.crit+=Number(item.crit)||0;\n   out.dodge+=Number(item.dodge)||0;\n\n   const stat=item.mainStat?.stat;'''
          assert old in s
          s=s.replace(old,'''   const stat=item.mainStat?.stat;''',1)
          s=s.replace('''   const level=typeof enhancementLevel==="function"?enhancementLevel(state,type):0;''','''   const level=levelSource&&typeof levelSource==="object"?Math.max(0,Math.min(Number(window.ENHANCEMENT_MAX_LEVEL)||20,Math.floor(Number(levelSource[type])||0))):(typeof enhancementLevel==="function"?enhancementLevel(state,type):0);''',1)
          s=s.replace(''' window.rawEquippedStats=equippedStats;\n equippedStats=enhancedEquippedStats;\n window.equippedStats=enhancedEquippedStats;\n window.enhancedEquippedStats=enhancedEquippedStats;''',''' window.rawEquippedStats=equippedStats;\n function enhancedEquippedStats(){return statsWithEnhancementLevels(null);}\n equippedStats=enhancedEquippedStats;\n window.equippedStats=enhancedEquippedStats;\n window.enhancedEquippedStats=enhancedEquippedStats;\n window.equippedStatsWithEnhancementLevels=statsWithEnhancementLevels;''',1)
          p.write_text(s)
          p=Path('enhancementgm.js');s=p.read_text()
          old=''' window.gmTestEnhancedEquippedStats=function(){\n  const base=typeof window.rawEquippedStats==="function"?window.rawEquippedStats():equippedStats();\n  const out={...base};\n  slots().forEach(type=>{const item=state?.equipment?.[type];if(!item?.mainStat)return;const stat=item.mainStat.stat,raw=Math.max(0,Number(item.mainStat.value)||0),delta=(typeof window.enhancedMainStatValue==="function"?window.enhancedMainStatValue(raw,testLevel(type)):raw)-raw;if(stat in out)out[stat]=(Number(out[stat])||0)+delta;});\n  out.crit=Math.round((Number(out.crit)||0)*10)/10;out.dodge=Math.round((Number(out.dodge)||0)*10)/10;return out;\n };'''
          new=''' window.gmTestEnhancedEquippedStats=function(){\n  const levels=Object.fromEntries(slots().map(type=>[type,testLevel(type)]));\n  return typeof window.equippedStatsWithEnhancementLevels==="function"?window.equippedStatsWithEnhancementLevels(levels):(typeof window.rawEquippedStats==="function"?window.rawEquippedStats():equippedStats());\n };'''
          assert old in s;s=s.replace(old,new,1);p.write_text(s)
          p=Path('index.html');s=p.read_text().replace('enhancementcombat.js?v=20260915-enhancement-batch2','enhancementcombat.js?v=20260915-enhancement-gm-final1').replace('enhancementgm.js?v=20260915-enhancement-gm3','enhancementgm.js?v=20260915-enhancement-gm-final1');p.write_text(s)
          PY
      - name: Verify GM enhancement architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          c=Path('enhancementcombat.js').read_text();g=Path('enhancementgm.js').read_text();i=Path('index.html').read_text()
          assert 'window.equippedStatsWithEnhancementLevels=statsWithEnhancementLevels' in c
          assert 'out.hp+=Number(item.hp)' not in c
          assert 'window.equippedStatsWithEnhancementLevels(levels)' in g
          assert 'window.gmUseCurrentEnhancementTestStatus();' in g
          assert 'window.gmTestPlayerStats=function(){return window.gmTestPlayerStatsWithEnhancement();};' in g
          assert 'enhancementcombat.js?v=20260915-enhancement-gm-final1' in i
          print('GM enhancement architecture verified')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/formalize-enhancement-gm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add enhancementcombat.js enhancementgm.js index.html .github/workflows/formalize-enhancement-gm.yml
          git commit -m 'Formalize enhancement GM test stats'
          git push