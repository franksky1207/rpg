name: Build home mobile background

on:
  push:
    paths:
      - '.github/workflows/build-home-mobile-background.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert mobile source to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('assets/backgrounds-source/home/mobile.png')
          dst=Path('assets/backgrounds/home/mobile.webp')
          dst.parent.mkdir(parents=True, exist_ok=True)
          im=Image.open(src).convert('RGB')
          max_w=1080
          if im.width>max_w:
              h=round(im.height*max_w/im.width)
              im=im.resize((max_w,h),Image.Resampling.LANCZOS)
          im.save(dst,'WEBP',quality=72,method=6)
          print(src,im.size,'->',dst,dst.stat().st_size,'bytes')
          PY
      - name: Commit optimized mobile background
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/backgrounds/home/mobile.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build optimized home mobile background'
          git push
