name: Batch 3 FX Lifecycle Regression
on:
  push:
    branches: [feat/combat-animation-batch3-20261017]
  workflow_dispatch:
jobs:
  fx-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --check combatfx.js && node --check tests/runtime/batch3-fx-timer-lifecycle.cjs
      - run: node tests/runtime/batch3-fx-timer-lifecycle.cjs
