name: Story Integrity

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'secondworlddata.js'
      - 'secondworldstoryregistry.js'
      - 'worldmaps-*.js'
      - 'storydata-*.js'
      - 'story.css'
      - 'storyintegrity.js'
      - 'storyui.js'
      - 'storymigration.js'
      - 'storyprogress.js'
      - 'storyrecordtabs.js'
      - 'storyruntimeintegrity.js'
      - 'thirdworldphase.js'
      - 'thirdworldmigrationregression.js'
      - 'gmstorytest.js'
      - 'ui.js'
      - 'combatcore.js'
      - 'battlepipeline.js'
      - 'index.html'
      - 'tests/story/**'
      - '.github/workflows/story-integrity.yml'
  workflow_dispatch:

jobs:
  story-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run raw story source purity
        run: set -o pipefail; node tests/story/source-purity.js 2>&1 | tee story-purity-report.txt
      - name: Run universe meta-language audit
        run: set -o pipefail; node tests/story/meta-language.js 2>&1 | tee story-meta-language-report.txt
      - name: Run story data integrity
        run: set -o pipefail; node tests/story/integrity.js 2>&1 | tee story-integrity-report.txt
      - name: Run Story Record regressions
        run: node tests/story/record.js
      - name: Run reincarnation W1 W2 Story trigger isolation
        run: node tests/story/reincarnation-trigger-batch2.js
      - name: Run reincarnation W3 Story and combat completion isolation
        run: node tests/story/reincarnation-higher-dimensional-batch3.js
      - name: Run three-era reincarnation Story old-save and reload closure
        run: node tests/story/reincarnation-three-era-batch4-closure.js
      - name: Run legacy W3 Story migration regressions
        run: node tests/story/legacy-thirdworld.js
      - name: Upload story integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-integrity-report
          path: |
            story-purity-report.txt
            story-meta-language-report.txt
            story-integrity-report.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Run story flow regressions
        run: node tests/story/flow.js