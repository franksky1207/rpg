name: Story Integrity

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'worldmaps-*.js'
      - 'storydata-*.js'
      - 'story.css'
      - 'storyintegrity.js'
      - 'storyui.js'
      - 'storymigration.js'
      - 'storyprogress.js'
      - 'storyrecordtabs.js'
      - 'storyruntimeintegrity.js'
      - 'gmstorytest.js'
      - 'ui.js'
      - 'combatcore.js'
      - 'battlepipeline.js'
      - 'index.html'
      - 'tests/story/**'
      - '.github/workflows/story-integrity.yml'
  workflow_dispatch:

jobs:
  story-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify story batch 4 layout
        run: |
          test -f story.css
          test -f tests/story/source-purity.js
          test -f tests/story/integrity.js
          test -f tests/story/flow.js
          test ! -e story-source-purity-ci.js
          test ! -e story-integrity-ci.js
          test ! -e story-flow-ci.js
          grep -q 'story.css?v=20260917-story-batch4' index.html
      - name: Run raw story source purity
        run: node tests/story/source-purity.js
      - name: Run story data integrity
        run: node tests/story/integrity.js
      - name: Run story flow regressions
        run: node tests/story/flow.js
