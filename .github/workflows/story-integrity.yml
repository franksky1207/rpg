name: Story Integrity

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'secondworlddata.js'
      - 'secondworldstoryregistry.js'
      - 'worldmaps-*.js'
      - 'storydata-*.js'
      - 'story.css'
      - 'storyintegrity.js'
      - 'storyui.js'
      - 'storymigration.js'
      - 'storyprogress.js'
      - 'storyrecordtabs.js'
      - 'storyruntimeintegrity.js'
      - 'gmstorytest.js'
      - 'ui.js'
      - 'combatcore.js'
      - 'battlepipeline.js'
      - 'index.html'
      - 'tests/story/**'
      - '.github/workflows/story-integrity.yml'
  workflow_dispatch:

jobs:
  story-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run raw story source purity
        run: set -o pipefail; node tests/story/source-purity.js 2>&1 | tee story-purity-report.txt
      - name: Run story data integrity
        run: set -o pipefail; node tests/story/integrity.js 2>&1 | tee story-integrity-report.txt
      - name: Upload story integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-integrity-report
          path: |
            story-purity-report.txt
            story-integrity-report.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Run story flow regressions
        run: node tests/story/flow.js
