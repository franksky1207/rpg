name: Story Integrity

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'secondworlddata.js'
      - 'secondworldstoryregistry.js'
      - 'worldmaps-*.js'
      - 'storydata-*.js'
      - 'story.css'
      - 'storyintegrity.js'
      - 'storyui.js'
      - 'storymigration.js'
      - 'storyprogress.js'
      - 'storyrecordtabs.js'
      - 'storyruntimeintegrity.js'
      - 'gmstorytest.js'
      - 'ui.js'
      - 'combatcore.js'
      - 'battlepipeline.js'
      - 'index.html'
      - 'tests/story/**'
      - '.github/workflows/story-integrity.yml'
  workflow_dispatch:

jobs:
  story-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify story integrity structure
        run: |
          test -f story.css
          test -f storyintegrity.js
          test -f storymigration.js
          test -f storyruntimeintegrity.js
          test -f secondworldstoryregistry.js
          for file in \
            storydata-universe-galaxy-beyond.js \
            storydata-universe-local-group-war.js \
            storydata-universe-supercluster-frontier.js \
            storydata-universe-cosmic-web.js \
            storydata-universe-dark-matter-sea.js \
            storydata-universe-deep-space.js \
            storydata-universe-void.js \
            storydata-universe-multi-domain.js \
            storydata-universe-cosmic-center.js \
            storydata-universe-cosmic-unification-war.js; do test -f "$file"; done
          test -f tests/story/source-purity.js
          test -f tests/story/integrity.js
          test -f tests/story/flow.js
          test ! -e story-source-purity-ci.js
          test ! -e story-integrity-ci.js
          test ! -e story-flow-ci.js
          grep -Eq 'href="story\.css\?v=[^"]+"' index.html
          grep -Eq 'src="secondworldstoryregistry\.js\?v=[^"]+"' index.html
          grep -Eq 'src="storydata-universe-galaxy-beyond\.js\?v=[^"]+"' index.html
          grep -Eq 'src="storydata-universe-cosmic-unification-war\.js\?v=[^"]+"' index.html
          grep -Eq 'src="storyintegrity\.js\?v=[^"]+"' index.html
          grep -Eq 'src="storyruntimeintegrity\.js\?v=[^"]+"' index.html
      - name: Run raw story source purity
        run: node tests/story/source-purity.js
      - name: Run story data integrity
        run: node tests/story/integrity.js 2>&1 | tee story-integrity-report.txt
      - name: Upload story integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-integrity-report
          path: story-integrity-report.txt
          retention-days: 1
      - name: Run story flow regressions
        run: node tests/story/flow.js
