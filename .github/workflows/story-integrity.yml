name: Story Integrity

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'secondworlddata.js'
      - 'secondworldstoryregistry.js'
      - 'worldmaps-*.js'
      - 'storydata-*.js'
      - 'story.css'
      - 'storyintegrity.js'
      - 'storyui.js'
      - 'storymigration.js'
      - 'storyprogress.js'
      - 'storyrecordtabs.js'
      - 'storyruntimeintegrity.js'
      - 'gmstorytest.js'
      - 'ui.js'
      - 'combatcore.js'
      - 'battlepipeline.js'
      - 'index.html'
      - 'tests/story/**'
      - '.github/workflows/story-integrity.yml'
  workflow_dispatch:

jobs:
  story-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify story integrity structure
        run: |
          for file in story.css storyintegrity.js storyruntimeintegrity.js secondworldstoryregistry.js tests/story/source-purity.js tests/story/integrity.js tests/story/flow.js; do
            test -f "$file" || { echo "Missing required story file: $file"; exit 1; }
          done
          for file in storydata-universe-galaxy-beyond.js storydata-universe-local-group-war.js storydata-universe-supercluster-frontier.js storydata-universe-cosmic-web.js storydata-universe-dark-matter-sea.js storydata-universe-deep-space.js storydata-universe-void.js storydata-universe-multi-domain.js storydata-universe-cosmic-center.js storydata-universe-cosmic-unification-war.js; do
            test -f "$file" || { echo "Missing universe story container: $file"; exit 1; }
          done
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const required=['story.css?v=','secondworldstoryregistry.js?v=','storydata-universe-galaxy-beyond.js?v=','storydata-universe-cosmic-unification-war.js?v=','storyintegrity.js?v=','storyruntimeintegrity.js?v='];
          for(const token of required)if(!html.includes(token))throw new Error('index.html missing '+token);
          NODE
      - name: Run raw story source purity
        run: node tests/story/source-purity.js
      - name: Run story data integrity
        run: node tests/story/integrity.js 2>&1 | tee story-integrity-report.txt
      - name: Upload story integrity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-integrity-report
          path: story-integrity-report.txt
          retention-days: 1
      - name: Run story flow regressions
        run: node tests/story/flow.js
