name: Story Integrity

on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'worldmaps-*.js'
      - 'storydata-*.js'
      - 'storyintegrity.js'
      - 'storymigration.js'
      - 'storyprogress.js'
      - 'storyrecordtabs.js'
      - 'storyruntimeintegrity.js'
      - 'gmstorytest.js'
      - 'ui.js'
      - 'combatcore.js'
      - 'battlepipeline.js'
      - 'story-source-purity-ci.js'
      - 'story-integrity-ci.js'
      - 'story-flow-ci.js'
      - '.github/workflows/story-integrity.yml'
  workflow_dispatch:

jobs:
  story-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run raw story source purity
        run: node story-source-purity-ci.js
      - name: Run story data integrity
        run: node story-integrity-ci.js
      - name: Run story flow regressions
        run: node story-flow-ci.js
