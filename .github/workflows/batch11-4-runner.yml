name: One-time Batch 11-4 Review Convergence

on:
  push:
    paths:
      - '.github/workflows/batch11-4-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply batch 11-4 convergence patch
        run: python .github/scripts/batch11-4-patch.py
      - name: Syntax and integrity self-check
        run: |
          set -euo pipefail
          node --check ui.js
          node --check worldmapui.js
          node --check thirdworldui.js
          node --check secondworldmainline.js
          node --check thirdworldintegritycontract.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'ui.js?v=20260928-thirdworld-batch11-4' index.html
          grep -q 'worldmapui.js?v=20260928-thirdworld-batch11-4' index.html
          grep -q 'thirdworldui.js?v=20260928-thirdworld-batch11-4' index.html
          grep -q 'secondworldmainline.js?v=20260928-thirdworld-batch11-4' index.html
          grep -q 'thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-4' index.html
      - name: Commit batch 11-4 to main and remove temporary files
        run: |
          set -euo pipefail
          rm .github/workflows/batch11-4-runner.yml .github/scripts/batch11-4-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Converge cross-era review runtime lifecycle'
          git push origin HEAD:main
