name: tmp-vip-loot-cleanup1
on:
  push:
    paths:
      - '.github/workflows/tmp-vip-loot-cleanup1.yml'
      - '.github/tmp/apply_vip_loot_cleanup1.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cleanup
        run: python .github/tmp/apply_vip_loot_cleanup1.py
      - name: Syntax checks
        run: |
          node --check viplootcore.js
          node --check traitdrop.js
          node --check dungeonbounty.js
          node --check secondworldrewards.js
          node --check secondworldmainline.js
          node --check tests/runtime/js-integrity.js
      - name: Runtime integrity
        run: node tests/runtime/js-integrity.js
      - name: Cleanup temporary files and commit
        run: |
          rm -f .github/tmp/apply_vip_loot_cleanup1.py .github/workflows/tmp-vip-loot-cleanup1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate VIP loot modifier pipeline'
          git push
