name: Batch 2-3 Legacy Comparison Stage Isolation
on:
  push:
    branches: [cleanup-batch2-3-legacy-runtime-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired-comparison-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Verify real game owner and source syntax
        run: |
          node --check scripts/stage-hybrid-preview.cjs
          node --check tests/runtime/cleanup-batch2-3-staging.cjs
          python3 scripts/formal-equipment-identities.py
          node tests/runtime/js-integrity.js
      - name: Build release and verify forbidden old entry
        run: |
          node scripts/build-publish-dry-run.cjs
          node scripts/stage-hybrid-preview.cjs
          node tests/runtime/cleanup-batch2-3-staging.cjs
      - name: Verify official publisher isolation
        run: |
          node scripts/publish-asset-audit.cjs
