name: Batch 12-O2 Apply
on:
  push:
    paths:
      - '.github/workflows/batch12-o2-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync permanent test expectations
        run: |
          sed -i 's/storyruntimeintegrity.js?v=20260928-thirdworld-batch12-o1/storyruntimeintegrity.js?v=20260928-thirdworld-batch12-o2/g' tests/story/flow.js
          sed -i 's/storyui.js?v=20260928-thirdworld-batch12-4/storyui.js?v=20260928-thirdworld-batch12-o2/g' tests/story/flow.js
          sed -i 's/storyprogress.js?v=20260928-thirdworld-batch12-4/storyprogress.js?v=20260928-thirdworld-batch12-o2/g' tests/story/flow.js
          sed -i 's/const VERSION=15;\/.test(storyProgress)/const VERSION=16;\/.test(storyProgress)/g' tests/runtime/js-integrity.js
          sed -i 's/const VERSION=9;\/.test(storyUi)&&\/LIFECYCLE_WAIT_VERSION=1/const VERSION=10;\/.test(storyUi)\&\&\/LIFECYCLE_WAIT_VERSION=2/g' tests/runtime/js-integrity.js
          sed -i 's/Story UI V9 必須提供 lifecycle wait API。/Story UI V10 必須提供 identity lifecycle wait API。/g' tests/runtime/js-integrity.js
      - name: Apply patch
        run: python3 batch12_o2_patch.py
      - name: Self-check
        run: |
          set -euo pipefail
          node --check storyui.js
          node --check storyprogress.js
          node --check storyruntimeintegrity.js
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'storyui.js?v=20260928-thirdworld-batch12-o2' index.html
          grep -q 'storyprogress.js?v=20260928-thirdworld-batch12-o2' index.html
          grep -q 'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-o2' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storyprogress.js storyruntimeintegrity.js tests/story/flow.js tests/runtime/js-integrity.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Converge W3 story completion owner'
          git push origin HEAD:main
