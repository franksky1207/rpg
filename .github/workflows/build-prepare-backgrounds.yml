name: Build prepare backgrounds

on:
  push:
    paths:
      - '.github/workflows/build-prepare-backgrounds.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert prepare sources to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          jobs=[
              ('assets/backgrounds-source/prepare/desktop.png','assets/backgrounds/prepare/desktop.webp',1536),
              ('assets/backgrounds-source/prepare/mobile.png','assets/backgrounds/prepare/mobile.webp',1080),
          ]
          for src_s,dst_s,max_w in jobs:
              src=Path(src_s); dst=Path(dst_s)
              dst.parent.mkdir(parents=True, exist_ok=True)
              im=Image.open(src).convert('RGB')
              if im.width>max_w:
                  h=round(im.height*max_w/im.width)
                  im=im.resize((max_w,h),Image.Resampling.LANCZOS)
              im.save(dst,'WEBP',quality=72,method=6)
              print(src,im.size,'->',dst,dst.stat().st_size,'bytes')
          PY
      - name: Commit optimized backgrounds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/backgrounds/prepare/desktop.webp assets/backgrounds/prepare/mobile.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build optimized prepare backgrounds'
          git push
