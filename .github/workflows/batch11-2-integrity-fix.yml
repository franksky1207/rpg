name: One-time Batch 11-2 Deterministic Integrity Fix

on:
  push:
    paths:
      - '.github/workflows/batch11-2-integrity-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update deterministic review integrity
        shell: python
        run: |
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path); t=p.read_text(encoding='utf-8'); c=t.count(old)
              if c!=1: raise SystemExit(f'{path}: expected one match, found {c}: {old[:100]!r}')
              p.write_text(t.replace(old,new),encoding='utf-8')

          rep('thirdworldcombatintegrity.js','  if(Number(window.THIRD_WORLD_COMBAT_VERSION)!==5)fail("THIRD_WORLD_COMBAT_VERSION","第三紀元戰鬥 adapter 版本應為 5",window.THIRD_WORLD_COMBAT_VERSION);','  if(Number(window.THIRD_WORLD_COMBAT_VERSION)!==6)fail("THIRD_WORLD_COMBAT_VERSION","第三紀元戰鬥 adapter 版本應為 6",window.THIRD_WORLD_COMBAT_VERSION);\n  if(Number(window.THIRD_WORLD_COMBAT_REVIEW_POLICY_VERSION)!==1||Number(window.THIRD_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION)!==1)fail("THIRD_WORLD_REVIEW_POLICY","高維回顧必須宣告固定最終型態與正式 state 隔離政策",{policy:window.THIRD_WORLD_COMBAT_REVIEW_POLICY_VERSION,isolation:window.THIRD_WORLD_COMBAT_REVIEW_STATE_ISOLATION_VERSION});')
          anchor='''  const profile=window.createThirdWorldBossCombatSnapshot(7,{ignoreUnlock:true,formalStartHp:maxHp,state:fakeState()})?.enemyAbilityProfile;\n  const expectedProfile={initiativeBonusPercent:60,comboRate:30,penetrationRate:30,counterRate:30,drainRate:40};\n'''
          insert='''  const reviewState=fakeState();reviewState.thirdWorld.bosses[4].currentHp=0;\n  const reviewBefore=stable(reviewState),reviewSnapshot=window.createThirdWorldBossCombatSnapshot(4,{state:reviewState,review:true});\n  if(!reviewSnapshot||reviewSnapshot.reviewMode!==true||Number(reviewSnapshot.stage)!==9||Number(reviewSnapshot.stageBasisHp)!==Math.floor(maxHp*.1)||Number(reviewSnapshot.enemyStartHp)!==maxHp||Number(reviewSnapshot.enemyHealCap)!==maxHp||Number(reviewSnapshot.formalStartHp)!==0)fail("REVIEW_FINAL_FORM_SNAPSHOT","高維回顧必須固定 Stage 9／10% 最終能力，但以完整 Boss HP 開場",reviewSnapshot||null);\n  const reviewResult=window.runThirdWorldBossCombat(4,{review:true,state:reviewState,player:{hp:1000000000,atk:9999999999,def:9999999999,crit:0,dodge:0},startHp:1000000000,playerHealCap:1000000000,civilizationLevel:0,logs:false,useTestSpecializations:true,markLevels:zeroMarks(),rng:constantRng(.99)});\n  if(reviewResult?.ok!==true||reviewResult?.review!==true||reviewResult?.formalSettlementEligible===true||Number(reviewResult?.effectivePermanentDamage)!==0||Number(reviewResult?.xp)!==0||Number(reviewResult?.dimensionalStrings)!==0||stable(reviewState)!==reviewBefore)fail("REVIEW_STATE_ISOLATION","高維回顧不得產生 settlement、永久削血、EXP、維度之弦或任何正式 state 變更",{result:summary(reviewResult),stateChanged:stable(reviewState)!==reviewBefore});\n\n'''+anchor
          rep('thirdworldcombatintegrity.js',anchor,insert)
          rep('index.html','thirdworldcombatintegrity.js?v=20260927-thirdworld-combat-opt3','thirdworldcombatintegrity.js?v=20260928-thirdworld-batch11-2')
          p=Path('tests/runtime/js-integrity.js'); t=p.read_text(encoding='utf-8'); t=t.replace('thirdworldcombatintegrity.js?v=20260927-thirdworld-combat-opt3','thirdworldcombatintegrity.js?v=20260928-thirdworld-batch11-2'); p.write_text(t,encoding='utf-8')
      - name: Syntax and static integrity self-check
        shell: bash
        run: |
          set -euo pipefail
          node --check thirdworldcombatintegrity.js
          node tests/runtime/js-integrity.js
          git diff --check
      - name: Commit deterministic integrity fix and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/batch11-2-integrity-fix.yml
          git add thirdworldcombatintegrity.js index.html tests/runtime/js-integrity.js
          git commit -m 'Verify higher-dimensional review state isolation'
          git push origin HEAD:main
