name: One-time Earth Story Chinese Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-earth-story-cn-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run one-time Earth story Chinese patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace remaining English story text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('storydata-earth.js')
          s=p.read_text(encoding='utf-8')
          replacements=[
              ('OBSERVATION NODE : ACTIVE','觀測節點：運作中'),
              ('OBSERVATION NODE','觀測節點'),
              ('UNKNOWN','未知節點'),
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit(f'expected text not found: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify story integrity before commit
        run: node story-integrity-ci.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storydata-earth.js
          git commit -m 'Fix remaining English in Earth story data'
          git push origin main
