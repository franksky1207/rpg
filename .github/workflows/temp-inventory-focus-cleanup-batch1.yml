name: Temporary Inventory Focus Cleanup Batch1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-inventory-focus-cleanup-batch1.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor inventory focus owner and self-check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          Path('inventoryfocus.js').write_text('''(function(){\n const VERSION=3;\n const FOCUS_MODE_ENTRY="entry";\n const FOCUS_MODE_POST_REDEEM="post-redeem";\n let pendingMode=null;\n\n function requestEntryFocus(){pendingMode=FOCUS_MODE_ENTRY;return true;}\n function requestPostRedeemFocus(){pendingMode=FOCUS_MODE_POST_REDEEM;return true;}\n function hasLostGear(){return Array.isArray(state?.lostGear)&&state.lostGear.length>0;}\n function hasUpgrade(){\n  if(!Array.isArray(state?.inventory)||typeof window.isActualGearUpgrade!=="function")return false;\n  return state.inventory.some(item=>window.isActualGearUpgrade(item));\n }\n function resolveFocusTarget(mode){\n  if(hasLostGear())return "lost-gear";\n  if(hasUpgrade())return "upgrade";\n  if(mode===FOCUS_MODE_ENTRY)return "top";\n  return "none";\n }\n function scrollTarget(target){\n  if(!target)return false;\n  target.scrollIntoView({block:"center",inline:"nearest",behavior:"auto"});\n  return true;\n }\n function runFocus(mode){\n  if(typeof document==="undefined"||!document.querySelector(".inventory-page"))return false;\n  const target=resolveFocusTarget(mode);\n  if(target==="lost-gear")return scrollTarget(document.querySelector(".inventory-page .lost-gear-card"));\n  if(target==="upgrade")return scrollTarget(document.querySelector('.inventory-page [onclick="equipBestAll()"]'));\n  if(target==="top"&&typeof window.scrollTo==="function")window.scrollTo({top:0,left:0,behavior:"auto"});\n  return true;\n }\n function applyFocus(){\n  if(!pendingMode)return false;\n  const mode=pendingMode;\n  pendingMode=null;\n  const run=()=>runFocus(mode);\n  if(typeof requestAnimationFrame==="function")requestAnimationFrame(()=>requestAnimationFrame(run));\n  else setTimeout(run,0);\n  return true;\n }\n\n window.requestInventoryEntryFocus=requestEntryFocus;\n window.requestInventoryPostRedeemFocus=requestPostRedeemFocus;\n window.applyInventoryFocus=applyFocus;\n window.resolveInventoryFocusTarget=resolveFocusTarget;\n window.inventoryHasEquipmentUpgrade=hasUpgrade;\n window.INVENTORY_FOCUS_VERSION=VERSION;\n})();\n''')

          p=Path('ui.js'); s=p.read_text()
          old='function go(v){inventoryReturnContext=null;if(v==="adventure"){adventureScreen="maps";if(secondWorldActive()&&typeof window.requestSecondWorldAdventureProgressFocus==="function")window.requestSecondWorldAdventureProgressFocus();}if(v==="storyrecord"&&typeof window.prepareStoryRecordEntry==="function")window.prepareStoryRecordEntry();if(v==="calamity"){if(secondWorldActive()){if(typeof window.prepareSecondWorldCivilizationCalamityEntry==="function")window.prepareSecondWorldCivilizationCalamityEntry();}else if(typeof window.prepareCivilizationCalamityEntry==="function")window.prepareCivilizationCalamityEntry();}view=v;render()}'
          new='function go(v){inventoryReturnContext=null;if(v==="adventure"){adventureScreen="maps";if(secondWorldActive()&&typeof window.requestSecondWorldAdventureProgressFocus==="function")window.requestSecondWorldAdventureProgressFocus();}if(v==="storyrecord"&&typeof window.prepareStoryRecordEntry==="function")window.prepareStoryRecordEntry();if(v==="calamity"){if(secondWorldActive()){if(typeof window.prepareSecondWorldCivilizationCalamityEntry==="function")window.prepareSecondWorldCivilizationCalamityEntry();}else if(typeof window.prepareCivilizationCalamityEntry==="function")window.prepareCivilizationCalamityEntry();}if(v==="inventory"&&typeof window.requestInventoryEntryFocus==="function")window.requestInventoryEntryFocus();view=v;render();if(v==="inventory"&&typeof window.applyInventoryFocus==="function")window.applyInventoryFocus()}'
          assert s.count(old)==1, f'go match count={s.count(old)}'
          s=s.replace(old,new,1)
          old='function openAdventureInventory(){inventoryReturnContext=adventureInventoryReturnContext();view="inventory";render()}'
          new='function openAdventureInventory(){inventoryReturnContext=adventureInventoryReturnContext();if(typeof window.requestInventoryEntryFocus==="function")window.requestInventoryEntryFocus();view="inventory";render();if(typeof window.applyInventoryFocus==="function")window.applyInventoryFocus()}'
          assert s.count(old)==1, f'openAdventureInventory match count={s.count(old)}'
          s=s.replace(old,new,1)
          old='function redeemGear(i){const r=redeemLostGear(i);if(!r.ok)return alert(r.reason);save();if(typeof window.requestInventoryPostRedeemFocus==="function")window.requestInventoryPostRedeemFocus();render();if(typeof window.applyInventoryEntryFocus==="function")window.applyInventoryEntryFocus()}'
          new='function redeemGear(i){const r=redeemLostGear(i);if(!r.ok)return alert(r.reason);save();if(typeof window.requestInventoryPostRedeemFocus==="function")window.requestInventoryPostRedeemFocus();render();if(typeof window.applyInventoryFocus==="function")window.applyInventoryFocus()}'
          assert s.count(old)==1, f'redeemGear match count={s.count(old)}'
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('tests/runtime/js-integrity.js'); s=p.read_text()
          replacements={
            'assert(pos("inventoryfocus.js")>pos("equipmentlock.js"),"inventoryfocus.js 必須在 equipmentlock.js 後載入，以共用正式裝備比較 owner。");':'assert(pos("inventoryfocus.js")>pos("equipmentlock.js")&&pos("inventoryfocus.js")>pos("gearupgrade.js"),"inventoryfocus.js 必須在 equipmentlock.js 與 gearupgrade.js 後載入，以共用正式裝備比較 owner。");',
            'assert(/INVENTORY_ENTRY_FOCUS_VERSION=VERSION/.test(inventoryFocus)&&/const VERSION=2;/.test(inventoryFocus),"背包進入定位 owner 應為 V2。");':'assert(/INVENTORY_FOCUS_VERSION=VERSION/.test(inventoryFocus)&&/const VERSION=3;/.test(inventoryFocus),"背包定位 owner 應為 V3。");',
            'assert(/requestInventoryEntryFocus=requestEntryFocus/.test(inventoryFocus)&&/requestInventoryPostRedeemFocus=requestPostRedeemFocus/.test(inventoryFocus)&&/applyInventoryEntryFocus=applyFocus/.test(inventoryFocus),"背包定位必須提供 entry、post-redeem 與 apply API。");':'assert(/requestInventoryEntryFocus=requestEntryFocus/.test(inventoryFocus)&&/requestInventoryPostRedeemFocus=requestPostRedeemFocus/.test(inventoryFocus)&&/applyInventoryFocus=applyFocus/.test(inventoryFocus),"背包定位必須提供 entry、post-redeem 與 apply API。");',
            'const inventoryLostPos=inventoryFocus.indexOf("if(hasLostGear())");\nconst inventoryUpgradePos=inventoryFocus.indexOf("if(hasUpgrade())");\nconst inventoryTopPos=inventoryFocus.indexOf(\'mode==="entry"\');':'const inventoryLostPos=inventoryFocus.indexOf("if(hasLostGear())");\nconst inventoryUpgradePos=inventoryFocus.indexOf("if(hasUpgrade())");\nconst inventoryTopPos=inventoryFocus.indexOf("if(mode===FOCUS_MODE_ENTRY)");',
            'assert(/if\\(args\\[0\\]===\"inventory\"\\)return enterInventory/.test(inventoryFocus)&&/openAdventureInventory=function/.test(inventoryFocus),"首頁與冒險背包入口必須共用同一套 entry focus owner。");':'assert(!/baseGo|baseAdventureInventory|window\\.go=function|window\\.openAdventureInventory=function/.test(inventoryFocus),"背包定位 owner 不得 monkey-patch go 或 openAdventureInventory。");\nassert(/function go\\(v\\)[\\s\\S]*requestInventoryEntryFocus[\\s\\S]*render\\(\\)[\\s\\S]*applyInventoryFocus/.test(ui)&&/function openAdventureInventory\\(\\)[\\s\\S]*requestInventoryEntryFocus[\\s\\S]*render\\(\\)[\\s\\S]*applyInventoryFocus/.test(ui),"首頁與冒險背包正式入口必須直接共用 entry focus owner。");',
            'assert(/mode===\"post-redeem\"/.test(inventoryFocus)||/mode===\"entry\"/.test(inventoryFocus),"背包定位必須區分 entry 與 post-redeem 模式。");':'assert(/FOCUS_MODE_ENTRY="entry"/.test(inventoryFocus)&&/FOCUS_MODE_POST_REDEEM="post-redeem"/.test(inventoryFocus),"背包定位必須以明確常數區分 entry 與 post-redeem 模式。");\nassert(/resolveInventoryFocusTarget=resolveFocusTarget/.test(inventoryFocus),"背包定位必須提供單一純判斷 target resolver。");\nassert(/isActualGearUpgrade/.test(inventoryFocus)&&!/equipmentScore\\(item\\)>/.test(inventoryFocus),"背包較強裝備判定必須委派正式 isActualGearUpgrade owner。");',
            'assert(/function redeemGear\\(i\\)[\\s\\S]*requestInventoryPostRedeemFocus[\\s\\S]*render\\(\\)[\\s\\S]*applyInventoryEntryFocus/.test(ui),"成功贖回後必須在 render 前建立 post-redeem request，並在 render 後套用定位。");':'assert(/function redeemGear\\(i\\)[\\s\\S]*requestInventoryPostRedeemFocus[\\s\\S]*render\\(\\)[\\s\\S]*applyInventoryFocus/.test(ui),"成功贖回後必須在 render 前建立 post-redeem request，並在 render 後套用定位。");',
            'assert(index.includes(\'inventoryfocus.js?v=20260925-inventory-focus-batch2\'),"index.html 必須載入最新 inventoryfocus.js cache-bust。");':'assert(index.includes(\'inventoryfocus.js?v=20260925-inventory-focus-cleanup1\'),"index.html 必須載入最新 inventoryfocus.js cache-bust。");'
          }
          for old,new in replacements.items():
            assert s.count(old)==1, f'integrity replacement match count={s.count(old)} for {old[:60]}'
            s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          olds={
            'inventoryfocus.js?v=20260925-inventory-focus-batch2':'inventoryfocus.js?v=20260925-inventory-focus-cleanup1',
            'ui.js?v=20260925-inventory-focus-batch2':'ui.js?v=20260925-inventory-focus-cleanup1'
          }
          for old,new in olds.items():
            assert s.count(old)==1, f'cache bust match count={s.count(old)} for {old}'
            s=s.replace(old,new,1)
          p.write_text(s)
          PY

          node --check inventoryfocus.js
          node --check ui.js
          node --check tests/runtime/js-integrity.js
          node tests/runtime/js-integrity.js
          grep -q 'INVENTORY_FOCUS_VERSION=VERSION' inventoryfocus.js
          ! grep -q 'INVENTORY_ENTRY_FOCUS_VERSION' inventoryfocus.js
          ! grep -q 'baseGo\|baseAdventureInventory' inventoryfocus.js
          grep -q 'isActualGearUpgrade' inventoryfocus.js
          grep -q 'resolveInventoryFocusTarget=resolveFocusTarget' inventoryfocus.js
          grep -q 'applyInventoryFocus' ui.js
          grep -q 'inventoryfocus.js?v=20260925-inventory-focus-cleanup1' index.html
          grep -q 'ui.js?v=20260925-inventory-focus-cleanup1' index.html

          rm .github/workflows/temp-inventory-focus-cleanup-batch1.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add inventoryfocus.js ui.js tests/runtime/js-integrity.js index.html .github/workflows/temp-inventory-focus-cleanup-batch1.yml
          git commit -m "Refactor inventory focus ownership"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
          gh workflow run story-integrity.yml --ref main
