name: Region 7 Story Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/region7-story-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix region 7 text and cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('storydata-universe-cosmic-filament.js')
          text=p.read_text(encoding='utf-8')
          old='數座 civilian 聚落仍依賴同一批補給站。'
          new='數座民用聚落仍依賴同一批補給站。'
          if text.count(old)!=1:
              raise SystemExit(f'expected one text target, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='storydata-universe-cosmic-filament.js?v=20260923-universe-story-batch3'
          new='storydata-universe-cosmic-filament.js?v=20260923-universe-region7-dialogue1'
          if text.count(old)!=1:
              raise SystemExit(f'expected one cache target, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit region 7 hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storydata-universe-cosmic-filament.js index.html
          git commit -m "Fix and cache universe region 7 stories"
          git push origin main
