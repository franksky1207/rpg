name: Audio candidates localize and validate
on:
  push:
    paths:
      - ".github/workflows/audio-localize.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-localize
  cancel-in-progress: false
jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg probe and decode utilities
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download verified CC0 source assets, measure, and create manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio/assets
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time,urllib.request
          from pathlib import Path
          base='https://opengameart.org/sites/default/files/'
          songs=['sector_0.mp3','airy_0.mp3','pulse_0.mp3','urgent_0.mp3','transmission_1.mp3','victory_4.mp3','hover_0.mp3','title_6.mp3']
          data={}
          for name in songs:
              dest=Path('audio/assets')/name
              if not dest.exists() or dest.stat().st_size<1000:
                  last=None
                  for attempt in range(3):
                      try:
                          request=urllib.request.Request(base+name,headers={'User-Agent':'Mozilla/5.0 CivilizationAudioAssets/1.0','Referer':'https://opengameart.org/'})
                          with urllib.request.urlopen(request,timeout=30) as response:
                              payload=response.read(16*1024*1024+1)
                          if len(payload)>16*1024*1024 or len(payload)<1000 or payload.startswith(b'<!DOCTYPE') or payload.startswith(b'<html'):
                              raise ValueError('invalid audio bytes or HTML response: '+name)
                          dest.write_bytes(payload)
                          break
                      except Exception as ex:
                          last=ex
                          if attempt<2:time.sleep(3*(attempt+1))
                  if not dest.exists():raise RuntimeError(f'Could not download {name}: {last}')
              probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,format_name','-of','json',str(dest)],capture_output=True,text=True,check=True)
              info=json.loads(probe.stdout).get('format',{})
              duration=float(info.get('duration',0))
              if duration<0.05:raise RuntimeError('No decodable audio duration: '+name)
              measure=subprocess.run(['ffmpeg','-nostdin','-hide_banner','-i',str(dest),'-af','volumedetect','-f','null','-'],capture_output=True,text=True,check=True)
              import re
              values=re.findall(r'mean_volume:\s*(-?[\d.]+) dB',measure.stderr)
              if not values:raise RuntimeError('Unable to measure audio signal: '+name)
              data[name]={'source':base+name,'license':'CC0','author':'SRG774','source_page':'https://opengameart.org/content/dark-sci-fi-audio-pack','bytes':dest.stat().st_size,'sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'duration_seconds':round(duration,3),'mean_volume_db':float(values[-1]),'signal_checked':True,'human_auditioned':False}
          Path('audio/assets/manifest.json').write_text(json.dumps({'version':1,'assets':data},indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('Validated',len(data),'source audio files; user audition still required.')
          PY
      - name: Commit materialized audio only after successful verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/assets/
          if git diff --cached --quiet; then
            echo "All audio assets already in the repository"
          else
            git commit -m "audio: localize CC0 source pack with signal and SHA256 manifest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
