name: Temporary Inventory Focus Integrity Batch2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-inventory-focus-integrity-batch2.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade inventory focus integrity behavior tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 .github/tmp/apply_inventory_focus_integrity.py
          node --check tests/runtime/js-integrity.js
          node tests/runtime/js-integrity.js
          grep -q 'Inventory Focus behavior contract' tests/runtime/js-integrity.js
          grep -q '最後一件贖回後若有較強裝備' tests/runtime/js-integrity.js
          ! grep -q '背包進入定位優先序' tests/runtime/js-integrity.js
          rm .github/tmp/apply_inventory_focus_integrity.py
          rm .github/workflows/temp-inventory-focus-integrity-batch2.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add tests/runtime/js-integrity.js .github/tmp/apply_inventory_focus_integrity.py .github/workflows/temp-inventory-focus-integrity-batch2.yml
          git commit -m "Strengthen inventory focus behavior integrity"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
