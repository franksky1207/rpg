name: Batch 12-1 Story Registry
on:
  push:
    paths:
      - '.github/workflows/batch12-1-story-registry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update cache-bust
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          replacements={
            'secondworldstoryregistry.js?v=20260923-universe-story-batch3':'secondworldstoryregistry.js?v=20260928-thirdworld-batch12-1',
            'storyruntimeintegrity.js?v=20260918-retire-backfill1':'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-1'
          }
          for old,new in replacements.items():
            if text.count(old)!=1: raise SystemExit('cache anchor mismatch: '+old)
            text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Self-check
        shell: bash
        run: |
          node --check secondworldstoryregistry.js
          node --check storyruntimeintegrity.js
          node tests/story/flow.js
          node tests/story/integrity.js
          node tests/story/meta-language.js
          node tests/story/source-purity.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'secondworldstoryregistry.js?v=20260928-thirdworld-batch12-1' index.html
          grep -q 'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-1' index.html
      - name: Commit cache-bust
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync batch 12-1 story cache-bust'
          git push origin HEAD:main