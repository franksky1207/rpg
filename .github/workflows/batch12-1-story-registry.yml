name: Batch 12-1 Story Registry
on:
  push:
    paths:
      - '.github/workflows/batch12-1-story-registry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply batch 12-1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = r'''(function(){
 const VERSION=2;
 const SHARED_ERA_REGISTRY_VERSION=1;
 const THIRD_WORLD_TRIGGER_REGISTRY_VERSION=1;
 const THIRD_WORLD_TRIGGER_POLICY_VERSION=1;
 const ERA_ID="universe";
 const eraDefinitions=new Map();

 function freeze(value){return Object.freeze(value);}
 function refreshEraSnapshot(){window.CIVILIZATION_STORY_ERAS=freeze(Object.fromEntries(Array.from(eraDefinitions.entries())));return window.CIVILIZATION_STORY_ERAS;}
 function registerStoryEra(definition){
  if(!definition||typeof definition!=="object")return null;
  const id=String(definition.id||"").trim();
  if(!id||typeof definition.regions!=="function")return null;
  const normalized=freeze({...definition,id,name:String(definition.name||id),regions:definition.regions});
  eraDefinitions.set(id,normalized);refreshEraSnapshot();return normalized;
 }
 function storyEraDefinition(id){return eraDefinitions.get(String(id||""))||null;}
 function storyEraIds(){return freeze(Array.from(eraDefinitions.keys()));}

 registerStoryEra({id:"galaxy",name:"銀河紀元",regions:()=>Array.isArray(window.CIVILIZATION_STORY_REGIONS)?window.CIVILIZATION_STORY_REGIONS:[]});

 function regions(){return Array.isArray(window.SECOND_WORLD_REGIONS)?window.SECOND_WORLD_REGIONS:[];}
 function bosses(){return Array.isArray(window.SECOND_WORLD_BOSSES)?window.SECOND_WORLD_BOSSES:[];}
 function storyIdForBossIndex(value){
  const index=Math.floor(Number(value));
  const boss=bosses()[index];
  if(!boss)return null;
  const region=regions().find(row=>Number(row.index)===Number(boss.regionIndex));
  if(!region)return null;
  const offset=index-Number(region.firstBossIndex);
  if(offset<0||offset>9)return null;
  return `universe-${region.id}-boss-${offset+1}`;
 }
 function bossIndexForStoryId(id){
  if(typeof id!=="string"||!id)return null;
  for(let index=0;index<bosses().length;index++)if(storyIdForBossIndex(index)===id)return index;
  return null;
 }
 function buildRegistry(){
  return regions().map(region=>freeze({
   id:String(region.id),
   name:String(region.name),
   era:ERA_ID,
   stories:freeze(bosses().filter(boss=>Number(boss.regionIndex)===Number(region.index)).map(boss=>freeze({
    id:storyIdForBossIndex(boss.index),
    label:String(boss.name),
    bossIndex:Number(boss.index),
    bossLevel:Number(boss.level),
    finale:Number(boss.index)===Number(region.lastBossIndex)
   })))
  }));
 }

 const registry=freeze(buildRegistry());
 window.CIVILIZATION_UNIVERSE_STORY_REGIONS=registry;
 registerStoryEra({id:ERA_ID,name:"宇宙紀元",regions:()=>registry});

 function titleThreshold(stage){
  const value=Math.max(1,Math.min(10,Math.floor(Number(stage)||0)));
  const def=typeof window.thirdWorldTitleDefinition==="function"?window.thirdWorldTitleDefinition(value):null;
  const threshold=Number(def?.thresholdRemainingPercentSum);
  return Number.isFinite(threshold)?threshold:null;
 }
 const thirdWorldTriggers=freeze([
  freeze({id:"higher-dimensional-intro",storyId:"higher-dimensional-intro",kind:"intro",stage:0,thresholdRemainingPercentSum:null,contentReady:false}),
  ...Array.from({length:9},(_,index)=>{
   const stage=index+1;
   return freeze({id:`higher-dimensional-milestone-${String(stage).padStart(2,"0")}`,storyId:`higher-dimensional-milestone-${String(stage).padStart(2,"0")}`,kind:"milestone",stage,thresholdRemainingPercentSum:titleThreshold(stage),contentReady:false});
  }),
  freeze({id:"higher-dimensional-final",storyId:"higher-dimensional-final",kind:"final",stage:10,thresholdRemainingPercentSum:titleThreshold(10),completionGate:"all-bosses-defeated",contentReady:false})
 ]);
 function thirdWorldStoryTriggerDescriptors(){return thirdWorldTriggers;}
 function thirdWorldStoryTriggerForStage(value){const stage=Math.floor(Number(value));return thirdWorldTriggers.find(row=>row.stage===stage&&row.kind!=="intro")||null;}
 function thirdWorldStoryTriggerDescriptor(value){
  if(typeof value==="number")return thirdWorldStoryTriggerForStage(value);
  const id=String(value||"");return thirdWorldTriggers.find(row=>row.id===id||row.storyId===id)||null;
 }
 registerStoryEra({id:"higher-dimensional",name:"高維紀元",regions:()=>[],triggers:thirdWorldStoryTriggerDescriptors});

 function validateSharedRegistry(){
  const errors=[];
  const ids=storyEraIds();
  if(JSON.stringify(ids)!==JSON.stringify(["galaxy","universe","higher-dimensional"]))errors.push("ERA_ORDER");
  if(registry.length!==10||registry.some(row=>row.stories.length!==10))errors.push("UNIVERSE_REGISTRY");
  if(thirdWorldTriggers.length!==11)errors.push("THIRD_WORLD_TRIGGER_COUNT");
  const milestones=thirdWorldTriggers.filter(row=>row.kind==="milestone"),finals=thirdWorldTriggers.filter(row=>row.kind==="final"),intros=thirdWorldTriggers.filter(row=>row.kind==="intro");
  if(intros.length!==1||milestones.length!==9||finals.length!==1)errors.push("THIRD_WORLD_TRIGGER_TYPES");
  const expectedThresholds=Array.from({length:9},(_,index)=>titleThreshold(index+1));
  if(JSON.stringify(milestones.map(row=>row.stage))!==JSON.stringify([1,2,3,4,5,6,7,8,9]))errors.push("THIRD_WORLD_MILESTONE_STAGES");
  if(JSON.stringify(milestones.map(row=>row.thresholdRemainingPercentSum))!==JSON.stringify(expectedThresholds))errors.push("THIRD_WORLD_MILESTONE_THRESHOLDS");
  if(finals[0]?.stage!==10||finals[0]?.thresholdRemainingPercentSum!==titleThreshold(10)||milestones.some(row=>row.stage===10))errors.push("THIRD_WORLD_FINAL_STAGE10");
  return freeze({version:SHARED_ERA_REGISTRY_VERSION,passed:errors.length===0,eraIds:ids,thirdWorldTriggerCount:thirdWorldTriggers.length,errors:freeze(errors)});
 }

 window.registerCivilizationStoryEra=registerStoryEra;
 window.getCivilizationStoryEra=storyEraDefinition;
 window.getCivilizationStoryEraIds=storyEraIds;
 window.thirdWorldStoryTriggerDescriptors=thirdWorldStoryTriggerDescriptors;
 window.thirdWorldStoryTriggerForStage=thirdWorldStoryTriggerForStage;
 window.thirdWorldStoryTriggerDescriptor=thirdWorldStoryTriggerDescriptor;
 window.CIVILIZATION_STORY_ERA_REGISTRY_VERSION=SHARED_ERA_REGISTRY_VERSION;
 window.THIRD_WORLD_STORY_TRIGGER_REGISTRY_VERSION=THIRD_WORLD_TRIGGER_REGISTRY_VERSION;
 window.THIRD_WORLD_STORY_TRIGGER_POLICY_VERSION=THIRD_WORLD_TRIGGER_POLICY_VERSION;
 window.THIRD_WORLD_STORY_TRIGGER_DESCRIPTORS=thirdWorldTriggers;
 window.CIVILIZATION_STORY_ERA_REGISTRY_INTEGRITY=validateSharedRegistry();
 window.universeStoryIdForBossIndex=storyIdForBossIndex;
 window.universeBossIndexForStoryId=bossIndexForStoryId;
 window.UNIVERSE_STORY_REGISTRY_VERSION=VERSION;
 window.UNIVERSE_STORY_REGISTRY_READY=registry.length===10&&registry.every(region=>region.stories.length===10)&&new Set(registry.flatMap(region=>region.stories.map(row=>row.id))).size===100;
})();'''
          Path('secondworldstoryregistry.js').write_text(registry,encoding='utf-8')

          runtime = r'''(function(){
 const VERSION=12;
 function run(){
  const errors=[],warnings=[],fail=(code,message,data=null)=>errors.push({code,message,data});const data=window.runCivilizationStoryIntegrity?.();
  if(!data||data.passed!==true)fail("STORY_RUNTIME_DATA_INTEGRITY_FAILED","正式劇情資料完整性檢查未通過",data?.errors||[]);if(Number(data?.galaxyStories)!==101)fail("STORY_RUNTIME_GALAXY_COUNT",`銀河紀元必須維持 101 篇，實際 ${Number(data?.galaxyStories)||0}`);if(Number(data?.universeStoriesExpected)!==100)fail("STORY_RUNTIME_UNIVERSE_REGISTRY_COUNT",`宇宙紀元 Registry 必須為 100 篇，實際 ${Number(data?.universeStoriesExpected)||0}`);if(window.UNIVERSE_STORY_REGISTRY_READY!==true)fail("STORY_RUNTIME_UNIVERSE_REGISTRY_READY","宇宙紀元 10 區／100 Boss Registry 未就緒");
  if(Number(window.CIVILIZATION_STORY_ERA_REGISTRY_VERSION)!==1)fail("STORY_RUNTIME_SHARED_ERA_REGISTRY","三紀元共用 Story Era Registry owner 未就緒");
  const eraIds=typeof window.getCivilizationStoryEraIds==="function"?Array.from(window.getCivilizationStoryEraIds()):[];
  if(JSON.stringify(eraIds)!==JSON.stringify(["galaxy","universe","higher-dimensional"]))fail("STORY_RUNTIME_ERA_ORDER","Story Era Registry 應依序包含銀河／宇宙／高維",eraIds);
  if(window.CIVILIZATION_STORY_ERA_REGISTRY_INTEGRITY?.passed!==true)fail("STORY_RUNTIME_ERA_REGISTRY_INTEGRITY","Story Era Registry 自我檢查失敗",window.CIVILIZATION_STORY_ERA_REGISTRY_INTEGRITY||null);
  const triggers=typeof window.thirdWorldStoryTriggerDescriptors==="function"?Array.from(window.thirdWorldStoryTriggerDescriptors()):[];
  const milestones=triggers.filter(row=>row?.kind==="milestone"),finals=triggers.filter(row=>row?.kind==="final"),intros=triggers.filter(row=>row?.kind==="intro");
  if(Number(window.THIRD_WORLD_STORY_TRIGGER_REGISTRY_VERSION)!==1||Number(window.THIRD_WORLD_STORY_TRIGGER_POLICY_VERSION)!==1||triggers.length!==11||intros.length!==1||milestones.length!==9||finals.length!==1)fail("STORY_RUNTIME_THIRD_WORLD_TRIGGER_SHAPE","高維 Trigger Registry 必須為序章 1＋900～100% milestone 9＋0% final 1",triggers);
  const expectedStages=[1,2,3,4,5,6,7,8,9];
  if(JSON.stringify(milestones.map(row=>row.stage))!==JSON.stringify(expectedStages))fail("STORY_RUNTIME_THIRD_WORLD_MILESTONE_STAGES","高維 milestone stage 必須為 1～9",milestones);
  const expectedThresholds=expectedStages.map(stage=>Number(window.thirdWorldTitleDefinition?.(stage)?.thresholdRemainingPercentSum));
  if(JSON.stringify(milestones.map(row=>row.thresholdRemainingPercentSum))!==JSON.stringify(expectedThresholds))fail("STORY_RUNTIME_THIRD_WORLD_THRESHOLD_OWNER","高維 milestone 門檻必須直接對齊 thirdWorldTitleDefinition owner",{actual:milestones.map(row=>row.thresholdRemainingPercentSum),expected:expectedThresholds});
  const final=finals[0]||null,finalThreshold=Number(window.thirdWorldTitleDefinition?.(10)?.thresholdRemainingPercentSum);
  if(final?.stage!==10||final?.thresholdRemainingPercentSum!==finalThreshold||milestones.some(row=>row.stage===10))fail("STORY_RUNTIME_THIRD_WORLD_FINAL_STAGE10","stage 10／0% 必須只對應 final，不得再有第 10 段 milestone",final);
  if(triggers.some(row=>row.contentReady!==false))fail("STORY_RUNTIME_THIRD_WORLD_CONTENT_PLACEHOLDER","第 12-1 批 Trigger Descriptor 只能是技術 placeholder，不得宣告正式內容已就緒");
  if(typeof window.openStory!=="function"||typeof window.isStoryOpen!=="function")fail("STORY_RUNTIME_UI_MISSING","共用正式劇情視窗未完整載入");const progress=window.civilizationStoryProgress;["normalize","resume","get","setPending","completeStory","queueBossStory","queueUniverseBossStory","bossStoryId","universeBossStoryId","universeBossIndexForStory","completedStories"].forEach(name=>{if(typeof progress?.[name]!=="function")fail("STORY_RUNTIME_PROGRESS_METHOD",`civilizationStoryProgress.${name} 未載入`);});if(Number(window.UNIVERSE_STORY_FIRST_CLEAR_HOOK_VERSION)!==1)fail("STORY_RUNTIME_UNIVERSE_FIRST_CLEAR_HOOK","宇宙紀元首次擊破劇情 hook 未載入");
  ["replayCompletedStory","storyRecordPageHtml","selectStoryRecordRegion","prepareStoryRecordEntry","setStoryRecordEraView"].forEach(name=>{if(typeof window[name]!=="function")fail("STORY_RUNTIME_RECORD_METHOD",`${name} 未載入`);});["gmStoryTestHtml","gmStoryChangeEra","gmPreviewStory","gmStoryMoveRegion","gmStoryMoveEntry","gmStoryRunIntegrity"].forEach(name=>{if(typeof window[name]!=="function")fail("STORY_RUNTIME_GM_METHOD",`${name} 未載入`);});
  const universeBosses=Array.isArray(window.SECOND_WORLD_BOSSES)?window.SECOND_WORLD_BOSSES:[],universeIds=new Set();universeBosses.forEach((boss,index)=>{const id=progress?.universeBossStoryId?.(index);if(!id)fail("STORY_RUNTIME_UNIVERSE_MAPPING_EMPTY",`宇宙 Boss ${index} 無故事 id`);else universeIds.add(id);const reverse=progress?.universeBossIndexForStory?.(id);if(reverse!==index)fail("STORY_RUNTIME_UNIVERSE_MAPPING_REVERSE",`${id} 反向對應錯誤`,{expected:index,actual:reverse});if(Number(boss.level)!==505+index*5)fail("STORY_RUNTIME_UNIVERSE_LEVEL_SEQUENCE",`宇宙 Boss ${index} 等級序列錯誤`);});if(universeIds.size!==100)fail("STORY_RUNTIME_UNIVERSE_MAPPING_COUNT",`宇宙紀元應有 100 個唯一故事對應，實際 ${universeIds.size}`);
  if(typeof state!=="undefined"&&state&&progress?.get){try{const before=JSON.stringify(state.storyProgress??null),p=progress.get();if(JSON.stringify(state.storyProgress??null)!==before)fail("STORY_RUNTIME_PROGRESS_GET_MUTATED","讀取故事進度時不應修改 storyProgress");if(p?.pendingStory&&!window.CIVILIZATION_STORIES?.[p.pendingStory])fail("STORY_RUNTIME_PENDING_UNKNOWN",`pendingStory 找不到正式資料：${p.pendingStory}`);}catch(error){fail("STORY_RUNTIME_PROGRESS_GET_FAILED","讀取故事進度時發生錯誤",String(error?.message||error));}}
  const report={passed:errors.length===0,version:VERSION,checkedAt:Date.now(),dataIntegrityPassed:data?.passed===true,galaxyStories:Number(data?.galaxyStories)||0,universeRegistry:universeIds.size,universeStoriesLoaded:Number(data?.universeStoriesLoaded)||0,targetStories:201,eraIds,thirdWorldTriggerCount:triggers.length,firstClearHook:Number(window.UNIVERSE_STORY_FIRST_CLEAR_HOOK_VERSION)||0,errors,warnings};window.STORY_RUNTIME_INTEGRITY_REPORT=report;if(!report.passed)console.error("[文明戰線] 劇情執行期完整性檢查失敗",report);else console.info("[文明戰線] 劇情執行期完整性檢查通過",report);return report;
 }
 window.STORY_RUNTIME_INTEGRITY_VERSION=VERSION;window.runCivilizationStoryRuntimeIntegrity=run;run();
})();'''
          Path('storyruntimeintegrity.js').write_text(runtime,encoding='utf-8')

          flow=Path('tests/story/flow.js').read_text(encoding='utf-8')
          flow=flow.replace("const progress=fs.readFileSync('storyprogress.js','utf8');", "const progress=fs.readFileSync('storyprogress.js','utf8');\nconst eraRegistry=fs.readFileSync('secondworldstoryregistry.js','utf8');")
          anchor="assert(/UNIVERSE_STORY_FIRST_CLEAR_HOOK_VERSION=1/.test(progress),'宇宙首殺 hook 版本遺失');"
          addition="""assert(/CIVILIZATION_STORY_ERA_REGISTRY_VERSION=SHARED_ERA_REGISTRY_VERSION/.test(eraRegistry)&&/const SHARED_ERA_REGISTRY_VERSION=1;/.test(eraRegistry),'三紀元共用 Story Era Registry owner 應為 V1');
assert(/registerStoryEra\(\{id:\"galaxy\"/.test(eraRegistry)&&/registerStoryEra\(\{id:ERA_ID/.test(eraRegistry)&&/registerStoryEra\(\{id:\"higher-dimensional\"/.test(eraRegistry),'銀河／宇宙／高維必須註冊到同一 Story Era owner');
assert(/THIRD_WORLD_STORY_TRIGGER_REGISTRY_VERSION=THIRD_WORLD_TRIGGER_REGISTRY_VERSION/.test(eraRegistry)&&/const THIRD_WORLD_TRIGGER_REGISTRY_VERSION=1;/.test(eraRegistry),'高維 Trigger Registry 應為 V1');
assert(/Array\.from\(\{length:9\}/.test(eraRegistry)&&/kind:\"final\",stage:10/.test(eraRegistry),'高維 Trigger 必須為 9 個 milestone，stage 10 只保留 final');
assert(/thirdWorldTitleDefinition/.test(eraRegistry)&&!/thresholdRemainingPercentSum:900/.test(eraRegistry),'高維 Trigger 門檻必須委派 thirdWorldTitleDefinition，不得複製 900～0 公式');
"""
          if anchor not in flow: raise SystemExit('flow anchor missing')
          flow=flow.replace(anchor,anchor+'\n'+addition,1)
          flow=flow.replace("assert(index.includes('secondworldstoryregistry.js?v='),'index.html 必須正式載入 secondworldstoryregistry.js');", "assert(index.includes('secondworldstoryregistry.js?v=20260928-thirdworld-batch12-1'),'index.html 必須載入 Batch 12-1 三紀元共用 Story Registry cache-bust');")
          flow=flow.replace("assert(index.indexOf('secondworldstoryregistry.js?v=')<index.indexOf('storydata-universe-galaxy-beyond.js?v='),'宇宙 Registry 必須早於正式劇情資料載入');", "assert(index.indexOf('secondworldstoryregistry.js?v=')<index.indexOf('storydata-universe-galaxy-beyond.js?v='),'共用 Story Era Registry／宇宙 Registry 必須早於正式劇情資料載入');")
          flow=flow.replace("console.log('STORY FLOW PASSED | galaxy owner preserved | universe formal runtime load=yes | containers=10 | region5=10 | shared finale marker=yes | target=201');", "console.log('STORY FLOW PASSED | shared eras=galaxy/universe/higher-dimensional | W3 triggers=11 | stage10=final-only | target=201');")
          Path('tests/story/flow.js').write_text(flow,encoding='utf-8')

          index=Path('index.html').read_text(encoding='utf-8')
          old='secondworldstoryregistry.js?v=20260923-universe-story-batch3'
          new='secondworldstoryregistry.js?v=20260928-thirdworld-batch12-1'
          if index.count(old)!=1: raise SystemExit('secondworldstoryregistry cache anchor mismatch')
          index=index.replace(old,new,1)
          old='storyruntimeintegrity.js?v=20260918-retire-backfill1'
          new='storyruntimeintegrity.js?v=20260928-thirdworld-batch12-1'
          if index.count(old)!=1: raise SystemExit('storyruntimeintegrity cache anchor mismatch')
          index=index.replace(old,new,1)
          Path('index.html').write_text(index,encoding='utf-8')
          PY
      - name: Self-check
        shell: bash
        run: |
          node --check secondworldstoryregistry.js
          node --check storyruntimeintegrity.js
          node tests/story/flow.js
          node tests/story/integrity.js
          node tests/story/meta-language.js
          node tests/story/source-purity.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'secondworldstoryregistry.js?v=20260928-thirdworld-batch12-1' index.html
          grep -q 'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-1' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondworldstoryregistry.js storyruntimeintegrity.js tests/story/flow.js index.html
          git commit -m 'Build shared story era trigger registry'
          git push origin HEAD:main