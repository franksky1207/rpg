name: Batch 12-1 Story Registry
on:
  push:
    paths:
      - '.github/workflows/batch12-1-story-registry.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply batch 12-1
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode('')))"
      - name: Self-check
        shell: bash
        run: |
          node --check secondworldstoryregistry.js
          node --check storyruntimeintegrity.js
          node tests/story/flow.js
          node tests/story/integrity.js
          node tests/story/meta-language.js
          node tests/story/source-purity.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'secondworldstoryregistry.js?v=20260928-thirdworld-batch12-1' index.html
          grep -q 'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-1' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add secondworldstoryregistry.js storyruntimeintegrity.js index.html
          git commit -m 'Build shared story era trigger registry'
          git push origin HEAD:main