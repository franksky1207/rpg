name: Runtime Integrity
'on':
  push:
    branches:
    - main
    paths:
    - '**/*.js'
    - tests/runtime/foreground-combat-*.cjs
    - tests/runtime/pr48-*.cjs
    - tests/runtime/pr48-*.mjs
    - tests/runtime/pr48-approved-presentation.json
    - tests/runtime/unified-mobile-combat-viewport*.cjs
    - tests/runtime/3d-formal-snapshots-contract.cjs
    - tests/runtime/t3a-hybrid-policy.cjs
    - tests/runtime/t3b-formal-projection.cjs
    - tests/runtime/t3b-formal-session.cjs
    - tests/runtime/t3b-formal-assets.cjs
    - tests/runtime/t3b-formal-renderer.cjs
    - tests/runtime/t3b-formal-controller.cjs
    - tests/runtime/t3b-formal-owner-clock.cjs
    - 3d-test/t3b-formal-projection.js
    - 3d-test/t3b-formal-session.js
    - 3d-test/t3b-formal-assets.js
    - 3d-test/t3a-hybrid-policy.js
    - tests/runtime/combat-events-contract.cjs
    - tests/runtime/combat-events-integration.cjs
    - index.html
    - alternateuniverse.css
    - adventureuipolish.css
    - thirdworldarena.css
    - assets/**
    - docs/**
    - .github/workflows/runtime-integrity.yml
    - scripts/ci-*
    - .github/actions/setup-ci-browser/**
  pull_request:
    paths:
    - 3d-test/monster-*.mjs
    - monstercodex*.js
    - monstercodex*.mjs
    - gmdata.js
    - resource-cache-client.js
    - tests/runtime/foreground-combat-*.cjs
    - tests/runtime/pr48-*.cjs
    - tests/runtime/unified-mobile-combat-viewport*.cjs
    - combat-viewport-coordinator.js
    - battle-mobile-viewport.css
    - .github/workflows/runtime-integrity.yml
    - scripts/ci-*
    - .github/actions/setup-ci-browser/**
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Run full JavaScript syntax and owner integrity
      run: |
        set -o pipefail
        node tests/runtime/batch20-approved-runtime.cjs
        node tests/runtime/unified-mobile-combat-viewport.cjs
        node tests/runtime/pr48-stop-contract.cjs
        node --test tests/runtime/pr48-sprite-warmup.test.mjs
        node tests/runtime/js-integrity.js 2>&1 | tee runtime-integrity-report.txt
        node tests/runtime/cleanup-batch4-4-final-guard.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/3d-formal-snapshots-contract.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/combat-events-contract.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/combat-events-integration.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/3d-shared-loader-contract.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t3a-hybrid-policy.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t3b-formal-bridge.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t3b-formal-projection.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t3b-formal-session.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t3b-formal-assets.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t3b-formal-renderer.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t3b-formal-controller.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/t4-preview-retirement.cjs
        node tests/runtime/cleanup-batch4-3-current-inventory.cjs
        node tests/runtime/t3b-formal-owner-clock.cjs 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/resource-manifest-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/save-global-writers.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/newstate-save-owner-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/gm-runtime-early-restore-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/gm-runtime-auth-preferences-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-data-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-attempt-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-combat-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-failure-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-progression-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-ui-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-batch4-3-regression.js 2>&1 | tee -a runtime-integrity-report.txt
        node tests/runtime/alternate-universe-old-save-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
    - name: Verify resource cache behavior and current audio contract
      run: |
        node tests/runtime/3d-equipment-contract.cjs
        node tests/runtime/3d-batch28-preflight.cjs
        node tests/runtime/resource-cache-integrity.js
        node tests/runtime/resource-cache-behavior.js
        node tests/runtime/resource-cache-prefetch-integrity.js
        node tests/audio-lifecycle.test.cjs
        node tests/audio-regression.test.cjs
        node tests/runtime/3d-asset-registry-integrity.cjs
    - name: Run unlimited VIP integrity
      run: set -o pipefail; node tests/runtime/vip-unbounded-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
    - name: Run GM mainline HP lock integrity
      run: set -o pipefail; node tests/runtime/gm-mainline-hp-lock-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
    - name: Run background asset integrity
      run: set -o pipefail; node tests/runtime/asset-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
    - name: Run project documentation integrity
      run: set -o pipefail; node tests/runtime/docs-integrity.js 2>&1 | tee -a runtime-integrity-report.txt
    - name: Install Node-only validation dependency
      run: npm install --no-save gltf-validator@2.0.0-dev.3.10
    - name: Run runtime-node-regression with command timings
      shell: bash
      run: |
        set -euo pipefail
        node scripts/ci-run-suite.cjs runtime-node-regression
    - name: Upload runtime integrity diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: runtime-integrity-report
        path: |
          runtime-integrity-report.txt
          ci-suite-*.json
          3d-player-browser-report.json
          3d-equipment-browser-report.json
          audio-lifecycle-browser-report.json
          combat-events-browser-report.json
          combat-events-owner-browser-report.json
          /tmp/foreground-combat-*.json
          /tmp/pr48-viewport-browser.json
          /tmp/pr48-live-combat.json
          /tmp/pr48-mode-matrix.json
          /tmp/t3b-formal-renderer-browser.json
          /tmp/batch28-consolidated
        if-no-files-found: ignore
        retention-days: 1
      if: always()
  runtime-r1:
    name: R1 — Core and saves
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium
    - name: Run R1 with command timings
      shell: bash
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ci-http.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        curl -fsS http://127.0.0.1:4173/index.html >/dev/null
        node scripts/ci-run-suite.cjs R1
    - name: Upload runtime browser regression diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-R1-${{ github.run_attempt }}
        path: |-
          runtime-integrity-report.txt
          3d-player-browser-report.json
          3d-equipment-browser-report.json
          audio-lifecycle-browser-report.json
          combat-events-browser-report.json
          combat-events-owner-browser-report.json
          /tmp/foreground-combat-*.json
          /tmp/pr48-viewport-browser.json
          /tmp/pr48-live-combat.json
          /tmp/pr48-mode-matrix.json
          /tmp/t3b-formal-renderer-browser.json
          /tmp/batch28-consolidated

          ci-suite-*.json
          /tmp/ci-http.log
        if-no-files-found: ignore
        retention-days: 1
  runtime-r2:
    name: R2 — Combat and eras
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium webkit
    - name: Run R2 with command timings
      shell: bash
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ci-http.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        curl -fsS http://127.0.0.1:4173/index.html >/dev/null
        node scripts/ci-run-suite.cjs R2
    - name: Upload runtime browser regression diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-R2-${{ github.run_attempt }}
        path: |-
          runtime-integrity-report.txt
          3d-player-browser-report.json
          3d-equipment-browser-report.json
          audio-lifecycle-browser-report.json
          combat-events-browser-report.json
          combat-events-owner-browser-report.json
          /tmp/foreground-combat-*.json
          /tmp/pr48-viewport-browser.json
          /tmp/pr48-live-combat.json
          /tmp/pr48-mode-matrix.json
          /tmp/t3b-formal-renderer-browser.json
          /tmp/batch28-consolidated

          ci-suite-*.json
          /tmp/ci-http.log
        if-no-files-found: ignore
        retention-days: 1
  runtime-r3:
    name: R3 — Reincarnation and progression
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium
    - name: Run R3 with command timings
      shell: bash
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ci-http.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        curl -fsS http://127.0.0.1:4173/index.html >/dev/null
        node scripts/ci-run-suite.cjs R3
    - name: Upload runtime browser regression diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-R3-${{ github.run_attempt }}
        path: |-
          runtime-integrity-report.txt
          3d-player-browser-report.json
          3d-equipment-browser-report.json
          audio-lifecycle-browser-report.json
          combat-events-browser-report.json
          combat-events-owner-browser-report.json
          /tmp/foreground-combat-*.json
          /tmp/pr48-viewport-browser.json
          /tmp/pr48-live-combat.json
          /tmp/pr48-mode-matrix.json
          /tmp/t3b-formal-renderer-browser.json
          /tmp/batch28-consolidated

          ci-suite-*.json
          /tmp/ci-http.log
        if-no-files-found: ignore
        retention-days: 1
  runtime-r4:
    name: R4 — Browser and resources
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: ./.github/actions/setup-ci-browser
      with:
        browsers: chromium
    - name: Run R4 with command timings
      shell: bash
      run: |
        set -euo pipefail
        python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ci-http.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for i in {1..40}; do
          if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
          sleep 0.25
        done
        curl -fsS http://127.0.0.1:4173/index.html >/dev/null
        node scripts/ci-run-suite.cjs R4
    - name: Upload runtime browser regression diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-R4-${{ github.run_attempt }}
        path: |-
          runtime-integrity-report.txt
          3d-player-browser-report.json
          3d-equipment-browser-report.json
          audio-lifecycle-browser-report.json
          combat-events-browser-report.json
          combat-events-owner-browser-report.json
          /tmp/foreground-combat-*.json
          /tmp/pr48-viewport-browser.json
          /tmp/pr48-live-combat.json
          /tmp/pr48-mode-matrix.json
          /tmp/t3b-formal-renderer-browser.json
          /tmp/batch28-consolidated

          ci-suite-*.json
          /tmp/ci-http.log
        if-no-files-found: ignore
        retention-days: 1
  gate:
    name: runtime-integrity-gate
    needs:
    - runtime-integrity
    - runtime-r1
    - runtime-r2
    - runtime-r3
    - runtime-r4
    if: always()
    runs-on: ubuntu-latest
    steps:
    - env:
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYGATE'
        import os,json
        jobs=json.loads(os.environ['NEEDS_JSON'])
        for name,item in jobs.items():
            print(name,item['result'])
            assert item['result']=='success', f"required job {name} did not pass"
        PYGATE
permissions:
  contents: read
