name: Normalize High Dimension Term
on:
  push:
    paths:
      - '.github/workflows/normalize-high-dimension-term.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply terminology normalization
        run: python3 normalize_high_dimension_entity_term.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check gameguide.js
          node --check tests/runtime/js-integrity.js
          git diff --check
          node tests/runtime/js-integrity.js
          node tests/runtime/vip-unbounded-integrity.js
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
          ! grep -n '十王' gameguide.js
          grep -q '10 名高維存在' gameguide.js
          grep -q 'gameguide.js?v=20260928-thirdworld-entity-term1' index.html
      - name: Commit formal changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameguide.js tests/runtime/js-integrity.js PROJECT_HANDOFF.md index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize high-dimensional entity terminology'
          git push origin HEAD:main
