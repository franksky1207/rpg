name: Batch19-2 GM Center
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gm-center:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.55.0
      - name: Install Chromium through the official Ubuntu HTTPS mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
      - name: Syntax, readonly owners and sealed sprite size policy
        run: |
          node --check 3d-test/gm-era-sprites.mjs
          node --check 3d-test/test-center.js
          node tests/runtime/gm-animation-center-terminology.cjs
          node tests/runtime/batch19-absolute-sizing-contract.cjs
          node tests/runtime/3d-formal-snapshots-contract.cjs
          node tests/runtime/3d-player-snapshot-contract.js
          node tests/runtime/cleanup-batch4-4-final-guard.cjs
      - name: Three viewport rendered GM integration and retained automation
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/batch19-2-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break || sleep .3; done
          node tests/runtime/batch19-2-gm-center-browser.cjs
          node tests/runtime/gm-3d-test-center-browser.js
          node tests/runtime/gm-battle-simulation-browser.js
          node tests/runtime/3d-gm-loader-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch19-2-rendered-evidence
          path: |
            /tmp/batch19-2-*.json
            /tmp/batch19-2-*.png
