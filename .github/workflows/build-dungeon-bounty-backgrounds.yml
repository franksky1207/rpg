name: Build dungeon bounty backgrounds

on:
  push:
    paths:
      - '.github/workflows/build-dungeon-bounty-backgrounds.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert and wire dungeon bounty backgrounds
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          jobs=[
              ('assets/backgrounds-source/dungeon-bounty/desktop.png','assets/backgrounds/dungeon-bounty/desktop.webp',1536),
              ('assets/backgrounds-source/dungeon-bounty/mobile.png','assets/backgrounds/dungeon-bounty/mobile.webp',1080),
          ]
          for src_s,dst_s,max_w in jobs:
              src=Path(src_s); dst=Path(dst_s)
              if not src.exists():
                  raise SystemExit(f'missing source: {src}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              im=Image.open(src).convert('RGB')
              if im.width>max_w:
                  h=round(im.height*max_w/im.width)
                  im=im.resize((max_w,h),Image.Resampling.LANCZOS)
              im.save(dst,'WEBP',quality=72,method=6)
              print(src,im.size,'->',dst,dst.stat().st_size,'bytes')

          css=Path('backgrounds.css')
          s=css.read_text()
          marker='/* dungeon-bounty background v1 */'
          if marker not in s:
              s += '''\n\n/* dungeon-bounty background v1 */\n@media (min-width:761px){\n  #main>.dungeon-bounty-shell.dungeon-page-shell{\n    width:100vw;\n    max-width:none;\n    min-height:calc(100vh - 57px);\n    min-height:calc(100dvh - 57px);\n    margin-top:-18px;\n    margin-bottom:-40px;\n    margin-left:calc(50% - 50vw);\n    margin-right:calc(50% - 50vw);\n    padding-top:36px;\n    padding-right:max(24px,calc((100vw - 1200px)/2 + 18px));\n    padding-bottom:64px;\n    padding-left:max(24px,calc((100vw - 1200px)/2 + 18px));\n    background-image:\n      linear-gradient(180deg,rgba(5,10,18,.26),rgba(5,10,18,.52)),\n      url("assets/backgrounds/dungeon-bounty/desktop.webp?v=20260913-dungeon-bounty-desktop1");\n    background-position:center center,center center;\n    background-size:cover,cover;\n    background-repeat:no-repeat,no-repeat;\n  }\n  #main>.dungeon-bounty-shell.dungeon-page-shell>.dungeon-bounty-card{\n    max-width:760px;\n    margin-left:auto;\n    margin-right:auto;\n    background:linear-gradient(180deg,rgba(36,27,47,.78),rgba(20,17,28,.86));\n    backdrop-filter:blur(3px);\n    -webkit-backdrop-filter:blur(3px);\n  }\n}\n\n@media (max-width:760px){\n  #main>.dungeon-bounty-shell.dungeon-page-shell{\n    width:100vw;\n    max-width:none;\n    min-height:calc(100vh - 52px);\n    min-height:calc(100dvh - 52px);\n    margin-top:-10px;\n    margin-bottom:-24px;\n    margin-left:calc(50% - 50vw);\n    margin-right:calc(50% - 50vw);\n    padding-top:20px;\n    padding-right:12px;\n    padding-bottom:28px;\n    padding-left:12px;\n    background-image:\n      linear-gradient(180deg,rgba(5,10,18,.26),rgba(5,10,18,.54)),\n      url("assets/backgrounds/dungeon-bounty/mobile.webp?v=20260913-dungeon-bounty-mobile1");\n    background-position:center center,center center;\n    background-size:cover,cover;\n    background-repeat:no-repeat,no-repeat;\n  }\n  #main>.dungeon-bounty-shell.dungeon-page-shell>.dungeon-bounty-card{\n    background:linear-gradient(180deg,rgba(36,27,47,.78),rgba(20,17,28,.86));\n    backdrop-filter:blur(2px);\n    -webkit-backdrop-filter:blur(2px);\n  }\n}\n'''
              css.write_text(s)

          idx=Path('index.html')
          t=idx.read_text()
          old='backgrounds.css?v=20260913-dungeon-home1'
          new='backgrounds.css?v=20260913-dungeon-bounty1'
          if old not in t:
              raise SystemExit('unexpected backgrounds.css cache token')
          idx.write_text(t.replace(old,new,1))
          PY
      - name: Commit optimized backgrounds and wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/backgrounds/dungeon-bounty/desktop.webp assets/backgrounds/dungeon-bounty/mobile.webp
          git add backgrounds.css index.html
          git commit -m 'Add dungeon bounty backgrounds'
          git push
