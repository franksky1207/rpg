name: Story Integrity Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/story-integrity-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch story integrity issues
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {n}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          p='storydata-universe-stellar-battlefront.js'
          replace_once(p,'軍事關卡','軍事封鎖點')
          replace_once(p,'"遠征火力穿過斷層，把母皇主艦逼離人口區外。"','"遠征火力穿過斷層，把母皇主艦逼離人口區外。","協同火線也跟著向前推進。"')
          replace_once(p,'"你笑了笑。艦隊隨即轉向殲星艦所在星系，沒有回頭。"','"你笑了笑。艦隊隨即轉向殲星艦所在星系，沒有回頭。","後方只留下修復中的航燈。"')
          replace_once(p,'"你沒有反對。只要那顆星還在，損失就仍有意義。"','"你沒有反對。只要那顆星還在，損失就仍有意義。","前列艦全部轉入護航位置。"')
          replace_once(p,'"遠征隊利用商船識別靠近外環，工程組則從維修接口切入拘留區。"','"遠征隊利用商船識別靠近外環，工程組則從維修接口切入拘留區。","而且時間已經不多。"')
          replace_once(p,'"最終裁決者被活捉，中立船員也全部撤出，轉運區沒有被摧毀。"','"最終裁決者被活捉，中立船員也全部撤出，轉運區沒有被摧毀。","瑪克親自確認名冊後才解除封鎖。"')
          replace_once(p,'"你沒有反駁。遠征隊開始計算繞行成本，而不是準備攻城。"','"你沒有反駁。遠征隊開始計算繞行成本，而不是準備攻城。","導航組也同步標出外側備援線。"')
          replace_once(p,'"他選擇離開遠征，帶著自己的決定前往別處。"','"他選擇離開遠征，帶著自己的決定前往別處。","沒有人勸他留下。"')

          additions=[
              ('"問題只剩如何安全離開，以及誰先停火。"','"問題只剩如何安全離開，以及誰先停火。","桌上的沉默，比任何威脅都更接近真正的談判。"'),
              ('"談判因此有了現實基礎。"','"談判因此有了現實基礎。","雙方至少先承認，彼此都不會憑空消失。"'),
              ('"你把這條路放上談判桌。"','"你把這條路放上談判桌。","這條新路也第一次讓撤離本身成為可談的條件。"'),
              ('"遠征隊先撤一步，換取對方開放一段驗證航線。"','"遠征隊先撤一步，換取對方開放一段驗證航線。","主艦上的幾名軍官沉默，沒有人再要求守住象徵性位置。"'),
              ('"這一戰只為證明協議必須能真正執行。"','"這一戰只為證明協議必須能真正執行。","補給隊退回安全距離後，談判頻道仍然保持開啟。"'),
              ('"雙方第一次對停戰的可執行性產生最低程度信任。"','"雙方第一次對停戰的可執行性產生最低程度信任。","前線第一次有了比口頭承諾更可靠的停火方式。"'),
              ('"這句話成為談判桌上少數輕鬆時刻。"','"這句話成為談判桌上少數輕鬆時刻。","芙瑞沒有反駁，只把那份紀錄留在自己的桌面上。"'),
              ('"一場有限戰鬥換來了真正的談判席位。"','"一場有限戰鬥換來了真正的談判席位。","雙方都知道，這份協議能活多久還得靠之後每一次克制。"'),
              ('"這成為本區最重要的認知。"','"這成為本區最重要的認知。","韓策沒有再問怎麼結束整場戰爭，只確認撤離時間。"'),
              ('"她點頭離開。群星會戰裡沒有誰因一次協議就永遠站在同一邊。"','"她點頭離開。群星會戰裡沒有誰因一次協議就永遠站在同一邊。","她還得回去說服那些認為任何讓步都等同失敗的人。"'),
              ('"沒有人追問她會留下多久。暫時同行，本身就已經足夠。"','"沒有人追問她會留下多久。暫時同行，本身就已經足夠。","尤娜把自己的座位重新固定好，像只是決定多走一站。"'),
              ('"你沒有把它們刪掉，只是不再追著每一場衝突前進。"','"你沒有把它們刪掉，只是不再追著每一場衝突前進。","這一次離開不是逃跑，而是主動拒絕被每條戰線綁住。"'),
              ('"你點頭。這條路本身就是停戰的成果。"','"你點頭。這條路本身就是停戰的成果。","沿途沒有歡迎，也沒有新的敵意，只有照常運作的日常。"'),
              ('"不知道不再等於立刻尋找更大的敵人。遠征隊只是繼續往前，離開一場不屬於自己的無限戰爭。"','"不知道不再等於立刻尋找更大的敵人。遠征隊只是繼續往前，離開一場不屬於自己的無限戰爭。","沒有人急著替陌生區域下結論，艦隊只保留必要警戒。"'),
              ('"艦隊越過王庭後方最後一座航標，正式進入超域邊境。","第四章・群星會戰　完"','"艦隊越過王庭後方最後一座航標，正式進入超域邊境。","後方炮火逐漸縮成星圖上的微光，沒有任何人回頭宣稱勝利。","第四章・群星會戰　完"'),
          ]
          for old,new in additions:
              replace_once(p,old,new)

          replace_once('storydata-earth.js','也是主角第一次真正走近決策位置。','也是你第一次真正走近決策位置。')
          replace_once('storydata-earth.js','主角也第一次明白，反抗未知控制與武斷判定未知，其實可能只有一步之隔。','你也第一次明白，反抗未知控制與武斷判定未知，其實可能只有一步之隔。')
          replace_once('storydata-galactic-frontier.js','包含主角越權、補給接管失敗與醫療走廊爆炸。','包含你越權、補給接管失敗與醫療走廊爆炸。')
          replace_once('storydata-galactic-mid.js','主角第一次真正失去親近戰友，不是因為死亡，而是因為自己的選擇。','你第一次真正失去親近戰友，不是因為死亡，而是因為自己的選擇。')
          replace_once('storydata-galactic-unification.js','一路同行的意義不是最後所有人都站在主角身後，而是每個人把共同經歷帶回自己的位置，繼續保留不同答案與互相監督的能力。','一路同行的意義不是最後所有人都站在你身後，而是每個人把共同經歷帶回自己的位置，繼續保留不同答案與互相監督的能力。')

          idx='index.html'
          replace_once(idx,'storydata-earth.js?v=20260918-earth-story-clean1','storydata-earth.js?v=20260923-player-ref-fix1')
          replace_once(idx,'storydata-galactic-frontier.js?v=20260918-galactic-frontier-rewrite2','storydata-galactic-frontier.js?v=20260923-player-ref-fix1')
          replace_once(idx,'storydata-galactic-mid.js?v=20260918-galactic-mid-rewrite1','storydata-galactic-mid.js?v=20260923-player-ref-fix1')
          replace_once(idx,'storydata-galactic-unification.js?v=20260918-galactic-unification1','storydata-galactic-unification.js?v=20260923-player-ref-fix1')
          replace_once(idx,'storydata-universe-stellar-battlefront.js?v=20260923-universe-region4-dialogue1','storydata-universe-stellar-battlefront.js?v=20260923-universe-region4-dialogue2')
          PY

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storydata-universe-stellar-battlefront.js storydata-earth.js storydata-galactic-frontier.js storydata-galactic-mid.js storydata-galactic-unification.js index.html
          git commit -m "Fix story integrity failures and player references"
          git push origin main
