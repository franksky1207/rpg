name: Apply batch 5 cleanup

on:
  push:
    paths:
      - '.github/workflows/apply-batch5-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply batch 5
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Main battle pipeline: remove the redundant second per-win save.
          p=Path('battlepipeline.js')
          text=p.read_text(encoding='utf-8')
          old='''   if(hasMoreBattles(ctx)){\n    save(false);\n    currentCombatEncounter=createMonsterEncounter(selectedMap,selectedEnemy);\n    await sleep(battleGapMs(r.e.kind));\n   }else save();'''
          new='''   if(hasMoreBattles(ctx)){\n    currentCombatEncounter=createMonsterEncounter(selectedMap,selectedEnemy);\n    await sleep(battleGapMs(r.e.kind));\n   }else save();'''
          if old not in text: raise SystemExit('battle pipeline redundant save anchor not found')
          text=text.replace(old,new,1)
          anchor=''' window.MAINLINE_BOSS_STORY_PIPELINE_VERSION=2;\n'''
          addition=''' window.MAIN_BATTLE_PIPELINE_CLEANUP_VERSION=1;\n'''+anchor
          if anchor not in text: raise SystemExit('battle pipeline version anchor not found')
          text=text.replace(anchor,addition,1)
          p.write_text(text,encoding='utf-8')

          # 2) Void Mirage: detach snapshot nested data and keep regular-name state run-local.
          p=Path('dungeonvoid.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace('''\n let lastRegularName="";\n let voidMirageRun=null;\n''','''\n let voidMirageRun=null;\n''',1)
          anchor=''' function finiteNonNegative(value,fallback=0){const n=Number(value);return Number.isFinite(n)&&n>=0?n:fallback;}\n'''
          addition=anchor+''' function cloneVoidSnapshotValue(value,seen=new WeakMap()){\n  if(value===null||typeof value!=="object")return value;\n  if(seen.has(value))return seen.get(value);\n  const out=Array.isArray(value)?[]:{};\n  seen.set(value,out);\n  Object.keys(value).forEach(key=>{out[key]=cloneVoidSnapshotValue(value[key],seen);});\n  return out;\n }\n'''
          if anchor not in text: raise SystemExit('void clone helper anchor not found')
          text=text.replace(anchor,addition,1)
          old=''' function regularName(previousName=""){\n  const blocked=String(previousName||lastRegularName||"");\n  const pool=VOID_MIRAGE_REGULAR_NAMES.filter(name=>name!==blocked),names=pool.length?pool:VOID_MIRAGE_REGULAR_NAMES;\n  const name=names[Math.floor(Math.random()*names.length)];lastRegularName=name;return name;\n }'''
          new=''' function regularName(previousName=""){\n  const blocked=String(previousName||"");\n  const pool=VOID_MIRAGE_REGULAR_NAMES.filter(name=>name!==blocked),names=pool.length?pool:VOID_MIRAGE_REGULAR_NAMES;\n  return names[Math.floor(Math.random()*names.length)];\n }'''
          if old not in text: raise SystemExit('void regular name anchor not found')
          text=text.replace(old,new,1)
          old='''  return {active:!!voidMirageRun.active,phase:voidMirageRun.phase,startFloor:voidMirageRun.startFloor,currentFloor:voidMirageRun.currentFloor,lastClearedFloor:voidMirageRun.lastClearedFloor,cleared:voidMirageRun.cleared,totalTurns:voidMirageRun.totalTurns,averageTurns:voidMirageRun.cleared?round1(voidMirageRun.totalTurns/voidMirageRun.cleared):0,exitRequested:!!voidMirageRun.exitRequested,endedReason:voidMirageRun.endedReason||"",failedFloor:voidMirageRun.failedFloor||0,runStarted:!!voidMirageRun.runStarted,playerSnapshot:voidMirageRun.playerSnapshot?{...voidMirageRun.playerSnapshot}:null,lastEnemy:voidMirageRun.lastEnemy?{...voidMirageRun.lastEnemy,traits:(voidMirageRun.lastEnemy.traits||[]).slice()}:null,lastResult:voidMirageRun.lastResult?{...voidMirageRun.lastResult,logs:(voidMirageRun.lastResult.logs||[]).slice()}:null,historicalHighest:historicalHighest(),dailyHighest:daily.highestFloor||0,dailyClaimed:daily.claimed===true,dailyReward:daily.reward||0};'''
          new='''  return {active:!!voidMirageRun.active,phase:voidMirageRun.phase,startFloor:voidMirageRun.startFloor,currentFloor:voidMirageRun.currentFloor,lastClearedFloor:voidMirageRun.lastClearedFloor,cleared:voidMirageRun.cleared,totalTurns:voidMirageRun.totalTurns,averageTurns:voidMirageRun.cleared?round1(voidMirageRun.totalTurns/voidMirageRun.cleared):0,exitRequested:!!voidMirageRun.exitRequested,endedReason:voidMirageRun.endedReason||"",failedFloor:voidMirageRun.failedFloor||0,runStarted:!!voidMirageRun.runStarted,playerSnapshot:cloneVoidSnapshotValue(voidMirageRun.playerSnapshot),lastEnemy:cloneVoidSnapshotValue(voidMirageRun.lastEnemy),lastResult:cloneVoidSnapshotValue(voidMirageRun.lastResult),historicalHighest:historicalHighest(),dailyHighest:daily.highestFloor||0,dailyClaimed:daily.claimed===true,dailyReward:daily.reward||0};'''
          if old not in text: raise SystemExit('void snapshot anchor not found')
          text=text.replace(old,new,1)
          old='''  voidMirageRun={active:true,phase:"ready",startFloor,currentFloor:startFloor,lastClearedFloor:startFloor-1,cleared:0,totalTurns:0,exitRequested:false,endedReason:"",failedFloor:0,lastEnemy:null,lastResult:null,previousRegularName:lastRegularName||"",playerSnapshot:null,runStarted:false};'''
          new='''  voidMirageRun={active:true,phase:"ready",startFloor,currentFloor:startFloor,lastClearedFloor:startFloor-1,cleared:0,totalTurns:0,exitRequested:false,endedReason:"",failedFloor:0,lastEnemy:null,lastResult:null,previousRegularName:"",playerSnapshot:null,runStarted:false};'''
          if old not in text: raise SystemExit('void run local name anchor not found')
          text=text.replace(old,new,1)
          anchor=''' window.VOID_MIRAGE_AUTO_OWNER_VERSION=1;\n'''
          addition=''' window.VOID_MIRAGE_SNAPSHOT_ISOLATION_VERSION=1;\n window.VOID_MIRAGE_RUN_LOCAL_NAME_VERSION=1;\n'''+anchor
          if anchor not in text: raise SystemExit('void version anchor not found')
          text=text.replace(anchor,addition,1)
          p.write_text(text,encoding='utf-8')

          # 3) Extend Void integrity for snapshot isolation and run-local name state.
          p=Path('dungeonvoidintegrity.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace(' const VERSION=2;',' const VERSION=3;',1)
          anchor='''  if(Number(window.VOID_MIRAGE_AUTO_OWNER_VERSION)!==1)fail("auto-owner-version");\n'''
          addition=anchor+'''  if(Number(window.VOID_MIRAGE_SNAPSHOT_ISOLATION_VERSION)!==1)fail("snapshot-isolation-version");\n  if(Number(window.VOID_MIRAGE_RUN_LOCAL_NAME_VERSION)!==1)fail("run-local-name-version");\n'''
          if anchor not in text: raise SystemExit('void integrity marker anchor not found')
          text=text.replace(anchor,addition,1)
          anchor='''  const snapshot=typeof window.getVoidMirageRunSnapshot==="function"?window.getVoidMirageRunSnapshot():null;\n'''
          addition='''  const snapshotSrc=src(window.getVoidMirageRunSnapshot);\n  if(!/cloneVoidSnapshotValue/.test(snapshotSrc))fail("snapshot-nested-clone");\n  const beginSrc=src(window.beginVoidMirageRun);\n  if(!/previousRegularName\s*:\s*["']["']/.test(beginSrc))fail("run-local-name-reset");\n\n'''+anchor
          if anchor not in text: raise SystemExit('void integrity snapshot anchor not found')
          text=text.replace(anchor,addition,1)
          old='''  const report={version:VERSION,ok:issues.length===0,issues,autoOwnerVersion:Number(window.VOID_MIRAGE_AUTO_OWNER_VERSION)||0,uiAdapterVersion:Number(window.VOID_MIRAGE_UI_AUTO_ADAPTER_VERSION)||0};'''
          new='''  const report={version:VERSION,ok:issues.length===0,issues,autoOwnerVersion:Number(window.VOID_MIRAGE_AUTO_OWNER_VERSION)||0,snapshotIsolationVersion:Number(window.VOID_MIRAGE_SNAPSHOT_ISOLATION_VERSION)||0,runLocalNameVersion:Number(window.VOID_MIRAGE_RUN_LOCAL_NAME_VERSION)||0,uiAdapterVersion:Number(window.VOID_MIRAGE_UI_AUTO_ADAPTER_VERSION)||0};'''
          if old not in text: raise SystemExit('void integrity report anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # 4) Documentation and cache busts.
          p=Path('PROJECT_HANDOFF.md')
          text=p.read_text(encoding='utf-8')
          anchor='''- `battlepipeline.js` 是共用連戰 pipeline。\n'''
          addition=anchor+'''- 主線每場勝利的中途存檔只保留一個正式 `save(false)`；下一場 encounter 仍於場間建立，最終／戰敗／特殊遭遇結束仍依既有正式結算點 `save()`。`MAIN_BATTLE_PIPELINE_CLEANUP_VERSION = 1`。\n'''
          if anchor not in text: raise SystemExit('handoff battle pipeline anchor not found')
          text=text.replace(anchor,addition,1)
          anchor='''- `VOID_MIRAGE_AUTO_OWNER_VERSION = 1`；`VOID_MIRAGE_UI_AUTO_ADAPTER_VERSION = 1`。\n'''
          addition=anchor+'''- 虛空 run snapshot 對 `playerSnapshot`／`lastEnemy`／`lastResult` 做遞迴脫鉤複製，避免 UI/外部修改 snapshot 反向污染核心 run；`VOID_MIRAGE_SNAPSHOT_ISOLATION_VERSION = 1`。\n- 一般怪名稱去重狀態只存在單次 run 的 `previousRegularName`，新 run 從空值開始，不再使用跨 run module 狀態；`VOID_MIRAGE_RUN_LOCAL_NAME_VERSION = 1`。\n'''
          if anchor not in text: raise SystemExit('handoff void owner anchor not found')
          text=text.replace(anchor,addition,1)
          text=text.replace('`VOID_MIRAGE_INTEGRITY_VERSION = 2`','`VOID_MIRAGE_INTEGRITY_VERSION = 3`',1)
          p.write_text(text,encoding='utf-8')

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          replacements={
           'dungeonvoid.js?v=20260917-auto-owner1':'dungeonvoid.js?v=20260917-batch5-isolation1',
           'battlepipeline.js?v=20260917-main-minimal-hooks1':'battlepipeline.js?v=20260917-batch5-save1',
           'dungeonvoidintegrity.js?v=20260917-void-integrity2':'dungeonvoidintegrity.js?v=20260917-void-integrity3'
          }
          for old,new in replacements.items():
              if old not in text: raise SystemExit(f'index cache anchor not found: {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit batch 5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battlepipeline.js dungeonvoid.js dungeonvoidintegrity.js PROJECT_HANDOFF.md index.html
          git commit -m 'refactor: finish battle and void cleanup batch 5'
          git push
