name: Apply minimal and balance batch 4

on:
  push:
    paths:
      - '.github/workflows/apply-minimal-balance-batch4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply batch 4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Shared minimal-mode API with backward-compatible Main aliases.
          p=Path('mainminimalmode.js')
          text=p.read_text(encoding='utf-8')
          old=''' function openMainMinimalMode(){return openMinimalMode("main");}\n\n window.openMinimalMode=openMinimalMode;\n window.registerMinimalModeAdapter=registerMinimalModeAdapter;\n window.openMainMinimalMode=openMainMinimalMode;\n window.closeMainMinimalMode=closeMainMinimalMode;\n window.syncMainMinimalMode=syncValues;\n window.setMainMinimalModeState=applyOverlayMode;\n window.isMainMinimalModeOpen=()=>!!overlay;\n window.getMinimalModeAdapterId=()=>overlay?activeAdapterId:null;'''
          new=''' function openMainMinimalMode(){return openMinimalMode("main");}\n function closeMinimalMode(){return closeMainMinimalMode();}\n function syncMinimalMode(){return syncValues();}\n function setMinimalModeState(mode){return applyOverlayMode(mode);}\n function isMinimalModeOpen(){return !!overlay;}\n function minimalModeBackgroundPolicy(){return "follow-gm-background-setting";}\n\n window.openMinimalMode=openMinimalMode;\n window.closeMinimalMode=closeMinimalMode;\n window.syncMinimalMode=syncMinimalMode;\n window.setMinimalModeState=setMinimalModeState;\n window.isMinimalModeOpen=isMinimalModeOpen;\n window.registerMinimalModeAdapter=registerMinimalModeAdapter;\n window.getMinimalModeAdapterId=()=>overlay?activeAdapterId:null;\n\n // Main-specific aliases remain during the compatibility transition.\n window.openMainMinimalMode=openMainMinimalMode;\n window.closeMainMinimalMode=closeMinimalMode;\n window.syncMainMinimalMode=syncMinimalMode;\n window.setMainMinimalModeState=setMinimalModeState;\n window.isMainMinimalModeOpen=isMinimalModeOpen;'''
          if old not in text: raise SystemExit('main minimal export anchor not found')
          text=text.replace(old,new,1)
          old=''' window.mainMinimalModeBackgroundPolicy=()=>"follow-gm-background-setting";\n window.MAIN_MINIMAL_MODE_HOOK_VERSION=2;'''
          new=''' window.minimalModeBackgroundPolicy=minimalModeBackgroundPolicy;\n window.mainMinimalModeBackgroundPolicy=minimalModeBackgroundPolicy;\n window.MINIMAL_MODE_SHARED_API_VERSION=1;\n window.MAIN_MINIMAL_MODE_HOOK_VERSION=2;'''
          if old not in text: raise SystemExit('main minimal policy anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # 2) Void adapter consumes generic shared APIs, with compatibility fallback.
          p=Path('dungeonvoidui.js')
          text=p.read_text(encoding='utf-8')
          old=''' function stopVoidMinimalModeIfOpen(){\n  if(window.getMinimalModeAdapterId?.()!=="void-mirage")return false;\n  if(typeof window.setMainMinimalModeState!=="function")return false;\n  window.setMainMinimalModeState("stopped");\n  return true;\n }'''
          new=''' function stopVoidMinimalModeIfOpen(){\n  if(window.getMinimalModeAdapterId?.()!=="void-mirage")return false;\n  const setMode=typeof window.setMinimalModeState==="function"?window.setMinimalModeState:window.setMainMinimalModeState;\n  if(typeof setMode!=="function")return false;\n  setMode("stopped");\n  return true;\n }'''
          if old not in text: raise SystemExit('void stopped API anchor not found')
          text=text.replace(old,new,1)
          old='''      else if(typeof window.syncMainMinimalMode==="function")window.syncMainMinimalMode();'''
          new='''      else {\n       const syncMode=typeof window.syncMinimalMode==="function"?window.syncMinimalMode:window.syncMainMinimalMode;\n       if(typeof syncMode==="function")syncMode();\n      }'''
          if old not in text: raise SystemExit('void sync API anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # 3) Main monster balance data constants; formulas unchanged.
          p=Path('balance.js')
          text=p.read_text(encoding='utf-8')
          anchor='''// 只調整主線怪物基礎成長、style 與階段倍率，不改獎勵、掉落、裝備公式或特性機率。\n'''
          addition=anchor+'''const MAIN_MONSTER_STYLE_MULTIPLIERS=Object.freeze({\n tank:Object.freeze({hp:1.15,atk:.95,def:1}),\n attack:Object.freeze({hp:.92,atk:1.10,def:1})\n});\nconst MAIN_MONSTER_STAGE_MULTIPLIERS=Object.freeze([\n Object.freeze({hp:1.22,atk:1.17,def:1.10}),\n Object.freeze({hp:1.31,atk:1.24,def:1.14}),\n Object.freeze({hp:1.34,atk:1.28,def:1.15}),\n Object.freeze({hp:1.39,atk:1.29,def:1.17}),\n Object.freeze({hp:1.44,atk:1.27,def:1.17})\n]);\nconst MAIN_MONSTER_DEFAULT_MULTIPLIER=Object.freeze({hp:1,atk:1,def:1});\nwindow.MAIN_MONSTER_BALANCE_VERSION=1;\n\n'''
          if anchor not in text: raise SystemExit('balance header anchor not found')
          text=text.replace(anchor,addition,1)
          old=''' let d=MAPS[mapIdx].enemies[eIdx],b=monsterBase(d[1]),kind=d[2],style=d[3];\n if(style==="tank"){b.hp=ceil(b.hp*1.15);b.atk=ceil(b.atk*.95)}\n if(style==="attack"){b.hp=ceil(b.hp*.92);b.atk=ceil(b.atk*1.10)}\n const stage=[\n  {hp:1.22,atk:1.17,def:1.10},\n  {hp:1.31,atk:1.24,def:1.14},\n  {hp:1.34,atk:1.28,def:1.15},\n  {hp:1.39,atk:1.29,def:1.17},\n  {hp:1.44,atk:1.27,def:1.17}\n ][eIdx]||{hp:1,atk:1,def:1};\n b.hp=ceil(b.hp*stage.hp);b.atk=ceil(b.atk*stage.atk);b.def=ceil(b.def*stage.def);'''
          new=''' let d=MAPS[mapIdx].enemies[eIdx],b=monsterBase(d[1]),kind=d[2],style=d[3];\n const styleMultiplier=MAIN_MONSTER_STYLE_MULTIPLIERS[style]||MAIN_MONSTER_DEFAULT_MULTIPLIER;\n b.hp=ceil(b.hp*styleMultiplier.hp);b.atk=ceil(b.atk*styleMultiplier.atk);b.def=ceil(b.def*styleMultiplier.def);\n const stage=MAIN_MONSTER_STAGE_MULTIPLIERS[eIdx]||MAIN_MONSTER_DEFAULT_MULTIPLIER;\n b.hp=ceil(b.hp*stage.hp);b.atk=ceil(b.atk*stage.atk);b.def=ceil(b.def*stage.def);'''
          if old not in text: raise SystemExit('balance monsterObj anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # 4) Integrity now protects generic API + compatibility aliases.
          p=Path('mainminimalmodeintegrity.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace(' const VERSION=3;',' const VERSION=4;',1)
          anchor='''  if(Number(window.MAIN_MINIMAL_MODE_ADAPTER_VERSION)!==1)fail("adapter-version");\n'''
          addition=anchor+'''  if(Number(window.MINIMAL_MODE_SHARED_API_VERSION)!==1)fail("shared-api-version");\n'''
          if anchor not in text: raise SystemExit('minimal integrity version anchor not found')
          text=text.replace(anchor,addition,1)
          anchor='''  if(typeof window.openMainMinimalMode!=="function")fail("open-api");\n'''
          addition='''  if(typeof window.openMinimalMode!=="function")fail("shared-open-api");\n  if(typeof window.closeMinimalMode!=="function")fail("shared-close-api");\n  if(typeof window.syncMinimalMode!=="function")fail("shared-sync-api");\n  if(typeof window.setMinimalModeState!=="function")fail("shared-state-api");\n  if(typeof window.isMinimalModeOpen!=="function")fail("shared-open-state-api");\n  if(typeof window.minimalModeBackgroundPolicy!=="function")fail("shared-background-policy-api");\n'''+anchor
          if anchor not in text: raise SystemExit('minimal integrity api anchor not found')
          text=text.replace(anchor,addition,1)
          old='''  if(typeof window.openMinimalMode!=="function")fail("adapter-open-api");\n  if(typeof window.registerMinimalModeAdapter!=="function")fail("adapter-register-api");'''
          new='''  if(typeof window.registerMinimalModeAdapter!=="function")fail("adapter-register-api");'''
          if old not in text: raise SystemExit('duplicate shared open integrity anchor not found')
          text=text.replace(old,new,1)
          old='''  if(typeof window.mainMinimalModeBackgroundPolicy!=="function"||window.mainMinimalModeBackgroundPolicy()!=="follow-gm-background-setting")fail("background-policy");'''
          new='''  if(typeof window.minimalModeBackgroundPolicy!=="function"||window.minimalModeBackgroundPolicy()!=="follow-gm-background-setting")fail("shared-background-policy");\n  if(typeof window.mainMinimalModeBackgroundPolicy!=="function"||window.mainMinimalModeBackgroundPolicy()!=="follow-gm-background-setting")fail("background-policy");'''
          if old not in text: raise SystemExit('minimal integrity policy anchor not found')
          text=text.replace(old,new,1)
          old='''  const report={version:VERSION,ok:issues.length===0,issues,backgroundPolicy:typeof window.mainMinimalModeBackgroundPolicy==="function"?window.mainMinimalModeBackgroundPolicy():null};'''
          new='''  const report={version:VERSION,ok:issues.length===0,issues,sharedApiVersion:Number(window.MINIMAL_MODE_SHARED_API_VERSION)||0,backgroundPolicy:typeof window.minimalModeBackgroundPolicy==="function"?window.minimalModeBackgroundPolicy():null};'''
          if old not in text: raise SystemExit('minimal integrity report anchor not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          # 5) Docs and cache busts.
          p=Path('MINIMAL_MODE.md')
          text=p.read_text(encoding='utf-8')
          anchor='''- `dungeonvoidui.js` 透過 `registerMinimalModeAdapter("void-mirage", ...)` 接入共用 overlay，不建立第二套極簡 UI。\n'''
          addition=anchor+'''- 共用控制 API 正式採 `openMinimalMode()`／`closeMinimalMode()`／`syncMinimalMode()`／`setMinimalModeState()`／`isMinimalModeOpen()`；舊 `*MainMinimalMode` 控制 API 暫保留為相容 alias，主線專屬 hook 名稱維持不變。\n'''
          if anchor not in text: raise SystemExit('minimal doc adapter anchor not found')
          text=text.replace(anchor,addition,1)
          anchor='''- `MAIN_MINIMAL_MODE_ADAPTER_VERSION = 1`\n'''
          addition=anchor+'''- `MINIMAL_MODE_SHARED_API_VERSION = 1`\n'''
          if anchor not in text: raise SystemExit('minimal doc version anchor not found')
          text=text.replace(anchor,addition,1)
          text=text.replace('- `MAIN_MINIMAL_MODE_INTEGRITY_VERSION = 3`','- `MAIN_MINIMAL_MODE_INTEGRITY_VERSION = 4`',1)
          p.write_text(text,encoding='utf-8')

          p=Path('PROJECT_HANDOFF.md')
          text=p.read_text(encoding='utf-8')
          anchor='''- 共用 adapter API：`registerMinimalModeAdapter()`、`openMinimalMode()`；虛空幻境由 `dungeonvoidui.js` 以 `void-mirage` adapter 接入，不複製第二套 overlay/CSS。\n'''
          addition='''- 共用 adapter／控制 API：`registerMinimalModeAdapter()`、`openMinimalMode()`、`closeMinimalMode()`、`syncMinimalMode()`、`setMinimalModeState()`、`isMinimalModeOpen()`；舊 `*MainMinimalMode` 控制 API 暫保留為相容 alias，主線專屬 hook 名稱維持不變。虛空幻境由 `dungeonvoidui.js` 以 `void-mirage` adapter 接入，不複製第二套 overlay/CSS。\n'''
          if anchor not in text: raise SystemExit('handoff minimal api anchor not found')
          text=text.replace(anchor,addition,1)
          old='''- `MAIN_MINIMAL_MODE_HOOK_VERSION = 2`；`MAIN_MINIMAL_MODE_ADAPTER_VERSION = 1`；`VOID_MINIMAL_MODE_HOOK_VERSION = 1`；`MAIN_MINIMAL_MODE_BACKGROUND_POLICY_VERSION = 1`；`MAIN_MINIMAL_MODE_INTEGRITY_VERSION = 3`。'''
          new='''- `MAIN_MINIMAL_MODE_HOOK_VERSION = 2`；`MAIN_MINIMAL_MODE_ADAPTER_VERSION = 1`；`MINIMAL_MODE_SHARED_API_VERSION = 1`；`VOID_MINIMAL_MODE_HOOK_VERSION = 1`；`MAIN_MINIMAL_MODE_BACKGROUND_POLICY_VERSION = 1`；`MAIN_MINIMAL_MODE_INTEGRITY_VERSION = 4`。'''
          if old not in text: raise SystemExit('handoff minimal version anchor not found')
          text=text.replace(old,new,1)
          anchor='''五階段倍率依 enemy index：\n\n1. HP 1.22 / ATK 1.17 / DEF 1.10\n2. HP 1.31 / ATK 1.24 / DEF 1.14\n3. HP 1.34 / ATK 1.28 / DEF 1.15\n4. HP 1.39 / ATK 1.29 / DEF 1.17\n5. HP 1.44 / ATK 1.27 / DEF 1.17\n'''
          addition=anchor+'''\nstyle 與五階段倍率由 `balance.js` 的 frozen 常數表集中管理；`MAIN_MONSTER_BALANCE_VERSION = 1`，數值公式本身不變。\n'''
          if anchor not in text: raise SystemExit('handoff balance anchor not found')
          text=text.replace(anchor,addition,1)
          p.write_text(text,encoding='utf-8')

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          replacements={
           'mainminimalmode.js?v=20260917-void-adapter-batch1':'mainminimalmode.js?v=20260917-shared-api1',
           'balance.js?v=20260914-maintenance1':'balance.js?v=20260917-balance-constants1',
           'dungeonvoidui.js?v=20260917-void-ui-css1':'dungeonvoidui.js?v=20260917-shared-api1',
           'mainminimalmodeintegrity.js?v=20260917-void-minimal-integrity3':'mainminimalmodeintegrity.js?v=20260917-shared-api-integrity4'
          }
          for old,new in replacements.items():
              if old not in text: raise SystemExit(f'index cache anchor not found: {old}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit batch 4
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mainminimalmode.js mainminimalmodeintegrity.js dungeonvoidui.js balance.js MINIMAL_MODE.md PROJECT_HANDOFF.md index.html
          git commit -m 'refactor: formalize shared minimal APIs and monster balance constants'
          git push
