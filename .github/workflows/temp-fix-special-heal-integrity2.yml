name: Temporary Fix Special Heal Integrity 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-fix-special-heal-integrity2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace multiline assertion with ordered probes
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('tests/runtime/js-integrity.js'); s=p.read_text(); start=s.index(\"assert(specialEncounter.includes('if(!special)return false;\"); end=s.index(\"assert(index.includes('src=\\\"specialencounter.js?v=20260924-special-full-heal1\\\"')\",start); new='const specialHealGate=specialEncounter.indexOf(\'if(!special)return false;\');\nconst specialHealRestore=specialEncounter.indexOf(\'if(typeof restorePlayerHp===\"function\")restorePlayerHp({save:false});\');\nconst specialHealFight=specialEncounter.indexOf(\'const result=await fightFormalSpecial(ctx,special,{world,bossIndex:options.bossIndex});\');\nassert(specialHealGate>=0&&specialHealRestore>specialHealGate&&specialHealFight>specialHealRestore,\"特殊遭遇正式觸發後必須先回滿血再開戰。\");\n'; p.write_text(s[:start]+new+s[end:])"
          rm .github/workflows/temp-fix-special-heal-integrity2.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add tests/runtime/js-integrity.js .github/workflows/temp-fix-special-heal-integrity2.yml
          git commit -m "Use ordered probes for special heal integrity"
          git push origin HEAD:main
