name: Universe Meta Language Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/universe-meta-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean meta wording across 90 universe stories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements={
          'storydata-universe-galaxy-beyond.js':[
            ('第一區的成果不是領土擴張，而是銀河第一次穩定接上更大的交通與政治網絡。','這段遠征留下的成果不是領土擴張，而是銀河第一次穩定接上更大的交通與政治網絡。')],
          'storydata-universe-local-group-war.js':[
            ('生物危機逐步交回地方處理，主線因此離開農業星域。','生物危機逐步交回地方處理，遠征主力因此離開農業星域。'),
            ('下一場不是被線索拖走，而是先完成本區最後一次防衛，再由自己決定前進方向。','下一場不是被線索拖走，而是先完成眼前這次防衛，再由自己決定前進方向。'),
            ('你把本區紀錄封存為「本星系群戰爭」。','你把這段紀錄封存為「本星系群戰爭」。')],
          'storydata-universe-star-cluster-frontier.js':[
            ('艦隊轉向群星會戰區，第三章就此結束。','艦隊轉向群星會戰區，這段邊疆航程也在此收束。')],
          'storydata-universe-stellar-battlefront.js':[
            ('下一戰將是這一區少見的正面決戰。','下一戰將是遠征至今少見的正面決戰。'),
            ('韓策說：「看來最後一場不是要把他們全打掉。」','韓策說：「看來接下來不是要把他們全打掉。」'),
            ('韓策整理制服：「所以這一區最後要靠談？」','韓策整理制服：「所以接下來要靠談？」'),
            ('也不願承認文明戰線擁有本區主導權。','也不願承認文明戰線擁有這片戰區的主導權。'),
            ('這成為本區最重要的認知。','這成為遠征隊此刻最重要的認知。'),
            ('韓策問：「下一區還會更亂嗎？」','韓策問：「前面還會更亂嗎？」'),
            ('第四章・群星會戰　完','群星會戰的炮火仍在遠方延續，艦隊已經離開。')],
          'storydata-universe-trans-domain-frontier.js':[
            ('你把第五區紀錄封存為「超域邊境」。','你把這段紀錄封存為「超域邊境」。'),
            ('第五章・超域邊境　完','超域邊境的航標逐漸退到艦隊後方。')],
          'storydata-universe-myriad-domain-frontline.js':[
            ('你看著仍完整的敵方主線，正式下令有秩序撤退。','你看著仍完整的敵方中央陣列，正式下令有秩序撤退。'),
            ('後方情報確認執行官真的已經離開，雙方主線不再重逢。','後方情報確認執行官真的已經離開，雙方艦隊沒有再次交會。'),
            ('你第一次把『離開』列為本區最主要的戰略目標。','你第一次把『離開』列為眼前最主要的戰略目標。'),
            ('沒有誰因為故事要收尾就被召回。','也沒有誰只因遠征即將離開就被召回。'),
            ('第六章・萬域戰線　完','萬域戰線的炮火逐漸遠離艦隊視野。')],
          'storydata-universe-cosmic-filament.js':[
            ('你把第七區紀錄封存為「宇宙纖維帶」。','你把這段紀錄封存為「宇宙纖維帶」。')],
          'storydata-universe-stellar-great-wall.js':[
            ('前幾區留下的合作關係在此刻變成實際可用的維修網，而不是固定隊伍。','沿途留下的合作關係在此刻變成實際可用的維修網，而不是固定隊伍。'),
            ('離開同步核心前，你把第八區所有紀錄重新排序：','離開同步核心前，你把巨牆沿途所有紀錄重新排序：')],
          'storydata-universe-cosmic-deep-domain.js':[
            ('前方深域皇座的交通訊號密度遠超之前任何據點，第九區最後一場行動開始成形。','前方深域皇座的交通訊號密度遠超之前任何據點，下一次行動的輪廓開始成形。'),
            ('你回答：「我們也沒打算留下來統治。」第九區最後一場行動因此先確定目的。','你回答：「我們也沒打算留下來統治。」這次行動因此先確定目的。'),
            ('第十區的方向因此清楚，卻仍沒有簡單答案。','前方戰區的方向因此清楚，卻仍沒有簡單答案。'),
            ('整補期間，辛把韓策最後一次撤退紀錄與本區所有戰術資料一起封存。','整補期間，辛把韓策最後一次撤退紀錄與這段遠征的所有戰術資料一起封存。'),
            ('無光帝艦仍存在於深域某處，但它不再是主線目標。','無光帝艦仍存在於深域某處，但它不再是遠征必須追逐的目標。'),
            ('一路上的選擇開始互相支撐，但沒有哪個配角被迫成為永久成員。','一路上的選擇開始互相支撐，曾經同行的人都保有自己的去向，沒有人被迫永遠留下。'),
            ('第九章在韓策留下的空位、辛接下的新責任，以及一張終於看清戰爭流向的交通圖中結束。','這段深域航程在韓策留下的空位、辛接下的新責任，以及一張終於看清戰爭流向的交通圖中收束。')]
          }
          for name, pairs in replacements.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  c=text.count(old)
                  if c!=1: raise SystemExit(f'{name}: expected one target for {old!r}, got {c}')
                  text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
          p=Path('index.html'); text=p.read_text(encoding='utf-8')
          caches={
           'storydata-universe-galaxy-beyond.js?v=20260923-universe-region1-dialogue1':'storydata-universe-galaxy-beyond.js?v=20260923-universe-region1-meta1',
           'storydata-universe-local-group-war.js?v=20260923-universe-region2-dialogue1':'storydata-universe-local-group-war.js?v=20260923-universe-region2-meta1',
           'storydata-universe-star-cluster-frontier.js?v=20260923-universe-region3-dialogue1':'storydata-universe-star-cluster-frontier.js?v=20260923-universe-region3-meta1',
           'storydata-universe-stellar-battlefront.js?v=20260923-universe-region4-dialogue2':'storydata-universe-stellar-battlefront.js?v=20260923-universe-region4-meta1',
           'storydata-universe-trans-domain-frontier.js?v=20260923-universe-region5-dialogue1':'storydata-universe-trans-domain-frontier.js?v=20260923-universe-region5-meta1',
           'storydata-universe-myriad-domain-frontline.js?v=20260923-universe-region6-dialogue1':'storydata-universe-myriad-domain-frontline.js?v=20260923-universe-region6-meta1',
           'storydata-universe-cosmic-filament.js?v=20260923-universe-region7-dialogue1':'storydata-universe-cosmic-filament.js?v=20260923-universe-region7-meta1',
           'storydata-universe-stellar-great-wall.js?v=20260923-universe-region8-dialogue1':'storydata-universe-stellar-great-wall.js?v=20260923-universe-region8-meta1',
           'storydata-universe-cosmic-deep-domain.js?v=20260923-universe-region9-dialogue2':'storydata-universe-cosmic-deep-domain.js?v=20260923-universe-region9-meta1'}
          for old,new in caches.items():
              c=text.count(old)
              if c!=1: raise SystemExit(f'index: expected one cache target for {old}, got {c}')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storydata-universe-*.js index.html
          git commit -m "Remove meta language from universe stories"
          git push origin main
