name: Temporary Universe Contextual Inventory Batch1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-universe-contextual-inventory-batch1.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply universe contextual inventory batch1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Universe boss cards: only latest progress boss owns the inventory button.
          p=Path('worldmapui.js')
          s=p.read_text()
          anchor='''  function secondWorldBosses(){\n    return Array.isArray(window.SECOND_WORLD_BOSSES)?window.SECOND_WORLD_BOSSES:[];\n  }\n\n'''
          insert='''  function secondWorldBosses(){\n    return Array.isArray(window.SECOND_WORLD_BOSSES)?window.SECOND_WORLD_BOSSES:[];\n  }\n\n  function secondWorldLatestProgressBossIndex(){\n    const bosses=secondWorldBosses();\n    if(!bosses.length)return -1;\n    const highest=typeof window.secondWorldHighestUnlockedBossIndex===\"function\"?Number(window.secondWorldHighestUnlockedBossIndex()):-1;\n    if(Number.isFinite(highest)&&highest>=0)return Math.max(0,Math.min(bosses.length-1,Math.floor(highest)));\n    return 0;\n  }\n\n'''
          assert s.count(anchor)==1, s.count(anchor)
          s=s.replace(anchor,insert,1)

          old='''  function secondWorldBossCardHtml(boss){\n    const killed=typeof window.secondWorldBossKilled===\"function\"&&window.secondWorldBossKilled(boss.index);\n    const canChallenge=typeof window.canChallengeSecondWorldBoss===\"function\"&&window.canChallengeSecondWorldBoss(boss.index);\n    const stats=typeof window.secondWorldBossBaseStats===\"function\"?window.secondWorldBossBaseStats(boss.index):null;\n    const status=killed?\"已擊敗\":canChallenge?\"可挑戰\":\"尚未開放\";\n    const statLine=stats?`<div class=\"universe-boss-stats\">HP ${stats.hp.toLocaleString()}　ATK ${stats.atk.toLocaleString()}　DEF ${stats.def.toLocaleString()}</div>`:\"\";\n    const active=window.activeSecondWorldMainlineContext;\n    const activeHere=active?.continuous===true&&Number(active.bossIndex)===Number(boss.index);\n    let action=\"\";\n    if(activeHere)action=`<button class=\"btn danger universe-boss-action\" type=\"button\" onclick=\"requestSecondWorldContinuousStop()\">本場結束後停止</button>`;\n    else if(canChallenge&&window.SECOND_WORLD_COMBAT_SETTLEMENT_READY===true&&typeof window.startSecondWorldBossBattle===\"function\"){\n      action=`<div class=\"universe-boss-actions\"><button class=\"btn blue universe-boss-action\" type=\"button\" onclick=\"startSecondWorldBossBattle(${boss.index})\">${killed?\"再次挑戰\":\"挑戰 Boss\"}</button><button class=\"btn universe-boss-action\" type=\"button\" onclick=\"startSecondWorldBossContinuous(${boss.index})\">連續戰鬥</button><button class=\"btn universe-boss-action\" type=\"button\" onclick=\"openAdventureInventory()\">背包</button></div>`;\n    }\n    return `<div class=\"map-card universe-boss-card ${killed?\"cleared\":\"\"}\" data-second-world-boss=\"${boss.index}\" aria-label=\"${boss.name} Lv.${boss.level}，${status}\"><b>${boss.name}</b><div class=\"muted\">Lv.${boss.level}</div>${statLine}<div class=\"map-status\">${activeHere?\"連續戰鬥中\":status}</div>${action}</div>`;\n  }\n'''
          new='''  function secondWorldBossCardHtml(boss){\n    const killed=typeof window.secondWorldBossKilled===\"function\"&&window.secondWorldBossKilled(boss.index);\n    const canChallenge=typeof window.canChallengeSecondWorldBoss===\"function\"&&window.canChallengeSecondWorldBoss(boss.index);\n    const latestProgress=Number(boss.index)===secondWorldLatestProgressBossIndex();\n    const stats=typeof window.secondWorldBossBaseStats===\"function\"?window.secondWorldBossBaseStats(boss.index):null;\n    const status=killed?\"已擊敗\":canChallenge?\"可挑戰\":\"尚未開放\";\n    const statLine=stats?`<div class=\"universe-boss-stats\">HP ${stats.hp.toLocaleString()}　ATK ${stats.atk.toLocaleString()}　DEF ${stats.def.toLocaleString()}</div>`:\"\";\n    const active=window.activeSecondWorldMainlineContext;\n    const activeHere=active?.continuous===true&&Number(active.bossIndex)===Number(boss.index);\n    let action=\"\";\n    if(activeHere)action=`<button class=\"btn danger universe-boss-action\" type=\"button\" onclick=\"requestSecondWorldContinuousStop()\">本場結束後停止</button>`;\n    else{\n      const buttons=[];\n      if(canChallenge&&window.SECOND_WORLD_COMBAT_SETTLEMENT_READY===true&&typeof window.startSecondWorldBossBattle===\"function\"){\n        buttons.push(`<button class=\"btn blue universe-boss-action\" type=\"button\" onclick=\"startSecondWorldBossBattle(${boss.index})\">${killed?\"再次挑戰\":\"挑戰 Boss\"}</button>`);\n        buttons.push(`<button class=\"btn universe-boss-action\" type=\"button\" onclick=\"startSecondWorldBossContinuous(${boss.index})\">連續戰鬥</button>`);\n      }\n      if(latestProgress)buttons.push(`<button class=\"btn universe-boss-action\" type=\"button\" data-universe-contextual-inventory=\"1\" onclick=\"openAdventureInventory()\">背包</button>`);\n      if(buttons.length)action=`<div class=\"universe-boss-actions\">${buttons.join(\"\")}</div>`;\n    }\n    return `<div class=\"map-card universe-boss-card ${killed?\"cleared\":\"\"}\" data-second-world-boss=\"${boss.index}\" aria-label=\"${boss.name} Lv.${boss.level}，${status}\"><b>${boss.name}</b><div class=\"muted\">Lv.${boss.level}</div>${statLine}<div class=\"map-status\">${activeHere?\"連續戰鬥中\":status}</div>${action}</div>`;\n  }\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Retire top shared inventory relocation; keep only stale-DOM cleanup.
          p=Path('playersemanticsui.js')
          s=p.read_text()
          s=s.replace(' const VERSION=2;',' const VERSION=3;',1)
          old=''' function installStyles(){\n  if(typeof document===\"undefined\"||document.getElementById(\"playerSemanticsUiStyles\"))return;\n  const style=document.createElement(\"style\");\n  style.id=\"playerSemanticsUiStyles\";\n  style.textContent=`\n   .universe-adventure-top{display:grid!important;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}\n   .universe-adventure-top>.back-btn{justify-self:start}\n   .universe-adventure-top>.page-title{justify-self:center;text-align:center}\n   .universe-adventure-top>.universe-adventure-inventory{justify-self:end}\n   @media(max-width:760px){.universe-adventure-top{gap:7px}.universe-adventure-top>.universe-adventure-inventory{padding:9px 12px}}\n  `;\n  document.head.appendChild(style);\n }\n'''
          new=''' function installStyles(){\n  if(typeof document===\"undefined\")return;\n  document.getElementById(\"playerSemanticsUiStyles\")?.remove();\n }\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old=''' function applyUniverseAdventureSemantics(){\n  if(typeof document===\"undefined\")return;\n  const screen=document.querySelector(\".universe-adventure-screen\");\n  if(!screen)return;\n  screen.querySelectorAll(\".universe-boss-actions .universe-boss-action\").forEach(button=>{\n   if(button.textContent?.trim()===\"背包\")button.remove();\n  });\n  const top=screen.querySelector(\":scope > .page-top\");\n  if(!top)return;\n  top.classList.add(\"universe-adventure-top\");\n  let inventory=top.querySelector(\".universe-adventure-inventory\");\n  if(!inventory){\n   inventory=document.createElement(\"button\");\n   inventory.type=\"button\";\n   inventory.className=\"btn universe-adventure-inventory\";\n   inventory.textContent=\"背包\";\n   inventory.setAttribute(\"aria-label\",\"開啟背包\");\n   inventory.addEventListener(\"click\",()=>{if(typeof window.openAdventureInventory===\"function\")window.openAdventureInventory();});\n   const placeholder=top.lastElementChild;\n   if(placeholder?.tagName===\"SPAN\")placeholder.replaceWith(inventory);else top.appendChild(inventory);\n  }\n }\n'''
          new=''' function applyUniverseAdventureSemantics(){\n  if(typeof document===\"undefined\")return;\n  const screen=document.querySelector(\".universe-adventure-screen\");\n  if(!screen)return;\n  const top=screen.querySelector(\":scope > .page-top\");\n  if(!top)return;\n  top.classList.remove(\"universe-adventure-top\");\n  const legacyInventory=top.querySelector(\".universe-adventure-inventory\");\n  if(legacyInventory){\n   const placeholder=document.createElement(\"span\");\n   legacyInventory.replaceWith(placeholder);\n  }\n }\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          s=s.replace(' window.SECOND_WORLD_SHARED_INVENTORY_BUTTON_VERSION=1;',' window.SECOND_WORLD_CONTEXTUAL_INVENTORY_BUTTON_VERSION=1;',1)
          p.write_text(s)

          # 3) Cache bust modified player-side JS.
          p=Path('index.html')
          s=p.read_text()
          a='worldmapui.js?v=20260922-adventure-context-batch1'
          b='worldmapui.js?v=20260925-universe-contextual-inventory1'
          assert s.count(a)==1, s.count(a)
          s=s.replace(a,b,1)
          a='playersemanticsui.js?v=20260924-universe-adventure-header-polish1'
          b='playersemanticsui.js?v=20260925-universe-contextual-inventory1'
          assert s.count(a)==1, s.count(a)
          s=s.replace(a,b,1)
          p.write_text(s)
          PY

          node --check worldmapui.js
          node --check playersemanticsui.js
          node tests/runtime/js-integrity.js
          grep -q 'data-universe-contextual-inventory="1"' worldmapui.js
          grep -q 'SECOND_WORLD_CONTEXTUAL_INVENTORY_BUTTON_VERSION=1' playersemanticsui.js
          ! grep -q 'SECOND_WORLD_SHARED_INVENTORY_BUTTON_VERSION=1' playersemanticsui.js
          ! grep -q 'if(button.textContent?.trim()==="背包")button.remove()' playersemanticsui.js
          grep -q 'worldmapui.js?v=20260925-universe-contextual-inventory1' index.html
          grep -q 'playersemanticsui.js?v=20260925-universe-contextual-inventory1' index.html

          rm .github/workflows/temp-universe-contextual-inventory-batch1.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add worldmapui.js playersemanticsui.js index.html .github/workflows/temp-universe-contextual-inventory-batch1.yml
          git commit -m "Use contextual universe adventure inventory"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
          gh workflow run story-integrity.yml --ref main
