name: Region 6 Purity Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/region6-purity-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix region 6 source purity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('storydata-universe-myriad-domain-frontline.js')
          text=p.read_text(encoding='utf-8')
          old='韓策看了一眼便收回追擊艦：「今天不玩他的遊戲。」'
          new='韓策看了一眼便收回追擊艦：「今天不跟著他的誘餌走。」'
          if text.count(old)!=1:
              raise SystemExit(f'expected one purity target, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit purity fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storydata-universe-myriad-domain-frontline.js
          git commit -m "Fix universe region 6 source purity"
          git push origin main
