name: Apply Universe Story Player Reference Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/story-player-reference-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite existing universe story player references and chapter ending
        shell: python
        run: |
          from pathlib import Path
          p=Path('storydata-universe-galaxy-beyond.js')
          s=p.read_text()
          # 逐句規則檢查後，現有正式三篇中的「主角」皆為旁白主詞／受詞，改為第二人稱「你」最自然；不改成玩家名稱。
          s=s.replace('主角','你')
          # 第一區現有區域王最後一頁補上與銀河紀元相同的章末 em block。
          marker='{em:"第一章・銀河彼端　完"}'
          if marker not in s:
              tail=']]\n]);\n})();'
              if tail in s:
                  s=s.replace(tail,'],['+marker+']]\n]);\n})();',1)
              else:
                  pos=s.rfind(']]);')
                  if pos<0: raise SystemExit('cannot locate final story ending')
                  s=s[:pos]+','+marker+s[pos:]
          p.write_text(s)
      - name: Commit formal story update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add storydata-universe-galaxy-beyond.js
          git diff --cached --quiet || git commit -m "Align existing universe stories with player-reference rules"
          git push
