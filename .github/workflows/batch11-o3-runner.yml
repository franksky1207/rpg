name: One-time Batch 11-O3 Cleanup and Review Presentation

on:
  push:
    paths:
      - '.github/workflows/batch11-o3-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Normalize current O2 patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/batch11-o3-patch.py')
          t=p.read_text(encoding='utf-8')
          old='''assert(/ADVENTURE_ERA_VIEW_OWNER_VERSION=1/.test(worldmap)&&/ADVENTURE_ERA_SESSION_POLICY_VERSION=1/.test(worldmap)&&/ADVENTURE_ERA_RUNTIME_LOCK_VERSION=4/.test(worldmap)&&/ADVENTURE_REVIEW_RUNTIME_SOURCE_VERSION=2/.test(worldmap),\"三紀元冒險切換必須由單一 session-only owner 持有，並具備可辨識來源的 shared review runtime lock。\");\\n'''
          new='''assert(/ADVENTURE_ERA_VIEW_OWNER_VERSION=1/.test(worldmap)&&/ADVENTURE_ERA_SESSION_POLICY_VERSION=1/.test(worldmap)&&/ADVENTURE_ERA_RUNTIME_LOCK_VERSION=4/.test(worldmap)&&/ADVENTURE_REVIEW_RUNTIME_SOURCE_VERSION=2/.test(worldmap)&&/GALAXY_REVIEW_SHARED_RUNTIME_DELEGATE_VERSION=1/.test(worldmap),\"三紀元冒險切換必須由單一 session-only owner 持有；銀河 legacy API 僅能作 shared review runtime delegate。\");\\n'''
          if old not in t:
              raise SystemExit('stale O2 assertion anchor not found')
          t=t.replace(old,new,1)
          helper='''\ndef replace_if_present(path, old, new):\n    text=read(path)\n    if old in text:\n        write(path,text.replace(old,new,1))\n'''
          marker='''def regex_once(path, pattern, repl):\n'''
          if helper.strip() not in t:
              if marker not in t: raise SystemExit('regex helper marker missing')
              t=t.replace(marker,helper+'\n'+marker,1)
          t=t.replace("replace_once('tests/runtime/js-integrity.js','src=", "replace_if_present('tests/runtime/js-integrity.js','src=")
          p.write_text(t,encoding='utf-8')
          PY
      - name: Apply batch 11-O3 patch
        run: python .github/scripts/batch11-o3-patch.py
      - name: Syntax and runtime integrity self-check
        run: |
          set -euo pipefail
          node --check worldphase.js
          node --check ui.js
          node --check secondworldmainline.js
          node --check thirdworldintegritycontract.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'src="worldphase.js?v=20260928-thirdworld-batch11-o3"' index.html
          grep -q 'src="ui.js?v=20260928-thirdworld-batch11-o3"' index.html
          grep -q 'src="secondworldmainline.js?v=20260928-thirdworld-batch11-o3"' index.html
          grep -q 'src="thirdworldintegritycontract.js?v=20260928-thirdworld-batch11-o3"' index.html
      - name: Commit batch 11-O3 and remove temporary files
        run: |
          set -euo pipefail
          rm .github/workflows/batch11-o3-runner.yml .github/scripts/batch11-o3-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean retired W2 transients and unify review result semantics'
          git push origin HEAD:main
