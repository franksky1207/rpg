name: Publish Optimized GitHub Pages
on:
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: optimized-pages-publish
  cancel-in-progress: false
jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: ./.github/actions/verify-pages-candidate
    - uses: actions/configure-pages@v5
    - name: Upload only validated site to GitHub Pages
      uses: actions/upload-pages-artifact@v4
      with:
        path: .publish-stage3
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
    - name: Deploy validated website
      id: deployment
      uses: actions/deploy-pages@v4
