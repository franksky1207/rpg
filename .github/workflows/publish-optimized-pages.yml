name: Publish Optimized GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: optimized-pages-publish
  cancel-in-progress: false
jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate optimized website
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-asset-audit.cjs
          node tests/runtime/publish-build-regression.cjs
          node scripts/build-publish-dry-run.cjs
          node tests/runtime/resource-cache-behavior.js
          node tests/runtime/resource-cache-prefetch-integrity.js
          node tests/audio-lifecycle.test.cjs
          node tests/audio-regression.test.cjs
          node tests/runtime/3d-formal-snapshots-contract.cjs
          node tests/runtime/combat-events-contract.cjs
          node tests/runtime/combat-events-integration.cjs
          node tests/runtime/3d-shared-loader-contract.cjs
          node tests/runtime/3d-asset-registry-integrity.cjs
          node tests/runtime/3d-equipment-contract.cjs
          node tests/runtime/3d-batch28-preflight.cjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save playwright@1.55.0 gltf-validator@2.0.0-dev.3.10
          npx playwright install --with-deps chromium
      - name: Verify optimized website in browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .publish-stage3 > /tmp/rpg-deploy-check.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          export SMOKE_URL=http://127.0.0.1:4173/index.html
          export RUNTIME_SMOKE_URL=http://127.0.0.1:4173/index.html
          node tests/runtime/combat-events-browser.js
          node tests/runtime/combat-events-owner-browser.js
          node tests/runtime/browser-smoke.js
          node tests/runtime/startup-readiness-browser.js
          node tests/runtime/gm-3d-test-center-browser.js
          node tests/runtime/t4-preview-retirement-browser.js
          node tests/equipment-formal/browser.cjs
          node tests/runtime/3d-gm-loader-browser.js
          node tests/runtime/3d-mode-browser-regression.js
          node tests/runtime/save-load-pipeline-integrity.js
          node tests/runtime/galaxy-3d-button-browser.js
          node tests/runtime/publish-candidate-browser.js
          node tests/runtime/3d-glb-validation.cjs
          node tests/runtime/3d-equipment-assets-browser.js
      - name: Verify exact 32 backgrounds, 17 audio, zero missing and release size
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('publish-stage3-report.json','utf8'));
          if(r.officialBackgrounds!==32||r.officialAudioFiles!==17||r.officialSfxCategories!==5||r.missingDirectRefs?.length)throw Error('release resource acceptance failed');
          if(!(r.artifactBytes>0&&r.artifactBytes<800000000))throw Error('release size limit or invalid report');
          console.log('Verified optimized Pages bytes:',r.artifactBytes);
          NODE
      # Optional browser-only preview lives under a separate URL path; the official
      # candidate, game manifest and release acceptance were finalized above.
      - name: Stage SHA-verified B3 visual preview separately
        run: node scripts/stage-hybrid-preview.cjs
      - name: Verify the published GM B sandbox closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4181 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/rpg-gm-b-publish.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4181/3d-test/ >/dev/null; then break; fi
            sleep 0.3
          done
          RUNTIME_SMOKE_URL=http://127.0.0.1:4181/index.html node tests/runtime/gm-battle-simulation-browser.js
          RUNTIME_SMOKE_URL=http://127.0.0.1:4181/index.html node tests/equipment-gm/browser.cjs
      - name: Check preview entry and production homepage
        shell: bash
        run: |
          set -euo pipefail
          test -s .publish-stage3/3d-test/index.html
          test -s .publish-stage3/3d-test/test-center.js
          test -s .publish-stage3/development/hybrid-comparison/t2b3-v1/manifest.json
          test -s .publish-stage3/index.html
          test ! -e .publish-stage3/development/hybrid-comparison/t2b2-v1/player/animation-source.blend
      - uses: actions/configure-pages@v5
      - name: Upload only validated site to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: .publish-stage3
      - name: Upload release audit for rollback traceability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimized-pages-release-audit
          path: |
            publish-stage3-report.json
            publish-stage4-browser-report.json
            3d-player-browser-report.json
            3d-equipment-browser-report.json
            audio-lifecycle-browser-report.json
            combat-events-browser-report.json
            combat-events-owner-browser-report.json
          if-no-files-found: warn
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - name: Deploy validated website
        id: deployment
        uses: actions/deploy-pages@v4
