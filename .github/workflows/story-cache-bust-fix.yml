name: Refresh Universe Story Cache Bust
on:
  push:
    branches: [main]
    paths: ['.github/workflows/story-cache-bust-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh cache-bust
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('storydata-universe-galaxy-beyond.js?v=20260923-universe-region1-rewrite1','storydata-universe-galaxy-beyond.js?v=20260923-player-reference1')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh universe story cache-bust"
          git push
