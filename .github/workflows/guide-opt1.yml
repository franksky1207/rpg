name: Guide Optimization Batch1
# post-commit follow-up: restore W1/W2 base text and finish W3 dynamic owner projection
on:
  push:
    paths:
      - '.github/workflows/guide-opt1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply follow-up
        run: python3 guide_opt1_followup.py
      - name: Syntax and diff
        run: |
          set -euo pipefail
          node --check gameguide.js
          node --check offlineprogress.js
          node --check tests/runtime/js-integrity.js
          git diff --check
      - name: Runtime checks
        run: |
          set -euo pipefail
          node tests/runtime/js-integrity.js
          node tests/runtime/vip-unbounded-integrity.js
      - name: Story checks
        run: |
          set -euo pipefail
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
      - name: Semantic checks
        run: |
          set -euo pipefail
          grep -q 'OFFLINE_PROGRESS_MAX_HOURS' gameguide.js
          grep -q 'rules.offlineMaxHours.toLocaleString()' gameguide.js
          grep -q 'rules.equipmentNameBandCount' gameguide.js
          grep -q '10 名高維存在' gameguide.js
          ! grep -q '十名高維存在' gameguide.js
          ! grep -q '十王' gameguide.js
          grep -q 'gameguide.js?v=20260928-thirdworld-guide-opt1fix1' index.html
          grep -q 'offlineprogress.js?v=20260928-thirdworld-guide-opt1' index.html
      - name: Commit formal follow-up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameguide.js index.html tests/runtime/js-integrity.js
          git diff --cached --quiet && exit 0
          git commit -m 'Finish third-world guide owner convergence optimization batch1'
          git push origin HEAD:main
