name: Guide Optimization Batch1
# retry after converting VIP protection regression to dynamic guide-owner validation
on:
  push:
    paths:
      - '.github/workflows/guide-opt1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: python3 guide_opt1_patch.py
      - name: Syntax and diff
        run: |
          set -euo pipefail
          node --check gameguide.js
          node --check offlineprogress.js
          node --check tests/runtime/js-integrity.js
          git diff --check
      - name: Runtime checks
        run: |
          set -euo pipefail
          node tests/runtime/js-integrity.js
          node tests/runtime/vip-unbounded-integrity.js
      - name: Story checks
        run: |
          set -euo pipefail
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
      - name: Semantic checks
        run: |
          set -euo pipefail
          grep -q 'GAME_GUIDE_THIRD_WORLD_RULE_SNAPSHOT_VERSION=1' gameguide.js
          grep -q 'GAME_GUIDE_CURRENT_CATEGORY_VALIDATION_VERSION=1' gameguide.js
          grep -q 'thirdWorldGuideRuleSnapshot' gameguide.js
          grep -q 'OFFLINE_DURATION_POLICY_VERSION=1' offlineprogress.js
          grep -q 'gameguide.js?v=20260928-thirdworld-guide-opt1' index.html
          grep -q 'offlineprogress.js?v=20260928-thirdworld-guide-opt1' index.html
          ! grep -q '十王' gameguide.js
      - name: Commit formal changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gameguide.js offlineprogress.js index.html tests/runtime/js-integrity.js
          git diff --cached --quiet && exit 0
          git commit -m 'Converge third-world guide rule owners optimization batch1'
          git push origin HEAD:main
