name: Hybrid Comparison T2-B1
on:
  push:
    branches: [main]
    paths:
      - 'development/hybrid-comparison/**'
      - 'tests/runtime/hybrid-comparison-playback-contract.cjs'
      - 'tests/runtime/hybrid-comparison-platform-browser.js'
      - 'docs/3D_HYBRID_T2B1*'
      - 'PROJECT_HANDOFF.md'
      - 'docs/3D_HYBRID_TRANSITION_EXECUTION_ROADMAP_2026-10-12.md'
      - '.github/workflows/hybrid-comparison-t2b1.yml'
  workflow_dispatch:
jobs:
  platform-and-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify unchanged source fixtures and browser modules
        run: |
          node scripts/hybrid-comparison-fixtures.cjs --check
          node --check development/hybrid-comparison/fixture-input.mjs
          node --check development/hybrid-comparison/playback.mjs
          node --check development/hybrid-comparison/comparison.mjs
          node tests/runtime/hybrid-comparison-playback-contract.cjs
          node tests/runtime/hybrid-comparison-contract.cjs
          node tests/runtime/3d-formal-snapshots-contract.cjs
          node tests/runtime/3d-shared-loader-contract.cjs
          node tests/runtime/combat-events-contract.cjs
          node tests/runtime/combat-events-integration.cjs
          node tests/runtime/resource-manifest-integrity.js
      - name: Verify actual lean publication exclusion
        run: |
          node scripts/build-publish-dry-run.cjs
          node tests/runtime/publish-build-regression.cjs
          test ! -e .publish-stage3/development/hybrid-comparison/index.html
          test ! -e .publish-stage3/development/hybrid-comparison/playback.mjs
      - name: Install browser dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exercise actual five-viewport isolated platform
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hybrid-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/development/hybrid-comparison/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/runtime/hybrid-comparison-platform-browser.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2b1-isolated-platform-evidence
          path: |
            hybrid-comparison-platform-browser-report.json
            /tmp/hybrid-http.log
          if-no-files-found: warn
