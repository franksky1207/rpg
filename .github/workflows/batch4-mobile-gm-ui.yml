name: Batch 4 Mobile Battle and GM UI Regression
on:
  push:
    branches: [feat/combat-animation-batch4-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-and-gm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check unchanged combat owner and animation UI contracts
        run: node scripts/batch4-19-item-gate.cjs
      - name: Check mobile viewport and interaction
        run: node tests/runtime/batch4-mobile-combat-viewport.cjs
      - name: Regression of battle audio, resource, and GM renderer contracts
        run: |
          node tests/runtime/combat-events-integration.cjs
          node tests/runtime/hybrid-comparison-renderer-contract.cjs
          node tests/runtime/resource-manifest-integrity.js
