name: Temporary Special Encounter Heal Align

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-special-heal-align.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shared special encounter heal rule
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('specialencounter.js'); s=p.read_text(); old='  const special=rollSpecialMonster(forcedByBlackMarket?[\"bandit_king\"]:null,world);\n  if(!special)return false;\n  await showSpecialEncounterAlert(special,forcedByBlackMarket);\n  const result=await fightFormalSpecial(ctx,special,{world,bossIndex:options.bossIndex});'; new='  const special=rollSpecialMonster(forcedByBlackMarket?[\"bandit_king\"]:null,world);\n  if(!special)return false;\n  if(typeof restorePlayerHp===\"function\")restorePlayerHp({save:false});\n  else state.hp=playerCombatStats().hp;\n  await showSpecialEncounterAlert(special,forcedByBlackMarket);\n  const result=await fightFormalSpecial(ctx,special,{world,bossIndex:options.bossIndex});'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old='specialencounter.js?v=20260922-death-no-exp-batch1'; new='specialencounter.js?v=20260924-special-full-heal1'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; p=Path('tests/runtime/js-integrity.js'); s=p.read_text(); old='const dungeonGm=read(\"dungeongm.js\");\n'; new=old+'const specialEncounter=read(\"specialencounter.js\");\n'; assert s.count(old)==1, s.count(old); s=s.replace(old,new,1); anchor='assert(index.includes(\'src=\"dungeonvoid.js?v=20260924-void-linear-v2\"\'),\"index.html 必須載入虛空線性公式 V2 cache-bust。\");\n'; add=anchor+'assert(/if\\(world===1&&baseEnemy\\?\\.kind===\"boss\"\\)return false;/.test(specialEncounter),\"銀河紀元 Boss 必須維持禁止特殊遭遇。\");\nassert(/if\\(!special\\)return false;\\n  if\\(typeof restorePlayerHp===\"function\"\\)restorePlayerHp\\(\\{save:false\\}\\);\\n  else state\\.hp=playerCombatStats\\(\\)\\.hp;/.test(specialEncounter),\"特殊遭遇正式觸發後必須先回滿血再開戰。\");\nassert(index.includes(\'src=\"specialencounter.js?v=20260924-special-full-heal1\"\'),\"index.html 必須載入特殊遭遇滿血規則 cache-bust。\");\n'; assert s.count(anchor)==1, s.count(anchor); p.write_text(s.replace(anchor,add,1))"
          rm .github/workflows/temp-special-heal-align.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add specialencounter.js index.html tests/runtime/js-integrity.js .github/workflows/temp-special-heal-align.yml
          git commit -m "Align special encounters to full HP"
          git push origin HEAD:main
