name: Final Region Quote Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-region-quote-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair final-page quote endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('storydata-universe-cosmic-unification-war.js')
          text=p.read_text(encoding='utf-8')
          before=text.count('。」]')
          if before < 1:
              raise SystemExit('expected at least one malformed dialogue ending')
          text=text.replace('。」]','。」"]')
          p.write_text(text,encoding='utf-8')
          q=Path('index.html')
          html=q.read_text(encoding='utf-8')
          old='storydata-universe-cosmic-unification-war.js?v=20260923-universe-region10-final1'
          new='storydata-universe-cosmic-unification-war.js?v=20260923-universe-region10-final2'
          if html.count(old)!=1:
              raise SystemExit('expected exactly one region10 cache target')
          q.write_text(html.replace(old,new,1),encoding='utf-8')
          print(f'repaired {before} malformed dialogue endings')
          PY
          node --check storydata-universe-cosmic-unification-war.js
          git rm .github/workflows/final-region-quote-fix.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair universe final region dialogue syntax"
          git push origin main
