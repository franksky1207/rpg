name: Batch 12-O3 Apply
on:
  push:
    paths:
      - '.github/workflows/batch12-o3-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync flow expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/story/flow.js')
          s=p.read_text(encoding='utf-8')
          old="assert(/if\\(queueThirdWorldEligibleStory\\(\\)\\)return true/.test(progress),'reload/resume 必須能從 persistent state 重建下一篇高維正式故事');"
          new="assert(/if\\(queueThirdWorldEligibleStory\\(\\{progress:p\\}\\)\\)return true/.test(progress),'reload/resume 必須重用已 normalize progress 並重建下一篇高維正式故事');"
          if s.count(old)!=1: raise SystemExit(f'flow expectation anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply patch
        run: python3 batch12_o3_patch.py
      - name: Self-check
        run: |
          set -euo pipefail
          node --check storyprogress.js
          node --check storyruntimeintegrity.js
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
          node tests/runtime/js-integrity.js
          git diff --check
          grep -q 'storyprogress.js?v=20260928-thirdworld-batch12-o3' index.html
          grep -q 'storyruntimeintegrity.js?v=20260928-thirdworld-batch12-o3' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add storyprogress.js storyruntimeintegrity.js tests/story/flow.js tests/runtime/js-integrity.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Converge shared story normalization and pending arbitration'
          git push origin HEAD:main
