name: Enhancement guide formalization
on:
  push:
    paths:
      - '.github/workflows/formalize-enhancement-guide-integrity.yml'
permissions:
  contents: write
jobs:
  formalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and verify
        run: python .github/enhancement-guide-integrity.py
      - name: Commit and clean temporary files
        run: |
          rm .github/workflows/formalize-enhancement-guide-integrity.yml
          rm .github/enhancement-guide-integrity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Formalize enhancement guide and integrity checks"
          git push