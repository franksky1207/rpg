name: Integrate enhancement sale rewards
on:
  push:
    paths:
      - '.github/workflows/integrate-enhancement-sale-rewards.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate sale rewards into equipment owner
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('equipmentlock.js')
          s=p.read_text()
          old=''' function restoreAfterEquipmentChange(){\n  if(typeof restorePlayerHp==="function")return restorePlayerHp({save:false});\n  state.hp=playerCombatStats().hp;\n  return state.hp;\n }'''
          new=''' function restoreAfterEquipmentChange(){\n  if(typeof restorePlayerHp==="function")return restorePlayerHp({save:false});\n  state.hp=playerCombatStats().hp;\n  return state.hp;\n }\n function saleEnhancementReward(item){\n  return typeof grantEnhancementStoneSaleReward==="function"?grantEnhancementStoneSaleReward(item):{basic:0,advanced:0};\n }\n function saleEnhancementText(reward){\n  return typeof enhancementStoneRewardText==="function"?enhancementStoneRewardText(reward):"";\n }'''
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('''   state.gold+=sold;\n   return {kept:false,sold,item};''','''   state.gold+=sold;\n   return {kept:false,sold,item,enhancementStones:saleEnhancementReward(item)};''',1)
          s=s.replace('''   state.gold+=sold;\n   return {kept:false,sold};''','''   state.gold+=sold;\n   return {kept:false,sold,enhancementStones:saleEnhancementReward(item)};''',1)
          s=s.replace('''  const sold=specializationSellValue(item);state.gold+=sold;selectedItem=null;\n  return {ok:true,item,sold};''','''  const sold=specializationSellValue(item);state.gold+=sold;selectedItem=null;\n  return {ok:true,item,sold,enhancementStones:saleEnhancementReward(item)};''',1)
          s=s.replace('''  state.inventory=state.inventory.filter(item=>!ids.has(item.id));\n  state.gold+=data.total;selectedItem=null;\n  return {count:data.targets.length,total:data.total};''','''  state.inventory=state.inventory.filter(item=>!ids.has(item.id));\n  state.gold+=data.total;selectedItem=null;\n  let basic=0,advanced=0;\n  data.targets.forEach(item=>{const r=saleEnhancementReward(item);basic+=Math.max(0,Math.floor(Number(r?.basic)||0));advanced+=Math.max(0,Math.floor(Number(r?.advanced)||0));});\n  return {count:data.targets.length,total:data.total,enhancementStones:{basic,advanced}};''',1)
          s=s.replace('''  save();render();\n }\n window.sellSelected=sellSelected;''','''  const stoneText=saleEnhancementText(r.enhancementStones);\n  save();render();\n  alert(`已出售裝備，獲得 ${r.sold.toLocaleString()} 金幣${stoneText?`，另獲得 ${stoneText}`:""}。`);\n }\n window.sellSelected=sellSelected;''',1)
          s=s.replace('''  const r=equipmentSellLowerAll(preview);save();render();\n  alert(`已出售 ${r.count} 件裝備，獲得 ${r.total.toLocaleString()} 金幣。`);''','''  const r=equipmentSellLowerAll(preview);save();render();\n  const stoneText=saleEnhancementText(r.enhancementStones);\n  alert(`已出售 ${r.count} 件裝備，獲得 ${r.total.toLocaleString()} 金幣${stoneText?`，另獲得 ${stoneText}`:""}。`);''',1)
          p.write_text(s)

          p=Path('enhancementrewardintegration.js')
          s=p.read_text()
          start=s.index('\n function saleStone(')
          end=s.rindex('\n})();')
          s=s[:start]+'\n'+s[end:]
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text().replace('equipmentlock.js?v=20260915-optimization1','equipmentlock.js?v=20260915-enhancement-sale1').replace('enhancementrewardintegration.js?v=20260915-enhancement-batch3','enhancementrewardintegration.js?v=20260915-enhancement-sale1')
          p.write_text(s)
          PY
      - name: Verify sale integration
        run: |
          python - <<'PY'
          from pathlib import Path
          e=Path('equipmentlock.js').read_text()
          r=Path('enhancementrewardintegration.js').read_text()
          i=Path('index.html').read_text()
          assert 'function saleEnhancementReward(item)' in e
          assert 'enhancementStones:saleEnhancementReward(item)' in e
          assert 'data.targets.forEach(item=>{const r=saleEnhancementReward(item)' in e
          assert '已出售裝備，獲得 ${r.sold.toLocaleString()} 金幣' in e
          assert '另獲得 ${stoneText}' in e
          assert 'function saleStone(' not in r
          assert 'window.equipmentSellSelected=function' not in r
          assert 'window.equipmentSellLowerAll=function' not in r
          assert 'const baseFightOnce=fightOnce;' in r
          assert 'equipmentlock.js?v=20260915-enhancement-sale1' in i
          print('sale integration verified')
          PY
      - name: Commit formal integration and remove workflow
        run: |
          rm .github/workflows/integrate-enhancement-sale-rewards.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add equipmentlock.js enhancementrewardintegration.js index.html .github/workflows/integrate-enhancement-sale-rewards.yml
          git commit -m 'Integrate enhancement stone sale rewards'
          git push