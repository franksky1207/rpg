name: Build enhancement backgrounds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-enhancement-backgrounds.yml'
      - 'assets/backgrounds-source/enhancement/desktop.PNG'
      - 'assets/backgrounds-source/enhancement/mobile.PNG'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Build optimized WebP backgrounds
        run: |
          mkdir -p assets/backgrounds/enhancement
          cwebp -quiet -q 80 -m 6 -mt assets/backgrounds-source/enhancement/desktop.PNG -o assets/backgrounds/enhancement/desktop.webp
          cwebp -quiet -q 80 -m 6 -mt assets/backgrounds-source/enhancement/mobile.PNG -o assets/backgrounds/enhancement/mobile.webp
          ls -lh assets/backgrounds/enhancement
      - name: Commit optimized backgrounds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/backgrounds/enhancement/desktop.webp assets/backgrounds/enhancement/mobile.webp
          if git diff --cached --quiet; then
            echo 'No optimized background changes.'
            exit 0
          fi
          git commit -m 'Build optimized enhancement backgrounds'
          git push
