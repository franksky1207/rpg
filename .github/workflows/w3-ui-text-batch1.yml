name: W3 UI Text Batch 1
# final retry with synced permanent runtime contract
on:
  push:
    paths:
      - '.github/workflows/w3-ui-text-batch1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply batch 1 patch
        run: python3 batch_w3_ui_text_1.py
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check playersemanticsui.js
          node --check enhancementui.js
          node --check specialization.js
          node --check storyrecordtabs.js
          node --check specialguide.js
          git diff --check
      - name: Story checks
        shell: bash
        run: |
          set -euo pipefail
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
      - name: Runtime checks
        run: node tests/runtime/js-integrity.js
      - name: Text semantics checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q '第三紀元不開放 +41' enhancementui.js
          ! grep -q '也不建立新的金幣／暗物質售價循環' specialization.js
          ! grep -q '高維裝備不建立新的出售貨幣循環' specialization.js
          grep -q '宇宙紀元・回顧' storyrecordtabs.js
          grep -q 'if(current===3)return sgBaseAdventurePreparePage' specialguide.js
          grep -q 'playersemanticsui.js?v=20260928-thirdworld-ui-text-batch1' index.html
          grep -q 'enhancementui.js?v=20260928-thirdworld-ui-text-batch1' index.html
          grep -q 'specialization.js?v=20260928-thirdworld-ui-text-batch1' index.html
          grep -q 'storyrecordtabs.js?v=20260928-thirdworld-ui-text-batch1' index.html
          grep -q 'specialguide.js?v=20260928-thirdworld-ui-text-batch1' index.html
      - name: Commit formal changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playersemanticsui.js enhancementui.js specialization.js storyrecordtabs.js specialguide.js tests/story/flow.js tests/runtime/js-integrity.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refine third-world player UI semantics batch 1'
          git push origin HEAD:main
