name: Formal Equipment Identity Contract (legacy artwork workflow retired)
on:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'engine.js'
      - 'worldmaps-*.js'
      - 'secondworlddata.js'
      - 'secondworldrewards.js'
      - 'thirdworlddata.js'
      - 'thirdworldloot.js'
      - 'scripts/formal-equipment-identities.py'
      - '.github/workflows/equipment-concepts.yml'
  pull_request:
    paths:
      - 'data.js'
      - 'engine.js'
      - 'worldmaps-*.js'
      - 'secondworlddata.js'
      - 'secondworldrewards.js'
      - 'thirdworlddata.js'
      - 'thirdworldloot.js'
      - 'scripts/formal-equipment-identities.py'
      - '.github/workflows/equipment-concepts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 210 authoritative identities and 1050 exact five-slot names
        run: python3 scripts/formal-equipment-identities.py
      - name: Check formal owner integrity
        run: node scripts/runtime-integrity.js
