name: Apply void UI CSS batch 3

on:
  push:
    paths:
      - '.github/workflows/apply-void-ui-css-batch3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract void UI styles from JS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('dungeonvoidui.js')
          text=p.read_text(encoding='utf-8')
          start=text.find(' function injectStyles(){')
          end=text.find('\n\n function progressSafe()', start)
          if start < 0 or end < 0:
              raise SystemExit('injectStyles block not found')
          text=text[:start]+text[end+2:]
          text=text.replace('window.renderVoidMirageDungeon=function(){\n  injectStyles();\n', 'window.renderVoidMirageDungeon=function(){\n', 1)
          text=text.replace(' window.VOID_MIRAGE_UI_AUTO_ADAPTER_VERSION=1;\n', ' window.VOID_MIRAGE_UI_STYLE_VERSION=1;\n window.VOID_MIRAGE_UI_AUTO_ADAPTER_VERSION=1;\n', 1)
          text=text.replace('\n\n injectStyles();\n})();', '\n})();', 1)
          p.write_text(text,encoding='utf-8')

          p=Path('dungeonvoidintegrity.js')
          text=p.read_text(encoding='utf-8')
          text=text.replace(' const VERSION=1;', ' const VERSION=2;', 1)
          anchor='''  if(Number(window.VOID_MIRAGE_UI_AUTO_ADAPTER_VERSION)!==1)fail("ui-auto-adapter-version");\n'''
          addition=anchor+'''  if(Number(window.VOID_MIRAGE_UI_STYLE_VERSION)!==1)fail("ui-style-version");\n'''
          if anchor not in text:
              raise SystemExit('integrity adapter anchor not found')
          text=text.replace(anchor,addition,1)
          p.write_text(text,encoding='utf-8')

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          css_anchor='<link rel="stylesheet" href="dungeonarena.css?v=20260914-maintenance1">'
          css_add=css_anchor+'<link rel="stylesheet" href="dungeonvoid.css?v=20260917-void-ui-css1">'
          if css_anchor not in text:
              raise SystemExit('index css anchor not found')
          text=text.replace(css_anchor,css_add,1)
          text=text.replace('dungeonvoidui.js?v=20260917-auto-owner1b','dungeonvoidui.js?v=20260917-void-ui-css1',1)
          text=text.replace('dungeonvoidintegrity.js?v=20260917-void-integrity1','dungeonvoidintegrity.js?v=20260917-void-integrity2',1)
          p.write_text(text,encoding='utf-8')

          p=Path('PROJECT_HANDOFF.md')
          text=p.read_text(encoding='utf-8')
          anchor='''- 虛空專屬 runtime integrity：`dungeonvoidintegrity.js`，`VOID_MIRAGE_INTEGRITY_VERSION = 1`；檢查解鎖 Lv.25、前 100 層起點、每 10 層 Boss、普通／Boss 特性數、勝利後紀錄與樓層前進順序、戰後滿血、退出旗標、唯一 auto-run owner/callback contract、必要 snapshot/API。\n'''
          addition='''- 虛空 UI 正式樣式檔為 `dungeonvoid.css`；`dungeonvoidui.js` 不再 runtime 注入 `<style>`，`VOID_MIRAGE_UI_STYLE_VERSION = 1`。\n- 虛空專屬 runtime integrity：`dungeonvoidintegrity.js`，`VOID_MIRAGE_INTEGRITY_VERSION = 2`；檢查解鎖 Lv.25、前 100 層起點、每 10 層 Boss、普通／Boss 特性數、勝利後紀錄與樓層前進順序、戰後滿血、退出旗標、唯一 auto-run owner/callback contract、必要 snapshot/API，以及正式 UI style marker。\n'''
          if anchor not in text:
              raise SystemExit('handoff integrity anchor not found')
          text=text.replace(anchor,addition,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit batch 3
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dungeonvoidui.js dungeonvoidintegrity.js index.html PROJECT_HANDOFF.md
          git commit -m 'refactor: formalize void mirage CSS ownership'
          git push
