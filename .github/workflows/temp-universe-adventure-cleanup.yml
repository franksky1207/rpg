name: Temporary Universe Adventure Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-universe-adventure-cleanup.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply universe adventure cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Safety: retired header polish version must have no external consumer.
          token='SECOND_WORLD_ADVENTURE_HEADER_POLISH_VERSION'
          external=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.name=='playersemanticsui.js' or '.git' in p.parts:
              continue
            if p.suffix not in {'.js','.html','.md','.yml','.yaml'}:
              continue
            try: text=p.read_text()
            except Exception: continue
            if token in text: external.append(str(p))
          assert not external, f'Header polish version still has consumers: {external}'

          # 1) Retire stale top-inventory cleanup semantics.
          p=Path('playersemanticsui.js')
          s=p.read_text()
          assert s.count(' const VERSION=4;')==1
          s=s.replace(' const VERSION=4;',' const VERSION=5;',1)
          old=''' function installStyles(){\n  if(typeof document==="undefined")return;\n  document.getElementById("playerSemanticsUiStyles")?.remove();\n }\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,'',1)
          old=''' function applyUniverseAdventureSemantics(){\n  if(typeof document==="undefined")return;\n  const screen=document.querySelector(".universe-adventure-screen");\n  if(!screen)return;\n  const top=screen.querySelector(":scope > .page-top");\n  if(!top)return;\n  top.classList.remove("universe-adventure-top");\n  const legacyInventory=top.querySelector(".universe-adventure-inventory");\n  if(legacyInventory){\n   const placeholder=document.createElement("span");\n   legacyInventory.replaceWith(placeholder);\n  }\n }\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,'',1)
          old=''' function apply(){\n  installStyles();applyHomeSemantics();applyUniverseAdventureSemantics();\n  if(typeof window.applySecondWorldAdventureProgressFocus==="function")window.applySecondWorldAdventureProgressFocus();\n }\n'''
          new=''' function apply(){\n  applyHomeSemantics();\n  if(typeof window.applySecondWorldAdventureProgressFocus==="function")window.applySecondWorldAdventureProgressFocus();\n }\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          assert s.count(' window.SECOND_WORLD_ADVENTURE_HEADER_POLISH_VERSION=1;\n')==1
          s=s.replace(' window.SECOND_WORLD_ADVENTURE_HEADER_POLISH_VERSION=1;\n','',1)
          p.write_text(s)

          # 2 + 4) Reuse the canonical latest-progress index and harden one-shot focus lifecycle.
          p=Path('worldmapui.js')
          s=p.read_text()
          old='''  window.requestSecondWorldAdventureProgressFocus=function(){\n    secondWorldAdventureFocusPending=true;\n    return true;\n  };\n  window.applySecondWorldAdventureProgressFocus=function(){\n    if(!secondWorldAdventureFocusPending||typeof document==="undefined")return false;\n    const screen=document.querySelector(".universe-adventure-screen:not(.galaxy-review-adventure-screen)");\n    if(!screen)return false;\n    const index=secondWorldLatestProgressBossIndex();\n    const target=index>=0?screen.querySelector(`[data-second-world-boss="${index}"]`):null;\n    if(!target)return false;\n    secondWorldAdventureFocusPending=false;\n'''
          new='''  window.requestSecondWorldAdventureProgressFocus=function(){\n    secondWorldAdventureFocusPending=true;\n    return true;\n  };\n  window.cancelSecondWorldAdventureProgressFocus=function(){\n    secondWorldAdventureFocusPending=false;\n    return true;\n  };\n  window.applySecondWorldAdventureProgressFocus=function(){\n    if(!secondWorldAdventureFocusPending||typeof document==="undefined")return false;\n    const screen=document.querySelector(".universe-adventure-screen:not(.galaxy-review-adventure-screen)");\n    if(!screen){secondWorldAdventureFocusPending=false;return false;}\n    const index=secondWorldLatestProgressBossIndex();\n    const target=index>=0?screen.querySelector(`[data-second-world-boss="${index}"]`):null;\n    if(!target){secondWorldAdventureFocusPending=false;return false;}\n    secondWorldAdventureFocusPending=false;\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old='''  function secondWorldActiveRegionIndex(){\n    const regions=secondWorldRegions();\n    if(!regions.length)return -1;\n    const highest=typeof window.secondWorldHighestUnlockedBossIndex==="function"?window.secondWorldHighestUnlockedBossIndex():-1;\n    if(highest<0)return 0;\n    const boss=secondWorldBosses()[highest];\n'''
          new='''  function secondWorldActiveRegionIndex(){\n    const regions=secondWorldRegions();\n    if(!regions.length)return -1;\n    const highest=secondWorldLatestProgressBossIndex();\n    if(highest<0)return 0;\n    const boss=secondWorldBosses()[highest];\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old='''  window.setSecondWorldAdventureView=function(value){\n    const next=value==="galaxy-review"?"galaxy-review":"universe";\n    if(secondWorldAdventureView===next)return;\n    secondWorldAdventureView=next;\n    render();\n  };\n'''
          new='''  window.setSecondWorldAdventureView=function(value){\n    const next=value==="galaxy-review"?"galaxy-review":"universe";\n    if(secondWorldAdventureView===next)return;\n    if(next!=="universe"&&typeof window.cancelSecondWorldAdventureProgressFocus==="function")window.cancelSecondWorldAdventureProgressFocus();\n    secondWorldAdventureView=next;\n    render();\n  };\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          assert s.count('  window.SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=1;')==1
          s=s.replace('  window.SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=1;','  window.SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=2;',1)
          p.write_text(s)

          # 5) Relax integrity probes to verify behavior contracts rather than exact formatting.
          p=Path('tests/runtime/js-integrity.js')
          s=p.read_text()
          old='''assert(/SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=1/.test(worldmap),"宇宙冒險目前進度自動定位應為 V1。");\nassert(/requestSecondWorldAdventureProgressFocus=function/.test(worldmap)&&/applySecondWorldAdventureProgressFocus=function/.test(worldmap),"宇宙冒險必須提供一次性定位 request/apply owner。");\nassert(/scrollIntoView\\(\\{block:"center",inline:"nearest",behavior:"auto"\\}\\)/.test(worldmap),"宇宙冒險定位必須以目前 Boss 元素置中，不得使用固定像素捲動。");\nassert(/if\\(v==="adventure"\\)\\{adventureScreen="maps";if\\(secondWorldActive\\(\\)/.test(ui),"從主頁進宇宙冒險必須提出目前 Boss 定位請求。");\nassert(/ctx\\?\\.mode==="universe-main"[\\s\\S]*requestSecondWorldAdventureProgressFocus/.test(ui),"宇宙冒險背包返回必須提出目前 Boss 定位請求。");\nassert(/function closeBattleResultModal\\(\\)[\\s\\S]*secondWorldActive\\(\\)[\\s\\S]*requestSecondWorldAdventureProgressFocus/.test(ui),"宇宙 Boss 結算返回必須提出目前 Boss 定位請求。");\nassert(/applySecondWorldAdventureProgressFocus/.test(playerSemanticsUi),"playersemanticsui.js 必須在 render 後套用一次性宇宙冒險定位。");\n'''
          new='''assert(/SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=2/.test(worldmap),"宇宙冒險目前進度自動定位應為 V2。");\nassert(/requestSecondWorldAdventureProgressFocus=function/.test(worldmap)&&/applySecondWorldAdventureProgressFocus=function/.test(worldmap)&&/cancelSecondWorldAdventureProgressFocus=function/.test(worldmap),"宇宙冒險必須提供一次性定位 request/apply/cancel owner。");\nassert(/scrollIntoView/.test(worldmap)&&/block:"center"/.test(worldmap)&&/data-second-world-boss/.test(worldmap),"宇宙冒險定位必須以目前 Boss 元素置中，不得依賴固定像素捲動。");\nassert(/function secondWorldActiveRegionIndex\\(\\)[\\s\\S]*secondWorldLatestProgressBossIndex\\(\\)/.test(worldmap),"宇宙目前區域必須共用 latest-progress Boss owner。");\nassert(!/installStyles|applyUniverseAdventureSemantics|SECOND_WORLD_ADVENTURE_HEADER_POLISH_VERSION/.test(playerSemanticsUi),"已退休的宇宙冒險頂部背包 cleanup 不得殘留。");\nfor(const fn of ["go","backToAdventureFromInventory","closeBattleResultModal"]){\n const start=ui.indexOf("function "+fn+"(");\n assert(start>=0,"找不到 "+fn+"。\");\n const next=ui.indexOf("\\nfunction ",start+1);\n const body=ui.slice(start,next>=0?next:ui.length);\n assert(body.includes("requestSecondWorldAdventureProgressFocus"),fn+" 必須保留宇宙目前 Boss 定位請求。");\n}\nassert(/applySecondWorldAdventureProgressFocus/.test(playerSemanticsUi),"playersemanticsui.js 必須在 render 後套用一次性宇宙冒險定位。");\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          p.write_text(s)

          # Cache-bust modified player-side JS.
          p=Path('index.html')
          s=p.read_text()
          for name,version in {
            'worldmapui.js':'20260925-universe-adventure-cleanup1',
            'playersemanticsui.js':'20260925-universe-adventure-cleanup1',
          }.items():
            pattern=rf'src="{re.escape(name)}\\?v=[^"]+"'
            replacement=f'src="{name}?v={version}"'
            s,n=re.subn(pattern,replacement,s,count=1)
            assert n==1,(name,n)
          p.write_text(s)
          PY

          node --check worldmapui.js
          node --check playersemanticsui.js
          node --check tests/runtime/js-integrity.js
          node tests/runtime/js-integrity.js
          grep -q 'SECOND_WORLD_ADVENTURE_AUTO_FOCUS_VERSION=2' worldmapui.js
          ! grep -q 'SECOND_WORLD_ADVENTURE_HEADER_POLISH_VERSION' playersemanticsui.js
          ! grep -q 'applyUniverseAdventureSemantics' playersemanticsui.js
          grep -q 'src="worldmapui.js?v=20260925-universe-adventure-cleanup1"' index.html
          grep -q 'src="playersemanticsui.js?v=20260925-universe-adventure-cleanup1"' index.html

          rm .github/workflows/temp-universe-adventure-cleanup.yml
          git config user.name "franksky1207"
          git config user.email "131867380+franksky1207@users.noreply.github.com"
          git add worldmapui.js playersemanticsui.js tests/runtime/js-integrity.js index.html .github/workflows/temp-universe-adventure-cleanup.yml
          git commit -m "Clean universe adventure focus owners"
          git push origin HEAD:main
          sleep 2
          gh workflow run runtime-integrity.yml --ref main
          gh workflow run story-integrity.yml --ref main
