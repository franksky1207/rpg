name: Batch13 Twenty Monster GM Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twenty-monsters:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==11.3.0
      - name: Validate genuine assets, registry, pool and protected owners
        run: |
          set -euo pipefail
          python3 tests/runtime/batch13-monster-assets.py
          node tests/runtime/batch13-monster-mappings.cjs
          python3 scripts/generate-monster-trial-registry.py --check
          node --test tests/runtime/batch13-monster-pool.test.mjs
          node tests/runtime/batch12-presentation-safety.cjs
          node tests/runtime/resource-cache-behavior.js
          node tests/runtime/resource-cache-prefetch-integrity.js
          node scripts/build-publish-dry-run.cjs
      - name: Install browser
        run: |
          npm install --prefix /tmp/batch13-browser --no-save playwright@1.55.0
          /tmp/batch13-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify deployed candidate, twenty monsters and existing player GM
        env:
          NODE_PATH: /tmp/batch13-browser/node_modules
          RUNTIME_SMOKE_URL: http://127.0.0.1:4173/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .publish-stage3 >/tmp/batch13-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/runtime/batch13-monster-browser.cjs
          node tests/runtime/batch15-all-identities-browser.cjs
          node tests/runtime/batch15-monster-recovery-browser.cjs
          node tests/equipment-gm/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch13-twenty-monster-evidence
          path: |
            /tmp/batch13-*.png
            /tmp/batch13-monster-browser.json
            /tmp/batch15-all-identities.json
            /tmp/batch15-monster-recovery.json
            /tmp/equipment-gm-era-browser.json
