name: W3 UI Text Batch 2
# capture patch-anchor diagnostics before formal commit
on:
  push:
    paths:
      - '.github/workflows/w3-ui-text-batch2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply batch 2 patch
        shell: bash
        run: |
          set +e
          python3 batch_w3_ui_text_2.py > batch2_patch_failure.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add batch2_patch_failure.txt
            git commit -m 'Capture batch 2 patch failure'
            git push origin HEAD:main
            exit "$status"
          fi
          rm -f batch2_patch_failure.txt
      - name: Syntax and diff checks
        shell: bash
        run: |
          set -euo pipefail
          node --check ui.js
          node --check equipmentlock.js
          node --check secondworldrewards.js
          node --check tests/runtime/js-integrity.js
          git diff --check
      - name: Story checks
        shell: bash
        run: |
          set -euo pipefail
          node tests/story/source-purity.js
          node tests/story/meta-language.js
          node tests/story/integrity.js
          node tests/story/flow.js
      - name: Runtime checks
        run: node tests/runtime/js-integrity.js
      - name: Batch 2 semantics checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '一鍵處理較低裝備' ui.js
          grep -q '處理結果' ui.js
          grep -q '不產生資源' ui.js
          grep -q '自動處理' ui.js
          grep -q '不可自動處理' ui.js
          grep -q 'THIRD_WORLD_LOST_GEAR_UI_POLICY_VERSION=1' ui.js
          grep -q '處理後將永久移除且不產生資源' equipmentlock.js
          grep -q '不會被手動處理、一鍵處理或自動處理' equipmentlock.js
          grep -q 'THIRD_WORLD_EQUIPMENT_PROCESSING_REWARD_POLICY_VERSION=1' secondworldrewards.js
          grep -q 'ui.js?v=20260928-thirdworld-ui-text-batch2' index.html
          grep -q 'equipmentlock.js?v=20260928-thirdworld-ui-text-batch2' index.html
          grep -q 'secondworldrewards.js?v=20260928-thirdworld-ui-text-batch2' index.html
      - name: Commit formal changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui.js equipmentlock.js secondworldrewards.js tests/runtime/js-integrity.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refine third-world inventory processing semantics batch 2'
          git push origin HEAD:main
