name: tmp-vip-loot-batch2
on:
  push:
    branches: [main]
    paths:
      - '.github/tmp/apply_vip_loot_batch2.py'
      - '.github/workflows/tmp-vip-loot-batch2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/tmp/apply_vip_loot_batch2.py
      - run: node --check secondworldrewards.js && node --check secondworldmainline.js && node tests/runtime/js-integrity.js && node tests/runtime/asset-integrity.js && node tests/runtime/docs-integrity.js
      - name: Remove temporary migration files
        run: rm -f .github/tmp/apply_vip_loot_batch2.py .github/workflows/tmp-vip-loot-batch2.yml
      - name: Commit batch2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Wire Universe mainline VIP loot privileges"
          git push
