name: Versioned CI browsers
description: Install pinned Node tools and only the requested Playwright browsers
inputs:
  browsers:
    description: Space separated browser names
    required: true
    default: chromium
  preinstalled:
    description: Browsers and OS dependencies are provided by the pinned Playwright container
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: Identify browser system ABI
    id: platform
    shell: bash
    run: |
      set -euo pipefail
      image="$(. /etc/os-release; printf '%s-%s' "$ID" "$VERSION_ID")"
      test -n "$image"
      echo "image=$image" >> "$GITHUB_OUTPUT"
  - name: Restore exact chromium revision cache
    if: inputs.preinstalled != 'true' && contains(inputs.browsers, 'chromium')
    uses: actions/cache@v4
    with:
      path: |-
        ~/.cache/ms-playwright/chromium-*
        ~/.cache/ms-playwright/chromium_headless_shell-*
        ~/.cache/ms-playwright/ffmpeg-*
      key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.image }}-1.55.0-chromium-v3
  - name: Restore exact webkit revision cache
    if: inputs.preinstalled != 'true' && contains(inputs.browsers, 'webkit')
    uses: actions/cache@v4
    with:
      path: |-
        ~/.cache/ms-playwright/webkit-*
        ~/.cache/ms-playwright/ffmpeg-*
      key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.platform.outputs.image }}-1.55.0-webkit-v3
  - name: Install pinned browser tools
    shell: bash
    run: npm install --no-save playwright@1.55.0 gltf-validator@2.0.0-dev.3.10
  - name: Ensure browsers and system libraries
    shell: bash
    env:
      CI_BROWSERS: ${{ inputs.browsers }}
    run: |
      set -euo pipefail
      for browser in $CI_BROWSERS; do
        case "$browser" in chromium|webkit) ;; *) echo "Unsupported browser: $browser"; exit 1;; esac
      done
      if [[ '${{ inputs.preinstalled }}' == 'true' ]]; then
        # The pinned official Playwright image supplies both browsers and native libraries.
        node - <<'NODE'
      const { chromium, webkit } = require('playwright');
      for (const name of process.env.CI_BROWSERS.split(/\s+/).filter(Boolean)) {
        const executable = ({ chromium, webkit })[name].executablePath();
        if (!require('node:fs').existsSync(executable)) throw new Error('Missing preinstalled ' + name + ': ' + executable);
        console.log('Preinstalled browser:', name, executable);
      }
      NODE
      elif [[ "$CI_BROWSERS" == *webkit* ]]; then
        # Non-container WebKit users retain the safe system-dependency setup.
        npx playwright install --with-deps $CI_BROWSERS
      else
        # Chromium validated on Ubuntu 24.04 without extra apt dependencies.
        npx playwright install $CI_BROWSERS
      fi
