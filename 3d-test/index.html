<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文明戰線｜GM 視覺測試中心</title>
<link rel="stylesheet" href="./prototype.css?v=20261009-b02&v2=20261009-warm-ui"><link rel="stylesheet" href="./test-center.css?v=20261017-gm-two-tabs1">
<link rel="stylesheet" href="./gm-whole-suit.css?v=20261015-phase4-sprites3">
</head>
<body>
<main class="shell">
<header><div><small>文明戰線 / GM · VISUAL TEST CENTER</small><h1>GM 視覺測試中心</h1></div><a id="backToGame" href="../index.html">返回正式遊戲 ↗</a></header>
<section class="center-layout" aria-label="GM 視覺測試中心">
<aside class="center-sidebar" aria-label="2.5D 預覽分類">
<input id="caseSearch" type="search" hidden aria-hidden="true">
<div id="categoryList" class="center-categories" aria-label="視覺預覽分類"></div>
<div id="caseList" class="center-cases" aria-label="目前預覽"></div>
</aside>
<div class="center-workspace" id="centerWorkspace">
<div class="center-description"><h2 id="caseTitle">載入中…</h2><p id="caseDetail"></p></div><div class="center-status" id="status" role="status" aria-live="polite" hidden></div>
<div id="fixturePanel" hidden></div>
<section class="stage" aria-label="2.5D 測試展示區">
<button id="maximizePreview" class="center-maximize-button" type="button" aria-pressed="false" aria-label="最大化預覽">⛶ 最大化預覽</button>
<div id="prototypeHost" class="prototype-host"></div>
<div class="fallback" id="fallback" hidden><h2>已切換為安全模式</h2><p id="fallbackReason">預覽暫時無法使用，仍可返回正式遊戲。</p></div>

</section></div></section>
<footer><p>只展示現有 2.5D 素材；銀河、宇宙、高維三種正式角色外觀尚待製作。</p><div class="actions"><label for="quality">畫質 <select id="quality"><option value="low">省電</option><option value="medium" selected>平衡</option><option value="high">高畫質</option></select></label><button type="button" id="toggle">停用預覽</button><button type="button" id="restart">重新載入</button></div></footer>
</main>
<script src="./test-center.js?v=20261017-gm-two-tabs1"></script>
</body>
</html>
