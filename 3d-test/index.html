<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文明戰線｜GM 動畫測試中心</title>
<link rel="stylesheet" href="./prototype.css?v=20261009-b02&amp;v2=20261009-warm-ui">
<link rel="stylesheet" href="./test-center.css?v=20261019-batch12-rising-cut1">
<link rel="stylesheet" href="./gm-whole-suit.css?v=20261015-phase4-sprites3">
</head>
<body>
<main class="shell">
<header><div><small>文明戰線 / GM</small><h1>GM 動畫測試中心</h1></div><a id="backToGame" href="../index.html">返回正式遊戲 ↗</a></header>
<section class="center-layout" aria-label="GM 動畫測試中心">

<div class="center-workspace" id="centerWorkspace">
<div class="center-description"><h2 id="caseTitle">載入中…</h2><p id="caseDetail"></p></div>
<div class="center-status" id="status" role="status" aria-live="polite" hidden></div>
<section class="stage" aria-label="戰鬥動畫測試展示區">
<button id="maximizePreview" class="center-maximize-button" type="button" aria-pressed="false" aria-label="最大化預覽">⛶ 最大化預覽</button>
<div id="prototypeHost" class="prototype-host"></div>
<div class="fallback" id="fallback" hidden><h2>已切換為安全模式</h2><p id="fallbackReason">目前無法顯示預覽，仍可返回正式遊戲。</p></div>
</section>
</div>
</section>
<footer><p>僅供 GM 查看角色動作與戰鬥畫面；測試不影響正式遊戲資料。</p><div class="actions">
<label for="quality">畫質 <select id="quality"><option value="low">省電</option><option value="medium" selected>平衡</option><option value="high">高畫質</option></select></label>
<button type="button" id="toggle">停用預覽</button><button type="button" id="restart">重新啟動</button></div></footer>
</main>
<script src="./test-center.js?v=20261022-batch19-frame1"></script>
</body>
</html>
