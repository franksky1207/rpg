<header><h1>文明戰線 · 12 身份美術修正</h1><p>人工美術驗收樣本，尚未套用正式遊戲。A 為未調色原型（以正式 MonsterActor 呈現）；B 為 main／PR #97；C 經同一正式外觀解析器的樣本路線。三欄使用相同尺寸、動作與時間。請特別比較母體兩種身份、兩位指揮官與異宇宙三版。</p>
