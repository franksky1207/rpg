<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文明戰線 · 靜態效果元件庫</title><link rel="stylesheet" href="review.css"></head><body>
<header><a href="index.html">← 全怪物分類預覽</a><span>REVIEW ONLY · 本體完全固定</span><h1>靜態效果元件庫</h1><p>48 個可執行的造型元件，8 個家族。每個元件都有 L0／L2／L5 示範；所有層級都能使用完整元件庫。</p><nav><a href="effect-statistics.html">使用分布統計</a><a href="#lab">自由組合試作台</a><a href="effect-sheets/index.html">效果總覽圖</a></nav></header>
<main><div class="controls"><label>家族<select id="libraryFamily"></select></label><label>搜尋元件<input id="librarySearch" placeholder="晶體、rift、光翼…"></label></div><div class="pagination"><button id="libPrev">上一頁</button><span id="libStatus"></span><button id="libNext">下一頁</button></div><div id="libraryGallery" class="library-grid"></div>
<section class="lab" id="lab"><h2>自由組合試作台</h2><p>按需預繪，可試作相容元件的搭配；不改動已輸出的候選與本體。大型領域框、同位置構造與原型適用性會先檢查。</p><div class="controls"><label>固定本體<select id="labAsset"></select></label><label>強度<select id="labLevel"></select></label><label>位置<select id="labPosition"><option value="auto">自動分開</option><option value="top">頭頂</option><option value="flanks">左右側</option><option value="diagonal">斜對角</option><option value="corners">外圍分散</option><option value="bottom">下方</option></select></label><label>形態<select id="labMorph"><option value="symmetric">對稱</option><option value="asymmetric">非對稱</option><option value="split">分離式</option></select></label><label>密度<select id="labDensity"><option value="1">稀疏</option><option value="2" selected>中等</option><option value="3">密集</option></select></label><label>大小<input id="labScale" type="range" min="14" max="40" value="28"></label><label>透明度<input id="labOpacity" type="range" min="32" max="85" value="70"></label><label>方向<select id="labDirection"><option value="0">正向</option><option value="-0.4">左傾</option><option value="0.4">右傾</option></select></label><label>顯示<select id="labDisplay"><option value="full">完整效果</option><option value="effects">只看透明效果</option></select></label></div><div id="labChoices" class="component-choices"></div><p><button id="labRender">產生這個靜態組合</button> <button id="labReset">清除選擇</button></p><p id="labStatus" role="status"></p><div class="lab-output"><div class="checker"><canvas id="labCanvas" width="512" height="512"></canvas></div><p>預繪影像快取上限 6 MiB，最近使用優先。<br>無計時器、無動畫迴圈、無粒子。<br>效果只附著於怪物 sprite，不使用固定地面底盤。</p></div></section></main>
<script src="data.js"></script><script src="effects-data.js"></script><script src="effects-geometry.js"></script><script src="static-effects.js"></script><script src="review-navigation.js"></script><script src="effect-library.js"></script></body></html>
